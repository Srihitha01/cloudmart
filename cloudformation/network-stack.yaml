AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Network-Security Stack.
  Creates the VPC, public and private subnets,
  Internet Gateway, route tables, security groups,
  and VPC endpoints.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
AvailabilityZone:
  Type: AWS::EC2::AvailabilityZone::Name
  Default: ap-south-1a
  Description: Availability Zone used by CloudMart

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16

  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24

  PrivateSubnetCidr:
    Type: String
    Default: 10.0.2.0/24

  AdminCidr:
    Type: String
    Default: 0.0.0.0/32

Resources:

  # ==========================================================
  # VPC
  # ==========================================================

  CloudMartVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-vpc


  # ==========================================================
  # INTERNET GATEWAY
  # ==========================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway

    Properties:
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-igw


  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment

    Properties:
      VpcId: !Ref CloudMartVPC
      InternetGatewayId: !Ref InternetGateway


  # ==========================================================
  # PUBLIC SUBNET
  # ==========================================================

  PublicSubnet:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone: !Ref AvailabilityZone
      MapPublicIpOnLaunch: true

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-public-subnet


  # ==========================================================
  # PRIVATE SUBNET
  # ==========================================================

  PrivateSubnet:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: !Ref PrivateSubnetCidr
      AvailabilityZone: !Ref AvailabilityZone
      MapPublicIpOnLaunch: false

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-private-subnet


  # ==========================================================
  # PUBLIC ROUTE TABLE
  # ==========================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:
      VpcId: !Ref CloudMartVPC

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-public-route-table


  PublicRoute:
    Type: AWS::EC2::Route

    DependsOn:
      - InternetGatewayAttachment

    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway


  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet


  # ==========================================================
  # PRIVATE ROUTE TABLE
  # ==========================================================

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:
      VpcId: !Ref CloudMartVPC

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-private-route-table


  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet


  # ==========================================================
  # LAMBDA SECURITY GROUP
  # ==========================================================

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: Security group for CloudMart private Lambda functions
      VpcId: !Ref CloudMartVPC

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-lambda-sg


  # ==========================================================
  # RDS SECURITY GROUP
  # ==========================================================

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: MySQL access from CloudMart Lambda functions
      VpcId: !Ref CloudMartVPC

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds-sg


  # ==========================================================
  # EC2 DASHBOARD SECURITY GROUP
  # ==========================================================

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: Security group for CloudMart Flask dashboard
      VpcId: !Ref CloudMartVPC

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr

        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AdminCidr

      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-ec2-sg


  # ==========================================================
  # VPC ENDPOINT SECURITY GROUP
  # ==========================================================

  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: HTTPS access for VPC interface endpoints
      VpcId: !Ref CloudMartVPC

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-endpoint-sg


  # ==========================================================
  # S3 GATEWAY ENDPOINT
  # ==========================================================

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC
      VpcEndpointType: Gateway

      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3

      RouteTableIds:
        - !Ref PrivateRouteTable


  # ==========================================================
  # SSM INTERFACE ENDPOINT
  # ==========================================================

  SSMEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC
      VpcEndpointType: Interface

      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup


  # ==========================================================
  # EVENTBRIDGE INTERFACE ENDPOINT
  # ==========================================================

  EventBridgeEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC
      VpcEndpointType: Interface

      ServiceName: !Sub com.amazonaws.${AWS::Region}.events

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup


  # ==========================================================
  # SNS INTERFACE ENDPOINT
  # ==========================================================

  SNSEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC
      VpcEndpointType: Interface

      ServiceName: !Sub com.amazonaws.${AWS::Region}.sns

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup


# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:

  VpcId:
    Description: CloudMart VPC ID
    Value: !Ref CloudMartVPC

    Export:
      Name: !Sub cloudmart-${Environment}-VpcId


  PublicSubnetId:
    Description: Public subnet ID
    Value: !Ref PublicSubnet

    Export:
      Name: !Sub cloudmart-${Environment}-PublicSubnetId


  PrivateSubnetId:
    Description: Private subnet ID
    Value: !Ref PrivateSubnet

    Export:
      Name: !Sub cloudmart-${Environment}-PrivateSubnetId


  LambdaSecurityGroupId:
    Description: Lambda security group ID
    Value: !Ref LambdaSecurityGroup

    Export:
      Name: !Sub cloudmart-${Environment}-LambdaSecurityGroupId


  RDSSecurityGroupId:
    Description: RDS security group ID
    Value: !Ref RDSSecurityGroup

    Export:
      Name: !Sub cloudmart-${Environment}-RDSSecurityGroupId


  EC2SecurityGroupId:
    Description: EC2 dashboard security group ID
    Value: !Ref EC2SecurityGroup

    Export:
      Name: !Sub cloudmart-${Environment}-EC2SecurityGroupId


  VPCEndpointSecurityGroupId:
    Description: VPC endpoint security group ID
    Value: !Ref VPCEndpointSecurityGroup

    Export:
      Name: !Sub cloudmart-${Environment}-VPCEndpointSecurityGroupId


  S3EndpointId:
    Description: S3 gateway endpoint ID
    Value: !Ref S3GatewayEndpoint

    Export:
      Name: !Sub cloudmart-${Environment}-S3EndpointId


  SSMEndpointId:
    Description: SSM interface endpoint ID
    Value: !Ref SSMEndpoint

    Export:
      Name: !Sub cloudmart-${Environment}-SSMEndpointId


  EventBridgeEndpointId:
    Description: EventBridge interface endpoint ID
    Value: !Ref EventBridgeEndpoint

    Export:
      Name: !Sub cloudmart-${Environment}-EventBridgeEndpointId


  SNSEndpointId:
    Description: SNS interface endpoint ID
    Value: !Ref SNSEndpoint

    Export:
      Name: !Sub cloudmart-${Environment}-SNSEndpointId