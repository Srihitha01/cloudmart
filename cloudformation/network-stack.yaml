AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Network and Security Infrastructure.
  Creates VPC, public and private subnets, Internet Gateway,
  route tables, security groups, VPC endpoints, and a separate
  EC2 database client for SSH access and RDS connectivity.


# ==========================================================
# PARAMETERS
# ==========================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    Description: Deployment environment


  VPCCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for CloudMart VPC


  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR block for public subnet


  PrivateSubnetCidr:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR block for primary private subnet


  SecondaryPrivateSubnetCidr:
    Type: String
    Default: 10.0.3.0/24
    Description: CIDR block for secondary private subnet


  DatabaseClientKeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 Key Pair name for SSH access


  DatabaseClientInstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type for database client


  DatabaseClientAMI:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 AMI


  AllowedSSHCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR block allowed to SSH into Database Client EC2


# ==========================================================
# RESOURCES
# ==========================================================

Resources:


  # ==========================================================
  # VPC
  # ==========================================================

  CloudMartVPC:
    Type: AWS::EC2::VPC

    Properties:
      CidrBlock: !Ref VPCCidr

      EnableDnsSupport: true
      EnableDnsHostnames: true

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-vpc


  # ==========================================================
  # INTERNET GATEWAY
  # ==========================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway

    Properties:
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-igw


  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment

    Properties:
      VpcId: !Ref CloudMartVPC
      InternetGatewayId: !Ref InternetGateway


  # ==========================================================
  # PUBLIC SUBNET
  # ==========================================================

  PublicSubnet:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref CloudMartVPC

      CidrBlock: !Ref PublicSubnetCidr

      AvailabilityZone: !Select
        - 0
        - !GetAZs ''

      MapPublicIpOnLaunch: true

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-public-subnet


  # ==========================================================
  # PRIMARY PRIVATE SUBNET
  # ==========================================================

  PrivateSubnet:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref CloudMartVPC

      CidrBlock: !Ref PrivateSubnetCidr

      AvailabilityZone: !Select
        - 0
        - !GetAZs ''

      MapPublicIpOnLaunch: false

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-private-subnet-1


  # ==========================================================
  # SECONDARY PRIVATE SUBNET
  # ==========================================================

  SecondaryPrivateSubnet:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref CloudMartVPC

      CidrBlock: !Ref SecondaryPrivateSubnetCidr

      AvailabilityZone: !Select
        - 1
        - !GetAZs ''

      MapPublicIpOnLaunch: false

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-private-subnet-2


  # ==========================================================
  # PUBLIC ROUTE TABLE
  # ==========================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:
      VpcId: !Ref CloudMartVPC

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-public-route-table


  PublicRoute:
    Type: AWS::EC2::Route

    DependsOn:
      - InternetGatewayAttachment

    Properties:
      RouteTableId: !Ref PublicRouteTable

      DestinationCidrBlock: 0.0.0.0/0

      GatewayId: !Ref InternetGateway


  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet


  # ==========================================================
  # PRIVATE ROUTE TABLE
  # ==========================================================

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:
      VpcId: !Ref CloudMartVPC

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-private-route-table


  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet


  SecondaryPrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref SecondaryPrivateSubnet


  # ==========================================================
  # LAMBDA SECURITY GROUP
  # ==========================================================

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: Security group for CloudMart private Lambda functions

      VpcId: !Ref CloudMartVPC

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-lambda-sg


  # ==========================================================
  # DATABASE CLIENT EC2 SECURITY GROUP
  # ==========================================================

  DatabaseClientSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: Security group for CloudMart database client EC2

      VpcId: !Ref CloudMartVPC

      SecurityGroupIngress:

        # SSH from your laptop
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSSHCidr


      SecurityGroupEgress:

        # Allow outbound connectivity
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0


      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-database-client-sg


  # ==========================================================
  # RDS SECURITY GROUP
  # ==========================================================

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: MySQL access from Lambda and Database Client EC2

      VpcId: !Ref CloudMartVPC

      SecurityGroupIngress:

        # Lambda to RDS MySQL
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref LambdaSecurityGroup


        # Database Client EC2 to RDS MySQL
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref DatabaseClientSecurityGroup


      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0


      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds-sg


  # ==========================================================
  # EC2 DASHBOARD SECURITY GROUP
  # ==========================================================

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: Security group for CloudMart Flask dashboard

      VpcId: !Ref CloudMartVPC

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0


      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-ec2-sg


  # ==========================================================
  # VPC ENDPOINT SECURITY GROUP
  # ==========================================================

  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: Security group for CloudMart VPC interface endpoints

      VpcId: !Ref CloudMartVPC

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup


      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0


      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-vpc-endpoint-sg


  # ==========================================================
  # DATABASE CLIENT EC2
  # ==========================================================

  DatabaseClientEC2:
    Type: AWS::EC2::Instance

    DependsOn:
      - InternetGatewayAttachment
      - PublicSubnetRouteTableAssociation

    Properties:

      ImageId: !Ref DatabaseClientAMI

      InstanceType: !Ref DatabaseClientInstanceType

      KeyName: !Ref DatabaseClientKeyName

      SubnetId: !Ref PublicSubnet

      SecurityGroupIds:
        - !Ref DatabaseClientSecurityGroup


      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-database-client


  # ==========================================================
  # S3 GATEWAY ENDPOINT
  # ==========================================================

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC

      VpcEndpointType: Gateway

      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3

      RouteTableIds:
        - !Ref PrivateRouteTable


  # ==========================================================
  # SSM INTERFACE ENDPOINT
  # ==========================================================

  SSMEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC

      VpcEndpointType: Interface

      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet
        - !Ref SecondaryPrivateSubnet

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup


  # ==========================================================
  # SSM MESSAGES INTERFACE ENDPOINT
  # ==========================================================

  SSMMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC

      VpcEndpointType: Interface

      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssmmessages

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet
        - !Ref SecondaryPrivateSubnet

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup


  # ==========================================================
  # EC2 MESSAGES INTERFACE ENDPOINT
  # ==========================================================

  EC2MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC

      VpcEndpointType: Interface

      ServiceName: !Sub com.amazonaws.${AWS::Region}.ec2messages

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet
        - !Ref SecondaryPrivateSubnet

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup


  # ==========================================================
  # EVENTBRIDGE INTERFACE ENDPOINT
  # ==========================================================

  EventBridgeEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC

      VpcEndpointType: Interface

      ServiceName: !Sub com.amazonaws.${AWS::Region}.events

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet
        - !Ref SecondaryPrivateSubnet

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup


  # ==========================================================
  # SNS INTERFACE ENDPOINT
  # ==========================================================

  SNSEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC

      VpcEndpointType: Interface

      ServiceName: !Sub com.amazonaws.${AWS::Region}.sns

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet
        - !Ref SecondaryPrivateSubnet

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup


  # ==========================================================
  # LAMBDA INTERFACE ENDPOINT
  # ==========================================================

  LambdaVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC

      VpcEndpointType: Interface

      ServiceName: !Sub com.amazonaws.${AWS::Region}.lambda

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet
        - !Ref SecondaryPrivateSubnet

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup


# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:


  # ==========================================================
  # VPC
  # ==========================================================

  VpcId:
    Description: CloudMart VPC ID

    Value: !Ref CloudMartVPC

    Export:
      Name: !Sub cloudmart-${Environment}-VpcId


  # ==========================================================
  # PUBLIC SUBNET
  # ==========================================================

  PublicSubnetId:
    Description: Public subnet ID

    Value: !Ref PublicSubnet

    Export:
      Name: !Sub cloudmart-${Environment}-PublicSubnetId


  # ==========================================================
  # PRIMARY PRIVATE SUBNET
  # ==========================================================

  PrivateSubnetId:
    Description: Primary private subnet ID

    Value: !Ref PrivateSubnet

    Export:
      Name: !Sub cloudmart-${Environment}-PrivateSubnetId


  # ==========================================================
  # SECONDARY PRIVATE SUBNET
  # ==========================================================

  SecondaryPrivateSubnetId:
    Description: Secondary private subnet ID

    Value: !Ref SecondaryPrivateSubnet

    Export:
      Name: !Sub cloudmart-${Environment}-SecondaryPrivateSubnetId


  # ==========================================================
  # LAMBDA SECURITY GROUP
  # ==========================================================

  LambdaSecurityGroupId:
    Description: Lambda security group ID

    Value: !Ref LambdaSecurityGroup

    Export:
      Name: !Sub cloudmart-${Environment}-LambdaSecurityGroupId


  # ==========================================================
  # RDS SECURITY GROUP
  # ==========================================================

  RDSSecurityGroupId:
    Description: RDS security group ID

    Value: !Ref RDSSecurityGroup

    Export:
      Name: !Sub cloudmart-${Environment}-RDSSecurityGroupId


  # ==========================================================
  # EXISTING EC2 DASHBOARD SECURITY GROUP
  # ==========================================================

  EC2SecurityGroupId:
    Description: EC2 dashboard security group ID

    Value: !Ref EC2SecurityGroup

    Export:
      Name: !Sub cloudmart-${Environment}-EC2SecurityGroupId


  # ==========================================================
  # DATABASE CLIENT EC2
  # ==========================================================

  DatabaseClientInstanceId:
    Description: Database Client EC2 Instance ID

    Value: !Ref DatabaseClientEC2

    Export:
      Name: !Sub cloudmart-${Environment}-DatabaseClientInstanceId


  DatabaseClientPublicIp:
    Description: Database Client EC2 Public IP

    Value: !GetAtt DatabaseClientEC2.PublicIp

    Export:
      Name: !Sub cloudmart-${Environment}-DatabaseClientPublicIp


  DatabaseClientPublicDns:
    Description: Database Client EC2 Public DNS

    Value: !GetAtt DatabaseClientEC2.PublicDnsName

    Export:
      Name: !Sub cloudmart-${Environment}-DatabaseClientPublicDns


  DatabaseClientSecurityGroupId:
    Description: Database Client EC2 Security Group ID

    Value: !Ref DatabaseClientSecurityGroup

    Export:
      Name: !Sub cloudmart-${Environment}-DatabaseClientSecurityGroupId


  # ==========================================================
  # VPC ENDPOINT SECURITY GROUP
  # ==========================================================

  VPCEndpointSecurityGroupId:
    Description: VPC endpoint security group ID

    Value: !Ref VPCEndpointSecurityGroup

    Export:
      Name: !Sub cloudmart-${Environment}-VPCEndpointSecurityGroupId


  # ==========================================================
  # S3 ENDPOINT
  # ==========================================================

  S3EndpointId:
    Description: S3 gateway endpoint ID

    Value: !Ref S3GatewayEndpoint

    Export:
      Name: !Sub cloudmart-${Environment}-S3EndpointId


  # ==========================================================
  # SSM ENDPOINT
  # ==========================================================

  SSMEndpointId:
    Description: SSM interface endpoint ID

    Value: !Ref SSMEndpoint

    Export:
      Name: !Sub cloudmart-${Environment}-SSMEndpointId


  SSMMessagesEndpointId:
    Description: SSM Messages interface endpoint ID

    Value: !Ref SSMMessagesEndpoint

    Export:
      Name: !Sub cloudmart-${Environment}-SSMMessagesEndpointId


  EC2MessagesEndpointId:
    Description: EC2 Messages interface endpoint ID

    Value: !Ref EC2MessagesEndpoint

    Export:
      Name: !Sub cloudmart-${Environment}-EC2MessagesEndpointId


  # ==========================================================
  # EVENTBRIDGE ENDPOINT
  # ==========================================================

  EventBridgeEndpointId:
    Description: EventBridge interface endpoint ID

    Value: !Ref EventBridgeEndpoint

    Export:
      Name: !Sub cloudmart-${Environment}-EventBridgeEndpointId


  # ==========================================================
  # SNS ENDPOINT
  # ==========================================================

  SNSEndpointId:
    Description: SNS interface endpoint ID

    Value: !Ref SNSEndpoint

    Export:
      Name: !Sub cloudmart-${Environment}-SNSEndpointId


  # ==========================================================
  # LAMBDA ENDPOINT
  # ==========================================================

  LambdaVPCEndpointId:
    Description: Lambda interface endpoint ID

    Value: !Ref LambdaVPCEndpoint

    Export:
      Name: !Sub cloudmart-${Environment}-LambdaVPCEndpointId