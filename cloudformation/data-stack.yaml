AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Data-Storage Stack.
  Creates the private RDS MySQL database,
  S3 report bucket, and Lambda deployment
  artifact bucket.

Parameters:

  # ==========================================================
  # ENVIRONMENT
  # ==========================================================

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment


  # ==========================================================
  # DATABASE
  # ==========================================================

  DBName:
    Type: String
    Default: cloudmart
    Description: CloudMart database name


  DBUsername:
    Type: String
    Default: cloudmartadmin
    NoEcho: true
    Description: RDS master username


  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: RDS master password


  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS instance class


  AllocatedStorage:
    Type: Number
    Default: 20
    Description: Initial RDS storage in GB


Resources:

  # ==========================================================
  # RDS SUBNET GROUP
  # ==========================================================

  CloudMartDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup

    Properties:

      DBSubnetGroupDescription: !Sub
        CloudMart ${Environment} RDS private subnet group

      SubnetIds:

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds-subnet-group

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # RDS MYSQL DATABASE
  # ==========================================================

  CloudMartRDS:
    Type: AWS::RDS::DBInstance

    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot

    Properties:

      DBInstanceIdentifier:
        !Sub cloudmart-${Environment}-mysql

      Engine:
        mysql

      DBName:
        !Ref DBName

      MasterUsername:
        !Ref DBUsername

      MasterUserPassword:
        !Ref DBPassword

      DBInstanceClass:
        !Ref DBInstanceClass

      AllocatedStorage:
        !Ref AllocatedStorage

      StorageType:
        gp3

      Port:
        3306

      PubliclyAccessible:
        false

      MultiAZ:
        false

      # Account currently restricts backup retention.
      BackupRetentionPeriod:
        0

      CopyTagsToSnapshot:
        true

      DBSubnetGroupName:
        !Ref CloudMartDBSubnetGroup

      VPCSecurityGroups:

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-RDSSecurityGroupId

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # S3 REPORT BUCKET
  # ==========================================================

  CloudMartReportBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      BucketEncryption:

        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-reports

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # LAMBDA ARTIFACT BUCKET
  # ==========================================================

  CloudMartLambdaArtifactBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      BucketName:
        !Sub cloudmart-${Environment}-artifacts

      BucketEncryption:

        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-artifacts

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  # ----------------------------------------------------------
  # RDS ENDPOINT
  # ----------------------------------------------------------

  DBEndpoint:
    Description: RDS MySQL endpoint

    Value:
      !GetAtt CloudMartRDS.Endpoint.Address

    Export:
      Name:
        !Sub cloudmart-${Environment}-DBEndpoint


  # ----------------------------------------------------------
  # RDS PORT
  # ----------------------------------------------------------

  DBPort:
    Description: RDS MySQL port

    Value:
      !GetAtt CloudMartRDS.Endpoint.Port

    Export:
      Name:
        !Sub cloudmart-${Environment}-DBPort


  # ----------------------------------------------------------
  # DATABASE NAME
  # ----------------------------------------------------------

  DBName:
    Description: CloudMart database name

    Value:
      !Ref DBName

    Export:
      Name:
        !Sub cloudmart-${Environment}-DBName


  # ----------------------------------------------------------
  # RDS INSTANCE IDENTIFIER
  # ----------------------------------------------------------

  DBInstanceIdentifier:
    Description: RDS instance identifier

    Value:
      !Ref CloudMartRDS

    Export:
      Name:
        !Sub cloudmart-${Environment}-DBInstanceIdentifier


  # ----------------------------------------------------------
  # REPORT BUCKET NAME
  # ----------------------------------------------------------

  ReportBucketName:
    Description: S3 report bucket name

    Value:
      !Ref CloudMartReportBucket

    Export:
      Name:
        !Sub cloudmart-${Environment}-ReportBucketName


  # ----------------------------------------------------------
  # REPORT BUCKET ARN
  # ----------------------------------------------------------

  ReportBucketArn:
    Description: S3 report bucket ARN

    Value:
      !GetAtt CloudMartReportBucket.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-ReportBucketArn


  # ----------------------------------------------------------
  # LAMBDA ARTIFACT BUCKET NAME
  # ----------------------------------------------------------

  LambdaArtifactBucketName:
    Description: Lambda dependency artifact bucket name

    Value:
      !Ref CloudMartLambdaArtifactBucket

    Export:
      Name:
        !Sub cloudmart-${Environment}-LambdaArtifactBucketName


  # ----------------------------------------------------------
  # LAMBDA ARTIFACT BUCKET ARN
  # ----------------------------------------------------------

  LambdaArtifactBucketArn:
    Description: Lambda dependency artifact bucket ARN

    Value:
      !GetAtt CloudMartLambdaArtifactBucket.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-LambdaArtifactBucketArn