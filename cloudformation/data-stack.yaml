AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Data Storage Stack.
  Creates the private RDS MySQL database, DB subnet group,
  encrypted S3 report bucket, deployment artifact bucket,
  manually supplied database credentials stored in SSM SecureString,
  and SSM configuration parameters.

# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    Description: CloudMart deployment environment supplied by CI/CD

  DBName:
    Type: String
    Default: cloudmart
    Description: CloudMart database name

  DBUsername:
    Type: String
    Default: cloudmartadmin
    NoEcho: true
    Description: RDS master username

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS instance class

  AllocatedStorage:
    Type: Number
    Default: 20
    Description: Initial RDS storage in GB


  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    MaxLength: 41
    Description: >
      RDS master password entered manually during deployment.
      Must contain at least 12 characters.

# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ==========================================================
  # RDS DB SUBNET GROUP
  # ==========================================================

  CloudMartDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup

    Properties:

      DBSubnetGroupDescription:
        !Sub CloudMart ${Environment} private RDS subnet group

      SubnetIds:

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds-subnet-group

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # PRIVATE RDS MYSQL DATABASE
  # ==========================================================

  CloudMartRDS:
    Type: AWS::RDS::DBInstance

    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot

    Properties:

      DBInstanceIdentifier:
        !Sub cloudmart-${Environment}-mysql

      Engine: mysql

      DBName:
        !Ref DBName

      MasterUsername:
        !Ref DBUsername

      MasterUserPassword:
        !Ref DBPassword

      DBInstanceClass:
        !Ref DBInstanceClass

      AllocatedStorage:
        !Ref AllocatedStorage

      StorageType: gp3

      StorageEncrypted: true

      Port: 3306

      PubliclyAccessible: false

      MultiAZ: false

      DeletionProtection: false

      BackupRetentionPeriod: 1

      CopyTagsToSnapshot: true

      DBSubnetGroupName:
        !Ref CloudMartDBSubnetGroup

      VPCSecurityGroups:

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-RDSSecurityGroupId

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # S3 REPORT BUCKET
  # ==========================================================

  CloudMartReportBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      # Keep the existing CloudFormation-managed bucket.
      # Do not allow CloudFormation to generate a new name.
    
      BucketEncryption:

        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true

        BlockPublicPolicy: true

        IgnorePublicAcls: true

        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-reports

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # S3 DEPLOYMENT ARTIFACT BUCKET
  # ==========================================================

  CloudMartArtifactBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true

        BlockPublicPolicy: true

        IgnorePublicAcls: true

        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      LifecycleConfiguration:

        Rules:

          - Id: DeleteOldArtifactVersions

            Status: Enabled

            NoncurrentVersionExpiration:
              NoncurrentDays: 30

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-artifacts

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # SSM DATABASE CONFIGURATION
  # ==========================================================

  DBEndpointParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/db/endpoint

      Type: String

      Value:
        !GetAtt CloudMartRDS.Endpoint.Address

      Description: CloudMart RDS MySQL endpoint


  DBNameParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/db/name

      Type: String

      Value:
        !Ref DBName

      Description: CloudMart database name


  DBPortParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/db/port

      Type: String

      Value:
        !GetAtt CloudMartRDS.Endpoint.Port

      Description: CloudMart RDS MySQL port


  DBUsernameParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/db/username

      Type: String

      Value:
        !Ref DBUsername

      Description: CloudMart RDS MySQL username


  # ==========================================================
  # IAM ROLE FOR SSM PASSWORD WRITER
  # ==========================================================

  DBPasswordSSMWriterRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName:
        !Sub cloudmart-${Environment}-data-ssm-writer-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: SSMParameterWriter
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                Resource:
                  !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/password

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-data-ssm-writer-role
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # SECURE PASSWORD WRITER LAMBDA
  # ==========================================================

  DBPasswordSSMWriterFunction:
    Type: AWS::Lambda::Function

    Properties:
      FunctionName:
        !Sub cloudmart-${Environment}-data-ssm-writer

      Runtime: python3.12
      Handler: index.handler
      Role:
        !GetAtt DBPasswordSSMWriterRole.Arn
      Timeout: 60

      Code:
        ZipFile: |
          import json
          import logging
          import urllib.request
          import boto3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          ssm = boto3.client("ssm")

          def send_response(event, context, status, reason=None, physical_id=None):
              body = {
                  "Status": status,
                  "Reason": reason or "See CloudWatch Logs",
                  "PhysicalResourceId": physical_id or context.log_stream_name,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": {}
              }
              encoded = json.dumps(body).encode("utf-8")
              request = urllib.request.Request(
                  event["ResponseURL"],
                  data=encoded,
                  method="PUT",
                  headers={"content-type": "", "content-length": str(len(encoded))}
              )
              urllib.request.urlopen(request)

          def handler(event, context):
              properties = event["ResourceProperties"]
              parameter_name = properties["ParameterName"]
              physical_id = event.get("PhysicalResourceId") or parameter_name

              try:
                  request_type = event["RequestType"]
                  logger.info("Processing SSM password parameter request: %s", request_type)

                  if request_type in ("Create", "Update"):
                      ssm.put_parameter(
                          Name=parameter_name,
                          Value=properties["Password"],
                          Type="SecureString",
                          Description=properties.get(
                              "Description",
                              "CloudMart secure database password"
                          ),
                          Overwrite=True
                      )
                      logger.info("SSM secure password parameter updated: %s", parameter_name)

                  elif request_type == "Delete":
                      try:
                          ssm.delete_parameter(Name=parameter_name)
                          logger.info("SSM secure password parameter deleted: %s", parameter_name)
                      except ssm.exceptions.ParameterNotFound:
                          logger.info("SSM parameter already absent: %s", parameter_name)

                  send_response(event, context, "SUCCESS", physical_id=physical_id)

              except Exception as exc:
                  logger.exception("Failed to manage SSM secure password parameter")
                  try:
                      send_response(event, context, "FAILED", reason=str(exc), physical_id=physical_id)
                  finally:
                      raise


  # ==========================================================
  # SSM DATABASE PASSWORD CUSTOM RESOURCE
  # ==========================================================

  DBPasswordParameter:
    Type: Custom::CloudMartSecureParameter

    DependsOn:
      - DBPasswordSSMWriterFunction

    Properties:
      ServiceToken:
        !GetAtt DBPasswordSSMWriterFunction.Arn

      ParameterName:
        !Sub /cloudmart/${Environment}/db/password

      Password:
        !Ref DBPassword

      Description:
        CloudMart RDS MySQL master password stored as SecureString


  # ==========================================================
  # SSM S3 CONFIGURATION
  # ==========================================================

  ReportBucketParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/s3/report-bucket

      Type: String

      Value:
        !Ref CloudMartReportBucket

      Description: CloudMart report bucket name


  ArtifactBucketParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/s3/artifact-bucket

      Type: String

      Value:
        !Ref CloudMartArtifactBucket

      Description: CloudMart deployment artifact bucket name


# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  # ==========================================================
  # RDS OUTPUTS
  # ==========================================================

  DBEndpoint:
    Description: CloudMart RDS MySQL endpoint

    Value:
      !GetAtt CloudMartRDS.Endpoint.Address

    Export:
      Name:
        !Sub cloudmart-${Environment}-DBEndpoint


  DBPort:
    Description: CloudMart RDS MySQL port

    Value:
      !GetAtt CloudMartRDS.Endpoint.Port

    Export:
      Name:
        !Sub cloudmart-${Environment}-DBPort


  DBNameOutput:
    Description: CloudMart database name

    Value:
      !Ref DBName

    Export:
      Name:
        !Sub cloudmart-${Environment}-DBName


  DBUsernameOutput:
    Description: CloudMart database username

    Value:
      !Ref DBUsername

    Export:
      Name:
        !Sub cloudmart-${Environment}-DBUsername


  DBInstanceIdentifier:
    Description: CloudMart RDS instance identifier

    Value:
      !Ref CloudMartRDS

    Export:
      Name:
        !Sub cloudmart-${Environment}-DBInstanceIdentifier


  # ==========================================================
  # RDS SECURITY GROUP
  # ==========================================================

  RDSSecurityGroupId:
    Description: CloudMart RDS security group ID

    Value:
      Fn::ImportValue:
        Fn::Sub: cloudmart-${Environment}-RDSSecurityGroupId

    Export:
      Name:
        !Sub cloudmart-${Environment}-DataStorageRDSSecurityGroupId


  # ==========================================================
  # REPORT BUCKET
  # ==========================================================

  ReportBucketName:
    Description: CloudMart report bucket name

    Value:
      !Ref CloudMartReportBucket

    Export:
      Name:
        !Sub cloudmart-${Environment}-ReportBucketName


  ReportBucketArn:
    Description: CloudMart report bucket ARN

    Value:
      !GetAtt CloudMartReportBucket.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-ReportBucketArn


  # ==========================================================
  # ARTIFACT BUCKET
  # ==========================================================

  ArtifactBucketName:
    Description: CloudMart deployment artifact bucket name

    Value:
      !Ref CloudMartArtifactBucket

    Export:
      Name:
        !Sub cloudmart-${Environment}-ArtifactBucketName


  ArtifactBucketArn:
    Description: CloudMart deployment artifact bucket ARN

    Value:
      !GetAtt CloudMartArtifactBucket.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-ArtifactBucketArn


  # ==========================================================
  # SSM PARAMETER PATHS
  # ==========================================================

  DBEndpointParameterName:
    Description: SSM parameter path for RDS endpoint

    Value:
      !Ref DBEndpointParameter

    Export:
      Name:
        !Sub cloudmart-${Environment}-DBEndpointParameterName


  DBNameParameterName:
    Description: SSM parameter path for database name

    Value:
      !Ref DBNameParameter

    Export:
      Name:
        !Sub cloudmart-${Environment}-DBNameParameterName


  DBPortParameterName:
    Description: SSM parameter path for database port

    Value:
      !Ref DBPortParameter

    Export:
      Name:
        !Sub cloudmart-${Environment}-DBPortParameterName


  DBUsernameParameterName:
    Description: SSM parameter path for database username

    Value:
      !Ref DBUsernameParameter

    Export:
      Name:
        !Sub cloudmart-${Environment}-DBUsernameParameterName


  DBPasswordParameterName:
    Description: SSM parameter path for secure RDS password

    Value:
      !Ref DBPasswordParameter

    Export:
      Name:
        !Sub cloudmart-${Environment}-DBPasswordParameterName


  ReportBucketParameterName:
    Description: SSM parameter path for report bucket

    Value:
      !Ref ReportBucketParameter

    Export:
      Name:
        !Sub cloudmart-${Environment}-ReportBucketParameterName


  ArtifactBucketParameterName:
    Description: SSM parameter path for artifact bucket

    Value:
      !Ref ArtifactBucketParameter

    Export:
      Name:
        !Sub cloudmart-${Environment}-ArtifactBucketParameterName