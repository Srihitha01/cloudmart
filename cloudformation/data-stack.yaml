AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Data Storage Stack.
  Creates the private RDS MySQL database, DB subnet group,
  encrypted S3 report bucket, deployment artifact bucket,
  and non-sensitive SSM configuration parameters.

# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: CloudMart deployment environment

  DBName:
    Type: String
    Default: cloudmart
    Description: CloudMart database name

  DBUsername:
    Type: String
    Default: cloudmartadmin
    NoEcho: true
    Description: RDS master username

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: RDS master password

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS instance class

  AllocatedStorage:
    Type: Number
    Default: 20
    Description: Initial RDS storage in GB


# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ==========================================================
  # RDS DB SUBNET GROUP
  # ==========================================================

  CloudMartDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup

    Properties:

      DBSubnetGroupDescription:
        !Sub CloudMart ${Environment} private RDS subnet group

      SubnetIds:

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds-subnet-group

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # PRIVATE RDS MYSQL DATABASE
  # ==========================================================

  CloudMartRDS:
    Type: AWS::RDS::DBInstance

    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot

    Properties:

      DBInstanceIdentifier:
        !Sub cloudmart-${Environment}-mysql

      Engine: mysql

      DBName:
        !Ref DBName

      MasterUsername:
        !Ref DBUsername

      MasterUserPassword:
        !Ref DBPassword

      DBInstanceClass:
        !Ref DBInstanceClass

      AllocatedStorage:
        !Ref AllocatedStorage

      StorageType: gp3

      StorageEncrypted: true

      Port: 3306

      PubliclyAccessible: false

      MultiAZ: false

      DeletionProtection: false

      BackupRetentionPeriod: 1

      CopyTagsToSnapshot: true

      DBSubnetGroupName:
        !Ref CloudMartDBSubnetGroup

      VPCSecurityGroups:

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-RDSSecurityGroupId

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # S3 REPORT BUCKET
  # Application reports are stored here
  # ==========================================================

  CloudMartReportBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      BucketEncryption:

        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true

        BlockPublicPolicy: true

        IgnorePublicAcls: true

        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-reports

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # S3 DEPLOYMENT ARTIFACT BUCKET
  # Stores Lambda ZIPs, Lambda layers and database schema
  # ==========================================================

  CloudMartArtifactBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      BucketEncryption:

        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true

        BlockPublicPolicy: true

        IgnorePublicAcls: true

        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      LifecycleConfiguration:

        Rules:

          - Id: DeleteOldArtifactVersions

            Status: Enabled

            NoncurrentVersionExpiration:
              NoncurrentDays: 30

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-artifacts

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # SSM DATABASE CONFIGURATION
  #
  # Non-sensitive database configuration is stored here.
  #
  # DB PASSWORD IS NOT CREATED HERE.
  # It is created by deploy.yaml as SecureString.
  # ==========================================================

  DBEndpointParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/db/endpoint

      Type: String

      Value:
        !GetAtt CloudMartRDS.Endpoint.Address

      Description: CloudMart RDS MySQL endpoint


  DBNameParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/db/name

      Type: String

      Value:
        !Ref DBName

      Description: CloudMart database name


  DBPortParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/db/port

      Type: String

      Value:
        !GetAtt CloudMartRDS.Endpoint.Port

      Description: CloudMart RDS MySQL port


  DBUsernameParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/db/username

      Type: String

      Value:
        !Ref DBUsername

      Description: CloudMart RDS MySQL username


  # ==========================================================
  # SSM S3 CONFIGURATION
  # ==========================================================

  ReportBucketParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/s3/report-bucket

      Type: String

      Value:
        !Ref CloudMartReportBucket

      Description: CloudMart report bucket name


  ArtifactBucketParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/s3/artifact-bucket

      Type: String

      Value:
        !Ref CloudMartArtifactBucket

      Description: CloudMart deployment artifact bucket name


# ============================================================
# OUTPUTS
# ============================================================

Outputs:


  # ==========================================================
  # RDS OUTPUTS
  # ==========================================================

  DBEndpoint:

    Description: CloudMart RDS MySQL endpoint

    Value:
      !GetAtt CloudMartRDS.Endpoint.Address

    Export:

      Name:
        !Sub cloudmart-${Environment}-DBEndpoint


  DBPort:

    Description: CloudMart RDS MySQL port

    Value:
      !GetAtt CloudMartRDS.Endpoint.Port

    Export:

      Name:
        !Sub cloudmart-${Environment}-DBPort


  DBName:

    Description: CloudMart database name

    Value:
      !Ref DBName

    Export:

      Name:
        !Sub cloudmart-${Environment}-DBName


  DBUsername:

    Description: CloudMart database username

    Value:
      !Ref DBUsername

    Export:

      Name:
        !Sub cloudmart-${Environment}-DBUsername


  DBInstanceIdentifier:

    Description: CloudMart RDS instance identifier

    Value:
      !Ref CloudMartRDS

    Export:

      Name:
        !Sub cloudmart-${Environment}-DBInstanceIdentifier


  # ==========================================================
  # RDS SECURITY GROUP
  # ==========================================================

  RDSSecurityGroupId:

    Description: CloudMart RDS security group ID

    Value:
      Fn::ImportValue:
        Fn::Sub: cloudmart-${Environment}-RDSSecurityGroupId

    Export:

      Name:
        !Sub cloudmart-${Environment}-DataStorageRDSSecurityGroupId


  # ==========================================================
  # REPORT BUCKET OUTPUTS
  # ==========================================================

  ReportBucketName:

    Description: CloudMart report bucket name

    Value:
      !Ref CloudMartReportBucket

    Export:

      Name:
        !Sub cloudmart-${Environment}-ReportBucketName


  ReportBucketArn:

    Description: CloudMart report bucket ARN

    Value:
      !GetAtt CloudMartReportBucket.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-ReportBucketArn


  # ==========================================================
  # ARTIFACT BUCKET OUTPUTS
  # ==========================================================

  ArtifactBucketName:

    Description: CloudMart deployment artifact bucket name

    Value:
      !Ref CloudMartArtifactBucket

    Export:

      Name:
        !Sub cloudmart-${Environment}-ArtifactBucketName


  ArtifactBucketArn:

    Description: CloudMart deployment artifact bucket ARN

    Value:
      !GetAtt CloudMartArtifactBucket.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-ArtifactBucketArn


  # ==========================================================
  # SSM PARAMETER PATH OUTPUTS
  # ==========================================================

  DBEndpointParameterName:

    Description: SSM parameter path for RDS endpoint

    Value:
      !Ref DBEndpointParameter

    Export:

      Name:
        !Sub cloudmart-${Environment}-DBEndpointParameterName


  DBNameParameterName:

    Description: SSM parameter path for database name

    Value:
      !Ref DBNameParameter

    Export:

      Name:
        !Sub cloudmart-${Environment}-DBNameParameterName


  DBPortParameterName:

    Description: SSM parameter path for database port

    Value:
      !Ref DBPortParameter

    Export:

      Name:
        !Sub cloudmart-${Environment}-DBPortParameterName


  DBUsernameParameterName:

    Description: SSM parameter path for database username

    Value:
      !Ref DBUsernameParameter

    Export:

      Name:
        !Sub cloudmart-${Environment}-DBUsernameParameterName


  ReportBucketParameterName:

    Description: SSM parameter path for report bucket

    Value:
      !Ref ReportBucketParameter

    Export:

      Name:
        !Sub cloudmart-${Environment}-ReportBucketParameterName


  ArtifactBucketParameterName:

    Description: SSM parameter path for artifact bucket

    Value:
      !Ref ArtifactBucketParameter

    Export:

      Name:
        !Sub cloudmart-${Environment}-ArtifactBucketParameterName