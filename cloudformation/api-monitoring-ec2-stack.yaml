                  "title": "Product Lambda - Invocations, Errors and Duration",
                  "view": "timeSeries",
                  "region": "${AWS::Region}",
                  "metrics": [
                    [ "AWS/Lambda", "Invocations", "FunctionName", "cloudmart-${Environment}-product-lambda", { "label": "Invocations", "stat": "Sum" } ],
                    [ ".", "Errors", ".", ".", { "label": "Errors", "stat": "Sum" } ],
                    [ ".", "Duration", ".", ".", { "label": "Duration p50", "stat": "p50" } ],
                    [ ".", ".", ".", ".", { "label": "Duration p90", "stat": "p90" } ]
                  ],
                  "period": 300,
                  "stat": "Sum"
                }
              },
              {
                "type": "metric",
                "properties": {
                  "title": "Order Lambda - Invocations, Errors and Duration",
                  "view": "timeSeries",
                  "region": "${AWS::Region}",
                  "metrics": [
                    [ "AWS/Lambda", "Invocations", "FunctionName", "cloudmart-${Environment}-order-lambda", { "label": "Invocations", "stat": "Sum" } ],
                    [ ".", "Errors", ".", ".", { "label": "Errors", "stat": "Sum" } ],
                    [ ".", "Duration", ".", ".", { "label": "Duration p50", "stat": "p50" } ],
                    [ ".", ".", ".", ".", { "label": "Duration p90", "stat": "p90" } ]
                  ],
                  "period": 300,
                  "stat": "Sum"
                }
              },
              {
