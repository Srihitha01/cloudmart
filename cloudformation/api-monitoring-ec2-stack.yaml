AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart API-Monitoring-EC2 Stack.
  Creates API Gateway REST API with Lambda Authorizer,
  Product and customer-specific Order API routes,
  CloudWatch monitoring and alarms,
  and an EC2 Flask Dashboard.

# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  # ==========================================================
  # ENVIRONMENT
  # ==========================================================

  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    Description: CloudMart deployment environment supplied by CI/CD


  # ==========================================================
  # EC2 CONFIGURATION
  # ==========================================================

  EC2InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type for CloudMart dashboard


  DashboardPort:
    Type: Number
    Default: 5000
    MinValue: 1
    MaxValue: 65535
    Description: HTTP port for the Flask dashboard


  # ==========================================================
  # SNS ALERT TOPICS
  # ==========================================================
  ProductAlertsTopicArn:
    Type: String
    Default: arn:aws:sns:ap-south-1:285150348844:cloudmart-dev-product-alerts
    Description: SNS topic ARN for product and API monitoring alerts

  OrderAlertsTopicArn:
    Type: String
    Default: arn:aws:sns:ap-south-1:285150348844:cloudmart-dev-order-alerts
    Description: SNS topic ARN for order and infrastructure monitoring alerts


# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ==========================================================
  # API GATEWAY REST API
  # ==========================================================

  CloudMartApi:

    Type: AWS::ApiGateway::RestApi

    Properties:

      Name:
        !Sub cloudmart-${Environment}-api

      Description:
        !Sub CloudMart ${Environment} REST API

      Mode:
        overwrite

      EndpointConfiguration:

        Types:
          - REGIONAL

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-api

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # API GATEWAY -> AUTHORIZER LAMBDA PERMISSION
  # ==========================================================

  AuthorizerLambdaInvokePermission:

    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:

        Fn::ImportValue:

          Fn::Sub:
            cloudmart-${Environment}-LambdaAuthorizerArn

      Action:
        lambda:InvokeFunction

      Principal:
        apigateway.amazonaws.com

      SourceArn:

        Fn::Sub:

          - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*

          - ApiId:
              !Ref CloudMartApi


  # ==========================================================
  # LAMBDA AUTHORIZER
  # ==========================================================

  CloudMartAuthorizer:

    Type: AWS::ApiGateway::Authorizer

    DependsOn:
      - AuthorizerLambdaInvokePermission

    Properties:

      Name:
        !Sub cloudmart-${Environment}-authorizer

      RestApiId:
        !Ref CloudMartApi

      Type:
        TOKEN

      IdentitySource:
        method.request.header.Authorization

      AuthorizerResultTtlInSeconds: 0

      AuthorizerUri:

        Fn::Sub:

          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations

          - AuthorizerArn:

              Fn::ImportValue:

                Fn::Sub:
                  cloudmart-${Environment}-LambdaAuthorizerArn


  # ==========================================================
  # PRODUCTS RESOURCE
  # ==========================================================

  ProductsResource:

    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ParentId:

        Fn::GetAtt:
          - CloudMartApi
          - RootResourceId

      PathPart:
        products


  # ==========================================================
  # PRODUCT ID RESOURCE
  # ==========================================================

  ProductIdResource:

    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ParentId:
        !Ref ProductsResource

      PathPart:
        '{id}'


  # ==========================================================
  # GET /products
  # ==========================================================

  GetProductsMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductsResource

      HttpMethod:
        GET

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:

          Fn::Sub:

            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations

            - LambdaArn:

                Fn::ImportValue:

                  Fn::Sub:
                    cloudmart-${Environment}-ProductLambdaArn


  # ==========================================================
  # POST /products
  # ==========================================================

  CreateProductMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductsResource

      HttpMethod:
        POST

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:

          Fn::Sub:

            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations

            - LambdaArn:

                Fn::ImportValue:

                  Fn::Sub:
                    cloudmart-${Environment}-ProductLambdaArn


  # ==========================================================
  # GET /products/{id}
  # ==========================================================

  GetProductByIdMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod:
        GET

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      RequestParameters:

        method.request.path.id: true

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:

          Fn::Sub:

            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations

            - LambdaArn:

                Fn::ImportValue:

                  Fn::Sub:
                    cloudmart-${Environment}-ProductLambdaArn


  # ==========================================================
  # PUT /products/{id}
  # ==========================================================

  UpdateProductMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod:
        PUT

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      RequestParameters:

        method.request.path.id: true

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:

          Fn::Sub:

            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations

            - LambdaArn:

                Fn::ImportValue:

                  Fn::Sub:
                    cloudmart-${Environment}-ProductLambdaArn


  # ==========================================================
  # DELETE /products/{id}
  # SOFT DELETE HANDLED IN PRODUCT LAMBDA
  # ==========================================================

  DeleteProductMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod:
        DELETE

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      RequestParameters:

        method.request.path.id: true

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:

          Fn::Sub:

            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations

            - LambdaArn:

                Fn::ImportValue:

                  Fn::Sub:
                    cloudmart-${Environment}-ProductLambdaArn


  # ==========================================================
  # CUSTOMER ORDERS ROOT RESOURCE
  # /customers
  # ==========================================================

  CustomersResource:

    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ParentId:

        Fn::GetAtt:
          - CloudMartApi
          - RootResourceId

      PathPart:
        customers


  # ==========================================================
  # CUSTOMER ID RESOURCE
  # /customers/{customer_id}
  # ==========================================================

  CustomerIdResource:

    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ParentId:
        !Ref CustomersResource

      PathPart:
        '{customer_id}'


  # ==========================================================
  # POST /customers
  # PUBLIC - CREATE CUSTOMER
  # No bearer token is required for registration.
  # ==========================================================

  CreateCustomerMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref CustomersResource

      HttpMethod:
        POST

      AuthorizationType:
        NONE

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:

          Fn::Sub:

            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations

            - LambdaArn:

                Fn::ImportValue:

                  Fn::Sub:
                    cloudmart-${Environment}-CustomerLambdaArn


  # ==========================================================
  # GET /customers
  # GET ALL CUSTOMERS
  # Protected by the Lambda Authorizer.
  # ==========================================================

  GetCustomersMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref CustomersResource

      HttpMethod:
        GET

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:

          Fn::Sub:

            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations

            - LambdaArn:

                Fn::ImportValue:

                  Fn::Sub:
                    cloudmart-${Environment}-CustomerLambdaArn


  # ==========================================================
  # DELETE /customers/{customer_id}
  # ADMIN ONLY - SOFT DELETE CUSTOMER
  # ==========================================================

  DeleteCustomerMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref CustomerIdResource

      HttpMethod:
        DELETE

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      RequestParameters:

        method.request.path.customer_id: true

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:

          Fn::Sub:

            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations

            - LambdaArn:

                Fn::ImportValue:

                  Fn::Sub:
                    cloudmart-${Environment}-CustomerLambdaArn



  # ==========================================================
  # GET /customers/{customer_id}
  # ==========================================================

  GetCustomerMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref CustomerIdResource

      HttpMethod:
        GET

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      RequestParameters:
        method.request.path.customer_id: true

      Integration:
        Type:
          AWS_PROXY
        IntegrationHttpMethod:
          POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-CustomerLambdaArn


  # ==========================================================
  # PUT /customers/{customer_id}
  # ==========================================================

  UpdateCustomerMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref CustomerIdResource

      HttpMethod:
        PUT

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      RequestParameters:
        method.request.path.customer_id: true

      Integration:
        Type:
          AWS_PROXY
        IntegrationHttpMethod:
          POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-CustomerLambdaArn


  # ==========================================================
  # PATCH /customers/{customer_id}
  # ==========================================================

  PatchCustomerMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref CustomerIdResource

      HttpMethod:
        PATCH

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      RequestParameters:
        method.request.path.customer_id: true

      Integration:
        Type:
          AWS_PROXY
        IntegrationHttpMethod:
          POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-CustomerLambdaArn


  # ==========================================================
  # CUSTOMER ORDERS RESOURCE
  # /customers/{customer_id}/orders
  # ==========================================================

  CustomerOrdersResource:

    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ParentId:
        !Ref CustomerIdResource

      PathPart:
        orders


  # ==========================================================
  # CUSTOMER ORDER ID RESOURCE
  # /customers/{customer_id}/orders/{order_id}
  # ==========================================================

  CustomerOrderIdResource:

    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ParentId:
        !Ref CustomerOrdersResource

      PathPart:
        '{order_id}'


  # ==========================================================
  # CUSTOMER ORDER STATUS RESOURCE
  # /customers/{customer_id}/orders/{order_id}/status
  # ==========================================================

  CustomerOrderStatusResource:

    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ParentId:
        !Ref CustomerOrderIdResource

      PathPart:
        status


  # ==========================================================
  # POST /customers/{customer_id}/orders
  # ==========================================================

  CreateCustomerOrderMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref CustomerOrdersResource

      HttpMethod:
        POST

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      RequestParameters:

        method.request.path.customer_id: true

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:

          Fn::Sub:

            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations

            - LambdaArn:

                Fn::ImportValue:

                  Fn::Sub:
                    cloudmart-${Environment}-OrderLambdaArn


  # ==========================================================
  # GET /customers/{customer_id}/orders
  # ==========================================================

  GetCustomerOrdersMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref CustomerOrdersResource

      HttpMethod:
        GET

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      RequestParameters:

        method.request.path.customer_id: true

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:

          Fn::Sub:

            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations

            - LambdaArn:

                Fn::ImportValue:

                  Fn::Sub:
                    cloudmart-${Environment}-OrderLambdaArn


  # ==========================================================
  # GET /customers/{customer_id}/orders/{order_id}
  # ==========================================================

  GetCustomerOrderByIdMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref CustomerOrderIdResource

      HttpMethod:
        GET

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      RequestParameters:

        method.request.path.customer_id: true

        method.request.path.order_id: true

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:

          Fn::Sub:

            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations

            - LambdaArn:

                Fn::ImportValue:

                  Fn::Sub:
                    cloudmart-${Environment}-OrderLambdaArn


  # ==========================================================
  # PUT /customers/{customer_id}/orders/{order_id}
  # ==========================================================

  UpdateCustomerOrderMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref CustomerOrderIdResource

      HttpMethod:
        PUT

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      RequestParameters:

        method.request.path.customer_id: true

        method.request.path.order_id: true

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:

          Fn::Sub:

            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations

            - LambdaArn:

                Fn::ImportValue:

                  Fn::Sub:
                    cloudmart-${Environment}-OrderLambdaArn


  # ==========================================================
  # PATCH /customers/{customer_id}/orders/{order_id}/status
  # ==========================================================

  UpdateCustomerOrderStatusMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref CustomerOrderStatusResource

      HttpMethod:
        PATCH

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      RequestParameters:

        method.request.path.customer_id: true

        method.request.path.order_id: true

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:

          Fn::Sub:

            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations

            - LambdaArn:

                Fn::ImportValue:

                  Fn::Sub:
                    cloudmart-${Environment}-OrderLambdaArn



  # ==========================================================
  # ADMIN ORDERS RESOURCES
  # /orders, /orders/{id}, /orders/{id}/status
  # ==========================================================

  AdminOrdersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId:
        Fn::GetAtt:
          - CloudMartApi
          - RootResourceId
      PathPart: orders

  AdminOrderIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !Ref AdminOrdersResource
      PathPart: '{id}'

  AdminOrderStatusResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !Ref AdminOrderIdResource
      PathPart: status

  GetAdminOrdersMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref AdminOrdersResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-OrderLambdaArn

  GetAdminOrderByIdMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref AdminOrderIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-OrderLambdaArn

  UpdateAdminOrderStatusMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref AdminOrderStatusResource
      HttpMethod: PATCH
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-OrderLambdaArn

  # ==========================================================
  # API GATEWAY -> PRODUCT LAMBDA PERMISSION
  # ==========================================================

  ProductLambdaInvokePermission:

    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:

        Fn::ImportValue:

          Fn::Sub:
            cloudmart-${Environment}-ProductLambdaArn

      Action:
        lambda:InvokeFunction

      Principal:
        apigateway.amazonaws.com

      SourceArn:

        Fn::Sub:

          - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*

          - ApiId:
              !Ref CloudMartApi


  # ==========================================================
  # API GATEWAY -> ORDER LAMBDA PERMISSION
  # ==========================================================

  OrderLambdaInvokePermission:

    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:

        Fn::ImportValue:

          Fn::Sub:
            cloudmart-${Environment}-OrderLambdaArn

      Action:
        lambda:InvokeFunction

      Principal:
        apigateway.amazonaws.com

      SourceArn:

        Fn::Sub:

          - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*

          - ApiId:
              !Ref CloudMartApi



  # ==========================================================
  # API GATEWAY -> CUSTOMER LAMBDA PERMISSION
  # ==========================================================

  CustomerLambdaInvokePermission:

    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-CustomerLambdaArn

      Action:
        lambda:InvokeFunction

      Principal:
        apigateway.amazonaws.com

      SourceArn:
        Fn::Sub:
          - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*
          - ApiId:
              !Ref CloudMartApi


  # ==========================================================
  # API DEPLOYMENT
  # ==========================================================

  ApiDeploymentV7:

    Type: AWS::ApiGateway::Deployment

    DependsOn:

      # PRODUCT METHODS
      - GetProductsMethod
      - CreateProductMethod
      - GetProductByIdMethod
      - UpdateProductMethod
      - DeleteProductMethod

      # CUSTOMER MANAGEMENT METHODS
      - CreateCustomerMethod
      - GetCustomersMethod
      - GetCustomerMethod
      - UpdateCustomerMethod
      - PatchCustomerMethod
      - DeleteCustomerMethod

      # ADMIN ORDER METHODS
      - GetAdminOrdersMethod
      - GetAdminOrderByIdMethod
      - UpdateAdminOrderStatusMethod

      # CUSTOMER ORDER METHODS
      - CreateCustomerOrderMethod
      - GetCustomerOrdersMethod
      - GetCustomerOrderByIdMethod
      - UpdateCustomerOrderMethod
      - UpdateCustomerOrderStatusMethod

    Properties:

      RestApiId:
        !Ref CloudMartApi

      Description:
        !Sub >
          CloudMart ${Environment} API deployment V8 with
          customer-specific order routes and Lambda Authorizer


  # ==========================================================
  # API GATEWAY ACCESS LOG GROUP
  # ==========================================================

  ApiGatewayLogGroup:

    Type: AWS::Logs::LogGroup

    Properties:

      LogGroupName:
        !Sub /aws/apigateway/cloudmart-${Environment}

      RetentionInDays: 14


  # ==========================================================
  # API STAGE
  # ==========================================================

  ApiStage:

    Type: AWS::ApiGateway::Stage

    DependsOn:
      - ApiGatewayLogGroup

    Properties:

      RestApiId:
        !Ref CloudMartApi

      DeploymentId:
        !Ref ApiDeploymentV7

      StageName:
        !Ref Environment

      Description:
        !Sub CloudMart ${Environment} API stage

      TracingEnabled: true

      MethodSettings:

        - ResourcePath: '/*'

          HttpMethod: '*'

          MetricsEnabled: true

          LoggingLevel: INFO

          DataTraceEnabled: false


  # ==========================================================
  # CLOUDWATCH DASHBOARD
  # ==========================================================

  CloudMartMonitoringDashboard:

    Type: AWS::CloudWatch::Dashboard

    Properties:

      DashboardName:
        !Sub cloudmart-${Environment}-operations

      DashboardBody:

        Fn::Sub: |

          {
            "widgets": [
              {
                "type": "metric",
                "properties": {
                  "title": "API Gateway Requests",
                  "view": "timeSeries",
                  "region": "${AWS::Region}",
                  "metrics": [
                    [
                      "AWS/ApiGateway",
                      "Count",
                      "ApiName",
                      "cloudmart-${Environment}-api",
                      "Stage",
                      "${Environment}"
                    ]
                  ],
                  "period": 300,
                  "stat": "Sum"
                }
              },
              {
                "type": "metric",
                "properties": {
                  "title": "API Gateway Errors",
                  "view": "timeSeries",
                  "region": "${AWS::Region}",
                  "metrics": [
                    [
                      "AWS/ApiGateway",
                      "4XXError",
                      "ApiName",
                      "cloudmart-${Environment}-api",
                      "Stage",
                      "${Environment}"
                    ],
                    [
                      ".",
                      "5XXError",
                      ".",
                      ".",
                      ".",
                      "."
                    ]
                  ],
                  "period": 300,
                  "stat": "Sum"
                }
              },
              {
                "type": "metric",
