AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart API-Monitoring-EC2 Stack.
  Creates API Gateway REST API with Lambda Authorizer,
  Product API routes, and Order API routes.

Parameters:

  # ==========================================================
  # ENVIRONMENT
  # ==========================================================

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment


Resources:

  # ==========================================================
  # API GATEWAY REST API
  # ==========================================================

  CloudMartApi:
    Type: AWS::ApiGateway::RestApi

    Properties:

      Name:
        !Sub cloudmart-${Environment}-api

      Description:
        !Sub CloudMart ${Environment} REST API

      EndpointConfiguration:
        Types:
          - REGIONAL


  # ==========================================================
  # API GATEWAY -> AUTHORISER LAMBDA PERMISSION
  # ==========================================================

  AuthorizerLambdaInvokePermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-LambdaAuthorizerArn

      Action:
        lambda:InvokeFunction

      Principal:
        apigateway.amazonaws.com

      SourceArn:
        Fn::Sub:
          - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*
          - ApiId:
              !Ref CloudMartApi


  # ==========================================================
  # LAMBDA AUTHORISER
  # ==========================================================

  CloudMartAuthorizer:
    Type: AWS::ApiGateway::Authorizer

    DependsOn:
      - AuthorizerLambdaInvokePermission

    Properties:

      Name:
        !Sub cloudmart-${Environment}-authorizer

      RestApiId:
        !Ref CloudMartApi

      Type:
        TOKEN

      IdentitySource:
        method.request.header.Authorization

      # IMPORTANT:
      # Authorization depends on token + HTTP method + resource path.
      # Disable caching so every request is evaluated correctly.
      AuthorizerResultTtlInSeconds: 0

      AuthorizerUri:
        Fn::Sub:
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
          - AuthorizerArn:
              Fn::ImportValue:
                Fn::Sub: cloudmart-${Environment}-LambdaAuthorizerArn


  # ==========================================================
  # PRODUCTS RESOURCE
  # ==========================================================

  ProductsResource:
    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ParentId:
        Fn::GetAtt:
          - CloudMartApi
          - RootResourceId

      PathPart: products


  # ==========================================================
  # PRODUCT ID RESOURCE
  # ==========================================================

  ProductIdResource:
    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ParentId:
        !Ref ProductsResource

      PathPart: '{id}'


  # ==========================================================
  # GET /products
  # CUSTOMER: ALLOWED
  # ADMIN: ALLOWED
  # ==========================================================

  GetProductsMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductsResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-ProductLambdaArn


  # ==========================================================
  # POST /products
  # CUSTOMER: DENIED
  # ADMIN: ALLOWED
  # ==========================================================

  CreateProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductsResource

      HttpMethod: POST

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-ProductLambdaArn


  # ==========================================================
  # GET /products/{id}
  # CUSTOMER: ALLOWED
  # ADMIN: ALLOWED
  # ==========================================================

  GetProductByIdMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      RequestParameters:

        method.request.path.id: true

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-ProductLambdaArn


  # ==========================================================
  # PUT /products/{id}
  # CUSTOMER: DENIED
  # ADMIN: ALLOWED
  # ==========================================================

  UpdateProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod: PUT

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      RequestParameters:

        method.request.path.id: true

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-ProductLambdaArn


  # ==========================================================
  # DELETE /products/{id}
  # CUSTOMER: DENIED
  # ADMIN: ALLOWED
  # ==========================================================

  DeleteProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod: DELETE

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      RequestParameters:

        method.request.path.id: true

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-ProductLambdaArn


  # ==========================================================
  # ORDERS RESOURCE
  # ==========================================================

  OrdersResource:
    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ParentId:
        Fn::GetAtt:
          - CloudMartApi
          - RootResourceId

      PathPart: orders


  # ==========================================================
  # ORDER ID RESOURCE
  # ==========================================================

  OrderIdResource:
    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ParentId:
        !Ref OrdersResource

      PathPart: '{id}'


  # ==========================================================
  # ORDER STATUS RESOURCE
  # ==========================================================

  OrderStatusResource:
    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ParentId:
        !Ref OrderIdResource

      PathPart: status


  # ==========================================================
  # POST /orders
  # CUSTOMER: ALLOWED
  # ADMIN: ALLOWED
  # ==========================================================

  CreateOrderMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref OrdersResource

      HttpMethod: POST

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-OrderLambdaArn


  # ==========================================================
  # GET /orders
  # CUSTOMER: ALLOWED
  # CUSTOMER ID IS TAKEN FROM AUTHORIZER CONTEXT
  # ==========================================================

  GetOrdersMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref OrdersResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      RequestParameters:

        method.request.querystring.customerId: false

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-OrderLambdaArn


  # ==========================================================
  # GET /orders/{id}
  # CUSTOMER: ALLOWED
  # ORDER LAMBDA CHECKS OWNERSHIP
  # ==========================================================

  GetOrderByIdMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref OrderIdResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      RequestParameters:

        method.request.path.id: true

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-OrderLambdaArn


  # ==========================================================
  # PATCH /orders/{id}/status
  # CUSTOMER: ALLOWED
  # ORDER LAMBDA CHECKS OWNERSHIP
  # ==========================================================

  UpdateOrderStatusMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref OrderStatusResource

      HttpMethod: PATCH

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      RequestParameters:

        method.request.path.id: true

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-OrderLambdaArn


  # ==========================================================
  # API GATEWAY -> PRODUCT LAMBDA PERMISSION
  # ==========================================================

  ProductLambdaInvokePermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-ProductLambdaArn

      Action: lambda:InvokeFunction

      Principal: apigateway.amazonaws.com

      SourceArn:
        Fn::Sub:
          - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*
          - ApiId:
              !Ref CloudMartApi


  # ==========================================================
  # API GATEWAY -> ORDER LAMBDA PERMISSION
  # ==========================================================

  OrderLambdaInvokePermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-OrderLambdaArn

      Action: lambda:InvokeFunction

      Principal: apigateway.amazonaws.com

      SourceArn:
        Fn::Sub:
          - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*
          - ApiId:
              !Ref CloudMartApi


  # ==========================================================
  # API DEPLOYMENT
  # NEW LOGICAL ID ENSURES FRESH DEPLOYMENT
  # ==========================================================

  ApiDeploymentV3:
    Type: AWS::ApiGateway::Deployment

    DependsOn:

      # PRODUCT METHODS
      - GetProductsMethod
      - CreateProductMethod
      - GetProductByIdMethod
      - UpdateProductMethod
      - DeleteProductMethod

      # ORDER METHODS
      - CreateOrderMethod
      - GetOrdersMethod
      - GetOrderByIdMethod
      - UpdateOrderStatusMethod

    Properties:

      RestApiId:
        !Ref CloudMartApi

      Description:
        !Sub >
          CloudMart ${Environment} API deployment with
          Lambda Authorizer route-based authorization


  # ==========================================================
  # API STAGE
  # ==========================================================

  ApiStage:
    Type: AWS::ApiGateway::Stage

    Properties:

      RestApiId:
        !Ref CloudMartApi

      DeploymentId:
        !Ref ApiDeploymentV3

      StageName:
        !Ref Environment

      Description:
        !Sub CloudMart ${Environment} API stage


# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  # ==========================================================
  # API ID
  # ==========================================================

  ApiId:

    Description:
      CloudMart API Gateway REST API ID

    Value:
      !Ref CloudMartApi

    Export:
      Name:
        !Sub cloudmart-${Environment}-ApiId


  # ==========================================================
  # API ENDPOINT
  # ==========================================================

  ApiEndpoint:

    Description:
      CloudMart API endpoint

    Value:
      !Sub >
        https://${CloudMartApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}

    Export:
      Name:
        !Sub cloudmart-${Environment}-ApiEndpoint


  # ==========================================================
  # AUTHORISER ID
  # ==========================================================

  AuthorizerId:

    Description:
      CloudMart API Gateway Lambda Authorizer ID

    Value:
      !Ref CloudMartAuthorizer

    Export:
      Name:
        !Sub cloudmart-${Environment}-AuthorizerId