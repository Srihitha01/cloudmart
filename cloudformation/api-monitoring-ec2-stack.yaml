AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart API-Monitoring-EC2 Stack.
  Creates API Gateway REST API with Lambda Authorizer,
  Product API routes, and customer-specific Order API routes.

Parameters:

  # ==========================================================
  # ENVIRONMENT
  # ==========================================================

  Environment:
    Type: String
    Default: dev

    AllowedValues:
      - dev
      - prod

    Description: Deployment environment


Resources:

  # ==========================================================
  # API GATEWAY REST API
  # ==========================================================

  CloudMartApi:

    Type: AWS::ApiGateway::RestApi

    Properties:

      Name: !Sub cloudmart-${Environment}-api

      Description: !Sub CloudMart ${Environment} REST API

      EndpointConfiguration:

        Types:
          - REGIONAL


  # ==========================================================
  # API GATEWAY -> AUTHORIZER LAMBDA PERMISSION
  # ==========================================================

  AuthorizerLambdaInvokePermission:

    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-LambdaAuthorizerArn

      Action: lambda:InvokeFunction

      Principal: apigateway.amazonaws.com

      SourceArn:
        Fn::Sub:
          - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*
          - ApiId: !Ref CloudMartApi


  # ==========================================================
  # LAMBDA AUTHORIZER
  # ==========================================================

  CloudMartAuthorizer:

    Type: AWS::ApiGateway::Authorizer

    DependsOn:
      - AuthorizerLambdaInvokePermission

    Properties:

      Name: !Sub cloudmart-${Environment}-authorizer

      RestApiId: !Ref CloudMartApi

      Type: TOKEN

      IdentitySource: method.request.header.Authorization

      AuthorizerResultTtlInSeconds: 0

      AuthorizerUri:
        Fn::Sub:
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
          - AuthorizerArn:
              Fn::ImportValue:
                Fn::Sub: cloudmart-${Environment}-LambdaAuthorizerArn


  # ==========================================================
  # PRODUCTS RESOURCE
  # ==========================================================

  ProductsResource:

    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId: !Ref CloudMartApi

      ParentId:
        Fn::GetAtt:
          - CloudMartApi
          - RootResourceId

      PathPart: products


  # ==========================================================
  # PRODUCT ID RESOURCE
  # ==========================================================

  ProductIdResource:

    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId: !Ref CloudMartApi

      ParentId: !Ref ProductsResource

      PathPart: '{id}'


  # ==========================================================
  # GET /products
  # ==========================================================

  GetProductsMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId: !Ref CloudMartApi

      ResourceId: !Ref ProductsResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-ProductLambdaArn


  # ==========================================================
  # POST /products
  # ==========================================================

  CreateProductMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId: !Ref CloudMartApi

      ResourceId: !Ref ProductsResource

      HttpMethod: POST

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-ProductLambdaArn


  # ==========================================================
  # GET /products/{id}
  # ==========================================================

  GetProductByIdMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId: !Ref CloudMartApi

      ResourceId: !Ref ProductIdResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref CloudMartAuthorizer

      RequestParameters:

        method.request.path.id: true

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-ProductLambdaArn


  # ==========================================================
  # PUT /products/{id}
  # ==========================================================

  UpdateProductMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId: !Ref CloudMartApi

      ResourceId: !Ref ProductIdResource

      HttpMethod: PUT

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref CloudMartAuthorizer

      RequestParameters:

        method.request.path.id: true

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-ProductLambdaArn


  # ==========================================================
  # DELETE /products/{id}
  # ==========================================================

  DeleteProductMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId: !Ref CloudMartApi

      ResourceId: !Ref ProductIdResource

      HttpMethod: DELETE

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref CloudMartAuthorizer

      RequestParameters:

        method.request.path.id: true

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-ProductLambdaArn


  # ==========================================================
  # CUSTOMERS RESOURCE
  # ==========================================================

  CustomersResource:

    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId: !Ref CloudMartApi

      ParentId:
        Fn::GetAtt:
          - CloudMartApi
          - RootResourceId

      PathPart: customers


  # ==========================================================
  # CUSTOMER ID RESOURCE
  # ==========================================================

  CustomerIdResource:

    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId: !Ref CloudMartApi

      ParentId: !Ref CustomersResource

      PathPart: '{customer_id}'


  # ==========================================================
  # CUSTOMER ORDERS RESOURCE
  # /customers/{customer_id}/orders
  # ==========================================================

  CustomerOrdersResource:

    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId: !Ref CloudMartApi

      ParentId: !Ref CustomerIdResource

      PathPart: orders


  # ==========================================================
  # CUSTOMER ORDER ID RESOURCE
  # /customers/{customer_id}/orders/{order_id}
  # ==========================================================

  CustomerOrderIdResource:

    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId: !Ref CloudMartApi

      ParentId: !Ref CustomerOrdersResource

      PathPart: '{order_id}'


  # ==========================================================
  # CUSTOMER ORDER STATUS RESOURCE
  # /customers/{customer_id}/orders/{order_id}/status
  # ==========================================================

  CustomerOrderStatusResource:

    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId: !Ref CloudMartApi

      ParentId: !Ref CustomerOrderIdResource

      PathPart: status


  # ==========================================================
  # POST /customers/{customer_id}/orders
  # CUSTOMER: ALLOWED FOR OWN ID ONLY
  # ADMIN: DENIED BY AUTHORIZER
  # ==========================================================

  CreateCustomerOrderMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId: !Ref CloudMartApi

      ResourceId: !Ref CustomerOrdersResource

      HttpMethod: POST

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref CloudMartAuthorizer

      RequestParameters:

        method.request.path.customer_id: true

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-OrderLambdaArn


  # ==========================================================
  # GET /customers/{customer_id}/orders
  # CUSTOMER: OWN ORDERS ONLY
  # ==========================================================

  GetCustomerOrdersMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId: !Ref CloudMartApi

      ResourceId: !Ref CustomerOrdersResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref CloudMartAuthorizer

      RequestParameters:

        method.request.path.customer_id: true

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-OrderLambdaArn


  # ==========================================================
  # GET /customers/{customer_id}/orders/{order_id}
  # CUSTOMER: OWN ORDER ONLY
  # ==========================================================

  GetCustomerOrderByIdMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId: !Ref CloudMartApi

      ResourceId: !Ref CustomerOrderIdResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref CloudMartAuthorizer

      RequestParameters:

        method.request.path.customer_id: true

        method.request.path.order_id: true

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-OrderLambdaArn


  # ==========================================================
  # PUT /customers/{customer_id}/orders/{order_id}
  # CUSTOMER: OWN ORDER ONLY
  # USED FOR PRODUCT / QUANTITY UPDATES
  # ==========================================================

  UpdateCustomerOrderMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId: !Ref CloudMartApi

      ResourceId: !Ref CustomerOrderIdResource

      HttpMethod: PUT

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref CloudMartAuthorizer

      RequestParameters:

        method.request.path.customer_id: true

        method.request.path.order_id: true

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-OrderLambdaArn


  # ==========================================================
  # PATCH /customers/{customer_id}/orders/{order_id}/status
  # CUSTOMER: OWN ORDER ONLY
  # ==========================================================

  UpdateCustomerOrderStatusMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId: !Ref CloudMartApi

      ResourceId: !Ref CustomerOrderStatusResource

      HttpMethod: PATCH

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref CloudMartAuthorizer

      RequestParameters:

        method.request.path.customer_id: true

        method.request.path.order_id: true

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-OrderLambdaArn


  # ==========================================================
  # API GATEWAY -> PRODUCT LAMBDA PERMISSION
  # ==========================================================

  ProductLambdaInvokePermission:

    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-ProductLambdaArn

      Action: lambda:InvokeFunction

      Principal: apigateway.amazonaws.com

      SourceArn:
        Fn::Sub:
          - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*
          - ApiId: !Ref CloudMartApi


  # ==========================================================
  # API GATEWAY -> ORDER LAMBDA PERMISSION
  # ==========================================================

  OrderLambdaInvokePermission:

    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-OrderLambdaArn

      Action: lambda:InvokeFunction

      Principal: apigateway.amazonaws.com

      SourceArn:
        Fn::Sub:
          - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*
          - ApiId: !Ref CloudMartApi


  # ==========================================================
  # API DEPLOYMENT
  # ==========================================================

  ApiDeploymentV4:

    Type: AWS::ApiGateway::Deployment

    DependsOn:

      # PRODUCT METHODS
      - GetProductsMethod
      - CreateProductMethod
      - GetProductByIdMethod
      - UpdateProductMethod
      - DeleteProductMethod

      # CUSTOMER ORDER METHODS
      - CreateCustomerOrderMethod
      - GetCustomerOrdersMethod
      - GetCustomerOrderByIdMethod
      - UpdateCustomerOrderMethod
      - UpdateCustomerOrderStatusMethod

    Properties:

      RestApiId: !Ref CloudMartApi

      Description: !Sub >
        CloudMart ${Environment} API deployment with
        customer-specific order routes and Lambda Authorizer


  # ==========================================================
  # API STAGE
  # ==========================================================

  ApiStage:

    Type: AWS::ApiGateway::Stage

    Properties:

      RestApiId: !Ref CloudMartApi

      DeploymentId: !Ref ApiDeploymentV4

      StageName: !Ref Environment

      Description: !Sub CloudMart ${Environment} API stage


# ============================================================
# OUTPUTS
# ============================================================

Outputs:


  ApiId:

    Description: CloudMart API Gateway REST API ID

    Value: !Ref CloudMartApi

    Export:

      Name: !Sub cloudmart-${Environment}-ApiId


  ApiEndpoint:

    Description: CloudMart API endpoint

    Value: !Sub https://${CloudMartApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}

    Export:

      Name: !Sub cloudmart-${Environment}-ApiEndpoint


  AuthorizerId:

    Description: CloudMart API Gateway Lambda Authorizer ID

    Value: !Ref CloudMartAuthorizer

    Export:

      Name: !Sub cloudmart-${Environment}-AuthorizerId