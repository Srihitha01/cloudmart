AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart API-Monitoring-EC2 Stack.
  Creates API Gateway REST API with Lambda Authorizer
  and Product API routes.

Parameters:

  # ==========================================================
  # ENVIRONMENT
  # ==========================================================

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment


Resources:

  # ==========================================================
  # API GATEWAY REST API
  # ==========================================================

  CloudMartApi:
    Type: AWS::ApiGateway::RestApi

    Properties:
      Name: !Sub cloudmart-${Environment}-api
      Description: !Sub CloudMart ${Environment} REST API

      EndpointConfiguration:
        Types:
          - REGIONAL


  # ==========================================================
  # LAMBDA AUTHORISER
  # ==========================================================

  CloudMartAuthorizer:
    Type: AWS::ApiGateway::Authorizer

    Properties:
      Name: !Sub cloudmart-${Environment}-authorizer

      RestApiId:
        !Ref CloudMartApi

      Type: TOKEN

      IdentitySource:
        method.request.header.Authorization
      AuthorizerResultTtlInSeconds: 0

      AuthorizerUri:
        Fn::Sub:
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
          - AuthorizerArn:
              Fn::ImportValue:
                Fn::Sub: cloudmart-${Environment}-LambdaAuthorizerArn

      AuthorizerResultTtlInSeconds: 0


  # ==========================================================
  # PRODUCTS RESOURCE
  # ==========================================================

  ProductsResource:
    Type: AWS::ApiGateway::Resource

    Properties:
      RestApiId:
        !Ref CloudMartApi

      ParentId:
        Fn::GetAtt:
          - CloudMartApi
          - RootResourceId

      PathPart: products


  # ==========================================================
  # PRODUCT ID RESOURCE
  # ==========================================================

  ProductIdResource:
    Type: AWS::ApiGateway::Resource

    Properties:
      RestApiId:
        !Ref CloudMartApi

      ParentId:
        !Ref ProductsResource

      PathPart: '{id}'


  # ==========================================================
  # GET /products
  # ==========================================================

  GetProductsMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductsResource

      HttpMethod:
        GET

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      Integration:
        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-ProductLambdaArn


  # ==========================================================
  # POST /products
  # ==========================================================

  CreateProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductsResource

      HttpMethod:
        POST

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      Integration:
        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-ProductLambdaArn


  # ==========================================================
  # GET /products/{id}
  # ==========================================================

  GetProductByIdMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod:
        GET

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      Integration:
        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-ProductLambdaArn


  # ==========================================================
  # PUT /products/{id}
  # ==========================================================

  UpdateProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod:
        PUT

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      Integration:
        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-ProductLambdaArn


  # ==========================================================
  # DELETE /products/{id}
  # ==========================================================

  DeleteProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod:
        DELETE

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      Integration:
        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-ProductLambdaArn


  # ==========================================================
  # API GATEWAY -> PRODUCT LAMBDA PERMISSION
  # ==========================================================

  ProductLambdaInvokePermission:
    Type: AWS::Lambda::Permission

    Properties:
      FunctionName:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-ProductLambdaArn

      Action:
        lambda:InvokeFunction

      Principal:
        apigateway.amazonaws.com

      SourceArn:
        Fn::Sub:
          - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*
          - ApiId:
              !Ref CloudMartApi


  # ==========================================================
  # API GATEWAY -> AUTHORISER LAMBDA PERMISSION
  # ==========================================================

  AuthorizerLambdaInvokePermission:
    Type: AWS::Lambda::Permission

    Properties:
      FunctionName:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-LambdaAuthorizerArn

      Action:
        lambda:InvokeFunction

      Principal:
        apigateway.amazonaws.com

      SourceArn:
        Fn::Sub:
          - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*
          - ApiId:
              !Ref CloudMartApi


  # ==========================================================
  # API DEPLOYMENT
  # ==========================================================

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment

    DependsOn:
      - GetProductsMethod
      - CreateProductMethod
      - GetProductByIdMethod
      - UpdateProductMethod
      - DeleteProductMethod

    Properties:
      RestApiId:
        !Ref CloudMartApi

      Description:
        !Sub CloudMart ${Environment} API deployment


  # ==========================================================
  # API STAGE
  # ==========================================================

  ApiStage:
    Type: AWS::ApiGateway::Stage

    Properties:
      RestApiId:
        !Ref CloudMartApi

      DeploymentId:
        !Ref ApiDeployment

      StageName:
        dev

      Description:
        !Sub CloudMart ${Environment} API stage


# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  # ----------------------------------------------------------
  # API ID
  # ----------------------------------------------------------

  ApiId:
    Description: CloudMart API Gateway REST API ID
    Value:
      !Ref CloudMartApi

    Export:
      Name:
        !Sub cloudmart-${Environment}-ApiId


  # ----------------------------------------------------------
  # API ENDPOINT
  # ----------------------------------------------------------

  ApiEndpoint:
    Description: CloudMart API endpoint
    Value:
      !Sub https://${CloudMartApi}.execute-api.${AWS::Region}.amazonaws.com/dev

    Export:
      Name:
        !Sub cloudmart-${Environment}-ApiEndpoint


  # ----------------------------------------------------------
  # AUTHORISER ID
  # ----------------------------------------------------------

  AuthorizerId:
    Description: CloudMart API Gateway Lambda Authorizer ID
    Value:
      !Ref CloudMartAuthorizer

    Export:
      Name:
        !Sub cloudmart-${Environment}-AuthorizerId