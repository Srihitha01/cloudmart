      Dimensions:

        - Name: InstanceId

          Value:
            !Ref CloudMartDashboardInstance

      Statistic:
        Average

      Period: 300

      EvaluationPeriods: 2

      Threshold: 80

      ComparisonOperator:
        GreaterThanThreshold

      AlarmActions:
        - !Ref OrderAlertsTopicArn

      TreatMissingData:
        notBreaching


