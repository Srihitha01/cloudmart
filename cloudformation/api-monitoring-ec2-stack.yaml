  # ==========================================================
  # EC2 DASHBOARD ACCESS POLICY
  # Allows the dashboard instance to:
  # - download dashboard files published by GitHub Actions
  # - read generated reports from the report bucket
  # - read CloudMart DB connection parameters from SSM
  # ==========================================================

  CloudMartDashboardAccessPolicy:

    Type: AWS::IAM::Policy

    Properties:

      PolicyName:
        !Sub cloudmart-${Environment}-dashboard-access

      Roles:

        - Fn::Select:
            - 1
            - Fn::Split:
                - /
                - Fn::ImportValue:
                    Fn::Sub: cloudmart-${Environment}-EC2DashboardRoleArn

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow
            Action:
              - s3:GetObject
            Resource:
              Fn::Sub:
                - '${ArtifactBucketArn}/dashboard/*'
                - ArtifactBucketArn:
                    Fn::ImportValue:
                      Fn::Sub: cloudmart-${Environment}-ArtifactBucketArn

          - Effect: Allow
            Action:
              - s3:ListBucket
            Resource:
              Fn::ImportValue:
                Fn::Sub: cloudmart-${Environment}-ArtifactBucketArn
            Condition:
              StringLike:
                s3:prefix:
                  - dashboard
                  - dashboard/*

          - Effect: Allow
            Action:
              - s3:GetObject
            Resource:
              Fn::Sub:
                - '${ReportBucketArn}/*'
                - ReportBucketArn:
                    Fn::ImportValue:
                      Fn::Sub: cloudmart-${Environment}-ReportBucketArn

          - Effect: Allow
            Action:
              - s3:ListBucket
            Resource:
              Fn::ImportValue:
                Fn::Sub: cloudmart-${Environment}-ReportBucketArn
            Condition:
              StringLike:
                s3:prefix:
                  - daily-reports
                  - daily-reports/*

          - Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/s3/report-bucket
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/token


  # ==========================================================
  # EC2 FLASK DASHBOARD
  # ==========================================================

  CloudMartDashboardInstance:

    Type: AWS::EC2::Instance

    DependsOn:
      - CloudMartDashboardAccessPolicy

    Properties:

      InstanceType:
        !Ref EC2InstanceType

      # Latest Amazon Linux 2023 AMI from SSM
      # No AMI ID hardcoding
      ImageId:
        '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'

      SubnetId:

        Fn::ImportValue:

          Fn::Sub:
            cloudmart-${Environment}-PublicSubnetId

      SecurityGroupIds:

        - Fn::ImportValue:

            Fn::Sub:
              cloudmart-${Environment}-EC2SecurityGroupId

      IamInstanceProfile:

        Fn::ImportValue:

          Fn::Sub:
            cloudmart-${Environment}-EC2DashboardInstanceProfile

      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              set -euxo pipefail

              exec > >(tee -a /var/log/cloudmart-dashboard-userdata.log | logger -t cloudmart-dashboard -s 2>/dev/console) 2>&1

              dnf install -y python3 python3-pip
              install -d -m 0755 /opt/cloudmart/dashboard
              install -d -m 0755 /var/log/cloudmart

              # Wait briefly for instance networking and IAM credentials.
              for attempt in {1..12}; do
                if aws sts get-caller-identity --region ${AWS::Region} >/dev/null 2>&1; then
                  break
                fi
                sleep 5
              done

              # Download the immutable dashboard artifact with retries.
              for attempt in {1..5}; do
                rm -rf /opt/cloudmart/dashboard/*
                if aws s3 sync "s3://${ArtifactBucketName}/dashboard/" /opt/cloudmart/dashboard/ --region ${AWS::Region}; then
                  break
                fi
                sleep 10
              done

              test -s /opt/cloudmart/dashboard/app.py
              cd /opt/cloudmart/dashboard

              # Keep application dependencies isolated and reproducible.
              python3 -m venv /opt/cloudmart/dashboard/.venv
              /opt/cloudmart/dashboard/.venv/bin/python -m pip install --upgrade pip setuptools wheel
              if [ -s requirements.txt ]; then
                /opt/cloudmart/dashboard/.venv/bin/python -m pip install -r requirements.txt
              else
                /opt/cloudmart/dashboard/.venv/bin/python -m pip install flask pymysql boto3 gunicorn
              fi

              # Create a persistent Flask session secret on this EC2 instance.
              # It is generated only once and is not related to the admin bearer token.
              install -d -m 0755 /etc/cloudmart
              if [ ! -s /etc/cloudmart/dashboard.env ]; then
                umask 077
                SECRET=$(python3 -c 'import secrets; print(secrets.token_hex(32))')
                printf 'FLASK_SECRET_KEY=%s\n' "$SECRET" > /etc/cloudmart/dashboard.env
                chmod 600 /etc/cloudmart/dashboard.env
              fi

              # Validate imports before systemd is enabled.
              /opt/cloudmart/dashboard/.venv/bin/python -c "import app; assert app.app is not None"

              cat > /etc/systemd/system/cloudmart-dashboard.service <<'SERVICE'
              [Unit]
              Description=CloudMart Flask Dashboard
              After=network-online.target
              Wants=network-online.target

              [Service]
              Type=simple
              WorkingDirectory=/opt/cloudmart/dashboard
              EnvironmentFile=/etc/cloudmart/dashboard.env
              Environment=PYTHONUNBUFFERED=1
              Environment=AWS_REGION=${AWS::Region}
              Environment=DB_ENDPOINT_PARAMETER=/cloudmart/${Environment}/db/endpoint
              Environment=DB_PORT_PARAMETER=/cloudmart/${Environment}/db/port
              Environment=DB_NAME_PARAMETER=/cloudmart/${Environment}/db/name
              Environment=DB_USERNAME_PARAMETER=/cloudmart/${Environment}/db/username
              Environment=DB_PASSWORD_PARAMETER=/cloudmart/${Environment}/db/password
              Environment=AUTH_TOKEN_PARAMETER=/cloudmart/${Environment}/auth/token
              Environment=REPORT_BUCKET=${ReportBucketName}
              Environment=REPORT_BUCKET_PARAMETER=/cloudmart/${Environment}/s3/report-bucket
              Environment=ENVIRONMENT=${Environment}
              ExecStart=/opt/cloudmart/dashboard/.venv/bin/gunicorn --workers 2 --threads 4 --timeout 120 --access-logfile - --error-logfile - --bind 0.0.0.0:${DashboardPort} app:app
              Restart=always
              RestartSec=5
              StartLimitIntervalSec=0
              User=root

              [Install]
              WantedBy=multi-user.target
              SERVICE

              systemctl daemon-reload
              systemctl enable cloudmart-dashboard
              systemctl restart cloudmart-dashboard
              sleep 5
              systemctl is-active --quiet cloudmart-dashboard
              curl --fail --silent --show-error --max-time 10 http://127.0.0.1:${DashboardPort}/ >/dev/null || {
                journalctl -u cloudmart-dashboard -n 100 --no-pager
                exit 1
              }

            - ArtifactBucketName:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-ArtifactBucketName
              ReportBucketName:
                Fn::ImportValue:
                  Fn::Sub: cloudmart-${Environment}-ReportBucketName

      Tags:

        - Key: Name

          Value:
            !Sub cloudmart-${Environment}-flask-dashboard

        - Key: Project

          Value: CloudMart

        - Key: Environment

          Value:
            !Ref Environment


