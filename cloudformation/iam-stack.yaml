  # ==========================================================
  # DAILY REPORT LAMBDA ROLE
  # ==========================================================

  DailyReportLambdaRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-daily-report-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        # ------------------------------------------------------
        # CLOUDWATCH LOGGING
        # ------------------------------------------------------

        - PolicyName: DailyReportLogging

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-daily-report


        # ------------------------------------------------------
        # SSM DATABASE PARAMETERS
        # ------------------------------------------------------

        - PolicyName: DailyReportSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/name
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/endpoint
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/port
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/username
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/password


        # ------------------------------------------------------
        # REPORT S3 BUCKET
        # ------------------------------------------------------

        - PolicyName: DailyReportS3

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - s3:PutObject
                  - s3:GetObject

                Resource:

                  - Fn::Sub:

                      - "${ReportBucketArn}/*"

                      - ReportBucketArn:

                          Fn::ImportValue:

                            Fn::Sub: cloudmart-${Environment}-ReportBucketArn


        # ------------------------------------------------------
        # VPC ACCESS
        # ------------------------------------------------------

        - PolicyName: DailyReportVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource:
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-daily-report-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # RDS ADMINISTRATION EC2 ROLE
  # ==========================================================

  RDSAdminEC2Role:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-rds-admin-ec2-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - ec2.amazonaws.com

            Action:
              - sts:AssumeRole

      # Dynamic AWS managed policy ARN
      ManagedPolicyArns:

        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore

      Policies:

        - PolicyName: RDSAdminDatabaseAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - rds:DescribeDBInstances

                Resource:
                  - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:cloudmart-${Environment}-mysql

        - PolicyName: RDSAdminDatabaseSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/name
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/endpoint
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/port
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/username
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/password

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-rds-admin-ec2-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # RDS ADMIN EC2 INSTANCE PROFILE
  # ==========================================================

  RDSAdminEC2InstanceProfile:

    Type: AWS::IAM::InstanceProfile

    Properties:

      InstanceProfileName:
        !Sub cloudmart-${Environment}-rds-admin-instance-profile

      Roles:

        - !Ref RDSAdminEC2Role


  # ==========================================================
  # EC2 API MONITORING DASHBOARD ROLE
  # ==========================================================

  EC2DashboardRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-ec2-dashboard-role

      Description:
        !Sub IAM role for CloudMart ${Environment} API monitoring dashboard EC2

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - ec2.amazonaws.com

            Action:
              - sts:AssumeRole

      # Dynamic AWS managed policy ARN
      ManagedPolicyArns:

        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-ec2-dashboard-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # EC2 API MONITORING DASHBOARD INSTANCE PROFILE
  # ==========================================================

  EC2DashboardInstanceProfile:

    Type: AWS::IAM::InstanceProfile

    Properties:

      InstanceProfileName:
        !Sub cloudmart-${Environment}-ec2-dashboard-instance-profile

      Roles:

        - !Ref EC2DashboardRole


  # ==========================================================
  # SECURE AUTH SSM PARAMETERS
  # ==========================================================

  AuthSSMWriterRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-auth-ssm-writer-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: SecureAuthParameterWriter

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                  - ssm:DeleteParameter

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/token

              - Effect: Allow

                Action:
                  - ssm:DeleteParameter

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/customer-tokens

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup

                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-auth-ssm-writer

              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-auth-ssm-writer:*

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-auth-ssm-writer-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # AUTH SSM WRITER FUNCTION
  # ==========================================================

  AuthSSMWriterFunction:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-auth-ssm-writer

      Runtime:
        python3.12

      Handler:
        index.handler

      Role:
        !GetAtt AuthSSMWriterRole.Arn

      Timeout:
        60

      Code:

        ZipFile: |

          import json
          import secrets
          import urllib.request
          import boto3


          ssm = boto3.client("ssm")


          def respond(
              event,
              context,
              status,
              physical_id,
              data=None,
              reason=None
          ):

              body = {

                  "Status": status,

                  "Reason":
                      reason or "See CloudWatch Logs",

                  "PhysicalResourceId":
                      physical_id,

                  "StackId":
                      event["StackId"],

                  "RequestId":
                      event["RequestId"],

                  "LogicalResourceId":
                      event["LogicalResourceId"],

                  "Data":
                      data or {}

              }

              encoded = json.dumps(
                  body
              ).encode("utf-8")

              request = urllib.request.Request(

                  event["ResponseURL"],

                  data=encoded,

                  method="PUT",

                  headers={

                      "content-type": "",

                      "content-length":
                          str(len(encoded))

                  }

              )

              urllib.request.urlopen(
                  request
              )


          def parameter_exists(name):

              try:

                  response = ssm.get_parameter(
                      Name=name
                  )

                  return (
                      response["Parameter"]["Type"]
                      == "SecureString"
                  )

              except ssm.exceptions.ParameterNotFound:

                  return False


          def ensure_parameter(
              name,
              value,
              description
          ):

              if parameter_exists(name):

                  return

              ssm.put_parameter(

                  Name=name,

                  Value=value,

                  Type="SecureString",

                  Description=description,

                  Overwrite=False

              )


          def handler(event, context):

              physical_id = (

                  event.get(
                      "PhysicalResourceId"
                  )

                  or event[
                      "ResourceProperties"
                  ][
                      "ParameterPrefix"
                  ]

              )

              try:

                  prefix = (
                      event[
                          "ResourceProperties"
                      ][
                          "ParameterPrefix"
                      ]
                  )

                  admin_name = (
                      prefix
                      + "/token"
                  )

                  legacy_customer_tokens_name = (
                      prefix
                      + "/customer-tokens"
                  )

                  if event[
                      "RequestType"
                  ] in (
                      "Create",
                      "Update"
                  ):

                      admin_token = (
                          secrets.token_urlsafe(
                              32
                          )
                      )

                      ensure_parameter(

                          admin_name,

                          admin_token,

                          "CloudMart administrator authentication token"

                      )

                      # Customer bearer tokens are stored hashed in RDS.
                      # Remove the legacy SSM customer-token map so no
                      # unmanaged authentication resource remains.
                      try:

                          ssm.delete_parameter(
                              Name=legacy_customer_tokens_name
                          )

                      except ssm.exceptions.ParameterNotFound:

                          pass

                  elif event[
                      "RequestType"
                  ] == "Delete":

                      for name in (
                          admin_name,
                          legacy_customer_tokens_name,
                      ):

                          try:

                              ssm.delete_parameter(
                                  Name=name
                              )

                          except ssm.exceptions.ParameterNotFound:

                              pass

                  respond(

                      event,

                      context,

                      "SUCCESS",

                      physical_id

                  )

              except Exception:

                  respond(

                      event,

                      context,

                      "FAILED",

                      physical_id,

                      reason="Authentication parameter provisioning failed; see CloudWatch Logs"

                  )

                  raise


  # ==========================================================
  # AUTH SSM PARAMETERS
  # ==========================================================

  AuthSSMParameters:

    Type: Custom::CloudMartAuthParameters

    DependsOn:

      - AuthSSMWriterFunction

    Properties:

      ServiceToken:
        !GetAtt AuthSSMWriterFunction.Arn

      ParameterPrefix:
        !Sub /cloudmart/${Environment}/auth


