AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart IAM Stack.
  Creates least-privilege IAM execution roles
  for CloudMart Lambda functions.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment


Resources:

  # ==========================================================
  # LAMBDA AUTHORIZER ROLE
  # ==========================================================

  LambdaAuthorizerRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-lambda-authorizer-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        # ======================================================
        # CLOUDWATCH LOGGING
        # ======================================================

        - PolicyName: LambdaAuthorizerLogging

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-lambda-authorizer:*


        # ======================================================
        # SSM AUTH PARAMETERS
        # ======================================================

        - PolicyName: LambdaAuthorizerSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/*


        # ======================================================
        # VPC NETWORK ACCESS
        # ======================================================

        - PolicyName: LambdaAuthorizerVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: '*'


      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-lambda-authorizer-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # PRODUCT LAMBDA ROLE
  # ==========================================================

  ProductLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-product-lambda-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        # ======================================================
        # CLOUDWATCH LOGGING
        # ======================================================

        - PolicyName: ProductLambdaLogging

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-product-lambda:*


        # ======================================================
        # DATABASE SSM PARAMETERS
        # ======================================================

        - PolicyName: ProductLambdaSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*


        # ======================================================
        # EVENTBRIDGE
        # ======================================================

        - PolicyName: ProductLambdaEventBridge

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - events:PutEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/cloudmart-${Environment}-event-bus


        # ======================================================
        # VPC NETWORK ACCESS
        # ======================================================

        - PolicyName: ProductLambdaVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: '*'


      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-product-lambda-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # ORDER LAMBDA ROLE
  # ==========================================================

  OrderLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-order-lambda-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        # ======================================================
        # CLOUDWATCH LOGGING
        # ======================================================

        - PolicyName: OrderLambdaLogging

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-order-lambda:*


        # ======================================================
        # DATABASE SSM PARAMETERS
        # ======================================================

        - PolicyName: OrderLambdaSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*


        # ======================================================
        # ORDER LAMBDA -> ORDER PROCESSOR
        # ======================================================

        - PolicyName: OrderLambdaInvokeProcessor

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - lambda:InvokeFunction

                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:cloudmart-${Environment}-order-processor


        # ======================================================
        # EVENTBRIDGE
        # ======================================================

        - PolicyName: OrderLambdaEventBridge

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - events:PutEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/cloudmart-${Environment}-event-bus


        # ======================================================
        # VPC NETWORK ACCESS
        # ======================================================

        - PolicyName: OrderLambdaVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: '*'


      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-order-lambda-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # ORDER PROCESSOR LAMBDA ROLE
  # ==========================================================

  OrderProcessorLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-order-processor-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        # ======================================================
        # CLOUDWATCH LOGGING
        # ======================================================

        - PolicyName: OrderProcessorLogging

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-order-processor:*


        # ======================================================
        # DATABASE SSM PARAMETERS
        # ======================================================

        - PolicyName: OrderProcessorSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*


        # ======================================================
        # EVENTBRIDGE
        # ======================================================

        - PolicyName: OrderProcessorEventBridge

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - events:PutEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/cloudmart-${Environment}-event-bus


        # ======================================================
        # VPC NETWORK ACCESS
        # ======================================================

        - PolicyName: OrderProcessorVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: '*'


      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-order-processor-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # REPORT LAMBDA ROLE
  # ==========================================================

  ReportLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-report-lambda-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        # ======================================================
        # CLOUDWATCH LOGGING
        # ======================================================

        - PolicyName: ReportLambdaLogging

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-report-lambda:*


        # ======================================================
        # DATABASE SSM PARAMETERS
        # ======================================================

        - PolicyName: ReportLambdaSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*


        # ======================================================
        # REPORT S3 BUCKET
        # ======================================================

        - PolicyName: ReportLambdaS3

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              # Bucket permission

              - Effect: Allow

                Action:
                  - s3:ListBucket

                Resource:
                  - Fn::ImportValue:
                      !Sub cloudmart-${Environment}-ReportBucketArn


              # Object permissions

              - Effect: Allow

                Action:
                  - s3:GetObject
                  - s3:PutObject

                Resource:
                  - !Join
                    - ''
                    - - Fn::ImportValue:
                          !Sub cloudmart-${Environment}-ReportBucketArn
                      - '/*'


        # ======================================================
        # VPC NETWORK ACCESS
        # ======================================================

        - PolicyName: ReportLambdaVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: '*'


      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-report-lambda-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:

  LambdaAuthorizerRoleArn:

    Description: Lambda Authorizer execution role ARN

    Value:
      !GetAtt LambdaAuthorizerRole.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-LambdaAuthorizerRoleArn


  ProductLambdaRoleArn:

    Description: Product Lambda execution role ARN

    Value:
      !GetAtt ProductLambdaRole.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-ProductLambdaRoleArn


  OrderLambdaRoleArn:

    Description: Order Lambda execution role ARN

    Value:
      !GetAtt OrderLambdaRole.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-OrderLambdaRoleArn


  OrderProcessorLambdaRoleArn:

    Description: Order Processor Lambda execution role ARN

    Value:
      !GetAtt OrderProcessorLambdaRole.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-OrderProcessorLambdaRoleArn


  ReportLambdaRoleArn:

    Description: Report Lambda execution role ARN

    Value:
      !GetAtt ReportLambdaRole.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-ReportLambdaRoleArn