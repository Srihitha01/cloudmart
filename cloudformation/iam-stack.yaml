    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-ec2-dashboard-role

      Description:
        !Sub IAM role for CloudMart ${Environment} API monitoring dashboard EC2

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - ec2.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

      Policies:

        # ------------------------------------------------------
        # CLOUDWATCH MONITORING
        # ------------------------------------------------------

        - PolicyName: EC2DashboardCloudWatchAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - cloudwatch:GetDashboard
