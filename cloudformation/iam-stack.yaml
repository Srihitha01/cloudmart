    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-rds-admin-ec2-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - ec2.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

      Policies:

        # ------------------------------------------------------
        # RDS DATABASE INFORMATION
        # ------------------------------------------------------

        - PolicyName: RDSAdminDatabaseAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - rds:DescribeDBInstances

                Resource: '*'

        # ------------------------------------------------------
        # SSM DATABASE PARAMETERS
