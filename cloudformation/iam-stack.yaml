    Properties:

      InstanceProfileName:
        !Sub cloudmart-${Environment}-ec2-dashboard-instance-profile

      Roles:

        - !Ref EC2DashboardRole



  # ==========================================================
  # SECURE AUTH SSM PARAMETERS
  # CloudFormation AWS::SSM::Parameter cannot create SecureString
  # directly, so this stack owns the SecureString parameters
  # through a CloudFormation custom resource.
  # Authentication values are generated by this stack; no
  # authentication GitHub Secrets are required.
  # ==========================================================

  AuthSSMWriterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-${Environment}-auth-ssm-writer-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: SecureAuthParameterWriter
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/*
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-auth-ssm-writer-role
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  AuthSSMWriterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub cloudmart-${Environment}-auth-ssm-writer
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt AuthSSMWriterRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import json
          import secrets
          import urllib.request
          import boto3

          ssm = boto3.client("ssm")

          def respond(event, context, status, physical_id, data=None, reason=None):
              body = {
                  "Status": status,
                  "Reason": reason or "See CloudWatch Logs",
                  "PhysicalResourceId": physical_id,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data or {}
              }
              encoded = json.dumps(body).encode("utf-8")
              request = urllib.request.Request(
                  event["ResponseURL"],
                  data=encoded,
                  method="PUT",
                  headers={"content-type": "", "content-length": str(len(encoded))}
              )
              urllib.request.urlopen(request)

          def parameter_exists(name):
              try:
                  response = ssm.get_parameter(Name=name)
                  return response["Parameter"]["Type"] == "SecureString"
              except ssm.exceptions.ParameterNotFound:
                  return False

          def ensure_parameter(name, value, description):
              if parameter_exists(name):
                  return
              ssm.put_parameter(
                  Name=name,
                  Value=value,
                  Type="SecureString",
                  Description=description,
                  Overwrite=False
              )

          def handler(event, context):
              physical_id = event.get("PhysicalResourceId") or event["ResourceProperties"]["ParameterPrefix"]
              try:
                  prefix = event["ResourceProperties"]["ParameterPrefix"]
                  admin_name = prefix + "/token"
                  customer_name = prefix + "/customer-tokens"

                  if event["RequestType"] in ("Create", "Update"):
                      # Generate values only when the parameters do not already exist.
                      # This prevents normal stack updates from rotating credentials.
                      admin_token = secrets.token_urlsafe(32)
                      customer_token = secrets.token_urlsafe(32)
                      customer_tokens = json.dumps({customer_token: 1}, separators=(",", ":"))

                      ensure_parameter(
                          admin_name,
                          admin_token,
                          "CloudMart administrator authentication token"
                      )
                      ensure_parameter(
                          customer_name,
                          customer_tokens,
                          "CloudMart customer authentication token mapping"
                      )

                  elif event["RequestType"] == "Delete":
                      for name in (admin_name, customer_name):
                          try:
                              ssm.delete_parameter(Name=name)
                          except ssm.exceptions.ParameterNotFound:
                              pass

                  respond(event, context, "SUCCESS", physical_id)
              except Exception:
                  respond(
                      event,
                      context,
                      "FAILED",
                      physical_id,
                      reason="Authentication parameter provisioning failed; see CloudWatch Logs"
                  )
                  raise

  AuthSSMParameters:
    Type: Custom::CloudMartAuthParameters
    DependsOn:
      - AuthSSMWriterFunction
    Properties:
      ServiceToken: !GetAtt AuthSSMWriterFunction.Arn
      ParameterPrefix: !Sub /cloudmart/${Environment}/auth


# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  LambdaAuthorizerRoleArn:

    Description: Lambda Authorizer execution role ARN

    Value:
      !GetAtt LambdaAuthorizerRole.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-LambdaAuthorizerRoleArn


  ProductLambdaRoleArn:

    Description: Product Lambda execution role ARN

    Value:
      !GetAtt ProductLambdaRole.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-ProductLambdaRoleArn


  OrderLambdaRoleArn:

    Description: Order Lambda execution role ARN

    Value:
      !GetAtt OrderLambdaRole.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-OrderLambdaRoleArn


  OrderProcessorLambdaRoleArn:

    Description: Order Processor Lambda execution role ARN

    Value:
      !GetAtt OrderProcessorLambdaRole.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-OrderProcessorLambdaRoleArn


  SchemaInitializerLambdaRoleArn:

    Description: Schema Initializer Lambda execution role ARN

    Value:
      !GetAtt SchemaInitializerLambdaRole.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-SchemaInitializerLambdaRoleArn


  RDSAdminEC2RoleArn:

    Description: RDS administration EC2 role ARN

    Value:
      !GetAtt RDSAdminEC2Role.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-RDSAdminEC2RoleArn


  RDSAdminEC2InstanceProfile:

    Description: EC2 instance profile for RDS administration instance

    Value:
      !Ref RDSAdminEC2InstanceProfile

    Export:
      Name:
        !Sub cloudmart-${Environment}-RDSAdminEC2InstanceProfile


  EC2DashboardRoleArn:

    Description: EC2 API monitoring dashboard role ARN

    Value:
      !GetAtt EC2DashboardRole.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-EC2DashboardRoleArn


  EC2DashboardInstanceProfile:

    Description: EC2 instance profile for API monitoring dashboard

    Value:
      !Ref EC2DashboardInstanceProfile

    Export:
      Name:
        !Sub cloudmart-${Environment}-EC2DashboardInstanceProfile