        - PolicyName: EC2DashboardLogsAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:FilterLogEvents
                  - logs:GetLogEvents
                  - logs:StartQuery
                  - logs:GetQueryResults

                Resource: '*'

        # ------------------------------------------------------
        # LAMBDA MONITORING
        # ------------------------------------------------------

        - PolicyName: EC2DashboardLambdaAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:ListFunctions

                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:cloudmart-${Environment}-*

        # ------------------------------------------------------
        # API GATEWAY MONITORING
        # ------------------------------------------------------

        - PolicyName: EC2DashboardAPIGatewayAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - apigateway:GET

                Resource: '*'

        # ------------------------------------------------------
        # RDS MONITORING
        # ------------------------------------------------------

        - PolicyName: EC2DashboardRDSAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - rds:DescribeDBInstances
                  - rds:DescribeDBClusters

                Resource: '*'

        # ------------------------------------------------------
        # EC2 MONITORING
        # ------------------------------------------------------

        - PolicyName: EC2DashboardEC2Access

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus

                Resource: '*'

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-ec2-dashboard-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


