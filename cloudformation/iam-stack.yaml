AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart IAM Stack.
  Creates least-privilege IAM execution roles
  for CloudMart Lambda functions.

Parameters:

  # ==========================================================
  # ENVIRONMENT
  # ==========================================================

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment


Resources:

  # ==========================================================
  # LAMBDA AUTHORISER ROLE
  # ==========================================================

  LambdaAuthorizerRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName: !Sub cloudmart-${Environment}-lambda-authorizer-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        # ------------------------------------------------------
        # CLOUDWATCH LOGGING
        # ------------------------------------------------------

        - PolicyName: LambdaAuthorizerLogging

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: '*'


        # ------------------------------------------------------
        # SSM AUTH TOKEN
        # ------------------------------------------------------

        - PolicyName: LambdaAuthorizerSSM

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/*


        # ------------------------------------------------------
        # VPC ACCESS
        # ------------------------------------------------------

        - PolicyName: LambdaAuthorizerVPCAccess

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: '*'

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-lambda-authorizer-role


  # ==========================================================
  # PRODUCT LAMBDA ROLE
  # ==========================================================

  ProductLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName: !Sub cloudmart-${Environment}-product-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        # ------------------------------------------------------
        # CLOUDWATCH LOGGING
        # ------------------------------------------------------

        - PolicyName: ProductLambdaLogging

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: '*'


        # ------------------------------------------------------
        # SSM DATABASE PARAMETERS
        # ------------------------------------------------------

        - PolicyName: ProductLambdaSSM

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*


        # ------------------------------------------------------
        # S3 SCHEMA ACCESS
        # Used by Schema Initializer Lambda
        # ------------------------------------------------------

        - PolicyName: ProductLambdaSchemaS3

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - s3:GetObject

                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::cloudmart-${Environment}-artifacts/database/*


        # ------------------------------------------------------
        # SNS
        # ------------------------------------------------------

        - PolicyName: ProductLambdaSNS

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - sns:Publish

                Resource: '*'


        # ------------------------------------------------------
        # EVENTBRIDGE
        # Used to publish inventory change events
        # ------------------------------------------------------

        - PolicyName: ProductLambdaEventBridge

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - events:PutEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default


        # ------------------------------------------------------
        # VPC ACCESS
        # ------------------------------------------------------

        - PolicyName: ProductLambdaVPCAccess

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: '*'

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-product-lambda-role


  # ==========================================================
  # ORDER LAMBDA ROLE
  # ==========================================================

  OrderLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName: !Sub cloudmart-${Environment}-order-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        # ------------------------------------------------------
        # CLOUDWATCH LOGGING
        # ------------------------------------------------------

        - PolicyName: OrderLambdaLogging

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: '*'


        # ------------------------------------------------------
        # SSM DATABASE PARAMETERS
        # ------------------------------------------------------

        - PolicyName: OrderLambdaSSM

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*


        # ------------------------------------------------------
        # VPC ACCESS
        # ------------------------------------------------------

        - PolicyName: OrderLambdaVPCAccess

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: '*'

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-order-lambda-role


  # ==========================================================
  # ORDER PROCESSOR LAMBDA ROLE
  # ==========================================================

  OrderProcessorLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName: !Sub cloudmart-${Environment}-order-processor-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        # ------------------------------------------------------
        # CLOUDWATCH LOGGING
        # ------------------------------------------------------

        - PolicyName: OrderProcessorLogging

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: '*'


        # ------------------------------------------------------
        # SSM DATABASE PARAMETERS
        # ------------------------------------------------------

        - PolicyName: OrderProcessorSSM

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*


        # ------------------------------------------------------
        # SNS
        # ------------------------------------------------------

        - PolicyName: OrderProcessorSNS

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - sns:Publish

                Resource: '*'


        # ------------------------------------------------------
        # VPC ACCESS
        # ------------------------------------------------------

        - PolicyName: OrderProcessorVPCAccess

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: '*'

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-order-processor-role


  # ==========================================================
  # REPORT LAMBDA ROLE
  # ==========================================================

  ReportLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName: !Sub cloudmart-${Environment}-report-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        # ------------------------------------------------------
        # CLOUDWATCH LOGGING
        # ------------------------------------------------------

        - PolicyName: ReportLambdaLogging

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: '*'


        # ------------------------------------------------------
        # SSM DATABASE PARAMETERS
        # ------------------------------------------------------

        - PolicyName: ReportLambdaSSM

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*


        # ------------------------------------------------------
        # S3 REPORT BUCKET
        # Uses the report bucket created by Data Stack
        # ------------------------------------------------------

        - PolicyName: ReportLambdaS3

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              # ------------------------------------------------
              # LIST REPORT BUCKET
              # ------------------------------------------------

              - Effect: Allow

                Action:
                  - s3:ListBucket

                Resource:
                  - !Sub
                      - arn:${AWS::Partition}:s3:::${ReportBucketName}
                      - ReportBucketName:
                          Fn::ImportValue:
                            !Sub cloudmart-${Environment}-ReportBucketName


              # ------------------------------------------------
              # READ / WRITE REPORT OBJECTS
              # ------------------------------------------------

              - Effect: Allow

                Action:
                  - s3:GetObject
                  - s3:PutObject

                Resource:
                  - !Sub
                      - arn:${AWS::Partition}:s3:::${ReportBucketName}/*
                      - ReportBucketName:
                          Fn::ImportValue:
                            !Sub cloudmart-${Environment}-ReportBucketName


        # ------------------------------------------------------
        # VPC ACCESS
        # ------------------------------------------------------

        - PolicyName: ReportLambdaVPCAccess

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: '*'

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-report-lambda-role


# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  # ----------------------------------------------------------
  # LAMBDA AUTHORIZER ROLE ARN
  # ----------------------------------------------------------

  LambdaAuthorizerRoleArn:
    Description: Lambda Authorizer execution role ARN

    Value:
      !GetAtt LambdaAuthorizerRole.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-LambdaAuthorizerRoleArn


  # ----------------------------------------------------------
  # PRODUCT LAMBDA ROLE ARN
  # ----------------------------------------------------------

  ProductLambdaRoleArn:
    Description: Product Lambda execution role ARN

    Value:
      !GetAtt ProductLambdaRole.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-ProductLambdaRoleArn


  # ----------------------------------------------------------
  # ORDER LAMBDA ROLE ARN
  # ----------------------------------------------------------

  OrderLambdaRoleArn:
    Description: Order Lambda execution role ARN

    Value:
      !GetAtt OrderLambdaRole.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-OrderLambdaRoleArn


  # ----------------------------------------------------------
  # ORDER PROCESSOR LAMBDA ROLE ARN
  # ----------------------------------------------------------

  OrderProcessorLambdaRoleArn:
    Description: Order Processor Lambda execution role ARN

    Value:
      !GetAtt OrderProcessorLambdaRole.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-OrderProcessorLambdaRoleArn


  # ----------------------------------------------------------
  # REPORT LAMBDA ROLE ARN
  # ----------------------------------------------------------

  ReportLambdaRoleArn:
    Description: Report Lambda execution role ARN

    Value:
      !GetAtt ReportLambdaRole.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-ReportLambdaRoleArn