AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart IAM Stack.
  Creates least-privilege IAM execution roles for:
  Lambda Authorizer, Product Lambda, Order Lambda,
  Order Processor Lambda, Schema Initializer Lambda,
  and the RDS Administration EC2 instance.

# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String
    Default: dev

    AllowedValues:
      - dev
      - prod

    Description: CloudMart deployment environment


# ============================================================
# RESOURCES
# ============================================================

Resources:


  # ==========================================================
  # LAMBDA AUTHORIZER ROLE
  # ==========================================================

  LambdaAuthorizerRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-lambda-authorizer-role


      # Trust Policy:
      # Allows AWS Lambda service to assume this role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      Policies:


        # ----------------------------------------------------
        # CLOUDWATCH LOGGING
        # ----------------------------------------------------

        - PolicyName: LambdaAuthorizerLogging

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup

                Resource: '*'


              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub >
                    arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:
                    log-group:/aws/lambda/cloudmart-${Environment}-lambda-authorizer:*


        # ----------------------------------------------------
        # SSM AUTH PARAMETERS
        # Authorizer reads authentication configuration
        # ----------------------------------------------------

        - PolicyName: LambdaAuthorizerSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/*


      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-lambda-authorizer-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # PRODUCT LAMBDA ROLE
  # ==========================================================

  ProductLambdaRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-product-lambda-role


      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      Policies:


        # ----------------------------------------------------
        # CLOUDWATCH LOGGING
        # ----------------------------------------------------

        - PolicyName: ProductLambdaLogging

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup

                Resource: '*'


              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-product-lambda:*


        # ----------------------------------------------------
        # SSM DATABASE CONFIGURATION
        # ----------------------------------------------------

        - PolicyName: ProductLambdaSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*


        # ----------------------------------------------------
        # EVENTBRIDGE
        # Product Lambda publishes product events
        # ----------------------------------------------------

        - PolicyName: ProductLambdaEventBridge

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - events:PutEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/cloudmart-${Environment}-event-bus


        # ----------------------------------------------------
        # VPC ACCESS
        # Required for Lambda ENI management
        # ----------------------------------------------------

        - PolicyName: ProductLambdaVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: '*'


      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-product-lambda-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # ORDER LAMBDA ROLE
  # ==========================================================

  OrderLambdaRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-order-lambda-role


      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      Policies:


        # ----------------------------------------------------
        # CLOUDWATCH LOGGING
        # ----------------------------------------------------

        - PolicyName: OrderLambdaLogging

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup

                Resource: '*'


              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-order-lambda:*


        # ----------------------------------------------------
        # SSM DATABASE CONFIGURATION
        # ----------------------------------------------------

        - PolicyName: OrderLambdaSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*


        # ----------------------------------------------------
        # EVENTBRIDGE
        # Order Lambda publishes order events
        # ----------------------------------------------------

        - PolicyName: OrderLambdaEventBridge

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - events:PutEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/cloudmart-${Environment}-event-bus


        # ----------------------------------------------------
        # VPC ACCESS
        # ----------------------------------------------------

        - PolicyName: OrderLambdaVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: '*'


      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-order-lambda-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # ORDER PROCESSOR LAMBDA ROLE
  # ==========================================================

  OrderProcessorLambdaRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-order-processor-role


      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      Policies:


        # ----------------------------------------------------
        # CLOUDWATCH LOGGING
        # ----------------------------------------------------

        - PolicyName: OrderProcessorLogging

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup

                Resource: '*'


              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-order-processor:*


        # ----------------------------------------------------
        # SSM DATABASE CONFIGURATION
        # ----------------------------------------------------

        - PolicyName: OrderProcessorSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*


        # ----------------------------------------------------
        # EVENTBRIDGE
        # Order Processor publishes processed order events
        # ----------------------------------------------------

        - PolicyName: OrderProcessorEventBridge

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - events:PutEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/cloudmart-${Environment}-event-bus


        # ----------------------------------------------------
        # VPC ACCESS
        # ----------------------------------------------------

        - PolicyName: OrderProcessorVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: '*'


      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-order-processor-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # SCHEMA INITIALIZER LAMBDA ROLE
  # ==========================================================

  SchemaInitializerLambdaRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-schema-initializer-role


      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      Policies:


        # ----------------------------------------------------
        # CLOUDWATCH LOGGING
        # ----------------------------------------------------

        - PolicyName: SchemaInitializerLogging

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup

                Resource: '*'


              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-schema-initializer:*


        # ----------------------------------------------------
        # SSM DATABASE CONFIGURATION
        # ----------------------------------------------------

        - PolicyName: SchemaInitializerSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*


        # ----------------------------------------------------
        # S3 ARTIFACT ACCESS
        # Dynamically imports Artifact Bucket ARN
        # No bucket name hardcoding
        # ----------------------------------------------------

        - PolicyName: SchemaInitializerS3

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - s3:GetObject

                Resource:
                  - Fn::Sub:
                    - ${ArtifactBucketArn}/*
                    - ArtifactBucketArn:
                        Fn::ImportValue:
                          Fn::Sub: cloudmart-${Environment}-ArtifactBucketArn


        # ----------------------------------------------------
        # VPC ACCESS
        # ----------------------------------------------------

        - PolicyName: SchemaInitializerVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: '*'


      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-schema-initializer-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # EC2 RDS ADMINISTRATION ROLE
  #
  # EC2 connects privately to RDS.
  # Session Manager is used instead of SSH.
  # ==========================================================

  RDSAdminEC2Role:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-rds-admin-ec2-role


      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - ec2.amazonaws.com

            Action:
              - sts:AssumeRole


      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore


      Policies:


        # ----------------------------------------------------
        # SSM DATABASE CONFIGURATION
        # EC2 reads database endpoint and credentials
        # ----------------------------------------------------

        - PolicyName: RDSAdminDatabaseSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*


      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-rds-admin-ec2-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # EC2 INSTANCE PROFILE
  # Required to attach IAM Role to EC2
  # ==========================================================

  RDSAdminEC2InstanceProfile:

    Type: AWS::IAM::InstanceProfile

    Properties:

      InstanceProfileName:
        !Sub cloudmart-${Environment}-rds-admin-instance-profile

      Roles:

        - !Ref RDSAdminEC2Role


# ============================================================
# OUTPUTS
# ============================================================

Outputs:


  LambdaAuthorizerRoleArn:

    Description: Lambda Authorizer execution role ARN

    Value:
      !GetAtt LambdaAuthorizerRole.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-LambdaAuthorizerRoleArn


  ProductLambdaRoleArn:

    Description: Product Lambda execution role ARN

    Value:
      !GetAtt ProductLambdaRole.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-ProductLambdaRoleArn


  OrderLambdaRoleArn:

    Description: Order Lambda execution role ARN

    Value:
      !GetAtt OrderLambdaRole.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderLambdaRoleArn


  OrderProcessorLambdaRoleArn:

    Description: Order Processor Lambda execution role ARN

    Value:
      !GetAtt OrderProcessorLambdaRole.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderProcessorLambdaRoleArn


  SchemaInitializerLambdaRoleArn:

    Description: Schema Initializer Lambda execution role ARN

    Value:
      !GetAtt SchemaInitializerLambdaRole.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-SchemaInitializerLambdaRoleArn


  RDSAdminEC2RoleArn:

    Description: RDS administration EC2 role ARN

    Value:
      !GetAtt RDSAdminEC2Role.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-RDSAdminEC2RoleArn


  RDSAdminEC2InstanceProfile:

    Description: EC2 instance profile for RDS administration instance

    Value:
      !Ref RDSAdminEC2InstanceProfile

    Export:

      Name:
        !Sub cloudmart-${Environment}-RDSAdminEC2InstanceProfile