AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart IAM Stack.
  Creates least-privilege IAM execution roles
  for CloudMart Lambda functions.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment


Resources:

  # ==========================================================
  # LAMBDA AUTHORISER ROLE
  # ==========================================================

  LambdaAuthorizerRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-lambda-authorizer-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        # ------------------------------------------------------
        # CloudWatch Logs
        # ------------------------------------------------------

        - PolicyName: LambdaAuthorizerLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

        # ------------------------------------------------------
        # SSM Authorizer Parameters
        # ------------------------------------------------------

        - PolicyName: LambdaAuthorizerSSM
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/*

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-lambda-authorizer-role


  # ==========================================================
  # PRODUCT LAMBDA ROLE
  # ==========================================================

  ProductLambdaRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-product-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        # ------------------------------------------------------
        # CloudWatch Logs
        # ------------------------------------------------------

        - PolicyName: ProductLambdaLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

        # ------------------------------------------------------
        # SSM Database Parameters
        # ------------------------------------------------------

        - PolicyName: ProductLambdaSSM
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*

        # ------------------------------------------------------
        # SNS Notifications
        # ------------------------------------------------------

        - PolicyName: ProductLambdaSNS
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: '*'

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-product-lambda-role


  # ==========================================================
  # ORDER LAMBDA ROLE
  # ==========================================================

  OrderLambdaRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-order-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        # ------------------------------------------------------
        # CloudWatch Logs
        # ------------------------------------------------------

        - PolicyName: OrderLambdaLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

        # ------------------------------------------------------
        # SSM Database Parameters
        # ------------------------------------------------------

        - PolicyName: OrderLambdaSSM
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-order-lambda-role


  # ==========================================================
  # ORDER PROCESSOR LAMBDA ROLE
  # ==========================================================

  OrderProcessorLambdaRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-order-processor-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        # ------------------------------------------------------
        # CloudWatch Logs
        # ------------------------------------------------------

        - PolicyName: OrderProcessorLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

        # ------------------------------------------------------
        # SSM Database Parameters
        # ------------------------------------------------------

        - PolicyName: OrderProcessorSSM
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*

        # ------------------------------------------------------
        # SNS Notifications
        # ------------------------------------------------------

        - PolicyName: OrderProcessorSNS
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: '*'

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-order-processor-role


  # ==========================================================
  # REPORT LAMBDA ROLE
  # ==========================================================

  ReportLambdaRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-report-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        # ------------------------------------------------------
        # CloudWatch Logs
        # ------------------------------------------------------

        - PolicyName: ReportLambdaLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

        # ------------------------------------------------------
        # SSM Database Parameters
        # ------------------------------------------------------

        - PolicyName: ReportLambdaSSM
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*

        # ------------------------------------------------------
        # S3 Report Bucket
        # Uses the actual bucket ARN exported by Data Stack
        # ------------------------------------------------------

        - PolicyName: ReportLambdaS3
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # List objects in the report bucket
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  Fn::ImportValue:
                    Fn::Sub: cloudmart-${Environment}-ReportBucketArn

              # Read and write report files
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  Fn::Sub:
                    - '${ReportBucketArn}/*'
                    - ReportBucketArn:
                        Fn::ImportValue:
                          Fn::Sub: cloudmart-${Environment}-ReportBucketArn

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-report-lambda-role


# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:

  # ----------------------------------------------------------
  # Lambda Authorizer Role ARN
  # ----------------------------------------------------------

  LambdaAuthorizerRoleArn:
    Description: Lambda Authorizer execution role ARN
    Value: !GetAtt LambdaAuthorizerRole.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-LambdaAuthorizerRoleArn


  # ----------------------------------------------------------
  # Product Lambda Role ARN
  # ----------------------------------------------------------

  ProductLambdaRoleArn:
    Description: Product Lambda execution role ARN
    Value: !GetAtt ProductLambdaRole.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-ProductLambdaRoleArn


  # ----------------------------------------------------------
  # Order Lambda Role ARN
  # ----------------------------------------------------------

  OrderLambdaRoleArn:
    Description: Order Lambda execution role ARN
    Value: !GetAtt OrderLambdaRole.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-OrderLambdaRoleArn


  # ----------------------------------------------------------
  # Order Processor Lambda Role ARN
  # ----------------------------------------------------------

  OrderProcessorLambdaRoleArn:
    Description: Order Processor Lambda execution role ARN
    Value: !GetAtt OrderProcessorLambdaRole.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-OrderProcessorLambdaRoleArn


  # ----------------------------------------------------------
  # Report Lambda Role ARN
  # ----------------------------------------------------------

  ReportLambdaRoleArn:
    Description: Report Lambda execution role ARN
    Value: !GetAtt ReportLambdaRole.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-ReportLambdaRoleArn