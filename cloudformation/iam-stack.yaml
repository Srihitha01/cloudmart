AWSTemplateFormatVersion: '2010-09-09'

Metadata:
  CustomerRoleExportVersion: '2'

Description: >
  CloudMart IAM Stack.
  Creates IAM execution roles for Lambda functions,
  schema initialization, daily reporting, RDS administration EC2,
  and API monitoring dashboard EC2.


# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String

    AllowedValues:
      - dev
      - prod

    Description:
      Deployment environment supplied by CI/CD configuration


# ============================================================
# RESOURCES
# ============================================================

Resources:


  # ==========================================================
  # LAMBDA AUTHORIZER ROLE
  # ==========================================================

  LambdaAuthorizerRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-lambda-authorizer-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: LambdaAuthorizerLogging

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup

                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-lambda-authorizer

              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-lambda-authorizer:*

        - PolicyName: LambdaAuthorizerSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/token

        - PolicyName: LambdaAuthorizerDatabaseSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/name
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/endpoint
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/port
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/username
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/password

        - PolicyName: LambdaAuthorizerVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource:
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-lambda-authorizer-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # PRODUCT LAMBDA ROLE
  # ==========================================================

  ProductLambdaRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-product-lambda-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: ProductLambdaLogging

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup

                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-product-lambda

              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-product-lambda:*

        - PolicyName: ProductLambdaSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/name
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/endpoint
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/port
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/username
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/password

        - PolicyName: ProductLambdaS3

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - s3:GetObject

                Resource:

                  - Fn::Sub:

                      - "${ArtifactBucketArn}/*"

                      - ArtifactBucketArn:

                          Fn::ImportValue:

                            Fn::Sub: cloudmart-${Environment}-ArtifactBucketArn

        - PolicyName: ProductLambdaEventBridge

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - events:PutEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/cloudmart-${Environment}-event-bus
        - PolicyName: ProductLambdaVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource:
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-product-lambda-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # CUSTOMER LAMBDA ROLE
