  OrderLambdaRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-order-lambda-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

