AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart IAM Stack.
  Creates IAM execution roles for Lambda functions,
  schema initialization, RDS administration EC2,
  and API monitoring dashboard EC2.

# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment supplied by CI/CD configuration


# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ==========================================================
  # LAMBDA AUTHORIZER ROLE
  # ==========================================================

  LambdaAuthorizerRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-lambda-authorizer-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        # ------------------------------------------------------
        # CLOUDWATCH LOGGING
        # ------------------------------------------------------

        - PolicyName: LambdaAuthorizerLogging

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup

                Resource: '*'

              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-lambda-authorizer:*

        # ------------------------------------------------------
        # SSM AUTH PARAMETERS
        # ------------------------------------------------------

        - PolicyName: LambdaAuthorizerSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/*

        # ------------------------------------------------------
        # SSM DATABASE PARAMETERS
        # ------------------------------------------------------

        - PolicyName: LambdaAuthorizerDatabaseSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*

        # ------------------------------------------------------
        # VPC ACCESS
        # ------------------------------------------------------

        - PolicyName: LambdaAuthorizerVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: '*'

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-lambda-authorizer-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # PRODUCT LAMBDA ROLE
  # ==========================================================

  ProductLambdaRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-product-lambda-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        # ------------------------------------------------------
        # CLOUDWATCH LOGGING
        # ------------------------------------------------------

        - PolicyName: ProductLambdaLogging

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup

                Resource: '*'

              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-product:*

        # ------------------------------------------------------
        # SSM DATABASE PARAMETERS
        # ------------------------------------------------------

        - PolicyName: ProductLambdaSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*

        # ------------------------------------------------------
        # S3 ARTIFACT ACCESS
        # ------------------------------------------------------

        - PolicyName: ProductLambdaS3

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - s3:GetObject

                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::cloudmart-${Environment}-artifacts/*

        # ------------------------------------------------------
        # EVENTBRIDGE
        # ------------------------------------------------------

        - PolicyName: ProductLambdaEventBridge

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - events:PutEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/cloudmart-${Environment}-event-bus

        # ------------------------------------------------------
        # VPC ACCESS
        # ------------------------------------------------------

        - PolicyName: ProductLambdaVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: '*'

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-product-lambda-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


