AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart IAM Stack.
  Creates IAM execution roles for Lambda functions,
  schema initialization, RDS administration EC2,
  and API monitoring dashboard EC2.


# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:

    Type: String

    Default: dev

    AllowedValues:
      - dev
      - prod

    Description: Deployment environment


# ============================================================
# RESOURCES
# ============================================================

Resources:


  # ==========================================================
  # LAMBDA AUTHORIZER ROLE
  # ==========================================================

  LambdaAuthorizerRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-lambda-authorizer-role


      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      Policies:


        # ------------------------------------------------------
        # CLOUDWATCH LOGGING
        # ------------------------------------------------------

        - PolicyName: LambdaAuthorizerLogging

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup

                Resource: '*'


              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-lambda-authorizer:*


        # ------------------------------------------------------
        # SSM AUTH PARAMETERS
        # ------------------------------------------------------

        - PolicyName: LambdaAuthorizerSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/*


        # ------------------------------------------------------
        # VPC ACCESS
        # ------------------------------------------------------

        - PolicyName: LambdaAuthorizerVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: '*'


      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-lambda-authorizer-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # PRODUCT LAMBDA ROLE
  # ==========================================================

  ProductLambdaRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-product-lambda-role


      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      Policies:


        # ------------------------------------------------------
        # CLOUDWATCH LOGGING
        # ------------------------------------------------------

        - PolicyName: ProductLambdaLogging

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup

                Resource: '*'


              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-product:*


        # ------------------------------------------------------
        # SSM DATABASE PARAMETERS
        # ------------------------------------------------------

        - PolicyName: ProductLambdaSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*


        # ------------------------------------------------------
        # S3 ARTIFACT ACCESS
        # ------------------------------------------------------

        - PolicyName: ProductLambdaS3

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - s3:GetObject

                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::cloudmart-*/*


        # ------------------------------------------------------
        # EVENTBRIDGE
        # ------------------------------------------------------

        - PolicyName: ProductLambdaEventBridge

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - events:PutEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/cloudmart-${Environment}-event-bus


        # ------------------------------------------------------
        # VPC ACCESS
        # ------------------------------------------------------

        - PolicyName: ProductLambdaVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: '*'


      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-product-lambda-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # ORDER LAMBDA ROLE
  # ==========================================================

  OrderLambdaRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-order-lambda-role


      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      Policies:


        # ------------------------------------------------------
        # CLOUDWATCH LOGGING
        # ------------------------------------------------------

        - PolicyName: OrderLambdaLogging

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup

                Resource: '*'


              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-order:*


        # ------------------------------------------------------
        # SSM DATABASE PARAMETERS
        # ------------------------------------------------------

        - PolicyName: OrderLambdaSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*


        # ------------------------------------------------------
        # EVENTBRIDGE
        # ------------------------------------------------------

        - PolicyName: OrderLambdaEventBridge

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - events:PutEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/cloudmart-${Environment}-event-bus


        # ------------------------------------------------------
        # VPC ACCESS
        # ------------------------------------------------------

        - PolicyName: OrderLambdaVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: '*'


      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-order-lambda-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # ORDER PROCESSOR LAMBDA ROLE
  # ==========================================================

  OrderProcessorLambdaRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-order-processor-role


      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      Policies:


        # ------------------------------------------------------
        # CLOUDWATCH LOGGING
        # ------------------------------------------------------

        - PolicyName: OrderProcessorLogging

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup

                Resource: '*'


              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-order-processor:*


        # ------------------------------------------------------
        # SSM DATABASE PARAMETERS
        # ------------------------------------------------------

        - PolicyName: OrderProcessorSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*


        # ------------------------------------------------------
        # EVENTBRIDGE
        # ------------------------------------------------------

        - PolicyName: OrderProcessorEventBridge

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - events:PutEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/cloudmart-${Environment}-event-bus


        # ------------------------------------------------------
        # VPC ACCESS
        # ------------------------------------------------------

        - PolicyName: OrderProcessorVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: '*'


      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-order-processor-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # SCHEMA INITIALIZER LAMBDA ROLE
  # ==========================================================

  SchemaInitializerLambdaRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-schema-initializer-role


      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      Policies:


        # ------------------------------------------------------
        # CLOUDWATCH LOGGING
        # ------------------------------------------------------

        - PolicyName: SchemaInitializerLogging

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup

                Resource: '*'


              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-schema-initializer:*


        # ------------------------------------------------------
        # SSM DATABASE CONFIGURATION
        # ------------------------------------------------------

        - PolicyName: SchemaInitializerSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*


        # ------------------------------------------------------
        # S3 SCHEMA ACCESS
        # ------------------------------------------------------

        - PolicyName: SchemaInitializerS3

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - s3:GetObject

                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::cloudmart-*/*


        # ------------------------------------------------------
        # VPC ACCESS
        # ------------------------------------------------------

        - PolicyName: SchemaInitializerVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: '*'


      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-schema-initializer-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # RDS ADMINISTRATION EC2 ROLE
  # ==========================================================

  RDSAdminEC2Role:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-rds-admin-ec2-role


      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - ec2.amazonaws.com

            Action:
              - sts:AssumeRole


      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore


      Policies:


        # ------------------------------------------------------
        # RDS DATABASE INFORMATION
        # ------------------------------------------------------

        - PolicyName: RDSAdminDatabaseAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - rds:DescribeDBInstances

                Resource: '*'


        # ------------------------------------------------------
        # SSM DATABASE PARAMETERS
        # ------------------------------------------------------

        - PolicyName: RDSAdminDatabaseSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*


      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-rds-admin-ec2-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # RDS ADMIN EC2 INSTANCE PROFILE
  # ==========================================================

  RDSAdminEC2InstanceProfile:

    Type: AWS::IAM::InstanceProfile

    Properties:

      InstanceProfileName:
        !Sub cloudmart-${Environment}-rds-admin-instance-profile


      Roles:

        - !Ref RDSAdminEC2Role


  # ==========================================================
  # EC2 API MONITORING DASHBOARD ROLE
  # ==========================================================

  EC2DashboardRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-ec2-dashboard-role


      Description: >
        IAM role for CloudMart API monitoring
        and dashboard EC2 instance.


      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - ec2.amazonaws.com

            Action:
              - sts:AssumeRole


      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore


      Policies:


        # ------------------------------------------------------
        # CLOUDWATCH MONITORING
        # ------------------------------------------------------

        - PolicyName: EC2DashboardCloudWatchAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - cloudwatch:GetDashboard
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:DescribeAlarmHistory

                Resource: '*'


        # ------------------------------------------------------
        # CLOUDWATCH LOGS
        # ------------------------------------------------------

        - PolicyName: EC2DashboardLogsAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:FilterLogEvents
                  - logs:GetLogEvents
                  - logs:StartQuery
                  - logs:GetQueryResults

                Resource: '*'


        # ------------------------------------------------------
        # LAMBDA MONITORING
        # ------------------------------------------------------

        - PolicyName: EC2DashboardLambdaAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:ListFunctions

                Resource: '*'


        # ------------------------------------------------------
        # API GATEWAY MONITORING
        # ------------------------------------------------------

        - PolicyName: EC2DashboardAPIGatewayAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - apigateway:GET

                Resource: '*'


        # ------------------------------------------------------
        # RDS MONITORING
        # ------------------------------------------------------

        - PolicyName: EC2DashboardRDSAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - rds:DescribeDBInstances
                  - rds:DescribeDBClusters

                Resource: '*'


        # ------------------------------------------------------
        # EC2 MONITORING
        # ------------------------------------------------------

        - PolicyName: EC2DashboardEC2Access

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus

                Resource: '*'


      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-ec2-dashboard-role

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # EC2 API MONITORING DASHBOARD INSTANCE PROFILE
  # ==========================================================

  EC2DashboardInstanceProfile:

    Type: AWS::IAM::InstanceProfile

    Properties:

      InstanceProfileName:
        !Sub cloudmart-${Environment}-ec2-dashboard-instance-profile


      Roles:

        - !Ref EC2DashboardRole


# ============================================================
# OUTPUTS
# ============================================================

Outputs:


  # ==========================================================
  # LAMBDA AUTHORIZER
  # ==========================================================

  LambdaAuthorizerRoleArn:

    Description: Lambda Authorizer execution role ARN

    Value:
      !GetAtt LambdaAuthorizerRole.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-LambdaAuthorizerRoleArn


  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambdaRoleArn:

    Description: Product Lambda execution role ARN

    Value:
      !GetAtt ProductLambdaRole.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-ProductLambdaRoleArn


  # ==========================================================
  # ORDER LAMBDA
  # ==========================================================

  OrderLambdaRoleArn:

    Description: Order Lambda execution role ARN

    Value:
      !GetAtt OrderLambdaRole.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderLambdaRoleArn


  # ==========================================================
  # ORDER PROCESSOR
  # ==========================================================

  OrderProcessorLambdaRoleArn:

    Description: Order Processor Lambda execution role ARN

    Value:
      !GetAtt OrderProcessorLambdaRole.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderProcessorLambdaRoleArn


  # ==========================================================
  # SCHEMA INITIALIZER
  # ==========================================================

  SchemaInitializerLambdaRoleArn:

    Description: Schema Initializer Lambda execution role ARN

    Value:
      !GetAtt SchemaInitializerLambdaRole.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-SchemaInitializerLambdaRoleArn


  # ==========================================================
  # RDS ADMIN EC2 ROLE
  # ==========================================================

  RDSAdminEC2RoleArn:

    Description: RDS administration EC2 role ARN

    Value:
      !GetAtt RDSAdminEC2Role.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-RDSAdminEC2RoleArn


  # ==========================================================
  # RDS ADMIN INSTANCE PROFILE
  # ==========================================================

  RDSAdminEC2InstanceProfile:

    Description: EC2 instance profile for RDS administration instance

    Value:
      !Ref RDSAdminEC2InstanceProfile

    Export:

      Name:
        !Sub cloudmart-${Environment}-RDSAdminEC2InstanceProfile


  # ==========================================================
  # EC2 DASHBOARD ROLE
  # ==========================================================

  EC2DashboardRoleArn:

    Description: EC2 API monitoring dashboard role ARN

    Value:
      !GetAtt EC2DashboardRole.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-EC2DashboardRoleArn


  # ==========================================================
  # EC2 DASHBOARD INSTANCE PROFILE
  # THIS EXPORT IS REQUIRED BY
  # api-monitoring-ec2-stack.yaml
  # ==========================================================

  EC2DashboardInstanceProfile:

    Description: EC2 instance profile for API monitoring dashboard

    Value:
      !Ref EC2DashboardInstanceProfile

    Export:

      Name:
        !Sub cloudmart-${Environment}-EC2DashboardInstanceProfile