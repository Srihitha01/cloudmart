AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Application-Events Stack.
  Creates the Lambda Authorizer and Product Lambda.
  Additional application-event resources will be added incrementally.

Parameters:

  # ==========================================================
  # ENVIRONMENT
  # ==========================================================

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment


  # ==========================================================
  # DATABASE SSM PARAMETERS
  # ==========================================================

  DBName:
    Type: String
    Default: /cloudmart/dev/db/name
    Description: SSM parameter containing database name

  DBEndpoint:
    Type: String
    Default: /cloudmart/dev/db/endpoint
    Description: SSM parameter containing RDS endpoint

  DBPort:
    Type: String
    Default: /cloudmart/dev/db/port
    Description: SSM parameter containing RDS port

  DBUsername:
    Type: String
    Default: /cloudmart/dev/db/username
    Description: SSM parameter containing database username

  DBPassword:
    Type: String
    Default: /cloudmart/dev/db/password
    Description: SSM parameter containing database password


  # ==========================================================
  # AUTHENTICATION
  # ==========================================================

  AuthTokenParameter:
    Type: String
    Default: /cloudmart/dev/auth/token
    Description: SSM SecureString containing API authentication token


Resources:

  # ==========================================================
  # LAMBDA AUTHORISER
  # ==========================================================

  LambdaAuthorizer:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-lambda-authorizer

      Runtime: python3.12

      Handler: index.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-LambdaAuthorizerRoleArn

      Timeout: 10

      MemorySize: 128

      Environment:
        Variables:
          AUTH_TOKEN_PARAMETER: !Ref AuthTokenParameter

      Code:
        ZipFile: |
          import json
          import os
          import boto3

          ssm = boto3.client("ssm")


          def get_parameter(name):
              response = ssm.get_parameter(
                  Name=name,
                  WithDecryption=True
              )

              return response["Parameter"]["Value"]


          def generate_policy(principal_id, effect, resource):
              return {
                  "principalId": principal_id,
                  "policyDocument": {
                      "Version": "2012-10-17",
                      "Statement": [
                          {
                              "Action": "execute-api:Invoke",
                              "Effect": effect,
                              "Resource": resource
                          }
                      ]
                  }
              }


          def lambda_handler(event, context):

              try:

                  token_parameter = os.environ["AUTH_TOKEN_PARAMETER"]

                  expected_token = get_parameter(token_parameter)

                  headers = event.get("headers") or {}

                  authorization_header = (
                      headers.get("Authorization")
                      or headers.get("authorization")
                  )

                  if not authorization_header:

                      print(json.dumps({
                          "level": "INFO",
                          "operation": "AUTHORIZE",
                          "result": "DENY",
                          "reason": "TOKEN_MISSING"
                      }))

                      return generate_policy(
                          "unauthorized",
                          "Deny",
                          event["methodArn"]
                      )

                  token = authorization_header.strip()

                  if token.startswith("Bearer "):
                      token = token[len("Bearer "):].strip()

                  if token != expected_token:

                      print(json.dumps({
                          "level": "INFO",
                          "operation": "AUTHORIZE",
                          "result": "DENY",
                          "reason": "TOKEN_INVALID"
                      }))

                      return generate_policy(
                          "unauthorized",
                          "Deny",
                          event["methodArn"]
                      )

                  print(json.dumps({
                      "level": "INFO",
                      "operation": "AUTHORIZE",
                      "result": "ALLOW"
                  }))

                  return generate_policy(
                      "authorized-user",
                      "Allow",
                      event["methodArn"]
                  )

              except Exception as error:

                  print(json.dumps({
                      "level": "ERROR",
                      "operation": "AUTHORIZE",
                      "result": "ERROR",
                      "error_type": type(error).__name__
                  }))

                  return generate_policy(
                      "unauthorized",
                      "Deny",
                      event.get("methodArn", "*")
                  )


      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-lambda-authorizer


  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-product-lambda

      Runtime: python3.12

      Handler: index.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-ProductLambdaRoleArn

      Timeout: 30

      MemorySize: 256

      # ------------------------------------------------------
      # VPC CONFIGURATION
      # ------------------------------------------------------

      VpcConfig:

        SubnetIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

        SecurityGroupIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

      # ------------------------------------------------------
      # SSM PARAMETER NAMES
      # ------------------------------------------------------

      Environment:

        Variables:

          DB_NAME_PARAMETER: !Ref DBName

          DB_ENDPOINT_PARAMETER: !Ref DBEndpoint

          DB_PORT_PARAMETER: !Ref DBPort

          DB_USERNAME_PARAMETER: !Ref DBUsername

          DB_PASSWORD_PARAMETER: !Ref DBPassword

      # ------------------------------------------------------
      # BOOTSTRAP CODE
      # ------------------------------------------------------

      Code:
        ZipFile: |
          import json

          def lambda_handler(event, context):

              return {
                  "statusCode": 200,
                  "headers": {
                      "Content-Type": "application/json"
                  },
                  "body": json.dumps({
                      "message": "Product Lambda bootstrap is running"
                  })
              }

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-product-lambda


# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  # ----------------------------------------------------------
  # LAMBDA AUTHORISER ARN
  # ----------------------------------------------------------

  LambdaAuthorizerArn:
    Description: Lambda Authorizer ARN
    Value: !GetAtt LambdaAuthorizer.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-LambdaAuthorizerArn


  # ----------------------------------------------------------
  # LAMBDA AUTHORISER NAME
  # ----------------------------------------------------------

  LambdaAuthorizerName:
    Description: Lambda Authorizer function name
    Value: !Ref LambdaAuthorizer

    Export:
      Name: !Sub cloudmart-${Environment}-LambdaAuthorizerName


  # ----------------------------------------------------------
  # PRODUCT LAMBDA ARN
  # ----------------------------------------------------------

  ProductLambdaArn:
    Description: Product Lambda ARN
    Value: !GetAtt ProductLambda.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-ProductLambdaArn


  # ----------------------------------------------------------
  # PRODUCT LAMBDA NAME
  # ----------------------------------------------------------

  ProductLambdaName:
    Description: Product Lambda function name
    Value: !Ref ProductLambda

    Export:
      Name: !Sub cloudmart-${Environment}-ProductLambdaName