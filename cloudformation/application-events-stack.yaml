AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Application-Events Stack.
  Creates the CloudMart Lambda Authorizer.
  Additional application and event resources will be added incrementally.

Parameters:

  # ==========================================================
  # ENVIRONMENT
  # ==========================================================

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment


  # ==========================================================
  # AUTHENTICATION
  # ==========================================================

  AuthTokenParameter:
    Type: String
    Default: /cloudmart/dev/auth/token
    Description: >
      SSM SecureString parameter containing the API
      authentication token.


Resources:

  # ==========================================================
  # LAMBDA AUTHORISER
  # ==========================================================

  LambdaAuthorizer:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-lambda-authorizer

      Runtime: python3.12

      Handler: index.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-LambdaAuthorizerRoleArn

      Timeout: 10

      MemorySize: 128

      Environment:
        Variables:
          AUTH_TOKEN_PARAMETER: !Ref AuthTokenParameter

      # ------------------------------------------------------
      # ACTUAL AUTHORISER CODE
      #
      # CloudFormation receives the code inline.
      # You do NOT create a .zip file yourself.
      # ------------------------------------------------------

      Code:
        ZipFile: |
          import json
          import os
          import boto3


          ssm = boto3.client("ssm")


          def log_event(level, result, reason=None):
              record = {
                  "level": level,
                  "service": "cloudmart-lambda-authorizer",
                  "operation": "AUTHORIZE",
                  "result": result
              }

              if reason:
                  record["reason"] = reason

              print(json.dumps(record))


          def get_parameter(name):
              response = ssm.get_parameter(
                  Name=name,
                  WithDecryption=True
              )

              return response["Parameter"]["Value"]


          def generate_policy(principal_id, effect, resource):
              return {
                  "principalId": principal_id,
                  "policyDocument": {
                      "Version": "2012-10-17",
                      "Statement": [
                          {
                              "Action": "execute-api:Invoke",
                              "Effect": effect,
                              "Resource": resource
                          }
                      ]
                  }
              }


          def lambda_handler(event, context):

              method_arn = event.get("methodArn", "*")

              try:

                  # ------------------------------------------------
                  # Get SSM parameter name
                  # ------------------------------------------------

                  token_parameter = os.environ["AUTH_TOKEN_PARAMETER"]

                  # ------------------------------------------------
                  # Get actual token from SSM SecureString
                  # ------------------------------------------------

                  expected_token = get_parameter(token_parameter)

                  # ------------------------------------------------
                  # Read Authorization header
                  # ------------------------------------------------

                  headers = event.get("headers") or {}

                  authorization_header = (
                      headers.get("Authorization")
                      or headers.get("authorization")
                  )

                  # ------------------------------------------------
                  # Missing token
                  # ------------------------------------------------

                  if not authorization_header:

                      log_event(
                          "WARN",
                          "DENY",
                          "TOKEN_MISSING"
                      )

                      return generate_policy(
                          "unauthorized-user",
                          "Deny",
                          method_arn
                      )

                  # ------------------------------------------------
                  # Clean header
                  # ------------------------------------------------

                  authorization_header = authorization_header.strip()

                  # ------------------------------------------------
                  # Require Bearer token
                  # ------------------------------------------------

                  if not authorization_header.startswith("Bearer "):

                      log_event(
                          "WARN",
                          "DENY",
                          "INVALID_AUTHORIZATION_FORMAT"
                      )

                      return generate_policy(
                          "unauthorized-user",
                          "Deny",
                          method_arn
                      )

                  # ------------------------------------------------
                  # Extract token
                  # ------------------------------------------------

                  token = authorization_header[len("Bearer "):].strip()

                  if not token:

                      log_event(
                          "WARN",
                          "DENY",
                          "TOKEN_EMPTY"
                      )

                      return generate_policy(
                          "unauthorized-user",
                          "Deny",
                          method_arn
                      )

                  # ------------------------------------------------
                  # Compare token with SSM value
                  # ------------------------------------------------

                  if token != expected_token:

                      log_event(
                          "WARN",
                          "DENY",
                          "TOKEN_INVALID"
                      )

                      return generate_policy(
                          "unauthorized-user",
                          "Deny",
                          method_arn
                      )

                  # ------------------------------------------------
                  # Token valid
                  # ------------------------------------------------

                  log_event(
                      "INFO",
                      "ALLOW"
                  )

                  return generate_policy(
                      "authorized-user",
                      "Allow",
                      method_arn
                  )

              except Exception as error:

                  # ------------------------------------------------
                  # Do not log the token or SSM secret
                  # ------------------------------------------------

                  print(json.dumps({
                      "level": "ERROR",
                      "service": "cloudmart-lambda-authorizer",
                      "operation": "AUTHORIZE",
                      "result": "ERROR",
                      "error_type": type(error).__name__
                  }))

                  return generate_policy(
                      "unauthorized-user",
                      "Deny",
                      method_arn
                  )

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-lambda-authorizer


# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  # ----------------------------------------------------------
  # AUTHORISER ARN
  # ----------------------------------------------------------

  LambdaAuthorizerArn:
    Description: CloudMart Lambda Authorizer ARN

    Value: !GetAtt LambdaAuthorizer.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-LambdaAuthorizerArn


  # ----------------------------------------------------------
  # AUTHORISER NAME
  # ----------------------------------------------------------

  LambdaAuthorizerName:
    Description: CloudMart Lambda Authorizer function name

    Value: !Ref LambdaAuthorizer

    Export:
      Name: !Sub cloudmart-${Environment}-LambdaAuthorizerName