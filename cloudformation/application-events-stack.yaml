AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Application-Events Stack.
  Creates Lambda Authorizer, PyMySQL layer, Product Lambda,
  Order Lambda, Order Processor Lambda, Schema Initializer Lambda,
  one custom EventBridge bus, order lifecycle events,
  low-stock alerts, and SNS notifications.


# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String
    Default: dev

    AllowedValues:
      - dev
      - prod


  # ==========================================================
  # DATABASE SSM PARAMETERS
  # ==========================================================

  DBName:
    Type: String
    Default: /cloudmart/dev/db/name

  DBEndpoint:
    Type: String
    Default: /cloudmart/dev/db/endpoint

  DBPort:
    Type: String
    Default: /cloudmart/dev/db/port

  DBUsername:
    Type: String
    Default: /cloudmart/dev/db/username

  DBPassword:
    Type: String
    Default: /cloudmart/dev/db/password


  # ==========================================================
  # AUTHENTICATION
  # ==========================================================

  AuthTokenParameter:
    Type: String
    Default: /cloudmart/dev/auth/token

  CustomerTokensParameter:
    Type: String
    Default: /cloudmart/dev/auth/customer-tokens


  # ==========================================================
  # LAMBDA ARTIFACTS
  # ==========================================================

  LambdaArtifactBucket:
    Type: String

  PyMySQLLayerS3Key:
    Type: String

  ProductLambdaS3Key:
    Type: String

  OrderLambdaS3Key:
    Type: String

  OrderProcessorLambdaS3Key:
    Type: String

  SchemaS3Key:
    Type: String
    Default: database/schema.sql


  # ==========================================================
  # ALERT EMAIL
  # ==========================================================

  AlertEmail:
    Type: String


# ============================================================
# RESOURCES
# ============================================================

Resources:


  # ==========================================================
  # CUSTOM EVENTBRIDGE EVENT BUS
  # ==========================================================

  CloudMartEventBus:

    Type: AWS::Events::EventBus

    Properties:

      Name: !Sub cloudmart-${Environment}-event-bus

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-event-bus

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # LAMBDA AUTHORIZER
  # ==========================================================

  LambdaAuthorizer:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-lambda-authorizer

      Runtime: python3.12

      Handler: index.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-LambdaAuthorizerRoleArn

      Timeout: 10

      MemorySize: 128


      Environment:

        Variables:

          ADMIN_TOKEN_PARAMETER: !Ref AuthTokenParameter

          CUSTOMER_TOKENS_PARAMETER: !Ref CustomerTokensParameter


      Code:

        ZipFile: |

          import json
          import os
          import boto3


          ssm = boto3.client("ssm")


          # ================================================
          # GET SSM PARAMETER
          # ================================================

          def get_parameter(parameter_name):

              response = ssm.get_parameter(
                  Name=parameter_name,
                  WithDecryption=True
              )

              return response["Parameter"]["Value"]


          # ================================================
          # GENERATE IAM POLICY
          # ================================================

          def generate_policy(
              principal_id,
              effect,
              resource,
              auth_context=None
          ):

              policy = {
                  "principalId": principal_id,

                  "policyDocument": {
                      "Version": "2012-10-17",

                      "Statement": [
                          {
                              "Action": "execute-api:Invoke",
                              "Effect": effect,
                              "Resource": resource
                          }
                      ]
                  }
              }


              if auth_context:

                  policy["context"] = auth_context


              return policy


          # ================================================
          # GET METHOD AND RESOURCE PATH
          # ================================================

          def get_request_details(method_arn):

              try:

                  execute_api_part = method_arn.split(":")[5]

                  parts = execute_api_part.split("/")


                  http_method = (
                      parts[2]
                      if len(parts) > 2
                      else ""
                  )


                  resource_path = (
                      "/"
                      + "/".join(parts[3:])
                      if len(parts) > 3
                      else "/"
                  )


                  return (
                      http_method,
                      resource_path
                  )


              except Exception:

                  return "", ""


          # ================================================
          # NORMALIZE API PATH
          # ================================================

          def normalize_path(resource_path):

              parts = [

                  part

                  for part in resource_path.split("/")

                  if part
              ]


              # /products

              if len(parts) == 1:

                  if parts[0] == "products":

                      return "/products"


                  if parts[0] == "orders":

                      return "/orders"


              # /products/{id}

              if (

                  len(parts) == 2

                  and parts[0] == "products"

              ):

                  return "/products/{id}"


              # /orders/{id}

              if (

                  len(parts) == 2

                  and parts[0] == "orders"

              ):

                  return "/orders/{id}"


              # /orders/{id}/status

              if (

                  len(parts) == 3

                  and parts[0] == "orders"

                  and parts[2] == "status"

              ):

                  return "/orders/{id}/status"


              return resource_path


          # ================================================
          # CUSTOMER ACCESS RULES
          # ================================================

          def customer_is_allowed(
              http_method,
              resource_path
          ):

              normalized_path = normalize_path(
                  resource_path
              )


              allowed_routes = {


                  # PRODUCTS

                  ("GET", "/products"),

                  ("GET", "/products/{id}"),


                  # ORDERS

                  ("POST", "/orders"),

                  ("GET", "/orders"),

                  ("GET", "/orders/{id}"),

                  ("PATCH", "/orders/{id}/status")
              }


              return (

                  http_method,

                  normalized_path

              ) in allowed_routes


          # ================================================
          # LAMBDA HANDLER
          # ================================================

          def lambda_handler(event, context):

              method_arn = event.get(
                  "methodArn",
                  "*"
              )


              try:

                  authorization_header = event.get(
                      "authorizationToken",
                      ""
                  )


                  # ========================================
                  # CHECK AUTHORIZATION HEADER
                  # ========================================

                  if not authorization_header:

                      return generate_policy(
                          "unauthorized",
                          "Deny",
                          method_arn
                      )


                  provided_token = (
                      authorization_header.strip()
                  )


                  # ========================================
                  # REMOVE BEARER PREFIX
                  # ========================================

                  if provided_token.lower().startswith(
                      "bearer "
                  ):

                      provided_token = (
                          provided_token[7:].strip()
                      )


                  if not provided_token:

                      return generate_policy(
                          "unauthorized",
                          "Deny",
                          method_arn
                      )


                  # ========================================
                  # GET ENVIRONMENT VARIABLES
                  # ========================================

                  admin_parameter = os.environ[
                      "ADMIN_TOKEN_PARAMETER"
                  ]


                  customer_parameter = os.environ[
                      "CUSTOMER_TOKENS_PARAMETER"
                  ]


                  # ========================================
                  # GET TOKENS FROM SSM
                  # ========================================

                  admin_token = get_parameter(
                      admin_parameter
                  )


                  customer_tokens_value = get_parameter(
                      customer_parameter
                  )


                  customer_tokens = json.loads(
                      customer_tokens_value
                  )


                  # ========================================
                  # GET REQUEST DETAILS
                  # ========================================

                  (
                      http_method,
                      resource_path
                  ) = get_request_details(
                      method_arn
                  )


                  normalized_path = normalize_path(
                      resource_path
                  )


                  # ========================================
                  # ADMIN ACCESS
                  # ========================================

                  if provided_token == admin_token:


                      # ====================================
                      # ADMIN CANNOT CREATE ORDERS
                      # ====================================

                      if (

                          http_method == "POST"

                          and normalized_path == "/orders"

                      ):

                          print(
                              "Admin access denied for POST /orders"
                          )


                          return generate_policy(
                              "admin",
                              "Deny",
                              method_arn,
                              {
                                  "role": "ADMIN",
                                  "customer_id": ""
                              }
                          )


                      # ====================================
                      # ADMIN ALLOWED FOR OTHER OPERATIONS
                      # ====================================

                      return generate_policy(
                          "admin",
                          "Allow",
                          method_arn,
                          {
                              "role": "ADMIN",
                              "customer_id": ""
                          }
                      )


                  # ========================================
                  # CUSTOMER ACCESS
                  # ========================================

                  customer_id = customer_tokens.get(
                      provided_token
                  )


                  # INVALID TOKEN

                  if customer_id is None:

                      return generate_policy(
                          "unauthorized",
                          "Deny",
                          method_arn
                      )


                  customer_id = int(
                      customer_id
                  )


                  # CHECK CUSTOMER PERMISSIONS

                  if not customer_is_allowed(
                      http_method,
                      resource_path
                  ):

                      return generate_policy(
                          f"customer-{customer_id}",
                          "Deny",
                          method_arn,
                          {
                              "role": "CUSTOMER",
                              "customer_id": str(customer_id)
                          }
                      )


                  # CUSTOMER ALLOWED

                  return generate_policy(
                      f"customer-{customer_id}",
                      "Allow",
                      method_arn,
                      {
                          "role": "CUSTOMER",
                          "customer_id": str(customer_id)
                      }
                  )


              except Exception as exc:


                  print(
                      json.dumps(
                          {
                              "error_type": type(exc).__name__,
                              "error": str(exc)
                          }
                      )
                  )


                  return generate_policy(
                      "unauthorized",
                      "Deny",
                      method_arn
                  )


      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-lambda-authorizer

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # API GATEWAY AUTHORISER PERMISSION
  # ==========================================================

  AuthorizerInvokePermission:

    Type: AWS::Lambda::Permission

    Properties:

      FunctionName: !Ref LambdaAuthorizer

      Action: lambda:InvokeFunction

      Principal: apigateway.amazonaws.com


  # ==========================================================
  # PYMYSQL LAYER
  # ==========================================================

  PyMySQLLayer:

    Type: AWS::Lambda::LayerVersion

    Properties:

      LayerName: !Sub cloudmart-${Environment}-pymysql

      Description: PyMySQL dependencies for CloudMart Lambda functions

      CompatibleRuntimes:

        - python3.12

      CompatibleArchitectures:

        - x86_64

      Content:

        S3Bucket: !Ref LambdaArtifactBucket

        S3Key: !Ref PyMySQLLayerS3Key


  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-product-lambda

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-ProductLambdaRoleArn

      Timeout: 30

      MemorySize: 256


      Layers:

        - !Ref PyMySQLLayer


      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId


        SubnetIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId


      Environment:

        Variables:

          DB_NAME_PARAMETER: !Ref DBName

          DB_ENDPOINT_PARAMETER: !Ref DBEndpoint

          DB_PORT_PARAMETER: !Ref DBPort

          DB_USERNAME_PARAMETER: !Ref DBUsername

          DB_PASSWORD_PARAMETER: !Ref DBPassword

          EVENT_BUS_NAME: !Ref CloudMartEventBus


      Code:

        S3Bucket: !Ref LambdaArtifactBucket

        S3Key: !Ref ProductLambdaS3Key


      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-product-lambda

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # ORDER LAMBDA
  # ==========================================================

  OrderLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-order-lambda

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-OrderLambdaRoleArn

      Timeout: 30

      MemorySize: 256


      Layers:

        - !Ref PyMySQLLayer


      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId


        SubnetIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId


      Environment:

        Variables:

          DB_NAME_PARAMETER: !Ref DBName

          DB_ENDPOINT_PARAMETER: !Ref DBEndpoint

          DB_PORT_PARAMETER: !Ref DBPort

          DB_USERNAME_PARAMETER: !Ref DBUsername

          DB_PASSWORD_PARAMETER: !Ref DBPassword

          EVENT_BUS_NAME: !Ref CloudMartEventBus

          ORDER_PROCESSOR_FUNCTION_NAME:
            !Ref OrderProcessorLambda


      Code:

        S3Bucket: !Ref LambdaArtifactBucket

        S3Key: !Ref OrderLambdaS3Key


      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-order-lambda

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # ORDER PROCESSOR LAMBDA
  # ==========================================================

  OrderProcessorLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-order-processor

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-OrderProcessorLambdaRoleArn

      Timeout: 30

      MemorySize: 256


      Layers:

        - !Ref PyMySQLLayer


      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId


        SubnetIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId


      Environment:

        Variables:

          DB_NAME_PARAMETER: !Ref DBName

          DB_ENDPOINT_PARAMETER: !Ref DBEndpoint

          DB_PORT_PARAMETER: !Ref DBPort

          DB_USERNAME_PARAMETER: !Ref DBUsername

          DB_PASSWORD_PARAMETER: !Ref DBPassword

          EVENT_BUS_NAME: !Ref CloudMartEventBus


      Code:

        S3Bucket: !Ref LambdaArtifactBucket

        S3Key: !Ref OrderProcessorLambdaS3Key


      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-order-processor

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # SCHEMA INITIALIZER LAMBDA
  # ==========================================================

  SchemaInitializerLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-schema-initializer

      Runtime: python3.12

      Handler: index.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-SchemaInitializerRoleArn

      Timeout: 30

      MemorySize: 256


      Layers:

        - !Ref PyMySQLLayer


      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId


        SubnetIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId


      Environment:

        Variables:

          DB_NAME_PARAMETER: !Ref DBName

          DB_ENDPOINT_PARAMETER: !Ref DBEndpoint

          DB_PORT_PARAMETER: !Ref DBPort

          DB_USERNAME_PARAMETER: !Ref DBUsername

          DB_PASSWORD_PARAMETER: !Ref DBPassword

          SCHEMA_BUCKET: !Ref LambdaArtifactBucket

          SCHEMA_KEY: !Ref SchemaS3Key


      Code:

        ZipFile: |

          def lambda_handler(event, context):

              print("Schema Initializer Lambda deployed")

              return {
                  "statusCode": 200,
                  "body": "Schema initializer completed"
              }


      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-schema-initializer

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # SNS LOW STOCK TOPIC
  # ==========================================================

  LowStockTopic:

    Type: AWS::SNS::Topic

    Properties:

      TopicName:
        !Sub cloudmart-${Environment}-low-stock-alerts

      DisplayName: CloudMart Low Stock Alerts


  # ==========================================================
  # SNS ORDER NOTIFICATION TOPIC
  # ==========================================================

  OrderConfirmationTopic:

    Type: AWS::SNS::Topic

    Properties:

      TopicName:
        !Sub cloudmart-${Environment}-order-notifications

      DisplayName: CloudMart Order Notifications


  # ==========================================================
  # LOW STOCK EMAIL SUBSCRIPTION
  # ==========================================================

  LowStockEmailSubscription:

    Type: AWS::SNS::Subscription

    Properties:

      TopicArn: !Ref LowStockTopic

      Protocol: email

      Endpoint: !Ref AlertEmail


  # ==========================================================
  # ORDER EMAIL SUBSCRIPTION
  # ==========================================================

  OrderEmailSubscription:

    Type: AWS::SNS::Subscription

    Properties:

      TopicArn: !Ref OrderConfirmationTopic

      Protocol: email

      Endpoint: !Ref AlertEmail


  # ==========================================================
  # LOW STOCK SNS POLICY
  # ==========================================================

  LowStockTopicPolicy:

    Type: AWS::SNS::TopicPolicy

    Properties:

      Topics:

        - !Ref LowStockTopic


      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Sid: AllowEventBridgePublish

            Effect: Allow

            Principal:

              Service: events.amazonaws.com

            Action: sns:Publish

            Resource: !Ref LowStockTopic


  # ==========================================================
  # ORDER SNS POLICY
  # ==========================================================

  OrderConfirmationTopicPolicy:

    Type: AWS::SNS::TopicPolicy

    Properties:

      Topics:

        - !Ref OrderConfirmationTopic


      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Sid: AllowEventBridgePublish

            Effect: Allow

            Principal:

              Service: events.amazonaws.com

            Action: sns:Publish

            Resource: !Ref OrderConfirmationTopic


  # ==========================================================
  # LOW STOCK EVENT RULE
  # ==========================================================

  LowStockEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-low-stock-rule

      Description: CloudMart low stock alert rule

      State: ENABLED

      EventBusName: !Ref CloudMartEventBus


      EventPattern:

        source:

          - cloudmart.inventory

        detail-type:

          - LowStock


      Targets:

        - Id: LowStockSnsTarget

          Arn: !Ref LowStockTopic

          InputTransformer:

            InputPathsMap:

              product_id: $.detail.product_id

              product_name: $.detail.product_name

              new_stock: $.detail.new_stock

              low_stock_threshold:
                $.detail.low_stock_threshold


            InputTemplate: |
              "CloudMart Low Stock Alert\n\nProduct ID: <product_id>\nProduct: <product_name>\nCurrent Stock: <new_stock>\nReorder Threshold: <low_stock_threshold>"


  # ==========================================================
  # ORDER PLACED EVENT RULE
  # ==========================================================

  OrderPlacedEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-placed-rule

      Description: CloudMart order placed notification rule

      State: ENABLED

      EventBusName: !Ref CloudMartEventBus


      EventPattern:

        source:

          - cloudmart.orders

        detail-type:

          - OrderPlaced


      Targets:

        - Id: OrderPlacedSnsTarget

          Arn: !Ref OrderConfirmationTopic


          InputTransformer:

            InputPathsMap:

              order_id: $.detail.order_id

              customer_id: $.detail.customer_id

              status: $.detail.status


            InputTemplate: |
              "CloudMart Order Placed\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nStatus: <status>\n\nYour order has been created successfully."


  # ==========================================================
  # ORDER PENDING EVENT RULE
  # ==========================================================

  OrderPendingEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-pending-rule

      Description: CloudMart order pending notification rule

      State: ENABLED

      EventBusName: !Ref CloudMartEventBus


      EventPattern:

        source:

          - cloudmart.orders

        detail-type:

          - OrderPending


      Targets:

        - Id: OrderPendingSnsTarget

          Arn: !Ref OrderConfirmationTopic


          InputTransformer:

            InputPathsMap:

              order_id: $.detail.order_id

              customer_id: $.detail.customer_id

              status: $.detail.status


            InputTemplate: |
              "CloudMart Order Pending\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nStatus: <status>\n\nYour order is currently being processed."


  # ==========================================================
  # ORDER CONFIRMED EVENT RULE
  # ==========================================================

  OrderConfirmedEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-confirmed-rule

      Description: CloudMart order confirmed notification rule

      State: ENABLED

      EventBusName: !Ref CloudMartEventBus


      EventPattern:

        source:

          - cloudmart.orders

        detail-type:

          - OrderConfirmed


      Targets:

        - Id: OrderConfirmedSnsTarget

          Arn: !Ref OrderConfirmationTopic


          InputTransformer:

            InputPathsMap:

              order_id: $.detail.order_id

              customer_id: $.detail.customer_id

              status: $.detail.status


            InputTemplate: |
              "CloudMart Order Confirmed\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nStatus: <status>\n\nYour order has been successfully confirmed."


  # ==========================================================
  # ORDER FAILED EVENT RULE
  # ==========================================================

  OrderFailedEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-failed-rule

      Description: CloudMart order failed notification rule

      State: ENABLED

      EventBusName: !Ref CloudMartEventBus


      EventPattern:

        source:

          - cloudmart.orders

        detail-type:

          - OrderFailed


      Targets:

        - Id: OrderFailedSnsTarget

          Arn: !Ref OrderConfirmationTopic


          InputTransformer:

            InputPathsMap:

              order_id: $.detail.order_id

              customer_id: $.detail.customer_id

              error: $.detail.error


            InputTemplate: |
              "CloudMart Order Failed\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nError: <error>\n\nThe order could not be completed and inventory was not deducted."


  # ==========================================================
  # ORDER CANCELLED EVENT RULE
  # ==========================================================

  OrderCancelledEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-cancelled-rule

      Description: CloudMart order cancelled notification rule

      State: ENABLED

      EventBusName: !Ref CloudMartEventBus


      EventPattern:

        source:

          - cloudmart.orders

        detail-type:

          - OrderCancelled


      Targets:

        - Id: OrderCancelledSnsTarget

          Arn: !Ref OrderConfirmationTopic


          InputTransformer:

            InputPathsMap:

              order_id: $.detail.order_id

              customer_id: $.detail.customer_id

              status: $.detail.status

              note: $.detail.note


            InputTemplate: |
              "CloudMart Order Cancelled\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nStatus: <status>\nNote: <note>\n\nThe order was cancelled. Inventory was restored where applicable."


# ============================================================
# OUTPUTS
# ============================================================

Outputs:


  # ==========================================================
  # LAMBDA AUTHORIZER
  # ==========================================================

  LambdaAuthorizerArn:

    Description: Lambda Authorizer ARN

    Value: !GetAtt LambdaAuthorizer.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-LambdaAuthorizerArn


  LambdaAuthorizerName:

    Description: Lambda Authorizer name

    Value: !Ref LambdaAuthorizer

    Export:

      Name:
        !Sub cloudmart-${Environment}-LambdaAuthorizerName


  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambdaArn:

    Description: Product Lambda ARN

    Value: !GetAtt ProductLambda.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-ProductLambdaArn


  ProductLambdaName:

    Description: Product Lambda name

    Value: !Ref ProductLambda

    Export:

      Name:
        !Sub cloudmart-${Environment}-ProductLambdaName


  # ==========================================================
  # ORDER LAMBDA
  # ==========================================================

  OrderLambdaArn:

    Description: Order Lambda ARN

    Value: !GetAtt OrderLambda.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderLambdaArn


  OrderLambdaName:

    Description: Order Lambda name

    Value: !Ref OrderLambda

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderLambdaName


  # ==========================================================
  # ORDER PROCESSOR
  # ==========================================================

  OrderProcessorLambdaArn:

    Description: Order Processor Lambda ARN

    Value: !GetAtt OrderProcessorLambda.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderProcessorLambdaArn


  OrderProcessorLambdaName:

    Description: Order Processor Lambda name

    Value: !Ref OrderProcessorLambda

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderProcessorLambdaName


  # ==========================================================
  # SCHEMA INITIALIZER
  # ==========================================================

  SchemaInitializerLambdaArn:

    Description: Schema Initializer Lambda ARN

    Value: !GetAtt SchemaInitializerLambda.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-SchemaInitializerLambdaArn


  SchemaInitializerLambdaName:

