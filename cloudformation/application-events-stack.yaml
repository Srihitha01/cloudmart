AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Application-Events Stack.
  Creates Lambda Authorizer, PyMySQL layer, Product Lambda,
  Order Lambda, Order Processor Lambda, Schema Initializer Lambda,
  Daily Report Lambda, EventBridge event bus and rules,
  and SNS notifications.
  No SQS is used in this architecture.


# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  # ==========================================================
  # ENVIRONMENT
  # ==========================================================

  Environment:
    Type: String

    AllowedValues:
      - dev
      - prod

    Description:
      Deployment environment supplied by the deployment pipeline


  # ==========================================================
  # DATABASE SSM PARAMETERS
  # ==========================================================

  DBName:
    Type: String

    Description:
      SSM parameter name containing the database name


  DBEndpoint:
    Type: String

    Description:
      SSM parameter name containing the RDS endpoint


  DBPort:
    Type: String

    Description:
      SSM parameter name containing the database port


  DBUsername:
    Type: String

    Description:
      SSM parameter name containing the database username


  DBPassword:
    Type: String

    Description:
      SSM parameter name containing the database password


  # ==========================================================
  # AUTHENTICATION
  # ==========================================================

  AuthTokenParameter:
    Type: String

    Description:
      SSM parameter name containing the authentication token


  CustomerTokensParameter:
    Type: String

    Description:
      SSM parameter name containing customer token mappings


  # ==========================================================
  # LAMBDA ARTIFACTS
  # ==========================================================

  LambdaArtifactBucket:
    Type: String

    Description:
      S3 bucket containing CloudMart Lambda artifacts


  PyMySQLLayerS3Key:
    Type: String

    Description:
      S3 key for the PyMySQL Lambda layer


  AuthorizerLambdaS3Key:
    Type: String

    Description:
      S3 key for the Lambda Authorizer artifact


  ProductLambdaS3Key:
    Type: String

    Description:
      S3 key for the Product Lambda artifact


  OrderLambdaS3Key:
    Type: String

    Description:
      S3 key for the Order Lambda artifact


  OrderProcessorLambdaS3Key:
    Type: String

    Description:
      S3 key for the Order Processor Lambda artifact


  DailyReportLambdaS3Key:
    Type: String

    Description:
      S3 key for the Daily Report Lambda artifact


  SchemaS3Key:
    Type: String

    Description:
      S3 key for the database schema SQL file


  # ==========================================================
  # ALERT EMAIL
  # ==========================================================

  AlertEmail:
    Type: String
    Default: gajjalasrihitha01@gmail.com

    Description:
      Email address used for CloudMart SNS alerts


# ============================================================
# RESOURCES
# ============================================================

Resources:


  # ==========================================================
  # CUSTOM EVENTBRIDGE EVENT BUS
  # ==========================================================

  CloudMartEventBus:

    Type: AWS::Events::EventBus

    Properties:

      Name:
        !Sub cloudmart-${Environment}-event-bus

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-event-bus

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # PYMYSQL LAYER
  # ==========================================================

  PyMySQLLayer:

    Type: AWS::Lambda::LayerVersion

    Properties:

      LayerName:
        !Sub cloudmart-${Environment}-pymysql

      Description:
        PyMySQL dependency layer for CloudMart Lambda functions

      CompatibleRuntimes:
        - python3.12

      CompatibleArchitectures:
        - x86_64

      Content:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref PyMySQLLayerS3Key


  # ==========================================================
  # LAMBDA AUTHORIZER
  # ==========================================================

  LambdaAuthorizer:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-lambda-authorizer

      Runtime:
        python3.12

      Handler:
        lambda_function.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-LambdaAuthorizerRoleArn

      Timeout:
        30

      MemorySize:
        256

      Layers:

        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          AUTH_TOKEN_PARAMETER:
            !Ref AuthTokenParameter

          CUSTOMER_TOKENS_PARAMETER:
            !Ref CustomerTokensParameter

          DB_NAME_PARAMETER:
            !Ref DBName

          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint

          DB_PORT_PARAMETER:
            !Ref DBPort

          DB_USERNAME_PARAMETER:
            !Ref DBUsername

          DB_PASSWORD_PARAMETER:
            !Ref DBPassword

      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref AuthorizerLambdaS3Key

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-lambda-authorizer

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-product-lambda

      Runtime:
        python3.12

      Handler:
        lambda_function.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-ProductLambdaRoleArn

      Timeout:
        30

      MemorySize:
        256

      Layers:

        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName

          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint

          DB_PORT_PARAMETER:
            !Ref DBPort

          DB_USERNAME_PARAMETER:
            !Ref DBUsername

          DB_PASSWORD_PARAMETER:
            !Ref DBPassword

          EVENT_BUS_NAME:
            !Ref CloudMartEventBus

      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref ProductLambdaS3Key

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-product-lambda

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # ORDER LAMBDA
  # ==========================================================

  OrderLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-order-lambda

      Runtime:
        python3.12

      Handler:
        lambda_function.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-OrderLambdaRoleArn

      Timeout:
        30

      MemorySize:
        256

      Layers:

        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName

          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint

          DB_PORT_PARAMETER:
            !Ref DBPort

          DB_USERNAME_PARAMETER:
            !Ref DBUsername

          DB_PASSWORD_PARAMETER:
            !Ref DBPassword

          EVENT_BUS_NAME:
            !Ref CloudMartEventBus

          ORDER_PROCESSOR_FUNCTION_NAME:
            !Ref OrderProcessorLambda

      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref OrderLambdaS3Key

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-order-lambda

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # ORDER PROCESSOR LAMBDA
  # ==========================================================

  OrderProcessorLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-order-processor

      Runtime:
        python3.12

      Handler:
        lambda_function.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-OrderProcessorLambdaRoleArn

      Timeout:
        60

      MemorySize:
        256

      Layers:

        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName

          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint

          DB_PORT_PARAMETER:
            !Ref DBPort

          DB_USERNAME_PARAMETER:
            !Ref DBUsername

          DB_PASSWORD_PARAMETER:
            !Ref DBPassword

          EVENT_BUS_NAME:
            !Ref CloudMartEventBus

      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref OrderProcessorLambdaS3Key

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-order-processor

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # ORDER LAMBDA -> ORDER PROCESSOR PERMISSION
  #
  # NO SQS
  #
  # Order Lambda directly invokes Order Processor Lambda.
  # ==========================================================

  OrderProcessorInvokePermission:

    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref OrderProcessorLambda

      Action:
        lambda:InvokeFunction

      Principal:
        lambda.amazonaws.com

      SourceArn:
        !GetAtt OrderLambda.Arn


  # ==========================================================
  # DAILY REPORT LAMBDA
  #
  # EventBridge
  #      |
  #      v
  # Daily Report Lambda
  #      |
  #      v
  #      RDS
  #      |
  #      v
  #      S3 CSV
  # ==========================================================

  DailyReportLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-daily-report

      Description:
        CloudMart Daily Inventory and Orders Report

      Runtime:
        python3.12

      Handler:
        lambda_function.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-DailyReportLambdaRoleArn

      Timeout:
        60

      MemorySize:
        256

      Architectures:

        - x86_64

      Layers:

        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName

          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint

          DB_PORT_PARAMETER:
            !Ref DBPort

          DB_USERNAME_PARAMETER:
            !Ref DBUsername

          DB_PASSWORD_PARAMETER:
            !Ref DBPassword

          REPORT_BUCKET:
            Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-ReportBucketName

      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref DailyReportLambdaS3Key

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-daily-report

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # DAILY REPORT EVENTBRIDGE SCHEDULE
  #
  # 00:00 UTC = 05:30 IST
  # ==========================================================

  DailyReportSchedule:

    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-daily-report-schedule

      Description:
        Runs the CloudMart Daily Report Lambda once every day

      ScheduleExpression:
        cron(0 0 * * ? *)

      State:
        ENABLED

      Targets:

        - Arn:
            !GetAtt DailyReportLambda.Arn

          Id:
            DailyReportLambdaTarget


  # ==========================================================
  # EVENTBRIDGE -> DAILY REPORT LAMBDA PERMISSION
  # ==========================================================

  DailyReportLambdaInvokePermission:

    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref DailyReportLambda

      Action:
        lambda:InvokeFunction

      Principal:
        events.amazonaws.com

      SourceArn:
        !GetAtt DailyReportSchedule.Arn


  # ==========================================================
  # SCHEMA INITIALIZER LAMBDA
  # ==========================================================

  SchemaInitializerLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-schema-initializer

      Runtime:
        python3.12

      Handler:
        index.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-SchemaInitializerLambdaRoleArn

      Timeout:
        300

      MemorySize:
        256

      Layers:

        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName

          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint

          DB_PORT_PARAMETER:
            !Ref DBPort

          DB_USERNAME_PARAMETER:
            !Ref DBUsername

          DB_PASSWORD_PARAMETER:
            !Ref DBPassword

          SCHEMA_BUCKET:
            !Ref LambdaArtifactBucket

          SCHEMA_KEY:
            !Ref SchemaS3Key

      Code:

        ZipFile: |

          import os
          import boto3
          import pymysql


          s3 = boto3.client("s3")
          ssm = boto3.client("ssm")


          DB_NAME_PARAMETER = os.environ["DB_NAME_PARAMETER"]
          DB_ENDPOINT_PARAMETER = os.environ["DB_ENDPOINT_PARAMETER"]
          DB_PORT_PARAMETER = os.environ["DB_PORT_PARAMETER"]
          DB_USERNAME_PARAMETER = os.environ["DB_USERNAME_PARAMETER"]
          DB_PASSWORD_PARAMETER = os.environ["DB_PASSWORD_PARAMETER"]

          SCHEMA_BUCKET = os.environ["SCHEMA_BUCKET"]
          SCHEMA_KEY = os.environ["SCHEMA_KEY"]


          def get_parameter(name):

              return ssm.get_parameter(
                  Name=name,
                  WithDecryption=True
              )["Parameter"]["Value"]


          def get_connection():

              return pymysql.connect(

                  host=get_parameter(
                      DB_ENDPOINT_PARAMETER
                  ),

                  port=int(
                      get_parameter(
                          DB_PORT_PARAMETER
                      )
                  ),

                  user=get_parameter(
                      DB_USERNAME_PARAMETER
                  ),

                  password=get_parameter(
                      DB_PASSWORD_PARAMETER
                  ),

                  database=get_parameter(
                      DB_NAME_PARAMETER
                  ),

                  connect_timeout=10,

                  read_timeout=30,

                  write_timeout=30
              )


          def lambda_handler(event, context):

              schema_object = s3.get_object(

                  Bucket=SCHEMA_BUCKET,

                  Key=SCHEMA_KEY
              )

              schema_sql = schema_object[
                  "Body"
              ].read().decode("utf-8")


              connection = get_connection()


              try:

                  with connection.cursor() as cursor:

                      statements = schema_sql.split(";")

                      for statement in statements:

                          statement = statement.strip()

                          if not statement:

                              continue

                          cursor.execute(statement)


                  connection.commit()

                  return {

                      "statusCode": 200,

                      "message":
                          "Database schema initialized successfully"

                  }

              finally:

                  connection.close()


  # ==========================================================
  # ORDER UPDATED EVENT RULE
  #
  # OrderUpdated
  #      |
  #      v
  # EventBridge
  #      |
  #      v
  # Order Processor Lambda
  #
  # NO SQS
  # ==========================================================

  OrderUpdatedEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-updated-rule

      Description:
        Sends OrderUpdated events to the Order Processor Lambda

      EventBusName:
        !Ref CloudMartEventBus

      State:
        ENABLED

      EventPattern:

        source:

          - cloudmart.orders

        detail-type:

          - OrderUpdated

      Targets:

        - Arn:
            !GetAtt OrderProcessorLambda.Arn

          Id:
            OrderProcessorTarget


  # ==========================================================
  # EVENTBRIDGE -> ORDER PROCESSOR PERMISSION
  # ==========================================================

  EventBridgeInvokeOrderProcessorPermission:

    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref OrderProcessorLambda

      Action:
        lambda:InvokeFunction

      Principal:
        events.amazonaws.com

      SourceArn:
        !GetAtt OrderUpdatedEventRule.Arn


  # ==========================================================
  # PRODUCT ALERT SNS TOPIC
  # ==========================================================

  ProductAlertTopic:

    Type: AWS::SNS::Topic

    Properties:

      TopicName:
        !Sub cloudmart-${Environment}-product-alerts

      DisplayName:
        CloudMart Product Alerts

      Subscription:

        - Endpoint:
            !Ref AlertEmail

          Protocol:
            email

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-product-alerts

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # ORDER ALERT SNS TOPIC
  # ==========================================================

  OrderAlertTopic:

    Type: AWS::SNS::Topic

    Properties:

      TopicName:
        !Sub cloudmart-${Environment}-order-alerts

      DisplayName:
        CloudMart Order Alerts

      Subscription:

        - Endpoint:
            !Ref AlertEmail

          Protocol:
            email

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-order-alerts

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # EVENTBRIDGE ROLE FOR PRODUCT SNS
  # ==========================================================

  EventBridgeProductSNSRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-eventbridge-product-sns-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - events.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName:
            PublishProductAlerts

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - sns:Publish

                Resource:
                  - !Ref ProductAlertTopic


  # ==========================================================
  # EVENTBRIDGE ROLE FOR ORDER SNS
  # ==========================================================

  EventBridgeOrderSNSRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-eventbridge-order-sns-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - events.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName:
            PublishOrderAlerts

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - sns:Publish

                Resource:
                  - !Ref OrderAlertTopic


  # ==========================================================
  # LOW STOCK EVENT -> PRODUCT SNS
  # ==========================================================

  LowStockEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-low-stock-rule

      Description:
        Sends low-stock inventory events to Product SNS alerts

      EventBusName:
        !Ref CloudMartEventBus

      State:
        ENABLED

      EventPattern:

        source:

          - cloudmart.product

        detail-type:

          - Inventory Changed

        detail:

          low_stock:

            - true

      Targets:

        - Arn:
            !Ref ProductAlertTopic

          Id:
            ProductLowStockSNSTarget

          RoleArn:
            !GetAtt EventBridgeProductSNSRole.Arn

          InputTransformer:
            InputPathsMap:
              productId: "$.detail.product_id"
              productName: "$.detail.product_name"
              oldStock: "$.detail.old_stock"
              newStock: "$.detail.new_stock"
              threshold: "$.detail.low_stock_threshold"

            InputTemplate: >
              "CloudMart LOW STOCK ALERT: Product <productName>
              (ID: <productId>) stock changed from <oldStock> to
              <newStock>. Reorder threshold: <threshold>."


  # ==========================================================
  # ORDER EVENTS -> ORDER SNS
  # ==========================================================

  OrderEventsToSNSRule:

    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-alert-rule

      Description:
        Sends CloudMart order lifecycle events to Order SNS alerts

      EventBusName:
        !Ref CloudMartEventBus

      State:
        ENABLED

      EventPattern:

        source:

          - cloudmart.orders

        detail-type:

          - OrderCreated
          - OrderUpdated
          - OrderCancelled
          - OrderDelivered
          - OrderConfirmed
          - OrderFailed

      Targets:

        - Arn:
            !Ref OrderAlertTopic

          Id:
            OrderSNSTarget

          RoleArn:
            !GetAtt EventBridgeOrderSNSRole.Arn

          InputTransformer:
            InputPathsMap:
              eventType: "$.detail-type"
              orderId: "$.detail.order_id"
              customerId: "$.detail.customer_id"
              status: "$.detail.status"
              totalAmount: "$.detail.total_amount"
              failureReason: "$.detail.failure_reason"

            InputTemplate: >
              "CloudMart ORDER ALERT: Event <eventType>.
              Order ID: <orderId>, Customer ID: <customerId>,
              Status: <status>, Total Amount: <totalAmount>,
              Failure Reason: <failureReason>."


# ============================================================
# OUTPUTS
# ============================================================

Outputs:


  # ==========================================================
  # EVENTBRIDGE
  # ==========================================================

  EventBusName:

    Description:
      CloudMart EventBridge Event Bus name

    Value:
      !Ref CloudMartEventBus

    Export:

      Name:
        !Sub cloudmart-${Environment}-EventBusName


  EventBusArn:

    Description:
      CloudMart EventBridge Event Bus ARN

    Value:
      !GetAtt CloudMartEventBus.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-EventBusArn


  # ==========================================================
  # LAMBDA AUTHORIZER
  # ==========================================================

  LambdaAuthorizerArn:

    Description:
      Lambda Authorizer ARN

    Value:
      !GetAtt LambdaAuthorizer.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-LambdaAuthorizerArn


  LambdaAuthorizerName:

    Description:
      Lambda Authorizer name

    Value:
      !Ref LambdaAuthorizer

    Export:

      Name:
        !Sub cloudmart-${Environment}-LambdaAuthorizerName


  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambdaArn:

    Description:
      Product Lambda ARN

    Value:
      !GetAtt ProductLambda.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-ProductLambdaArn


  ProductLambdaName:

    Description:
      Product Lambda name

    Value:
      !Ref ProductLambda

    Export:

      Name:
        !Sub cloudmart-${Environment}-ProductLambdaName


  # ==========================================================
  # ORDER LAMBDA
  # ==========================================================

  OrderLambdaArn:

    Description:
      Order Lambda ARN

    Value:
      !GetAtt OrderLambda.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderLambdaArn


  OrderLambdaName:

    Description:
      Order Lambda name

    Value:
      !Ref OrderLambda

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderLambdaName


  # ==========================================================
  # ORDER PROCESSOR
  # ==========================================================

  OrderProcessorLambdaArn:

    Description:
      Order Processor Lambda ARN

    Value:
      !GetAtt OrderProcessorLambda.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderProcessorLambdaArn


  OrderProcessorLambdaName:

    Description:
      Order Processor Lambda name

    Value:
      !Ref OrderProcessorLambda

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderProcessorLambdaName


  # ==========================================================
  # DAILY REPORT LAMBDA
  # ==========================================================

  DailyReportLambdaArn:

    Description:
      Daily Report Lambda ARN

    Value:
      !GetAtt DailyReportLambda.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-DailyReportLambdaArn


  DailyReportLambdaName:

    Description:
      Daily Report Lambda name

    Value:
      !Ref DailyReportLambda

    Export:

      Name:
        !Sub cloudmart-${Environment}-DailyReportLambdaName


  DailyReportScheduleArn:

    Description:
      Daily Report EventBridge schedule ARN

    Value:
      !GetAtt DailyReportSchedule.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-DailyReportScheduleArn


  # ==========================================================
  # SCHEMA INITIALIZER
  # ==========================================================

  SchemaInitializerLambdaArn:

    Description:
      Schema Initializer Lambda ARN

