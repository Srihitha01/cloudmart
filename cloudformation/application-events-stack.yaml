AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Application-Events Stack.
  Creates Lambda Authorizer, PyMySQL layer, Product Lambda,
  Order Lambda, Order Processor Lambda, Schema Initializer,
  EventBridge order lifecycle events, low-stock notifications,
  and SNS alerts.


# ============================================================
# PARAMETERS
# ============================================================

Parameters:


  # ==========================================================
  # ENVIRONMENT
  # ==========================================================

  Environment:

    Type: String

    Default: dev

    AllowedValues:

      - dev

      - prod

    Description: Deployment environment


  # ==========================================================
  # DATABASE SSM PARAMETERS
  # ==========================================================

  DBName:

    Type: String

    Default: /cloudmart/dev/db/name


  DBEndpoint:

    Type: String

    Default: /cloudmart/dev/db/endpoint


  DBPort:

    Type: String

    Default: /cloudmart/dev/db/port


  DBUsername:

    Type: String

    Default: /cloudmart/dev/db/username


  DBPassword:

    Type: String

    Default: /cloudmart/dev/db/password


  # ==========================================================
  # AUTHENTICATION SSM PARAMETERS
  # ==========================================================

  AuthTokenParameter:

    Type: String

    Default: /cloudmart/dev/auth/token


  CustomerTokensParameter:

    Type: String

    Default: /cloudmart/dev/auth/customer-tokens


  # ==========================================================
  # LAMBDA ARTIFACTS
  # ==========================================================

  LambdaArtifactBucket:

    Type: String


  PyMySQLLayerS3Key:

    Type: String


  ProductLambdaS3Key:

    Type: String


  OrderLambdaS3Key:

    Type: String


  OrderProcessorLambdaS3Key:

    Type: String


  AuthorizerLambdaS3Key:

    Type: String


  SchemaS3Key:

    Type: String


  # ==========================================================
  # SNS ALERT EMAIL
  # ==========================================================

  AlertEmail:

    Type: String


# ============================================================
# RESOURCES
# ============================================================

Resources:


  # ==========================================================
  # CUSTOM EVENTBRIDGE EVENT BUS
  # ==========================================================

  CloudMartEventBus:

    Type: AWS::Events::EventBus

    Properties:

      Name: !Sub cloudmart-${Environment}-event-bus


  # ==========================================================
  # PYMYSQL LAYER
  # ==========================================================

  PyMySQLLayer:

    Type: AWS::Lambda::LayerVersion

    Properties:

      LayerName:
        !Sub cloudmart-${Environment}-pymysql

      Description:
        PyMySQL dependency layer for CloudMart Lambda functions

      CompatibleRuntimes:

        - python3.12

      Content:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref PyMySQLLayerS3Key


  # ==========================================================
  # LAMBDA AUTHORIZER
  # ==========================================================

  LambdaAuthorizer:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-lambda-authorizer

      Runtime:
        python3.12

      Handler:
        lambda_function.lambda_handler

      Role:

        Fn::ImportValue:

          Fn::Sub:
            cloudmart-${Environment}-LambdaAuthorizerRoleArn

      Timeout: 10

      MemorySize: 128


      Environment:

        Variables:

          ADMIN_TOKEN_PARAMETER:
            !Ref AuthTokenParameter

          CUSTOMER_TOKENS_PARAMETER:
            !Ref CustomerTokensParameter


      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref AuthorizerLambdaS3Key


      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-lambda-authorizer

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-product-lambda

      Runtime:
        python3.12

      Handler:
        lambda_function.lambda_handler

      Role:

        Fn::ImportValue:

          Fn::Sub:
            cloudmart-${Environment}-ProductLambdaRoleArn

      Timeout: 30

      MemorySize: 256


      Layers:

        - !Ref PyMySQLLayer


      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:

              Fn::Sub:
                cloudmart-${Environment}-LambdaSecurityGroupId


        SubnetIds:

          - Fn::ImportValue:

              Fn::Sub:
                cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:

              Fn::Sub:
                cloudmart-${Environment}-SecondaryPrivateSubnetId


      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName

          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint

          DB_PORT_PARAMETER:
            !Ref DBPort

          DB_USERNAME_PARAMETER:
            !Ref DBUsername

          DB_PASSWORD_PARAMETER:
            !Ref DBPassword

          EVENT_BUS_NAME:
            !Ref CloudMartEventBus


      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref ProductLambdaS3Key


      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-product-lambda

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # ORDER LAMBDA
  # ==========================================================

  OrderLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-order-lambda

      Runtime:
        python3.12

      Handler:
        lambda_function.lambda_handler

      Role:

        Fn::ImportValue:

          Fn::Sub:
            cloudmart-${Environment}-OrderLambdaRoleArn

      Timeout: 30

      MemorySize: 256


      Layers:

        - !Ref PyMySQLLayer


      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:

              Fn::Sub:
                cloudmart-${Environment}-LambdaSecurityGroupId


        SubnetIds:

          - Fn::ImportValue:

              Fn::Sub:
                cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:

              Fn::Sub:
                cloudmart-${Environment}-SecondaryPrivateSubnetId


      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName

          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint

          DB_PORT_PARAMETER:
            !Ref DBPort

          DB_USERNAME_PARAMETER:
            !Ref DBUsername

          DB_PASSWORD_PARAMETER:
            !Ref DBPassword

          EVENT_BUS_NAME:
            !Ref CloudMartEventBus

          ORDER_PROCESSOR_FUNCTION_NAME:
            !Ref OrderProcessorLambda


      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref OrderLambdaS3Key


      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-order-lambda

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # ORDER PROCESSOR LAMBDA
  # ==========================================================

  OrderProcessorLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-order-processor

      Runtime:
        python3.12

      Handler:
        lambda_function.lambda_handler

      Role:

        Fn::ImportValue:

          Fn::Sub:
            cloudmart-${Environment}-OrderProcessorLambdaRoleArn

      Timeout: 60

      MemorySize: 256


      Layers:

        - !Ref PyMySQLLayer


      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:

              Fn::Sub:
                cloudmart-${Environment}-LambdaSecurityGroupId


        SubnetIds:

          - Fn::ImportValue:

              Fn::Sub:
                cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:

              Fn::Sub:
                cloudmart-${Environment}-SecondaryPrivateSubnetId


      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName

          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint

          DB_PORT_PARAMETER:
            !Ref DBPort

          DB_USERNAME_PARAMETER:
            !Ref DBUsername

          DB_PASSWORD_PARAMETER:
            !Ref DBPassword

          EVENT_BUS_NAME:
            !Ref CloudMartEventBus


      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref OrderProcessorLambdaS3Key


      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-order-processor

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # SCHEMA INITIALIZER LAMBDA
  # ==========================================================

  SchemaInitializerLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-schema-initializer

      Runtime:
        python3.12

      Handler:
        lambda_function.lambda_handler

      Role:

        Fn::ImportValue:

          Fn::Sub:
            cloudmart-${Environment}-ProductLambdaRoleArn

      Timeout: 60

      MemorySize: 256


      Layers:

        - !Ref PyMySQLLayer


      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:

              Fn::Sub:
                cloudmart-${Environment}-LambdaSecurityGroupId


        SubnetIds:

          - Fn::ImportValue:

              Fn::Sub:
                cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:

              Fn::Sub:
                cloudmart-${Environment}-SecondaryPrivateSubnetId


      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName

          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint

          DB_PORT_PARAMETER:
            !Ref DBPort

          DB_USERNAME_PARAMETER:
            !Ref DBUsername

          DB_PASSWORD_PARAMETER:
            !Ref DBPassword


      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref SchemaS3Key


      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-schema-initializer

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ==========================================================
  # SCHEMA INITIALIZER CUSTOM RESOURCE
  # ==========================================================

  SchemaInitialization:

    Type: Custom::SchemaInitialization

    DependsOn:

      - SchemaInitializerLambda

    Properties:

      ServiceToken:
        !GetAtt SchemaInitializerLambda.Arn


  # ==========================================================
  # SNS - LOW STOCK ALERTS
  # ==========================================================

  LowStockTopic:

    Type: AWS::SNS::Topic

    Properties:

      TopicName:
        !Sub cloudmart-${Environment}-low-stock-alerts

      DisplayName:
        CloudMart Low Stock Alerts


  LowStockSubscription:

    Type: AWS::SNS::Subscription

    Properties:

      TopicArn:
        !Ref LowStockTopic

      Protocol:
        email

      Endpoint:
        !Ref AlertEmail


  # ==========================================================
  # SNS - ORDER NOTIFICATIONS
  # ==========================================================

  OrderConfirmationTopic:

    Type: AWS::SNS::Topic

    Properties:

      TopicName:
        !Sub cloudmart-${Environment}-order-notifications

      DisplayName:
        CloudMart Order Notifications


  OrderNotificationSubscription:

    Type: AWS::SNS::Subscription

    Properties:

      TopicArn:
        !Ref OrderConfirmationTopic

      Protocol:
        email

      Endpoint:
        !Ref AlertEmail


  # ==========================================================
  # EVENTBRIDGE → SNS ROLE
  # ==========================================================

  EventBridgeSNSRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-eventbridge-sns-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                events.amazonaws.com

            Action:
              sts:AssumeRole


      Policies:

        - PolicyName:
            PublishToCloudMartSNSTopics

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  sns:Publish

                Resource:

                  - !Ref LowStockTopic

                  - !Ref OrderConfirmationTopic


  # ==========================================================
  # LOW STOCK EVENT RULE
  # ==========================================================

  LowStockEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-low-stock-rule

      Description:
        CloudMart low stock notification rule

      State: ENABLED

      EventBusName:
        !Ref CloudMartEventBus


      EventPattern:

        source:

          - cloudmart.inventory

        detail-type:

          - LowStock


      Targets:

        - Id:
            LowStockSnsTarget

          Arn:
            !Ref LowStockTopic

          RoleArn:
            !GetAtt EventBridgeSNSRole.Arn


          InputTransformer:

            InputPathsMap:

              product_id:
                $.detail.product_id

              product_name:
                $.detail.product_name

              quantity:
                $.detail.quantity


            InputTemplate: |
              "CloudMart Low Stock Alert\n\nProduct ID: <product_id>\nProduct Name: <product_name>\nRemaining Quantity: <quantity>\n\nPlease restock this product."


  # ==========================================================
  # ORDER PLACED EVENT RULE
  # ==========================================================

  OrderPlacedEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-placed-rule

      Description:
        CloudMart order placed notification rule

      State: ENABLED

      EventBusName:
        !Ref CloudMartEventBus


      EventPattern:

        source:

          - cloudmart.orders

        detail-type:

          - OrderPlaced


      Targets:

        - Id:
            OrderPlacedSnsTarget

          Arn:
            !Ref OrderConfirmationTopic

          RoleArn:
            !GetAtt EventBridgeSNSRole.Arn


          InputTransformer:

            InputPathsMap:

              order_id:
                $.detail.order_id

              customer_id:
                $.detail.customer_id

              status:
                $.detail.status


            InputTemplate: |
              "CloudMart Order Placed\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nStatus: <status>\n\nYour order has been placed successfully."


  # ==========================================================
  # ORDER PENDING EVENT RULE
  # ==========================================================

  OrderPendingEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-pending-rule

      Description:
        CloudMart order pending notification rule

      State: ENABLED

      EventBusName:
        !Ref CloudMartEventBus


      EventPattern:

        source:

          - cloudmart.orders

        detail-type:

          - OrderPending


      Targets:

        - Id:
            OrderPendingSnsTarget

          Arn:
            !Ref OrderConfirmationTopic

          RoleArn:
            !GetAtt EventBridgeSNSRole.Arn


          InputTransformer:

            InputPathsMap:

              order_id:
                $.detail.order_id

              customer_id:
                $.detail.customer_id

              status:
                $.detail.status


            InputTemplate: |
              "CloudMart Order Pending\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nStatus: <status>\n\nYour order is pending processing."


  # ==========================================================
  # ORDER PROCESSING EVENT RULE
  # ==========================================================

  OrderProcessingEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-processing-rule

      Description:
        CloudMart order processing notification rule

      State: ENABLED

      EventBusName:
        !Ref CloudMartEventBus


      EventPattern:

        source:

          - cloudmart.orders

        detail-type:

          - OrderProcessing


      Targets:

        - Id:
            OrderProcessingSnsTarget

          Arn:
            !Ref OrderConfirmationTopic

          RoleArn:
            !GetAtt EventBridgeSNSRole.Arn


          InputTransformer:

            InputPathsMap:

              order_id:
                $.detail.order_id

              customer_id:
                $.detail.customer_id

              status:
                $.detail.status


            InputTemplate: |
              "CloudMart Order Processing\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nStatus: <status>\n\nYour order is currently being processed."


  # ==========================================================
  # ORDER CONFIRMED EVENT RULE
  # ==========================================================

  OrderConfirmedEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-confirmed-rule

      Description:
        CloudMart order confirmed notification rule

      State: ENABLED

      EventBusName:
        !Ref CloudMartEventBus


      EventPattern:

        source:

          - cloudmart.orders

        detail-type:

          - OrderConfirmed


      Targets:

        - Id:
            OrderConfirmedSnsTarget

          Arn:
            !Ref OrderConfirmationTopic

          RoleArn:
            !GetAtt EventBridgeSNSRole.Arn


          InputTransformer:

            InputPathsMap:

              order_id:
                $.detail.order_id

              customer_id:
                $.detail.customer_id

              status:
                $.detail.status


            InputTemplate: |
              "CloudMart Order Confirmed\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nStatus: <status>\n\nYour order has been successfully confirmed."


  # ==========================================================
  # ORDER DELIVERED EVENT RULE
  # ==========================================================

  OrderDeliveredEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-delivered-rule

      Description:
        CloudMart order delivered notification rule

      State: ENABLED

      EventBusName:
        !Ref CloudMartEventBus


      EventPattern:

        source:

          - cloudmart.orders

        detail-type:

          - OrderDelivered


      Targets:

        - Id:
            OrderDeliveredSnsTarget

          Arn:
            !Ref OrderConfirmationTopic

          RoleArn:
            !GetAtt EventBridgeSNSRole.Arn


          InputTransformer:

            InputPathsMap:

              order_id:
                $.detail.order_id

              customer_id:
                $.detail.customer_id

              status:
                $.detail.status


            InputTemplate: |
              "CloudMart Order Delivered\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nStatus: <status>\n\nYour order has been delivered successfully."


  # ==========================================================
  # ORDER FAILED EVENT RULE
  # ==========================================================

  OrderFailedEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-failed-rule

      Description:
        CloudMart order failed notification rule

      State: ENABLED

      EventBusName:
        !Ref CloudMartEventBus


      EventPattern:

        source:

          - cloudmart.orders

        detail-type:

          - OrderFailed


      Targets:

        - Id:
            OrderFailedSnsTarget

          Arn:
            !Ref OrderConfirmationTopic

          RoleArn:
            !GetAtt EventBridgeSNSRole.Arn


          InputTransformer:

            InputPathsMap:

              order_id:
                $.detail.order_id

              customer_id:
                $.detail.customer_id

              error:
                $.detail.error


            InputTemplate: |
              "CloudMart Order Failed\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nError: <error>\n\nThe order could not be completed and inventory was not deducted."


  # ==========================================================
  # ORDER CANCELLED EVENT RULE
  # ==========================================================

  OrderCancelledEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-cancelled-rule

      Description:
        CloudMart order cancelled notification rule

      State: ENABLED

      EventBusName:
        !Ref CloudMartEventBus


      EventPattern:

        source:

          - cloudmart.orders

        detail-type:

          - OrderCancelled


      Targets:

        - Id:
            OrderCancelledSnsTarget

          Arn:
            !Ref OrderConfirmationTopic

          RoleArn:
            !GetAtt EventBridgeSNSRole.Arn


          InputTransformer:

            InputPathsMap:

              order_id:
                $.detail.order_id

              customer_id:
                $.detail.customer_id

              status:
                $.detail.status

              note:
                $.detail.note


            InputTemplate: |
              "CloudMart Order Cancelled\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nStatus: <status>\nNote: <note>\n\nThe order was cancelled."


  # ==========================================================
  # ORDER UPDATED EVENT RULE
  # ==========================================================

  OrderUpdatedEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-updated-rule

      Description:
        CloudMart order updated notification rule

      State: ENABLED

      EventBusName:
        !Ref CloudMartEventBus


      EventPattern:

        source:

          - cloudmart.orders

        detail-type:

          - OrderUpdated


      Targets:

        - Id:
            OrderUpdatedSnsTarget

          Arn:
            !Ref OrderConfirmationTopic

          RoleArn:
            !GetAtt EventBridgeSNSRole.Arn


          InputTransformer:

            InputPathsMap:

              order_id:
                $.detail.order_id

              customer_id:
                $.detail.customer_id

              status:
                $.detail.status

              note:
                $.detail.note


            InputTemplate: |
              "CloudMart Order Updated\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nStatus: <status>\nUpdate: <note>\n\nYour order has been updated successfully."


# ============================================================
# OUTPUTS
# ============================================================

Outputs:


  # ==========================================================
  # LAMBDA AUTHORIZER
  # ==========================================================

  LambdaAuthorizerArn:

    Description:
      Lambda Authorizer ARN

    Value:
      !GetAtt LambdaAuthorizer.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-LambdaAuthorizerArn


  LambdaAuthorizerName:

    Description:
      Lambda Authorizer name

    Value:
      !Ref LambdaAuthorizer

    Export:

      Name:
        !Sub cloudmart-${Environment}-LambdaAuthorizerName


  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambdaArn:

    Description:
      Product Lambda ARN

    Value:
      !GetAtt ProductLambda.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-ProductLambdaArn


  ProductLambdaName:

    Description:
      Product Lambda name

    Value:
      !Ref ProductLambda

    Export:

      Name:
        !Sub cloudmart-${Environment}-ProductLambdaName


  # ==========================================================
  # ORDER LAMBDA
  # ==========================================================

  OrderLambdaArn:

    Description:
      Order Lambda ARN

    Value:
      !GetAtt OrderLambda.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderLambdaArn


  OrderLambdaName:

    Description:
      Order Lambda name

    Value:
      !Ref OrderLambda

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderLambdaName


  # ==========================================================
  # ORDER PROCESSOR
  # ==========================================================

  OrderProcessorLambdaArn:

    Description:
      Order Processor Lambda ARN

    Value:
      !GetAtt OrderProcessorLambda.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderProcessorLambdaArn


  OrderProcessorLambdaName:

    Description:
      Order Processor Lambda name

    Value:
      !Ref OrderProcessorLambda

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderProcessorLambdaName


  # ==========================================================
  # SCHEMA INITIALIZER
  # ==========================================================

  SchemaInitializerLambdaArn:

    Description:
      Schema Initializer Lambda ARN

    Value:
      !GetAtt SchemaInitializerLambda.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-SchemaInitializerLambdaArn


  SchemaInitializerLambdaName:

    Description:
      Schema Initializer Lambda name

    Value:
      !Ref SchemaInitializerLambda

    Export:

      Name:
        !Sub cloudmart-${Environment}-SchemaInitializerLambdaName


  # ==========================================================
  # PYMYSQL LAYER
  # ==========================================================

  PyMySQLLayerArn:

    Description:
      PyMySQL Layer ARN

    Value:
      !Ref PyMySQLLayer

    Export:

      Name:
        !Sub cloudmart-${Environment}-PyMySQLLayerArn


  # ==========================================================
  # EVENT BUS
  # ==========================================================

  EventBusName:

    Description:
      CloudMart EventBridge Event Bus name

    Value:
      !Ref CloudMartEventBus

    Export:

      Name:
        !Sub cloudmart-${Environment}-EventBusName


  EventBusArn:

    Description:
      CloudMart EventBridge Event Bus ARN

    Value:
      !GetAtt CloudMartEventBus.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-EventBusArn


  # ==========================================================
  # LOW STOCK SNS
  # ==========================================================

  LowStockTopicArn:

    Description:
      Low stock SNS topic ARN

    Value:
      !Ref LowStockTopic

    Export:

      Name:
        !Sub cloudmart-${Environment}-LowStockTopicArn


  LowStockTopicName:

    Description:
      Low stock SNS topic name

    Value:
      !GetAtt LowStockTopic.TopicName

    Export:

      Name:
        !Sub cloudmart-${Environment}-LowStockTopicName


  # ==========================================================
  # ORDER NOTIFICATION SNS
  # ==========================================================

  OrderConfirmationTopicArn:

    Description:
      Order notification SNS topic ARN

    Value:
      !Ref OrderConfirmationTopic

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderConfirmationTopicArn


  OrderConfirmationTopicName:

    Description:
      Order notification SNS topic name

    Value:
      !GetAtt OrderConfirmationTopic.TopicName

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderConfirmationTopicName


  # ==========================================================
  # EVENT RULES
  # ==========================================================

  LowStockEventRuleArn:

    Description:
      Low stock EventBridge rule ARN

    Value:
      !GetAtt LowStockEventRule.Arn


  OrderPlacedEventRuleArn:

    Description:
      Order placed EventBridge rule ARN

    Value:
      !GetAtt OrderPlacedEventRule.Arn


  OrderPendingEventRuleArn:

    Description:
      Order pending EventBridge rule ARN

    Value:
      !GetAtt OrderPendingEventRule.Arn


  OrderProcessingEventRuleArn:

    Description:
      Order processing EventBridge rule ARN

    Value:
      !GetAtt OrderProcessingEventRule.Arn


  OrderConfirmedEventRuleArn:

    Description:
      Order confirmed EventBridge rule ARN

    Value:
      !GetAtt OrderConfirmedEventRule.Arn


  OrderDeliveredEventRuleArn:

    Description:
      Order delivered EventBridge rule ARN

    Value:
      !GetAtt OrderDeliveredEventRule.Arn


  OrderFailedEventRuleArn:

    Description:
      Order failed EventBridge rule ARN

    Value:
      !GetAtt OrderFailedEventRule.Arn


  OrderCancelledEventRuleArn:

    Description:
      Order cancelled EventBridge rule ARN

    Value:
      !GetAtt OrderCancelledEventRule.Arn


  OrderUpdatedEventRuleArn:

