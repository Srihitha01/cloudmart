# ============================================================
# OUTPUTS
# ============================================================

Outputs:


  # ==========================================================
  # EVENTBRIDGE
  # ==========================================================

  EventBusName:

    Description: CloudMart EventBridge Event Bus name

    Value: !Ref CloudMartEventBus

    Export:
      Name: !Sub cloudmart-${Environment}-EventBusName


  EventBusArn:

    Description: CloudMart EventBridge Event Bus ARN

    Value: !GetAtt CloudMartEventBus.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-EventBusArn


  # ==========================================================
  # LAMBDA AUTHORIZER
  # ==========================================================

  LambdaAuthorizerArn:

    Description: Lambda Authorizer ARN

    Value: !GetAtt LambdaAuthorizer.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-LambdaAuthorizerArn


  LambdaAuthorizerName:

    Description: Lambda Authorizer name

    Value: !Ref LambdaAuthorizer

    Export:
      Name: !Sub cloudmart-${Environment}-LambdaAuthorizerName


  # ==========================================================
  # CUSTOMER LAMBDA
  # ==========================================================

  CustomerLambdaArn:

    Description: Customer Lambda ARN

    Value: !GetAtt CustomerLambda.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-CustomerLambdaArn


  CustomerLambdaName:

    Description: Customer Lambda name

    Value: !Ref CustomerLambda

    Export:
      Name: !Sub cloudmart-${Environment}-CustomerLambdaName


  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambdaArn:

    Description: Product Lambda ARN

    Value: !GetAtt ProductLambda.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-ProductLambdaArn


  ProductLambdaName:

    Description: Product Lambda name

    Value: !Ref ProductLambda

    Export:
      Name: !Sub cloudmart-${Environment}-ProductLambdaName


  # ==========================================================
  # ORDER LAMBDA
  # ==========================================================

  OrderLambdaArn:

    Description: Order Lambda ARN

    Value: !GetAtt OrderLambda.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-OrderLambdaArn


  OrderLambdaName:

    Description: Order Lambda name

    Value: !Ref OrderLambda

    Export:
      Name: !Sub cloudmart-${Environment}-OrderLambdaName


  # ==========================================================
  # ORDER PROCESSOR
  # ==========================================================

  OrderProcessorLambdaArn:

    Description: Order Processor Lambda ARN

    Value: !GetAtt OrderProcessorLambda.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-OrderProcessorLambdaArn


  OrderProcessorLambdaName:

    Description: Order Processor Lambda name

    Value: !Ref OrderProcessorLambda

    Export:
      Name: !Sub cloudmart-${Environment}-OrderProcessorLambdaName


  # ==========================================================
  # DAILY REPORT LAMBDA
  # ==========================================================

  DailyReportLambdaArn:

    Description: Daily Report Lambda ARN

    Value: !GetAtt DailyReportLambda.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-DailyReportLambdaArn


  DailyReportLambdaName:

    Description: Daily Report Lambda name

    Value: !Ref DailyReportLambda

    Export:
      Name: !Sub cloudmart-${Environment}-DailyReportLambdaName


  DailyReportScheduleArn:

    Description: Daily Report EventBridge schedule ARN

    Value: !GetAtt DailyReportSchedule.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-DailyReportScheduleArn


  # ==========================================================
  # SCHEMA INITIALIZER
  # ==========================================================

  SchemaInitializerLambdaArn:

    Description: Schema Initializer Lambda ARN

    Value: !GetAtt SchemaInitializerLambda.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-SchemaInitializerLambdaArn


  SchemaInitializerLambdaName:

    Description: Schema Initializer Lambda name

    Value: !Ref SchemaInitializerLambda

    Export:
      Name: !Sub cloudmart-${Environment}-SchemaInitializerLambdaName


  # ==========================================================
  # PYMYSQL LAYER
  # ==========================================================

  PyMySQLLayerArn:

    Description: PyMySQL Lambda Layer ARN

    Value: !Ref PyMySQLLayer

    Export:
      Name: !Sub cloudmart-${Environment}-PyMySQLLayerArn


  # ==========================================================
  # SNS TOPICS
  # ==========================================================

  ProductAlertTopicArn:

    Description: Product Alert SNS Topic ARN

    Value: !Ref ProductAlertTopic

    Export:
      Name: !Sub cloudmart-${Environment}-ProductAlertTopicArn


  ProductNotificationTopicArn:

    Description: Product Notification SNS Topic ARN

    Value: !Ref ProductNotificationTopic

    Export:
      Name: !Sub cloudmart-${Environment}-ProductNotificationTopicArn


  OrderAlertTopicArn:

    Description: Order Alert SNS Topic ARN

    Value: !Ref OrderAlertTopic

    Export:
      Name: !Sub cloudmart-${Environment}-OrderAlertTopicArn


  OrderNotificationTopicArn:

    Description: Customer Order Notification SNS Topic ARN

    Value: !Ref OrderNotificationTopic

    Export:
      Name: !Sub cloudmart-${Environment}-OrderNotificationTopicArn


  # ==========================================================
  # EVENT RULES
  # ==========================================================

  LowStockEventRuleArn:

    Description: Low Stock EventBridge Rule ARN

    Value: !GetAtt LowStockEventRule.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-LowStockEventRuleArn


  OrderPendingEventsToSNSRuleArn:

    Description: Pending Order Events SNS EventBridge Rule ARN

    Value: !GetAtt OrderPendingEventsToSNSRule.Arn

