AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Application Events Stack.
  Creates Lambda Authorizer, PyMySQL Layer,
  Product Lambda, Order Lambda, Order Processor Lambda,
  Schema Initializer Lambda, custom EventBridge Event Bus,
  product low-stock alerts, order lifecycle alerts,
  and SNS email notifications.


# ============================================================
# PARAMETERS
# ============================================================

Parameters:


  # ==========================================================
  # ENVIRONMENT
  # ==========================================================

  Environment:

    Type: String

    AllowedValues:
      - dev
      - prod

    Description: CloudMart deployment environment supplied by CI/CD


  # ==========================================================
  # DATABASE SSM PARAMETER PATHS
  #
  # Lambda receives the PARAMETER PATHS.
  # Actual values are retrieved from SSM at runtime.
  # ==========================================================

  DBName:

    Type: String

    Description: SSM parameter path for database name


  DBEndpoint:

    Type: String

    Description: SSM parameter path for RDS endpoint


  DBPort:

    Type: String

    Description: SSM parameter path for RDS port


  DBUsername:

    Type: String

    Description: SSM parameter path for database username


  DBPassword:

    Type: String

    Description: SSM parameter path for database password


  # ==========================================================
  # AUTHENTICATION SSM PARAMETER PATHS
  # ==========================================================

  AuthTokenParameter:

    Type: String

    Description: SSM parameter path for administrator token


  CustomerTokensParameter:

    Type: String

    Description: SSM parameter path for customer tokens


  # ==========================================================
  # LAMBDA ARTIFACTS
  #
  # Bucket name is dynamically obtained by deploy.yaml
  # from the Data Stack.
  # ==========================================================

  LambdaArtifactBucket:

    Type: String

    Description: S3 bucket containing Lambda deployment artifacts


  AuthorizerLambdaS3Key:

    Type: String

    Description: S3 key for Lambda Authorizer package


  PyMySQLLayerS3Key:

    Type: String

    Description: S3 key for PyMySQL Lambda Layer


  ProductLambdaS3Key:

    Type: String

    Description: S3 key for Product Lambda package


  OrderLambdaS3Key:

    Type: String

    Description: S3 key for Order Lambda package


  OrderProcessorLambdaS3Key:

    Type: String

    Description: S3 key for Order Processor Lambda package


  SchemaS3Key:

    Type: String

    Description: S3 key for database schema file


  # ==========================================================
  # SNS ALERT EMAIL
  # ==========================================================

  AlertEmail:

    Type: String

    Description: Email address for CloudMart alerts


# ============================================================
# RESOURCES
# ============================================================

Resources:


  # ==========================================================
  # CUSTOM EVENTBRIDGE EVENT BUS
  #
  # Used for decoupled communication between CloudMart services.
  # ==========================================================

  CloudMartEventBus:

    Type: AWS::Events::EventBus

    Properties:

      Name:
        !Sub cloudmart-${Environment}-event-bus

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-event-bus

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # PYMYSQL LAMBDA LAYER
  #
  # Shared database dependency for Lambdas that connect to RDS.
  # ==========================================================

  PyMySQLLayer:

    Type: AWS::Lambda::LayerVersion

    Properties:

      LayerName:
        !Sub cloudmart-${Environment}-pymysql

      Description: >
        Shared PyMySQL dependency layer for CloudMart Lambda functions

      CompatibleRuntimes:
        - python3.12

      CompatibleArchitectures:
        - x86_64

      Content:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref PyMySQLLayerS3Key


  # ==========================================================
  # LAMBDA AUTHORIZER
  #
  # The authorizer validates customer bearer tokens against RDS,
  # so it is attached to the private VPC and uses the shared PyMySQL layer.
  # ==========================================================

  LambdaAuthorizer:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-lambda-authorizer

      Description: >
        CloudMart Lambda Authorizer for API authentication
        and authorization

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:

        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-LambdaAuthorizerRoleArn

      Timeout: 30

      MemorySize: 256

      Architectures:
        - x86_64

      Layers:
        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          ADMIN_TOKEN_PARAMETER:
            !Ref AuthTokenParameter

          DB_NAME_PARAMETER:
            !Ref DBName

          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint

          DB_PORT_PARAMETER:
            !Ref DBPort

          DB_USERNAME_PARAMETER:
            !Ref DBUsername

          DB_PASSWORD_PARAMETER:
            !Ref DBPassword

      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref AuthorizerLambdaS3Key

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-lambda-authorizer

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # PRODUCT LAMBDA
  #
  # Handles:
  # - Create Product
  # - Get Products
  # - Update Product
  # - Soft Delete Product
  # - Inventory Updates
  # - Low Stock Events
  #
  # Attached to VPC because it connects to private RDS.
  # ==========================================================

  ProductLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-product-lambda

      Description: >
        CloudMart Product API Lambda

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:

        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-ProductLambdaRoleArn

      Timeout: 30

      MemorySize: 256

      Architectures:
        - x86_64

      Layers:
        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName

          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint

          DB_PORT_PARAMETER:
            !Ref DBPort

          DB_USERNAME_PARAMETER:
            !Ref DBUsername

          DB_PASSWORD_PARAMETER:
            !Ref DBPassword

          EVENT_BUS_NAME:
            !Ref CloudMartEventBus

      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref ProductLambdaS3Key

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-product-lambda

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # ORDER LAMBDA
  #
  # Handles:
  # - Create Order
  # - Get Orders
  # - Partial Order Update using PATCH
  # - Cancel Order
  # - Soft Delete
  # - Publish Order Events
  #
  # Attached to VPC because it connects to private RDS.
  # ==========================================================

  OrderLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-order-lambda

      Description: >
        CloudMart Order API Lambda

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:

        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-OrderLambdaRoleArn

      Timeout: 30

      MemorySize: 256

      Architectures:
        - x86_64

      Layers:
        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName

          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint

          DB_PORT_PARAMETER:
            !Ref DBPort

          DB_USERNAME_PARAMETER:
            !Ref DBUsername

          DB_PASSWORD_PARAMETER:
            !Ref DBPassword

          EVENT_BUS_NAME:
            !Ref CloudMartEventBus

      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref OrderLambdaS3Key

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-order-lambda

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # ORDER PROCESSOR LAMBDA
  #
  # Invoked asynchronously by EventBridge
  # when an OrderUpdated event occurs.
  #
  # Attached to VPC because it connects to private RDS.
  # ==========================================================

  OrderProcessorLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-order-processor

      Description: >
        CloudMart asynchronous Order Processor Lambda

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:

        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-OrderProcessorLambdaRoleArn

      Timeout: 30

      MemorySize: 256

      Architectures:
        - x86_64

      Layers:
        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName

          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint

          DB_PORT_PARAMETER:
            !Ref DBPort

          DB_USERNAME_PARAMETER:
            !Ref DBUsername

          DB_PASSWORD_PARAMETER:
            !Ref DBPassword

          EVENT_BUS_NAME:
            !Ref CloudMartEventBus

      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref OrderProcessorLambdaS3Key

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-order-processor

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # SCHEMA INITIALIZER LAMBDA
  #
  # Connects privately to RDS.
  # Reads schema.sql from artifact bucket.
  #
  # Uses SchemaInitializer IAM role.
  # ==========================================================

  SchemaInitializerLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-schema-initializer

      Description: >
        CloudMart database schema initializer Lambda

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:

        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-SchemaInitializerLambdaRoleArn

      Timeout: 60

      MemorySize: 256

      Architectures:
        - x86_64

      Layers:
        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName

          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint

          DB_PORT_PARAMETER:
            !Ref DBPort

          DB_USERNAME_PARAMETER:
            !Ref DBUsername

          DB_PASSWORD_PARAMETER:
            !Ref DBPassword

          SCHEMA_BUCKET:
            !Ref LambdaArtifactBucket

          SCHEMA_KEY:
            !Ref SchemaS3Key

      Code:

        ZipFile: |
          def lambda_handler(event, context):
              print("Schema Initializer Lambda deployed successfully")

              return {
                  "statusCode": 200,
                  "body": "Schema initializer Lambda is available"
              }

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-schema-initializer

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # ORDER UPDATED EVENT RULE
  #
  # Flow:
  #
  # Order Lambda
  #      |
  #      | OrderUpdated event
  #      v
  # EventBridge
  #      |
  #      v
  # Order Processor Lambda
  # ==========================================================

  OrderUpdatedEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-updated-rule

      Description: >
        Sends OrderUpdated events to the Order Processor Lambda

      EventBusName:
        !Ref CloudMartEventBus

      State: ENABLED

      EventPattern:

        source:
          - cloudmart.orders

        detail-type:
          - OrderUpdated

      Targets:

        - Arn:
            !GetAtt OrderProcessorLambda.Arn

          Id: OrderProcessorTarget


  # ==========================================================
  # EVENTBRIDGE PERMISSION
  #
  # Allows ONLY this EventBridge rule
  # to invoke the Order Processor Lambda.
  # ==========================================================

  EventBridgeInvokeOrderProcessorPermission:

    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref OrderProcessorLambda

      Action:
        lambda:InvokeFunction

      Principal:
        events.amazonaws.com

      SourceArn:
        !GetAtt OrderUpdatedEventRule.Arn


  # ==========================================================
  # PRODUCT ALERT SNS TOPIC
  #
  # Used for low-stock notifications.
  # ==========================================================

  ProductAlertTopic:

    Type: AWS::SNS::Topic

    Properties:

      TopicName:
        !Sub cloudmart-${Environment}-product-alerts

      DisplayName:
        CloudMart Product Alerts

      Subscription:

        - Endpoint:
            !Ref AlertEmail

          Protocol: email

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-product-alerts

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # ORDER ALERT SNS TOPIC
  #
  # Used for order lifecycle notifications.
  # ==========================================================

  OrderAlertTopic:

    Type: AWS::SNS::Topic

    Properties:

      TopicName:
        !Sub cloudmart-${Environment}-order-alerts

      DisplayName:
        CloudMart Order Alerts

      Subscription:

        - Endpoint:
            !Ref AlertEmail

          Protocol: email

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-order-alerts

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # EVENTBRIDGE ROLE FOR PRODUCT SNS
  #
  # Allows EventBridge to publish ONLY
  # to the Product Alert topic.
  # ==========================================================

  EventBridgeProductSNSRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-eventbridge-product-sns-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - events.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: PublishProductAlerts

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - sns:Publish

                Resource:
                  - !Ref ProductAlertTopic


  # ==========================================================
  # EVENTBRIDGE ROLE FOR ORDER SNS
  #
  # Allows EventBridge to publish ONLY
  # to the Order Alert topic.
  # ==========================================================

  EventBridgeOrderSNSRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-eventbridge-order-sns-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - events.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: PublishOrderAlerts

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - sns:Publish

                Resource:
                  - !Ref OrderAlertTopic


  # ==========================================================
  # LOW STOCK EVENT RULE
  #
  # Matches:
  #
  # source       = cloudmart.product
  # detail-type  = Inventory Changed
  # low_stock    = true
  #
  # Then publishes to Product SNS topic.
  # ==========================================================

  LowStockEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-low-stock-rule

      Description: >
        Sends low-stock inventory events to Product SNS alerts

      EventBusName:
        !Ref CloudMartEventBus

      State: ENABLED

      EventPattern:

        source:
          - cloudmart.product

        detail-type:
          - Inventory Changed

        detail:

          low_stock:
            - true

      Targets:

        - Arn:
            !Ref ProductAlertTopic

          Id: ProductLowStockSNSTarget

          RoleArn:
            !GetAtt EventBridgeProductSNSRole.Arn


  # ==========================================================
  # ORDER EVENTS TO SNS RULE
  #
  # Matches order lifecycle events and sends them
  # to the Order SNS topic.
  # ==========================================================

  OrderEventsToSNSRule:

    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-alert-rule

      Description: >
        Sends CloudMart order lifecycle events to Order SNS alerts

      EventBusName:
        !Ref CloudMartEventBus

      State: ENABLED

      EventPattern:

        source:
          - cloudmart.orders

        detail-type:
          - OrderCreated
          - OrderUpdated
          - OrderCancelled
          - OrderDelivered

      Targets:

        - Arn:
            !Ref OrderAlertTopic

          Id: OrderSNSTarget

          RoleArn:
            !GetAtt EventBridgeOrderSNSRole.Arn


# ============================================================
# OUTPUTS
# ============================================================

Outputs:


  # ==========================================================
  # EVENTBRIDGE
  # ==========================================================

  EventBusName:

    Description: CloudMart EventBridge Event Bus name

    Value:
      !Ref CloudMartEventBus

    Export:

      Name:
        !Sub cloudmart-${Environment}-EventBusName


  EventBusArn:

    Description: CloudMart EventBridge Event Bus ARN

    Value:
      !GetAtt CloudMartEventBus.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-EventBusArn


  # ==========================================================
  # LAMBDA AUTHORIZER
  # ==========================================================

  LambdaAuthorizerArn:

    Description: Lambda Authorizer ARN

    Value:
      !GetAtt LambdaAuthorizer.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-LambdaAuthorizerArn


  LambdaAuthorizerName:

    Description: Lambda Authorizer name

    Value:
      !Ref LambdaAuthorizer

    Export:

      Name:
        !Sub cloudmart-${Environment}-LambdaAuthorizerName


  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambdaArn:

    Description: Product Lambda ARN

    Value:
      !GetAtt ProductLambda.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-ProductLambdaArn


  ProductLambdaName:

    Description: Product Lambda name

    Value:
      !Ref ProductLambda

    Export:

      Name:
        !Sub cloudmart-${Environment}-ProductLambdaName


  # ==========================================================
  # ORDER LAMBDA
  # ==========================================================

  OrderLambdaArn:

    Description: Order Lambda ARN

    Value:
      !GetAtt OrderLambda.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderLambdaArn


  OrderLambdaName:

    Description: Order Lambda name

    Value:
      !Ref OrderLambda

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderLambdaName


  # ==========================================================
  # ORDER PROCESSOR LAMBDA
  # ==========================================================

  OrderProcessorLambdaArn:

    Description: Order Processor Lambda ARN

    Value:
      !GetAtt OrderProcessorLambda.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderProcessorLambdaArn


  OrderProcessorLambdaName:

    Description: Order Processor Lambda name

    Value:
      !Ref OrderProcessorLambda

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderProcessorLambdaName


  # ==========================================================
  # SCHEMA INITIALIZER
  # ==========================================================

  SchemaInitializerLambdaArn:

    Description: Schema Initializer Lambda ARN

    Value:
      !GetAtt SchemaInitializerLambda.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-SchemaInitializerLambdaArn


  SchemaInitializerLambdaName:

    Description: Schema Initializer Lambda name

    Value:
      !Ref SchemaInitializerLambda

    Export:

      Name:
        !Sub cloudmart-${Environment}-SchemaInitializerLambdaName


  # ==========================================================
  # PYMYSQL LAYER
  # ==========================================================

  PyMySQLLayerArn:

    Description: PyMySQL Lambda Layer ARN

    Value:
      !Ref PyMySQLLayer

    Export:

      Name:
        !Sub cloudmart-${Environment}-PyMySQLLayerArn


  # ==========================================================
  # SNS TOPICS
  # ==========================================================

  ProductAlertTopicArn:

    Description: Product Alert SNS Topic ARN

    Value:
      !Ref ProductAlertTopic

    Export:

      Name:
        !Sub cloudmart-${Environment}-ProductAlertTopicArn


  OrderAlertTopicArn:

    Description: Order Alert SNS Topic ARN

    Value:
      !Ref OrderAlertTopic

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderAlertTopicArn


  # ==========================================================
  # EVENT RULES
  # ==========================================================

  OrderUpdatedEventRuleArn:

    Description: Order Updated EventBridge Rule ARN

    Value:
      !GetAtt OrderUpdatedEventRule.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderUpdatedEventRuleArn


  LowStockEventRuleArn:

    Description: Low Stock EventBridge Rule ARN

    Value:
      !GetAtt LowStockEventRule.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-LowStockEventRuleArn


  OrderEventsToSNSRuleArn:

    Description: Order Events SNS EventBridge Rule ARN

    Value:
      !GetAtt OrderEventsToSNSRule.Arn

    Export:

      Name:
        !Sub cloudmart-${Environment}-OrderEventsToSNSRuleArn