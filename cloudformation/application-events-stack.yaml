AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Application-Events Stack.
  Creates the Lambda Authorizer and Product Lambda.
  Additional application-event resources will be added incrementally.

Parameters:

  # ==========================================================
  # ENVIRONMENT
  # ==========================================================

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment


  # ==========================================================
  # DATABASE SSM PARAMETERS
  # ==========================================================

  DBName:
    Type: String
    Default: /cloudmart/dev/db/name
    Description: SSM parameter containing database name

  DBEndpoint:
    Type: String
    Default: /cloudmart/dev/db/endpoint
    Description: SSM parameter containing RDS endpoint

  DBPort:
    Type: String
    Default: /cloudmart/dev/db/port
    Description: SSM parameter containing RDS port

  DBUsername:
    Type: String
    Default: /cloudmart/dev/db/username
    Description: SSM parameter containing database username

  DBPassword:
    Type: String
    Default: /cloudmart/dev/db/password
    Description: SSM parameter containing database password


  # ==========================================================
  # AUTHENTICATION
  # ==========================================================

  AuthTokenParameter:
    Type: String
    Default: /cloudmart/dev/auth/token
    Description: SSM SecureString containing API authentication token


Resources:

  # ==========================================================
  # LAMBDA AUTHORISER
  # ==========================================================

  LambdaAuthorizer:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-lambda-authorizer

      Runtime: python3.12

      Handler: index.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-LambdaAuthorizerRoleArn

      Timeout: 10

      MemorySize: 128

      Environment:
        Variables:
          TOKEN_PARAMETER: !Ref AuthTokenParameter

      Code:
        ZipFile: |
          import json
          import os
          import boto3

          ssm = boto3.client("ssm")

          TOKEN_PARAMETER = os.environ["TOKEN_PARAMETER"]


          def lambda_handler(event, context):

              headers = event.get("headers") or {}

              authorization = (
                  headers.get("Authorization")
                  or headers.get("authorization")
              )

              # ------------------------------------------------
              # Missing token
              # ------------------------------------------------

              if not authorization:
                  return {
                      "isAuthorized": False,
                      "context": {
                          "reason": "missing_token"
                      }
                  }

              # ------------------------------------------------
              # Invalid authorization format
              # ------------------------------------------------

              if not authorization.startswith("Bearer "):
                  return {
                      "isAuthorized": False,
                      "context": {
                          "reason": "invalid_authorization_format"
                      }
                  }

              supplied_token = authorization[len("Bearer "):].strip()

              # ------------------------------------------------
              # Read token from SSM
              # ------------------------------------------------

              try:
                  response = ssm.get_parameter(
                      Name=TOKEN_PARAMETER,
                      WithDecryption=True
                  )

                  expected_token = response["Parameter"]["Value"]

              except Exception as exc:

                  print(json.dumps({
                      "level": "ERROR",
                      "message": "Unable to retrieve authorization token",
                      "error": str(exc)
                  }))

                  return {
                      "isAuthorized": False,
                      "context": {
                          "reason": "authorization_configuration_error"
                      }
                  }

              # ------------------------------------------------
              # Validate token
              # ------------------------------------------------

              if supplied_token != expected_token:
                  return {
                      "isAuthorized": False,
                      "context": {
                          "reason": "invalid_token"
                      }
                  }

              # ------------------------------------------------
              # Authorized
              # ------------------------------------------------

              return {
                  "isAuthorized": True,
                  "context": {
                      "authenticated": "true"
                  }
              }

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-lambda-authorizer


  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-product-lambda

      Runtime: python3.12

      Handler: index.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-ProductLambdaRoleArn

      Timeout: 30

      MemorySize: 256

      # ------------------------------------------------------
      # VPC CONFIGURATION
      # ------------------------------------------------------

      VpcConfig:

        SubnetIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

        SecurityGroupIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

      # ------------------------------------------------------
      # SSM PARAMETER NAMES
      # ------------------------------------------------------

      Environment:

        Variables:

          DB_NAME_PARAMETER: !Ref DBName

          DB_ENDPOINT_PARAMETER: !Ref DBEndpoint

          DB_PORT_PARAMETER: !Ref DBPort

          DB_USERNAME_PARAMETER: !Ref DBUsername

          DB_PASSWORD_PARAMETER: !Ref DBPassword

      # ------------------------------------------------------
      # BOOTSTRAP CODE
      # ------------------------------------------------------
      #
      # This is intentionally a minimal bootstrap.
      # GitHub Actions will later update the Lambda code
      # with the packaged Python application and PyMySQL.
      #

      Code:
        ZipFile: |
          import json

          def lambda_handler(event, context):

              return {
                  "statusCode": 200,
                  "headers": {
                      "Content-Type": "application/json"
                  },
                  "body": json.dumps({
                      "message": "Product Lambda bootstrap is running"
                  })
              }

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-product-lambda


# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  # ----------------------------------------------------------
  # Lambda Authorizer ARN
  # ----------------------------------------------------------

  LambdaAuthorizerArn:
    Description: Lambda Authorizer ARN
    Value: !GetAtt LambdaAuthorizer.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-LambdaAuthorizerArn


  # ----------------------------------------------------------
  # Lambda Authorizer Name
  # ----------------------------------------------------------

  LambdaAuthorizerName:
    Description: Lambda Authorizer function name
    Value: !Ref LambdaAuthorizer

    Export:
      Name: !Sub cloudmart-${Environment}-LambdaAuthorizerName


  # ----------------------------------------------------------
  # Product Lambda ARN
  # ----------------------------------------------------------

  ProductLambdaArn:
    Description: Product Lambda ARN
    Value: !GetAtt ProductLambda.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-ProductLambdaArn


  # ----------------------------------------------------------
  # Product Lambda Name
  # ----------------------------------------------------------

  ProductLambdaName:
    Description: Product Lambda function name
    Value: !Ref ProductLambda

    Export:
      Name: !Sub cloudmart-${Environment}-ProductLambdaName