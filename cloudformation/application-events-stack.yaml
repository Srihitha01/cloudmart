AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Application-Events Stack.
  Creates Lambda Authorizer, PyMySQL layer, Product Lambda,
  Order Lambda, Order Processor Lambda, Schema Initializer Lambda,
  Daily Report Lambda, EventBridge event bus and rules,
  and SNS notifications.
  No SQS is used in this architecture.


# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  # ==========================================================
  # ENVIRONMENT
  # ==========================================================

  Environment:
    Type: String

    AllowedValues:
    - dev
    - prod

    Description: Deployment environment supplied by the deployment pipeline


  # ==========================================================
  # DATABASE SSM PARAMETERS
  # ==========================================================

  DBName:
    Type: String

    Description: SSM parameter name containing the database name


  DBEndpoint:
    Type: String

    Description: SSM parameter name containing the RDS endpoint


  DBPort:
    Type: String

    Description: SSM parameter name containing the database port


  DBUsername:
    Type: String

    Description: SSM parameter name containing the database username


  DBPassword:
    Type: String

    Description: SSM parameter name containing the database password


  # ==========================================================
  # AUTHENTICATION
  # ==========================================================

  AuthTokenParameter:
    Type: String

    Description: SSM parameter name containing the authentication token


  CustomerTokensParameter:
    Type: String

    Description: SSM parameter name containing customer token mappings


  # ==========================================================
  # LAMBDA ARTIFACTS
  # ==========================================================

  LambdaArtifactBucket:
    Type: String

    Description: S3 bucket containing CloudMart Lambda artifacts


  PyMySQLLayerS3Key:
    Type: String

    Description: S3 key for the PyMySQL Lambda layer

  AuthorizerLambdaS3Key:
    Type: String

    Description: S3 key for the Lambda Authorizer artifact


  ProductLambdaS3Key:
    Type: String

    Description: S3 key for the Product Lambda artifact


  CustomerLambdaS3Key:
    Type: String

    Description: S3 key for the Customer Lambda artifact


  OrderLambdaS3Key:
    Type: String

    Description: S3 key for the Order Lambda artifact


  OrderProcessorLambdaS3Key:
    Type: String

    Description: S3 key for the Order Processor Lambda artifact


  DailyReportLambdaS3Key:
    Type: String

    Description: S3 key for the Daily Report Lambda artifact


  SchemaS3Key:
    Type: String

    Description: S3 key for the database schema SQL file


  # ==========================================================
  # ALERT EMAIL
  # ==========================================================

  AlertEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: Must be a valid email address.
    Description: Operations email address that receives CloudMart SNS alerts.


# ============================================================
# RESOURCES
# ============================================================

Resources:


  # ==========================================================
  # CUSTOM EVENTBRIDGE EVENT BUS
  # ==========================================================

  CloudMartEventBus:

    Type: AWS::Events::EventBus

    Properties:

      Name: !Sub cloudmart-${Environment}-event-bus

      Tags:

      - Key: Name
        Value: !Sub cloudmart-${Environment}-event-bus

      - Key: Project
        Value: CloudMart

      - Key: Environment
        Value: !Ref Environment


  # ==========================================================
  # PYMYSQL LAYER
  # ==========================================================

  PyMySQLLayer:

    Type: AWS::Lambda::LayerVersion

    Properties:

      LayerName: !Sub cloudmart-${Environment}-pymysql

      Description: PyMySQL dependency layer for CloudMart Lambda functions

      CompatibleRuntimes:
      - python3.12

      CompatibleArchitectures:
      - x86_64

      Content:

        S3Bucket: !Ref LambdaArtifactBucket

        S3Key: !Ref PyMySQLLayerS3Key


  # ==========================================================
  # LAMBDA AUTHORIZER
  # ==========================================================

  LambdaAuthorizer:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-lambda-authorizer

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-LambdaAuthorizerRoleArn

      # Keep the Lambda below API Gateway REST API's ~29 second integration limit.
      # The product Lambda now uses short AWS SDK timeouts and treats
      # EventBridge/CloudWatch metrics as best-effort operations.
      Timeout: 10

      MemorySize: 512

      # The authorizer validates customer bearer tokens against the
      # hashed customers.bearer_token value in the private RDS.
      # It therefore MUST run inside the CloudMart VPC.
      VpcConfig:

        SecurityGroupIds:

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Layers:

      - !Ref PyMySQLLayer

      Environment:

        Variables:

          ADMIN_TOKEN_PARAMETER: !Ref AuthTokenParameter

          CUSTOMER_TOKENS_PARAMETER: !Ref CustomerTokensParameter

          DB_NAME_PARAMETER: !Ref DBName

          DB_ENDPOINT_PARAMETER: !Ref DBEndpoint

          DB_PORT_PARAMETER: !Ref DBPort

          DB_USERNAME_PARAMETER: !Ref DBUsername

          DB_PASSWORD_PARAMETER: !Ref DBPassword

      Code:

        S3Bucket: !Ref LambdaArtifactBucket

        S3Key: !Ref AuthorizerLambdaS3Key

      Tags:

      - Key: Name
        Value: !Sub cloudmart-${Environment}-lambda-authorizer

      - Key: Project
        Value: CloudMart

      - Key: Environment
        Value: !Ref Environment


  # ==========================================================
  # CUSTOMER LAMBDA
  #
  # Handles customer creation and soft deletion.
  # The Customer Lambda artifact must contain:
  #   POST /customers
  #   DELETE /customers/{customer_id}
  #
  # Uses the dedicated Customer Lambda IAM role exported by the IAM stack.
  # ==========================================================

  CustomerLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-customer-lambda

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-CustomerLambdaRoleArn

      Timeout: 29

      MemorySize: 512

      Layers:

      - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER: !Ref DBName

          DB_ENDPOINT_PARAMETER: !Ref DBEndpoint

          DB_PORT_PARAMETER: !Ref DBPort

          DB_USERNAME_PARAMETER: !Ref DBUsername

          DB_PASSWORD_PARAMETER: !Ref DBPassword

          EVENT_BUS_NAME: !Ref CloudMartEventBus

      Code:

        S3Bucket: !Ref LambdaArtifactBucket

        S3Key: !Ref CustomerLambdaS3Key

      Tags:

      - Key: Name
        Value: !Sub cloudmart-${Environment}-customer-lambda

      - Key: Project
        Value: CloudMart

      - Key: Environment
        Value: !Ref Environment


  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-product-lambda

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-ProductLambdaRoleArn

      Timeout: 29

      MemorySize: 512

      Layers:

      - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER: !Ref DBName

          DB_ENDPOINT_PARAMETER: !Ref DBEndpoint

          DB_PORT_PARAMETER: !Ref DBPort

          DB_USERNAME_PARAMETER: !Ref DBUsername

          DB_PASSWORD_PARAMETER: !Ref DBPassword

          EVENT_BUS_NAME: !Ref CloudMartEventBus

      Code:

        S3Bucket: !Ref LambdaArtifactBucket

        S3Key: !Ref ProductLambdaS3Key

      Tags:

      - Key: Name
        Value: !Sub cloudmart-${Environment}-product-lambda

      - Key: Project
        Value: CloudMart

      - Key: Environment
        Value: !Ref Environment


  # ==========================================================
  # ORDER LAMBDA
  # ==========================================================

  OrderLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-order-lambda

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-OrderLambdaRoleArn

      Timeout: 29

      MemorySize: 512

      Layers:

      - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER: !Ref DBName

          DB_ENDPOINT_PARAMETER: !Ref DBEndpoint

          DB_PORT_PARAMETER: !Ref DBPort

          DB_USERNAME_PARAMETER: !Ref DBUsername

          DB_PASSWORD_PARAMETER: !Ref DBPassword

          EVENT_BUS_NAME: !Ref CloudMartEventBus

          ORDER_PROCESSOR_FUNCTION_NAME: !Ref OrderProcessorLambda

      Code:

        S3Bucket: !Ref LambdaArtifactBucket

        S3Key: !Ref OrderLambdaS3Key

      Tags:

      - Key: Name
        Value: !Sub cloudmart-${Environment}-order-lambda

      - Key: Project
        Value: CloudMart

      - Key: Environment
        Value: !Ref Environment


  # ==========================================================
  # ORDER PROCESSOR LAMBDA
  # ==========================================================

  OrderProcessorLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-order-processor

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-OrderProcessorLambdaRoleArn

      Timeout: 60

      MemorySize: 512

      Layers:

      - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER: !Ref DBName

          DB_ENDPOINT_PARAMETER: !Ref DBEndpoint

          DB_PORT_PARAMETER: !Ref DBPort

          DB_USERNAME_PARAMETER: !Ref DBUsername

          DB_PASSWORD_PARAMETER: !Ref DBPassword

          EVENT_BUS_NAME: !Ref CloudMartEventBus

      Code:

        S3Bucket: !Ref LambdaArtifactBucket

        S3Key: !Ref OrderProcessorLambdaS3Key

      Tags:

      - Key: Name
        Value: !Sub cloudmart-${Environment}-order-processor

      - Key: Project
        Value: CloudMart

      - Key: Environment
        Value: !Ref Environment


  # ==========================================================
  # ORDER LAMBDA -> ORDER PROCESSOR PERMISSION
  #
  # NO SQS
  #
  # Order Lambda directly invokes Order Processor Lambda.
  # ==========================================================

  OrderProcessorInvokePermission:

    Type: AWS::Lambda::Permission

    Properties:

      FunctionName: !Ref OrderProcessorLambda

      Action: lambda:InvokeFunction

      Principal: lambda.amazonaws.com

      SourceArn: !GetAtt OrderLambda.Arn


  # ==========================================================
  # DAILY REPORT LAMBDA
  #
  # EventBridge
  #      |
  #      v
  # Daily Report Lambda
  #      |
  #      v
  #      RDS
  #      |
  #      v
  #      S3 CSV
  # ==========================================================

  DailyReportLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-daily-report

      Description: CloudMart Daily Inventory and Orders Report

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-DailyReportLambdaRoleArn

      Timeout: 60

      MemorySize: 256

      Architectures:

      - x86_64

      Layers:

      - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER: !Ref DBName

          DB_ENDPOINT_PARAMETER: !Ref DBEndpoint

          DB_PORT_PARAMETER: !Ref DBPort

          DB_USERNAME_PARAMETER: !Ref DBUsername

          DB_PASSWORD_PARAMETER: !Ref DBPassword

          REPORT_BUCKET:
            Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-ReportBucketName

      Code:

        S3Bucket: !Ref LambdaArtifactBucket

        S3Key: !Ref DailyReportLambdaS3Key

      Tags:

      - Key: Name
        Value: !Sub cloudmart-${Environment}-daily-report

      - Key: Project
        Value: CloudMart

      - Key: Environment
        Value: !Ref Environment


  # ==========================================================
  # DAILY REPORT EVENTBRIDGE SCHEDULE
  #
  # 00:00 UTC = 05:30 IST
  # ==========================================================

  DailyReportSchedule:

    Type: AWS::Events::Rule

    Properties:

      Name: !Sub cloudmart-${Environment}-daily-report-schedule

      Description: Runs the CloudMart Daily Report Lambda once every day

      ScheduleExpression: cron(0 0 * * ? *)

      State: ENABLED

      Targets:

      - Arn: !GetAtt DailyReportLambda.Arn

        Id: DailyReportLambdaTarget


  # ==========================================================
  # EVENTBRIDGE -> DAILY REPORT LAMBDA PERMISSION
  # ==========================================================

  DailyReportLambdaInvokePermission:

    Type: AWS::Lambda::Permission

    Properties:

      FunctionName: !Ref DailyReportLambda

      Action: lambda:InvokeFunction

      Principal: events.amazonaws.com

      SourceArn: !GetAtt DailyReportSchedule.Arn


  # ==========================================================
  # SCHEMA INITIALIZER LAMBDA
  # ==========================================================

  SchemaInitializerLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-schema-initializer

      Runtime: python3.12

      Handler: index.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-SchemaInitializerLambdaRoleArn

      Timeout: 300

      MemorySize: 256

      Layers:

      - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER: !Ref DBName

          DB_ENDPOINT_PARAMETER: !Ref DBEndpoint

          DB_PORT_PARAMETER: !Ref DBPort

          DB_USERNAME_PARAMETER: !Ref DBUsername

          DB_PASSWORD_PARAMETER: !Ref DBPassword

          SCHEMA_BUCKET: !Ref LambdaArtifactBucket

          SCHEMA_KEY: !Ref SchemaS3Key

      Code:

        ZipFile: |2

          import json
          import os
          import urllib.request
          import boto3
          import pymysql


          s3 = boto3.client("s3")
          ssm = boto3.client("ssm")

          DB_NAME_PARAMETER = os.environ["DB_NAME_PARAMETER"]
          DB_ENDPOINT_PARAMETER = os.environ["DB_ENDPOINT_PARAMETER"]
          DB_PORT_PARAMETER = os.environ["DB_PORT_PARAMETER"]
          DB_USERNAME_PARAMETER = os.environ["DB_USERNAME_PARAMETER"]
          DB_PASSWORD_PARAMETER = os.environ["DB_PASSWORD_PARAMETER"]
          SCHEMA_BUCKET = os.environ["SCHEMA_BUCKET"]
          SCHEMA_KEY = os.environ["SCHEMA_KEY"]


          def get_parameter(name):
              return ssm.get_parameter(
                  Name=name,
                  WithDecryption=True
              )["Parameter"]["Value"]


          def get_connection():
              return pymysql.connect(
                  host=get_parameter(DB_ENDPOINT_PARAMETER),
                  port=int(get_parameter(DB_PORT_PARAMETER)),
                  user=get_parameter(DB_USERNAME_PARAMETER),
                  password=get_parameter(DB_PASSWORD_PARAMETER),
                  database=get_parameter(DB_NAME_PARAMETER),
                  connect_timeout=10,
                  read_timeout=30,
                  write_timeout=30,
                  autocommit=False
              )
          def send_cfn_response(event, context, status, reason=None):
              response_body = {
                  "Status": status,
                  "Reason": reason or "See CloudWatch logs for details",
                  "PhysicalResourceId": event.get(
                      "PhysicalResourceId",
                      context.log_stream_name
                  ),
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": {
                      "Message": "CloudMart database schema initialization " + status
                  }
              }

              request = urllib.request.Request(
                  event["ResponseURL"],
                  data=json.dumps(response_body).encode("utf-8"),
                  headers={"content-type": ""},
                  method="PUT"
              )

              with urllib.request.urlopen(request, timeout=15) as response:
                  response.read()


          def initialize_schema():
              schema_object = s3.get_object(
                  Bucket=SCHEMA_BUCKET,
                  Key=SCHEMA_KEY
              )
              schema_sql = schema_object["Body"].read().decode("utf-8")

              connection = get_connection()
              try:
                  with connection.cursor() as cursor:
                      for statement in schema_sql.split(";"):
                          statement = statement.strip()
                          if not statement:
                              continue

                          try:
                              cursor.execute(statement)
                          except pymysql.err.OperationalError as error:
                              # MySQL error 1061 means an index already exists.
                              # Ignore it so repeated stack deployments remain idempotent.
                              if error.args and error.args[0] == 1061:
                                  print(json.dumps({
                                      "level": "INFO",
                                      "message": "Index already exists; continuing",
                                      "statement": statement[:200]
                                  }))
                                  continue
                              raise

                  connection.commit()

              except Exception:
                  connection.rollback()
                  raise

              finally:
                  connection.close()


          def lambda_handler(event, context):
              request_type = event.get("RequestType", "Create")

              try:
                  if request_type in ("Create", "Update"):
                      initialize_schema()

                  send_cfn_response(
                      event,
                      context,
                      "SUCCESS",
                      "Schema initialization completed"
                  )

              except Exception as error:
                  print(json.dumps({
                      "level": "ERROR",
                      "service": "cloudmart-schema-initializer",
                      "message": "Schema initialization failed",
                      "error_type": type(error).__name__,
                      "error": str(error)
                  }))

                  send_cfn_response(
                      event,
                      context,
                      "FAILED",
                      str(error)[:1024]
                  )


  # ==========================================================
  # AUTOMATIC DATABASE SCHEMA INITIALIZATION
  # ==========================================================

  DatabaseSchemaInitialization:

    Type: Custom::CloudMartDatabaseSchema

    DependsOn:
    - SchemaInitializerLambda

    Properties:
      ServiceToken: !GetAtt SchemaInitializerLambda.Arn

      SchemaKey: !Ref SchemaS3Key

      SchemaVersion: !Ref SchemaS3Key


  # ==========================================================
  # PRODUCT ALERT SNS TOPIC
  # ==========================================================

  ProductAlertTopic:

    Type: AWS::SNS::Topic

    Properties:
      TopicName: !Sub cloudmart-${Environment}-product-alerts

      DisplayName: CloudMart Product Alerts

      Tags:
      - Key: Name
        Value: !Sub cloudmart-${Environment}-product-alerts

      - Key: Project
        Value: CloudMart

      - Key: Environment
        Value: !Ref Environment


  # ==========================================================
  # PRODUCT NOTIFICATION SNS TOPIC
  # Separate from the operational Product Alert SNS topic.
  # The same AlertEmail receives both streams as two distinct emails.
  # ==========================================================

  ProductNotificationTopic:

    Type: AWS::SNS::Topic

    Properties:
      TopicName: !Sub cloudmart-${Environment}-product-notifications

      DisplayName: CloudMart Product Notifications

      Tags:
      - Key: Name
        Value: !Sub cloudmart-${Environment}-product-notifications

      - Key: Project
        Value: CloudMart

      - Key: Environment
        Value: !Ref Environment


  # ==========================================================
  # ORDER ALERT SNS TOPIC
  # ==========================================================

  OrderAlertTopic:

    Type: AWS::SNS::Topic

    Properties:
      TopicName: !Sub cloudmart-${Environment}-order-alerts

      DisplayName: CloudMart Order Alerts

      Tags:
      - Key: Name
        Value: !Sub cloudmart-${Environment}-order-alerts

      - Key: Project
        Value: CloudMart

      - Key: Environment
        Value: !Ref Environment


  # ==========================================================
  # CUSTOMER ORDER NOTIFICATION SNS TOPIC
  # Separate from operational/CloudWatch alert notifications.
  # ==========================================================

  OrderNotificationTopic:

    Type: AWS::SNS::Topic

    Properties:
      TopicName: !Sub cloudmart-${Environment}-order-notifications

      DisplayName: CloudMart Order Notifications

      Tags:
      - Key: Name
        Value: !Sub cloudmart-${Environment}-order-notifications

      - Key: Project
        Value: CloudMart

      - Key: Environment
        Value: !Ref Environment


  # ==========================================================
  # SNS EMAIL SUBSCRIPTIONS
  # ==========================================================

  ProductAlertEmailSubscription:

    Type: AWS::SNS::Subscription

    Properties:
      TopicArn: !Ref ProductAlertTopic

      Protocol: email

      Endpoint: !Ref AlertEmail


  ProductNotificationEmailSubscription:

    Type: AWS::SNS::Subscription

    Properties:
      TopicArn: !Ref ProductNotificationTopic

      Protocol: email

      Endpoint: !Ref AlertEmail


  OrderAlertEmailSubscription:

    Type: AWS::SNS::Subscription

    Properties:
      TopicArn: !Ref OrderAlertTopic

      Protocol: email

      Endpoint: !Ref AlertEmail



  OrderNotificationEmailSubscription:

    Type: AWS::SNS::Subscription

    Properties:
      TopicArn: !Ref OrderNotificationTopic

      Protocol: email

      Endpoint: !Ref AlertEmail


  # ==========================================================
  # EVENTBRIDGE -> SNS RESOURCE POLICIES
  # ==========================================================

  ProductAlertTopicPolicy:

    Type: AWS::SNS::TopicPolicy

    Properties:
      Topics:
      - !Ref ProductAlertTopic

      PolicyDocument:
        Version: '2012-10-17'

        Statement:
        - Sid: AllowEventBridgeToPublishProductAlerts
          Effect: Allow

          Principal:
            Service:
            - events.amazonaws.com

          Action:
          - sns:Publish

          Resource: !Ref ProductAlertTopic

          Condition:
            StringEquals:
              AWS:SourceAccount: !Ref AWS::AccountId


  ProductNotificationTopicPolicy:

    Type: AWS::SNS::TopicPolicy

    Properties:
      Topics:
      - !Ref ProductNotificationTopic

      PolicyDocument:
        Version: '2012-10-17'

        Statement:
        - Sid: AllowEventBridgeToPublishProductNotifications
          Effect: Allow

          Principal:
            Service:
            - events.amazonaws.com

          Action:
          - sns:Publish

          Resource: !Ref ProductNotificationTopic

          Condition:
            StringEquals:
              AWS:SourceAccount: !Ref AWS::AccountId


  OrderAlertTopicPolicy:

    Type: AWS::SNS::TopicPolicy

    Properties:
      Topics:
      - !Ref OrderAlertTopic

      PolicyDocument:
        Version: '2012-10-17'

        Statement:
        - Sid: AllowEventBridgeToPublishOrderAlerts
          Effect: Allow

          Principal:
            Service:
            - events.amazonaws.com

          Action:
          - sns:Publish

          Resource: !Ref OrderAlertTopic

          Condition:
            StringEquals:
              AWS:SourceAccount: !Ref AWS::AccountId



  OrderNotificationTopicPolicy:

    Type: AWS::SNS::TopicPolicy

    Properties:
      Topics:
      - !Ref OrderNotificationTopic

      PolicyDocument:
        Version: '2012-10-17'

        Statement:
        - Sid: AllowEventBridgeToPublishOrderNotifications
          Effect: Allow

          Principal:
            Service:
            - events.amazonaws.com

          Action:
          - sns:Publish

          Resource: !Ref OrderNotificationTopic

          Condition:
            StringEquals:
              AWS:SourceAccount: !Ref AWS::AccountId


  # ==========================================================
  # LOW STOCK EVENT -> PRODUCT SNS
  # ==========================================================

  LowStockEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name: !Sub cloudmart-${Environment}-low-stock-rule

      Description: Sends low-stock inventory events to both Product Alert and Product Notification SNS topics

      EventBusName: !Ref CloudMartEventBus

      State: ENABLED

      EventPattern:

        source:
        - cloudmart.inventory

        detail-type:
        - LowStock

        detail:
          low_stock:
          - true

      Targets:

      - Arn: !Ref ProductAlertTopic

        Id: ProductLowStockAlertSNSTarget

        InputTransformer:

          InputPathsMap:
            productId: "$.detail.product_id"
            productName: "$.detail.product_name"
            oldStock: "$.detail.old_stock"
            newStock: "$.detail.new_stock"
            threshold: "$.detail.low_stock_threshold"

          InputTemplate: >
            "CloudMart LOW STOCK ALERT: Product <productName>
            (ID: <productId>) stock changed from <oldStock> to
            <newStock>. Reorder threshold: <threshold>."

      - Arn: !Ref ProductNotificationTopic

        Id: ProductLowStockNotificationSNSTarget

        InputTransformer:

          InputPathsMap:
            productId: "$.detail.product_id"
            productName: "$.detail.product_name"
            oldStock: "$.detail.old_stock"
            newStock: "$.detail.new_stock"
            threshold: "$.detail.low_stock_threshold"

          InputTemplate: >
            "CloudMart LOW STOCK: Product <productName>
            (ID: <productId>) stock changed from <oldStock> to
            <newStock>. Reorder threshold: <threshold>."


  # ==========================================================
  # PRODUCT LAMBDA LOW STOCK -> PRODUCT SNS
  #
  # The Product Lambda publishes stock updates as:
  #   source     = cloudmart.product
  #   detail-type = Inventory Changed
  #   detail.low_stock = true
  #
  # This rule catches that event and sends it to the Product Alert SNS topic.
  # The existing LowStockEventRule below remains in place for the
  # Order Processor's cloudmart.inventory / LowStock events.
  # ==========================================================

  ProductInventoryLowStockEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name: !Sub cloudmart-${Environment}-product-low-stock-rule

      Description: Sends the Product Lambda Inventory Changed low-stock event to the Product Notification SNS topic

      EventBusName: !Ref CloudMartEventBus

      State: ENABLED

      EventPattern:

        source:
        - cloudmart.product

        detail-type:
        - Inventory Changed

        detail:
          low_stock:
          - true

      Targets:

      - Arn: !Ref ProductNotificationTopic

        Id: ProductInventoryLowStockNotificationSNSTarget

        InputTransformer:

          InputPathsMap:
            productId: "$.detail.product_id"
            productName: "$.detail.product_name"
            oldStock: "$.detail.old_stock"
            newStock: "$.detail.new_stock"
            threshold: "$.detail.low_stock_threshold"

          InputTemplate: >
            "CloudMart LOW STOCK: Product <productName>
            (ID: <productId>) stock changed from <oldStock> to
            <newStock>. Reorder threshold: <threshold>."


  # ==========================================================
  # PRODUCT LAMBDA LOW STOCK ALERT EVENT
  # Product Lambda publishes LowStockAlert when inventory crosses
  # the configured reorder threshold.
  # ==========================================================

  ProductLowStockAlertEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name: !Sub cloudmart-${Environment}-product-low-stock-alert-rule

      Description: Sends Product Lambda LowStockAlert events to Product Alert SNS

      EventBusName: !Ref CloudMartEventBus

      State: ENABLED

      EventPattern:

        source:
        - cloudmart.product

        detail-type:
        - LowStockAlert

        detail:
          low_stock:
          - true

      Targets:

      - Arn: !Ref ProductAlertTopic

        Id: ProductLowStockAlertEventSNSTarget

        InputTransformer:

          InputPathsMap:
            productId: "$.detail.product_id"
            productName: "$.detail.product_name"
            oldStock: "$.detail.old_stock"
            newStock: "$.detail.new_stock"
            threshold: "$.detail.low_stock_threshold"

          InputTemplate: >
            "CloudMart LOW STOCK ALERT: Product <productName>
            (ID: <productId>) stock changed from <oldStock> to
            <newStock>. Reorder threshold: <threshold>."


  # ==========================================================
  # FAILED ORDER EVENTS -> ORDER NOTIFICATION SNS + OPERATIONS ALERT SNS
  # ==========================================================

  OrderFailedEventsToSNSRule:

    Type: AWS::Events::Rule

    Properties:

      Name: !Sub cloudmart-${Environment}-order-failed-alert-rule

      Description: Sends failed CloudMart orders with the failure reason to SNS

      EventBusName: !Ref CloudMartEventBus

      State: ENABLED

      EventPattern:

        source:
        - cloudmart.orders

        detail-type:
        - OrderFailed

      Targets:

      - Arn: !Ref OrderNotificationTopic

        Id: OrderFailedSNSTarget

        InputTransformer:

          InputPathsMap:
            eventType: "$.detail-type"
            orderId: "$.detail.order_id"
            customerId: "$.detail.customer_id"
            status: "$.detail.status"
            totalAmount: "$.detail.total_amount"
            failureReason: "$.detail.failure_reason"

          InputTemplate: >
            "CloudMart ORDER FAILED: Order ID: <orderId>,
            Customer ID: <customerId>, Status: <status>,
            Total Amount: <totalAmount>, Failure Reason: <failureReason>."

      - Arn: !Ref OrderAlertTopic

        Id: OrderFailedOperationalAlertSNSTarget

        InputTransformer:

          InputPathsMap:
            eventType: "$.detail-type"
            orderId: "$.detail.order_id"
            customerId: "$.detail.customer_id"
            status: "$.detail.status"
            totalAmount: "$.detail.total_amount"
            failureReason: "$.detail.failure_reason"

          InputTemplate: >
            "CloudMart ORDER FAILED ALERT: Event <eventType>.
            Order ID: <orderId>, Customer ID: <customerId>,
            Status: <status>, Total Amount: <totalAmount>,
            Failure Reason: <failureReason>."


