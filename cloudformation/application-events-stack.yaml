AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Application, Lambda, EventBridge and SNS Stack

# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String
    Default: dev

  LambdaArtifactBucket:
    Type: String

  PyMySQLLayerS3Key:
    Type: String

  ProductLambdaS3Key:
    Type: String

  OrderLambdaS3Key:
    Type: String

  OrderProcessorLambdaS3Key:
    Type: String

  AuthorizerLambdaS3Key:
    Type: String

  SchemaS3Key:
    Type: String

  DBName:
    Type: String

  DBEndpoint:
    Type: String

  DBPort:
    Type: String

  DBUsername:
    Type: String

  DBPassword:
    Type: String

  AuthTokenParameter:
    Type: String

  CustomerTokensParameter:
    Type: String

  AlertEmail:
    Type: String


# ============================================================
# RESOURCES
# ============================================================

Resources:


  # ==========================================================
  # PYMYSQL LAYER
  # ==========================================================

  PyMySQLLayer:

    Type: AWS::Lambda::LayerVersion

    Properties:

      LayerName: !Sub cloudmart-${Environment}-pymysql

      Description: PyMySQL dependency layer for CloudMart Lambda functions

      Content:

        S3Bucket: !Ref LambdaArtifactBucket

        S3Key: !Ref PyMySQLLayerS3Key

      CompatibleRuntimes:

        - python3.12


  # ==========================================================
  # EVENTBRIDGE EVENT BUS
  # ==========================================================

  CloudMartEventBus:

    Type: AWS::Events::EventBus

    Properties:

      Name: !Sub cloudmart-${Environment}-event-bus


  # ==========================================================
  # LOW STOCK SNS TOPIC
  # ==========================================================

  LowStockTopic:

    Type: AWS::SNS::Topic

    Properties:

      TopicName: !Sub cloudmart-${Environment}-low-stock-alerts

      DisplayName: CloudMart Low Stock Alerts


  # ==========================================================
  # ORDER NOTIFICATION SNS TOPIC
  # ==========================================================

  OrderConfirmationTopic:

    Type: AWS::SNS::Topic

    Properties:

      TopicName: !Sub cloudmart-${Environment}-order-notifications

      DisplayName: CloudMart Order Notifications


  # ==========================================================
  # LOW STOCK EMAIL SUBSCRIPTION
  # ==========================================================

  LowStockEmailSubscription:

    Type: AWS::SNS::Subscription

    Properties:

      TopicArn: !Ref LowStockTopic

      Protocol: email

      Endpoint: !Ref AlertEmail


  # ==========================================================
  # ORDER EMAIL SUBSCRIPTION
  # ==========================================================

  OrderEmailSubscription:

    Type: AWS::SNS::Subscription

    Properties:

      TopicArn: !Ref OrderConfirmationTopic

      Protocol: email

      Endpoint: !Ref AlertEmail


  # ==========================================================
  # EVENTBRIDGE TO SNS ROLE
  # ==========================================================

  EventBridgeSNSRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName: !Sub cloudmart-${Environment}-eventbridge-sns-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service: events.amazonaws.com

            Action: sts:AssumeRole


      Policies:

        - PolicyName: PublishToCloudMartSNSTopics

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - sns:Publish

                Resource:

                  - !Ref LowStockTopic

                  - !Ref OrderConfirmationTopic


  # ==========================================================
  # LOW STOCK SNS TOPIC POLICY
  # ==========================================================

  LowStockTopicPolicy:

    Type: AWS::SNS::TopicPolicy

    Properties:

      Topics:

        - !Ref LowStockTopic

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Sid: AllowEventBridgePublish

            Effect: Allow

            Principal:

              Service: events.amazonaws.com

            Action: sns:Publish

            Resource: !Ref LowStockTopic


  # ==========================================================
  # ORDER SNS TOPIC POLICY
  # ==========================================================

  OrderConfirmationTopicPolicy:

    Type: AWS::SNS::TopicPolicy

    Properties:

      Topics:

        - !Ref OrderConfirmationTopic

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Sid: AllowEventBridgePublish

            Effect: Allow

            Principal:

              Service: events.amazonaws.com

            Action: sns:Publish

            Resource: !Ref OrderConfirmationTopic


  # ==========================================================
  # LAMBDA AUTHORIZER
  # ==========================================================

  LambdaAuthorizer:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-lambda-authorizer

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:

        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-LambdaAuthorizerRoleArn

      Timeout: 30

      MemorySize: 128

      Environment:

        Variables:

          AUTH_TOKEN_PARAMETER: !Ref AuthTokenParameter

          CUSTOMER_TOKENS_PARAMETER: !Ref CustomerTokensParameter

      Code:

        S3Bucket: !Ref LambdaArtifactBucket

        S3Key: !Ref AuthorizerLambdaS3Key


  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-product-lambda

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:

        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-ProductLambdaRoleArn

      Timeout: 30

      MemorySize: 256

      Layers:

        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER: !Ref DBName

          DB_ENDPOINT_PARAMETER: !Ref DBEndpoint

          DB_PORT_PARAMETER: !Ref DBPort

          DB_USERNAME_PARAMETER: !Ref DBUsername

          DB_PASSWORD_PARAMETER: !Ref DBPassword

          EVENT_BUS_NAME: !Ref CloudMartEventBus

      Code:

        S3Bucket: !Ref LambdaArtifactBucket

        S3Key: !Ref ProductLambdaS3Key


  # ==========================================================
  # ORDER LAMBDA
  # ==========================================================

  OrderLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-order-lambda

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:

        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-OrderLambdaRoleArn

      Timeout: 30

      MemorySize: 256

      Layers:

        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          ORDER_PROCESSOR_FUNCTION_NAME: !Ref OrderProcessorLambda

          EVENT_BUS_NAME: !Ref CloudMartEventBus

      Code:

        S3Bucket: !Ref LambdaArtifactBucket

        S3Key: !Ref OrderLambdaS3Key


  # ==========================================================
  # ORDER PROCESSOR LAMBDA
  # ==========================================================

  OrderProcessorLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-order-processor

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:

        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-OrderProcessorLambdaRoleArn

      Timeout: 60

      MemorySize: 256

      Layers:

        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER: !Ref DBName

          DB_ENDPOINT_PARAMETER: !Ref DBEndpoint

          DB_PORT_PARAMETER: !Ref DBPort

          DB_USERNAME_PARAMETER: !Ref DBUsername

          DB_PASSWORD_PARAMETER: !Ref DBPassword

          EVENT_BUS_NAME: !Ref CloudMartEventBus

      Code:

        S3Bucket: !Ref LambdaArtifactBucket

        S3Key: !Ref OrderProcessorLambdaS3Key


  # ==========================================================
  # ORDER LAMBDA -> ORDER PROCESSOR PERMISSION
  # ==========================================================

  OrderProcessorInvokePermission:

    Type: AWS::Lambda::Permission

    Properties:

      FunctionName: !Ref OrderProcessorLambda

      Action: lambda:InvokeFunction

      Principal: lambda.amazonaws.com

      SourceArn: !GetAtt OrderLambda.Arn


  # ==========================================================
  # SCHEMA INITIALIZER LAMBDA
  # IMPORTANT:
  # Uses INLINE CODE, NOT SchemaS3Key as Lambda code
  # ==========================================================

  SchemaInitializerLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-schema-initializer

      Runtime: python3.12

      Handler: index.lambda_handler

      Role:

        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-ProductLambdaRoleArn

      Timeout: 300

      MemorySize: 256

      Layers:

        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER: !Ref DBName

          DB_ENDPOINT_PARAMETER: !Ref DBEndpoint

          DB_PORT_PARAMETER: !Ref DBPort

          DB_USERNAME_PARAMETER: !Ref DBUsername

          DB_PASSWORD_PARAMETER: !Ref DBPassword

          SCHEMA_BUCKET: !Ref LambdaArtifactBucket

          SCHEMA_KEY: !Ref SchemaS3Key

      Code:

        ZipFile: |
          import os
          import boto3
          import pymysql

          s3 = boto3.client("s3")
          ssm = boto3.client("ssm")

          def get_parameter(name):
              response = ssm.get_parameter(
                  Name=name,
                  WithDecryption=True
              )
              return response["Parameter"]["Value"]

          def lambda_handler(event, context):

              db_name = get_parameter(
                  os.environ["DB_NAME_PARAMETER"]
              )

              db_endpoint = get_parameter(
                  os.environ["DB_ENDPOINT_PARAMETER"]
              )

              db_port = int(
                  get_parameter(
                      os.environ["DB_PORT_PARAMETER"]
                  )
              )

              db_username = get_parameter(
                  os.environ["DB_USERNAME_PARAMETER"]
              )

              db_password = get_parameter(
                  os.environ["DB_PASSWORD_PARAMETER"]
              )

              schema_bucket = os.environ["SCHEMA_BUCKET"]
              schema_key = os.environ["SCHEMA_KEY"]

              response = s3.get_object(
                  Bucket=schema_bucket,
                  Key=schema_key
              )

              schema_sql = response["Body"].read().decode("utf-8")

              connection = pymysql.connect(
                  host=db_endpoint,
                  user=db_username,
                  password=db_password,
                  database=db_name,
                  port=db_port,
                  connect_timeout=10,
                  autocommit=True
              )

              try:

                  with connection.cursor() as cursor:

                      statements = [
                          statement.strip()
                          for statement in schema_sql.split(";")
                          if statement.strip()
                      ]

                      for statement in statements:
                          cursor.execute(statement)

                  return {
                      "statusCode": 200,
                      "body": "CloudMart database schema initialized successfully"
                  }

              finally:

                  connection.close()


  # ==========================================================
  # LOW STOCK EVENT RULE
  # ==========================================================

  LowStockEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name: !Sub cloudmart-${Environment}-low-stock-rule

      Description: CloudMart low stock alert rule

      State: ENABLED

      EventBusName: !Ref CloudMartEventBus

      EventPattern:

        source:

          - cloudmart.product

        detail-type:

          - Inventory Changed

        detail:

          low_stock:

            - true

      Targets:

        - Id: LowStockSnsTarget

          Arn: !Ref LowStockTopic

          RoleArn: !GetAtt EventBridgeSNSRole.Arn


  # ==========================================================
  # ORDER PLACED EVENT RULE
  # ==========================================================

  OrderPlacedEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name: !Sub cloudmart-${Environment}-order-placed-rule

      State: ENABLED

      EventBusName: !Ref CloudMartEventBus

      EventPattern:

        source:

          - cloudmart.orders

        detail-type:

          - OrderPlaced

      Targets:

        - Id: OrderPlacedSnsTarget

          Arn: !Ref OrderConfirmationTopic

          RoleArn: !GetAtt EventBridgeSNSRole.Arn


  # ==========================================================
  # ORDER PENDING EVENT RULE
  # ==========================================================

  OrderPendingEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name: !Sub cloudmart-${Environment}-order-pending-rule

      State: ENABLED

      EventBusName: !Ref CloudMartEventBus

      EventPattern:

        source:

          - cloudmart.orders

        detail-type:

          - OrderPending

      Targets:

        - Id: OrderPendingSnsTarget

          Arn: !Ref OrderConfirmationTopic

          RoleArn: !GetAtt EventBridgeSNSRole.Arn


  # ==========================================================
  # ORDER CONFIRMED EVENT RULE
  # ==========================================================

  OrderConfirmedEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name: !Sub cloudmart-${Environment}-order-confirmed-rule

      State: ENABLED

      EventBusName: !Ref CloudMartEventBus

      EventPattern:

        source:

          - cloudmart.orders

        detail-type:

          - OrderConfirmed

      Targets:

        - Id: OrderConfirmedSnsTarget

          Arn: !Ref OrderConfirmationTopic

          RoleArn: !GetAtt EventBridgeSNSRole.Arn


  # ==========================================================
  # ORDER FAILED EVENT RULE
  # ==========================================================

  OrderFailedEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name: !Sub cloudmart-${Environment}-order-failed-rule

      State: ENABLED

      EventBusName: !Ref CloudMartEventBus

      EventPattern:

        source:

          - cloudmart.orders

        detail-type:

          - OrderFailed

      Targets:

        - Id: OrderFailedSnsTarget

          Arn: !Ref OrderConfirmationTopic

          RoleArn: !GetAtt EventBridgeSNSRole.Arn


  # ==========================================================
  # ORDER CANCELLED EVENT RULE
  # ==========================================================

  OrderCancelledEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name: !Sub cloudmart-${Environment}-order-cancelled-rule

      State: ENABLED

      EventBusName: !Ref CloudMartEventBus

      EventPattern:

        source:

          - cloudmart.orders

        detail-type:

          - OrderCancelled

      Targets:

        - Id: OrderCancelledSnsTarget

          Arn: !Ref OrderConfirmationTopic

          RoleArn: !GetAtt EventBridgeSNSRole.Arn


  # ==========================================================
  # ORDER UPDATED EVENT RULE
  # ==========================================================

  OrderUpdatedEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name: !Sub cloudmart-${Environment}-order-updated-rule

      State: ENABLED

      EventBusName: !Ref CloudMartEventBus

      EventPattern:

        source:

          - cloudmart.orders

        detail-type:

          - OrderUpdated

      Targets:

        - Id: OrderUpdatedSnsTarget

          Arn: !Ref OrderConfirmationTopic

          RoleArn: !GetAtt EventBridgeSNSRole.Arn


# ============================================================
# OUTPUTS
# ============================================================

Outputs:


  LambdaAuthorizerArn:

    Description: Lambda Authorizer ARN

    Value: !GetAtt LambdaAuthorizer.Arn

    Export:

      Name: !Sub cloudmart-${Environment}-LambdaAuthorizerArn


  LambdaAuthorizerName:

    Description: Lambda Authorizer Name

    Value: !Ref LambdaAuthorizer

    Export:

      Name: !Sub cloudmart-${Environment}-LambdaAuthorizerName


  ProductLambdaArn:

    Description: Product Lambda ARN

    Value: !GetAtt ProductLambda.Arn

    Export:

      Name: !Sub cloudmart-${Environment}-ProductLambdaArn


  ProductLambdaName:

    Description: Product Lambda Name

    Value: !Ref ProductLambda

    Export:

      Name: !Sub cloudmart-${Environment}-ProductLambdaName


  OrderLambdaArn:

    Description: Order Lambda ARN

    Value: !GetAtt OrderLambda.Arn

    Export:

      Name: !Sub cloudmart-${Environment}-OrderLambdaArn


  OrderLambdaName:

    Description: Order Lambda Name

    Value: !Ref OrderLambda

    Export:

      Name: !Sub cloudmart-${Environment}-OrderLambdaName


  OrderProcessorLambdaArn:

    Description: Order Processor Lambda ARN

    Value: !GetAtt OrderProcessorLambda.Arn

    Export:

      Name: !Sub cloudmart-${Environment}-OrderProcessorLambdaArn


  OrderProcessorLambdaName:

    Description: Order Processor Lambda Name

    Value: !Ref OrderProcessorLambda

    Export:

      Name: !Sub cloudmart-${Environment}-OrderProcessorLambdaName


  SchemaInitializerLambdaArn:

    Description: Schema Initializer Lambda ARN

    Value: !GetAtt SchemaInitializerLambda.Arn

    Export:

      Name: !Sub cloudmart-${Environment}-SchemaInitializerLambdaArn


  SchemaInitializerLambdaName:

    Description: Schema Initializer Lambda Name

    Value: !Ref SchemaInitializerLambda

    Export:

      Name: !Sub cloudmart-${Environment}-SchemaInitializerLambdaName


  PyMySQLLayerArn:

    Description: PyMySQL Layer ARN

    Value: !Ref PyMySQLLayer

    Export:

      Name: !Sub cloudmart-${Environment}-PyMySQLLayerArn


  EventBusName:

    Description: CloudMart EventBridge Event Bus Name

    Value: !Ref CloudMartEventBus

    Export:

      Name: !Sub cloudmart-${Environment}-EventBusName


  EventBusArn:

    Description: CloudMart EventBridge Event Bus ARN

    Value: !GetAtt CloudMartEventBus.Arn

    Export:

      Name: !Sub cloudmart-${Environment}-EventBusArn


  LowStockTopicArn:

    Description: Low Stock SNS Topic ARN

    Value: !Ref LowStockTopic

    Export:

      Name: !Sub cloudmart-${Environment}-LowStockTopicArn


  OrderConfirmationTopicArn:

    Description: Order Notification SNS Topic ARN

    Value: !Ref OrderConfirmationTopic

    Export:

      Name: !Sub cloudmart-${Environment}-OrderConfirmationTopicArn


  OrderPlacedEventRuleArn:

    Description: Order Placed Event Rule ARN

    Value: !GetAtt OrderPlacedEventRule.Arn

    Export:

      Name: !Sub cloudmart-${Environment}-OrderPlacedEventRuleArn


  OrderPendingEventRuleArn:

    Description: Order Pending Event Rule ARN

    Value: !GetAtt OrderPendingEventRule.Arn

    Export:

      Name: !Sub cloudmart-${Environment}-OrderPendingEventRuleArn


  OrderConfirmedEventRuleArn:

    Description: Order Confirmed Event Rule ARN

    Value: !GetAtt OrderConfirmedEventRule.Arn

    Export:

      Name: !Sub cloudmart-${Environment}-OrderConfirmedEventRuleArn


  OrderFailedEventRuleArn:

    Description: Order Failed Event Rule ARN

    Value: !GetAtt OrderFailedEventRule.Arn

    Export:

      Name: !Sub cloudmart-${Environment}-OrderFailedEventRuleArn


  OrderCancelledEventRuleArn:

    Description: Order Cancelled Event Rule ARN

    Value: !GetAtt OrderCancelledEventRule.Arn

    Export:

      Name: !Sub cloudmart-${Environment}-OrderCancelledEventRuleArn


  OrderUpdatedEventRuleArn:

    Description: Order Updated Event Rule ARN

    Value: !GetAtt OrderUpdatedEventRule.Arn

    Export:

      Name: !Sub cloudmart-${Environment}-OrderUpdatedEventRuleArn