AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Application-Events Stack.
  Creates Lambda Authorizer, PyMySQL layer, Product Lambda,
  Order Lambda, Order Processor Lambda, Schema Initializer Lambda,
  one custom EventBridge bus, order lifecycle events,
  low-stock alerts, and SNS notifications.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  DBName:
    Type: String
    Default: /cloudmart/dev/db/name

  DBEndpoint:
    Type: String
    Default: /cloudmart/dev/db/endpoint

  DBPort:
    Type: String
    Default: /cloudmart/dev/db/port

  DBUsername:
    Type: String
    Default: /cloudmart/dev/db/username

  DBPassword:
    Type: String
    Default: /cloudmart/dev/db/password

  AuthTokenParameter:
    Type: String
    Default: /cloudmart/dev/auth/token

  CustomerTokensParameter:
    Type: String
    Default: /cloudmart/dev/auth/customer-tokens

  LambdaArtifactBucket:
    Type: String

  PyMySQLLayerS3Key:
    Type: String

  ProductLambdaS3Key:
    Type: String

  OrderLambdaS3Key:
    Type: String

  OrderProcessorLambdaS3Key:
    Type: String

  SchemaS3Key:
    Type: String
    Default: database/schema.sql

  AlertEmail:
    Type: String


Resources:

  # ==========================================================
  # CUSTOM EVENTBRIDGE BUS
  # ==========================================================

  CloudMartEventBus:
    Type: AWS::Events::EventBus

    Properties:
      Name: !Sub cloudmart-${Environment}-event-bus

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-event-bus

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # LAMBDA AUTHORIZER
  # ==========================================================

  LambdaAuthorizer:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-lambda-authorizer

      Runtime: python3.12

      Handler: index.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-LambdaAuthorizerRoleArn

      Timeout: 10

      MemorySize: 128

      Environment:

        Variables:
          ADMIN_TOKEN_PARAMETER: !Ref AuthTokenParameter
          CUSTOMER_TOKENS_PARAMETER: !Ref CustomerTokensParameter

      Code:

        ZipFile: |
          import json
          import os
          import boto3


          ssm = boto3.client("ssm")


          def get_parameter(parameter_name):

              response = ssm.get_parameter(
                  Name=parameter_name,
                  WithDecryption=True
              )

              return response["Parameter"]["Value"]


          def generate_policy(
              principal_id,
              effect,
              resource,
              auth_context=None
          ):

              policy = {
                  "principalId": principal_id,

                  "policyDocument": {
                      "Version": "2012-10-17",

                      "Statement": [
                          {
                              "Action": "execute-api:Invoke",
                              "Effect": effect,
                              "Resource": resource
                          }
                      ]
                  }
              }

              if auth_context:
                  policy["context"] = auth_context

              return policy


          def get_request_details(method_arn):

              try:

                  execute_api_part = method_arn.split(":")[5]

                  parts = execute_api_part.split("/")

                  http_method = (
                      parts[2]
                      if len(parts) > 2
                      else ""
                  )

                  resource_path = (
                      "/" + "/".join(parts[3:])
                      if len(parts) > 3
                      else "/"
                  )

                  return http_method, resource_path

              except Exception:

                  return "", ""


          def normalize_path(resource_path):

              parts = [
                  part
                  for part in resource_path.split("/")
                  if part
              ]

              if len(parts) == 1:

                  if parts[0] == "products":
                      return "/products"

                  if parts[0] == "orders":
                      return "/orders"


              if (
                  len(parts) == 2
                  and parts[0] == "products"
              ):
                  return "/products/{id}"


              if (
                  len(parts) == 2
                  and parts[0] == "orders"
              ):
                  return "/orders/{id}"


              if (
                  len(parts) == 3
                  and parts[0] == "orders"
                  and parts[2] == "status"
              ):
                  return "/orders/{id}/status"


              return resource_path


          def customer_is_allowed(
              http_method,
              resource_path
          ):

              normalized_path = normalize_path(
                  resource_path
              )

              allowed_routes = {

                  ("GET", "/products"),

                  ("GET", "/products/{id}"),

                  ("POST", "/orders"),

                  ("GET", "/orders"),

                  ("GET", "/orders/{id}"),

                  (
                      "PATCH",
                      "/orders/{id}/status"
                  )
              }

              return (
                  http_method,
                  normalized_path
              ) in allowed_routes


          def lambda_handler(event, context):

              method_arn = event.get(
                  "methodArn",
                  "*"
              )

              try:

                  authorization_header = event.get(
                      "authorizationToken",
                      ""
                  )


                  if not authorization_header:

                      return generate_policy(
                          "unauthorized",
                          "Deny",
                          method_arn
                      )


                  provided_token = (
                      authorization_header.strip()
                  )


                  if provided_token.lower().startswith(
                      "bearer "
                  ):

                      provided_token = (
                          provided_token[7:].strip()
                      )


                  if not provided_token:

                      return generate_policy(
                          "unauthorized",
                          "Deny",
                          method_arn
                      )


                  admin_parameter = os.environ[
                      "ADMIN_TOKEN_PARAMETER"
                  ]

                  customer_parameter = os.environ[
                      "CUSTOMER_TOKENS_PARAMETER"
                  ]


                  admin_token = get_parameter(
                      admin_parameter
                  )

                  customer_tokens_value = (
                      get_parameter(
                          customer_parameter
                      )
                  )


                  customer_tokens = json.loads(
                      customer_tokens_value
                  )


                  (
                      http_method,
                      resource_path
                  ) = get_request_details(
                      method_arn
                  )


                  if provided_token == admin_token:

                      return generate_policy(
                          "admin",
                          "Allow",
                          method_arn,
                          {
                              "role": "ADMIN",
                              "customer_id": ""
                          }
                      )


                  customer_id = customer_tokens.get(
                      provided_token
                  )


                  if customer_id is None:

                      return generate_policy(
                          "unauthorized",
                          "Deny",
                          method_arn
                      )


                  customer_id = int(
                      customer_id
                  )


                  if not customer_is_allowed(
                      http_method,
                      resource_path
                  ):

                      return generate_policy(
                          f"customer-{customer_id}",
                          "Deny",
                          method_arn
                      )


                  return generate_policy(
                      f"customer-{customer_id}",
                      "Allow",
                      method_arn,
                      {
                          "role": "CUSTOMER",
                          "customer_id": str(
                              customer_id
                          )
                      }
                  )


              except Exception as exc:

                  print(
                      json.dumps(
                          {
                              "error_type":
                                  type(exc).__name__,
                              "error":
                                  str(exc)
                          }
                      )
                  )

                  return generate_policy(
                      "unauthorized",
                      "Deny",
                      method_arn
                  )


  # ==========================================================
  # PYMYSQL LAYER
  # ==========================================================

  PyMySQLLayer:
    Type: AWS::Lambda::LayerVersion

    Properties:

      LayerName:
        !Sub cloudmart-${Environment}-pymysql-layer

      Description:
        PyMySQL dependency layer for CloudMart Lambda functions

      CompatibleRuntimes:
        - python3.12

      CompatibleArchitectures:
        - x86_64

      Content:

        S3Bucket: !Ref LambdaArtifactBucket

        S3Key: !Ref PyMySQLLayerS3Key


  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-product-lambda

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-ProductLambdaRoleArn

      Timeout: 30

      MemorySize: 256

      Layers:
        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER: !Ref DBName

          DB_ENDPOINT_PARAMETER: !Ref DBEndpoint

          DB_PORT_PARAMETER: !Ref DBPort

          DB_USERNAME_PARAMETER: !Ref DBUsername

          DB_PASSWORD_PARAMETER: !Ref DBPassword

          EVENT_BUS_NAME: !Ref CloudMartEventBus

      Code:

        S3Bucket: !Ref LambdaArtifactBucket

        S3Key: !Ref ProductLambdaS3Key


  # ==========================================================
  # ORDER LAMBDA
  # ==========================================================

  OrderLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-order-lambda

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-OrderLambdaRoleArn

      Timeout: 30

      MemorySize: 256

      Layers:
        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          ORDER_PROCESSOR_FUNCTION_NAME:
            !Ref OrderProcessorLambda

          EVENT_BUS_NAME:
            !Ref CloudMartEventBus

      Code:

        S3Bucket: !Ref LambdaArtifactBucket

        S3Key: !Ref OrderLambdaS3Key


  # ==========================================================
  # ORDER PROCESSOR LAMBDA
  # ==========================================================

  OrderProcessorLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-order-processor

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-OrderProcessorLambdaRoleArn

      Timeout: 60

      MemorySize: 256

      Layers:
        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName

          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint

          DB_PORT_PARAMETER:
            !Ref DBPort

          DB_USERNAME_PARAMETER:
            !Ref DBUsername

          DB_PASSWORD_PARAMETER:
            !Ref DBPassword

          EVENT_BUS_NAME:
            !Ref CloudMartEventBus

      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref OrderProcessorLambdaS3Key


  # ==========================================================
  # ORDER LAMBDA -> ORDER PROCESSOR PERMISSION
  # ==========================================================

  OrderProcessorInvokePermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref OrderProcessorLambda

      Action:
        lambda:InvokeFunction

      Principal:
        lambda.amazonaws.com

      SourceArn:
        !GetAtt OrderLambda.Arn


  # ==========================================================
  # SCHEMA INITIALIZER LAMBDA
  # ==========================================================

  SchemaInitializerLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-schema-initializer

      Runtime: python3.12

      Handler: index.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-ProductLambdaRoleArn

      Timeout: 300

      MemorySize: 256

      Layers:
        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName

          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint

          DB_PORT_PARAMETER:
            !Ref DBPort

          DB_USERNAME_PARAMETER:
            !Ref DBUsername

          DB_PASSWORD_PARAMETER:
            !Ref DBPassword

          SCHEMA_S3_BUCKET:
            !Ref LambdaArtifactBucket

          SCHEMA_S3_KEY:
            !Ref SchemaS3Key

      Code:

        ZipFile: |
          import json
          import os
          import boto3


          ssm = boto3.client("ssm")
          s3 = boto3.client("s3")


          def get_parameter(name):

              response = ssm.get_parameter(
                  Name=name,
                  WithDecryption=True
              )

              return response["Parameter"]["Value"]


          def lambda_handler(event, context):

              return {
                  "statusCode": 200,
                  "body": json.dumps(
                      {
                          "message":
                              "Schema initializer is configured"
                      }
                  )
              }


  # ==========================================================
  # ORDER NOTIFICATION SNS TOPIC
  # ==========================================================

  OrderConfirmationTopic:
    Type: AWS::SNS::Topic

    Properties:

      TopicName:
        !Sub cloudmart-${Environment}-order-notifications

      DisplayName:
        CloudMart Order Notifications


  # ==========================================================
  # ORDER EMAIL SUBSCRIPTION
  # ==========================================================

  OrderConfirmationEmailSubscription:
    Type: AWS::SNS::Subscription

    Properties:

      TopicArn:
        !Ref OrderConfirmationTopic

      Protocol:
        email

      Endpoint:
        !Ref AlertEmail


  # ==========================================================
  # ORDER SNS POLICY
  # ==========================================================

  OrderConfirmationTopicPolicy:
    Type: AWS::SNS::TopicPolicy

    Properties:

      Topics:
        - !Ref OrderConfirmationTopic

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Sid: AllowEventBridgePublish

            Effect: Allow

            Principal:
              Service: events.amazonaws.com

            Action: sns:Publish

            Resource: !Ref OrderConfirmationTopic


  # ==========================================================
  # ORDER PLACED RULE
  # ==========================================================

  OrderPlacedEventRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-placed-rule

      Description:
        CloudMart order placed notification rule

      State: ENABLED

      EventBusName:
        !Ref CloudMartEventBus

      EventPattern:

        source:
          - cloudmart.orders

        detail-type:
          - OrderPlaced

      Targets:

        - Id: OrderPlacedSnsTarget

          Arn: !Ref OrderConfirmationTopic


  # ==========================================================
  # ORDER PENDING RULE
  # ==========================================================

  OrderPendingEventRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-pending-rule

      Description:
        CloudMart order pending notification rule

      State: ENABLED

      EventBusName:
        !Ref CloudMartEventBus

      EventPattern:

        source:
          - cloudmart.orders

        detail-type:
          - OrderPending

      Targets:

        - Id: OrderPendingSnsTarget

          Arn: !Ref OrderConfirmationTopic


  # ==========================================================
  # ORDER CONFIRMED RULE
  # ==========================================================

  OrderConfirmedEventRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-confirmed-rule

      Description:
        CloudMart order confirmed notification rule

      State: ENABLED

      EventBusName:
        !Ref CloudMartEventBus

      EventPattern:

        source:
          - cloudmart.orders

        detail-type:
          - OrderConfirmed

      Targets:

        - Id: OrderConfirmedSnsTarget

          Arn: !Ref OrderConfirmationTopic


  # ==========================================================
  # ORDER FAILED RULE
  # ==========================================================

  OrderFailedEventRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-failed-rule

      Description:
        CloudMart order failed notification rule

      State: ENABLED

      EventBusName:
        !Ref CloudMartEventBus

      EventPattern:

        source:
          - cloudmart.orders

        detail-type:
          - OrderFailed

      Targets:

        - Id: OrderFailedSnsTarget

          Arn: !Ref OrderConfirmationTopic


  # ==========================================================
  # ORDER CANCELLED RULE
  # ==========================================================

  OrderCancelledEventRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-cancelled-rule

      Description:
        CloudMart order cancelled notification rule

      State: ENABLED

      EventBusName:
        !Ref CloudMartEventBus

      EventPattern:

        source:
          - cloudmart.orders

        detail-type:
          - OrderCancelled

      Targets:

        - Id: OrderCancelledSnsTarget

          Arn: !Ref OrderConfirmationTopic


  # ==========================================================
  # LOW STOCK SNS TOPIC
  # ==========================================================

  LowStockTopic:
    Type: AWS::SNS::Topic

    Properties:

      TopicName:
        !Sub cloudmart-${Environment}-low-stock-alerts

      DisplayName:
        CloudMart Low Stock Alerts


  # ==========================================================
  # LOW STOCK EMAIL SUBSCRIPTION
  # ==========================================================

  LowStockEmailSubscription:
    Type: AWS::SNS::Subscription

    Properties:

      TopicArn:
        !Ref LowStockTopic

      Protocol:
        email

      Endpoint:
        !Ref AlertEmail


  # ==========================================================
  # LOW STOCK SNS POLICY
  # ==========================================================

  LowStockTopicPolicy:
    Type: AWS::SNS::TopicPolicy

    Properties:

      Topics:
        - !Ref LowStockTopic

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Sid: AllowEventBridgePublish

            Effect: Allow

            Principal:
              Service: events.amazonaws.com

            Action: sns:Publish

            Resource: !Ref LowStockTopic


  # ==========================================================
  # LOW STOCK EVENT RULE
  # ==========================================================

  LowStockEventRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-low-stock-rule

      Description:
        CloudMart low stock alert rule

      State: ENABLED

      EventBusName:
        !Ref CloudMartEventBus

      EventPattern:

        source:
          - cloudmart.inventory

        detail-type:
          - LowStock

      Targets:

        - Id: LowStockSnsTarget

          Arn: !Ref LowStockTopic


Outputs:

  LambdaAuthorizerArn:
    Description: Lambda Authorizer ARN
    Value: !GetAtt LambdaAuthorizer.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-LambdaAuthorizerArn


  LambdaAuthorizerName:
    Description: Lambda Authorizer name
    Value: !Ref LambdaAuthorizer

    Export:
      Name: !Sub cloudmart-${Environment}-LambdaAuthorizerName


  ProductLambdaArn:
    Description: Product Lambda ARN
    Value: !GetAtt ProductLambda.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-ProductLambdaArn


  ProductLambdaName:
    Description: Product Lambda name
    Value: !Ref ProductLambda

    Export:
      Name: !Sub cloudmart-${Environment}-ProductLambdaName


  OrderLambdaArn:
    Description: Order Lambda ARN
    Value: !GetAtt OrderLambda.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-OrderLambdaArn


  OrderLambdaName:
    Description: Order Lambda name
    Value: !Ref OrderLambda

    Export:
      Name: !Sub cloudmart-${Environment}-OrderLambdaName


  OrderProcessorLambdaArn:
    Description: Order Processor Lambda ARN
    Value: !GetAtt OrderProcessorLambda.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-OrderProcessorLambdaArn


  OrderProcessorLambdaName:
    Description: Order Processor Lambda name
    Value: !Ref OrderProcessorLambda

    Export:
      Name: !Sub cloudmart-${Environment}-OrderProcessorLambdaName


  SchemaInitializerLambdaArn:
    Description: Schema Initializer Lambda ARN
    Value: !GetAtt SchemaInitializerLambda.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-SchemaInitializerLambdaArn


  SchemaInitializerLambdaName:
    Description: Schema Initializer Lambda name
    Value: !Ref SchemaInitializerLambda

    Export:
      Name: !Sub cloudmart-${Environment}-SchemaInitializerLambdaName


  PyMySQLLayerArn:
    Description: PyMySQL Layer ARN
    Value: !Ref PyMySQLLayer

    Export:
      Name: !Sub cloudmart-${Environment}-PyMySQLLayerArn


  EventBusName:
    Description: CloudMart EventBridge Event Bus name
    Value: !Ref CloudMartEventBus

    Export:
      Name: !Sub cloudmart-${Environment}-EventBusName


  EventBusArn:
    Description: CloudMart EventBridge Event Bus ARN
    Value: !GetAtt CloudMartEventBus.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-EventBusArn


  LowStockTopicArn:
    Description: Low stock SNS topic ARN
    Value: !Ref LowStockTopic

    Export:
      Name: !Sub cloudmart-${Environment}-LowStockTopicArn


  OrderConfirmationTopicArn:
    Description: Order notification SNS topic ARN
    Value: !Ref OrderConfirmationTopic

    Export:
      Name: !Sub cloudmart-${Environment}-OrderConfirmationTopicArn


  OrderPlacedEventRuleArn:
    Description: OrderPlaced EventBridge rule ARN
    Value: !GetAtt OrderPlacedEventRule.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-OrderPlacedEventRuleArn


  OrderPendingEventRuleArn:
    Description: OrderPending EventBridge rule ARN
    Value: !GetAtt OrderPendingEventRule.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-OrderPendingEventRuleArn


  OrderConfirmedEventRuleArn:
    Description: OrderConfirmed EventBridge rule ARN
    Value: !GetAtt OrderConfirmedEventRule.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-OrderConfirmedEventRuleArn


  OrderFailedEventRuleArn:
    Description: OrderFailed EventBridge rule ARN
    Value: !GetAtt OrderFailedEventRule.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-OrderFailedEventRuleArn


  OrderCancelledEventRuleArn:
    Description: OrderCancelled EventBridge rule ARN
    Value: !GetAtt OrderCancelledEventRule.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-OrderCancelledEventRuleArn


  LowStockEventRuleArn:
    Description: LowStock EventBridge rule ARN
    Value: !GetAtt LowStockEventRule.Arn

    Export:
      Name: !Sub cloudmart-${Environment}-LowStockEventRuleArn