AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Application-Events Stack.
  Creates Lambda Authorizer, PyMySQL layer, Product Lambda,
  Order Lambda, Order Processor Lambda, Schema Initializer,
  EventBridge order lifecycle events, EventBridge low-stock rule,
  and SNS alerts.

Parameters:

  # ==========================================================
  # ENVIRONMENT
  # ==========================================================

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment


  # ==========================================================
  # DATABASE SSM PARAMETERS
  # ==========================================================

  DBName:
    Type: String
    Default: /cloudmart/dev/db/name
    Description: SSM parameter containing database name

  DBEndpoint:
    Type: String
    Default: /cloudmart/dev/db/endpoint
    Description: SSM parameter containing RDS endpoint

  DBPort:
    Type: String
    Default: /cloudmart/dev/db/port
    Description: SSM parameter containing RDS port

  DBUsername:
    Type: String
    Default: /cloudmart/dev/db/username
    Description: SSM parameter containing database username

  DBPassword:
    Type: String
    Default: /cloudmart/dev/db/password
    Description: SSM parameter containing database password


  # ==========================================================
  # AUTHENTICATION
  # ==========================================================

  AuthTokenParameter:
    Type: String
    Default: /cloudmart/dev/auth/token
    Description: SSM SecureString containing authentication token


  # ==========================================================
  # LAMBDA ARTIFACTS
  # ==========================================================

  LambdaArtifactBucket:
    Type: String
    Description: S3 bucket containing Lambda artifacts

  PyMySQLLayerS3Key:
    Type: String
    Description: S3 object key for the PyMySQL Lambda layer

  ProductLambdaS3Key:
    Type: String
    Description: S3 object key for the Product Lambda package

  OrderLambdaS3Key:
    Type: String
    Description: S3 object key for the Order Lambda package

  OrderProcessorLambdaS3Key:
    Type: String
    Description: S3 object key for the Order Processor Lambda package

  SchemaS3Key:
    Type: String
    Description: S3 object key for database/schema.sql


  # ==========================================================
  # SNS ALERT EMAIL
  # ==========================================================

  AlertEmail:
    Type: String
    Description: Email address for CloudMart alerts


# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ==========================================================
  # CUSTOM EVENTBRIDGE EVENT BUS
  # ==========================================================

  CloudMartEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub cloudmart-${Environment}-event-bus

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-event-bus
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================
  # LAMBDA AUTHORISER
  # ==========================================================

  LambdaAuthorizer:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-lambda-authorizer

      Runtime:
        python3.12

      Handler:
        index.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-LambdaAuthorizerRoleArn

      Timeout: 10

      MemorySize: 128

      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PublicSubnetId

      Environment:

        Variables:

          AUTH_TOKEN_PARAMETER:
            !Ref AuthTokenParameter

      Code:

        ZipFile: |
          import json
          import os

          import boto3


          ssm = boto3.client("ssm")


          TOKEN_PARAMETER = os.environ[
              "AUTH_TOKEN_PARAMETER"
          ]


          def log_event(level, message, **details):

              record = {
                  "level": level,
                  "service": "cloudmart-lambda-authorizer",
                  "message": message,
                  **details
              }

              print(
                  json.dumps(record)
              )


          def get_expected_token():

              response = ssm.get_parameter(
                  Name=TOKEN_PARAMETER,
                  WithDecryption=True
              )

              return response[
                  "Parameter"
              ][
                  "Value"
              ]


          def generate_policy(
              principal_id,
              effect,
              resource
          ):

              return {
                  "principalId": principal_id,

                  "policyDocument": {
                      "Version": "2012-10-17",

                      "Statement": [
                          {
                              "Action":
                                  "execute-api:Invoke",

                              "Effect":
                                  effect,

                              "Resource":
                                  resource
                          }
                      ]
                  }
              }


          def get_stage_resource(method_arn):

              parts = method_arn.split(":")

              if len(parts) < 6:
                  return method_arn

              api_gateway_part = parts[5]

              api_parts = (
                  api_gateway_part.split("/")
              )

              if len(api_parts) < 2:
                  return method_arn

              api_id = api_parts[0]

              stage = api_parts[1]

              return (
                  ":".join(parts[:5])
                  + ":"
                  + api_id
                  + "/"
                  + stage
                  + "/*/*"
              )


          def lambda_handler(event, context):

              request_id = (
                  context.aws_request_id
              )

              method_arn = event.get(
                  "methodArn",
                  "*"
              )

              try:

                  log_event(
                      "INFO",
                      "Authorization request received",
                      request_id=request_id
                  )

                  authorization_token = event.get(
                      "authorizationToken",
                      ""
                  )

                  if not authorization_token:

                      headers = (
                          event.get(
                              "headers",
                              {}
                          )
                          or {}
                      )

                      authorization_token = (
                          headers.get(
                              "Authorization"
                          )
                          or
                          headers.get(
                              "authorization"
                          )
                          or
                          ""
                      )

                  if not authorization_token:

                      log_event(
                          "WARN",
                          "Authorization token missing",
                          request_id=request_id
                      )

                      return generate_policy(
                          "unauthorized",
                          "Deny",
                          method_arn
                      )

                  provided_token = (
                      authorization_token.strip()
                  )

                  if provided_token.startswith(
                      "Bearer "
                  ):

                      provided_token = (
                          provided_token[
                              len("Bearer "):
                          ]
                          .strip()
                      )

                  if not provided_token:

                      log_event(
                          "WARN",
                          "Authorization token empty",
                          request_id=request_id
                      )

                      return generate_policy(
                          "unauthorized",
                          "Deny",
                          method_arn
                      )

                  expected_token = (
                      get_expected_token()
                  )

                  if (
                      provided_token
                      !=
                      expected_token
                  ):

                      log_event(
                          "WARN",
                          "Authorization token invalid",
                          request_id=request_id
                      )

                      return generate_policy(
                          "unauthorized",
                          "Deny",
                          method_arn
                      )

                  stage_resource = (
                      get_stage_resource(
                          method_arn
                      )
                  )

                  log_event(
                      "INFO",
                      "Authorization successful",
                      request_id=request_id
                  )

                  return generate_policy(
                      "authorized-user",
                      "Allow",
                      stage_resource
                  )

              except Exception as error:

                  log_event(
                      "ERROR",
                      "Authorization failed",
                      request_id=request_id,
                      error_type=type(error).__name__,
                      error=str(error)
                  )

                  return generate_policy(
                      "unauthorized",
                      "Deny",
                      method_arn
                  )


      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-lambda-authorizer

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # AUTHORISER INVOCATION PERMISSION
  # ==========================================================

  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref LambdaAuthorizer

      Action:
        lambda:InvokeFunction

      Principal:
        apigateway.amazonaws.com


  # ==========================================================
  # PYMYSQL LAMBDA LAYER
  # ==========================================================

  PyMySQLLayer:
    Type: AWS::Lambda::LayerVersion

    Properties:

      LayerName:
        !Sub cloudmart-${Environment}-pymysql

      Description:
        PyMySQL and cryptography dependencies for CloudMart Lambdas

      CompatibleRuntimes:
        - python3.12

      CompatibleArchitectures:
        - x86_64

      Content:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref PyMySQLLayerS3Key


  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-product-lambda

      Runtime:
        python3.12

      Handler:
        index.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-ProductLambdaRoleArn

      Timeout: 30

      MemorySize: 256

      Layers:
        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName

          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint

          DB_PORT_PARAMETER:
            !Ref DBPort

          DB_USERNAME_PARAMETER:
            !Ref DBUsername

          DB_PASSWORD_PARAMETER:
            !Ref DBPassword

      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref ProductLambdaS3Key

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-product-lambda

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # ORDER LAMBDA
  # ==========================================================

  OrderLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-order-lambda

      Runtime:
        python3.12

      Handler:
        lambda_function.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-OrderLambdaRoleArn

      Timeout: 30

      MemorySize: 256

      Layers:
        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName

          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint

          DB_PORT_PARAMETER:
            !Ref DBPort

          DB_USERNAME_PARAMETER:
            !Ref DBUsername

          DB_PASSWORD_PARAMETER:
            !Ref DBPassword

          ORDER_PROCESSOR_FUNCTION_NAME:
            !Ref OrderProcessorLambda

      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref OrderLambdaS3Key

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-order-lambda

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # ORDER PROCESSOR LAMBDA
  # ==========================================================

  OrderProcessorLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-order-processor

      Runtime:
        python3.12

      Handler:
        lambda_function.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-OrderProcessorLambdaRoleArn

      Timeout: 60

      MemorySize: 256

      Layers:
        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName

          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint

          DB_PORT_PARAMETER:
            !Ref DBPort

          DB_USERNAME_PARAMETER:
            !Ref DBUsername

          DB_PASSWORD_PARAMETER:
            !Ref DBPassword

      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref OrderProcessorLambdaS3Key

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-order-processor

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # ORDER LAMBDA -> ORDER PROCESSOR PERMISSION
  # ==========================================================

  OrderProcessorInvokePermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref OrderProcessorLambda

      Action:
        lambda:InvokeFunction

      Principal:
        lambda.amazonaws.com

      SourceArn:
        !GetAtt OrderLambda.Arn


  # ==========================================================
  # SCHEMA INITIALIZER LAMBDA
  # ==========================================================

  SchemaInitializerLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-schema-initializer

      Runtime:
        python3.12

      Handler:
        index.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-ProductLambdaRoleArn

      Timeout: 300

      MemorySize: 256

      Layers:
        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName

          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint

          DB_PORT_PARAMETER:
            !Ref DBPort

          DB_USERNAME_PARAMETER:
            !Ref DBUsername

          DB_PASSWORD_PARAMETER:
            !Ref DBPassword

          SCHEMA_BUCKET:
            !Ref LambdaArtifactBucket

          SCHEMA_KEY:
            !Ref SchemaS3Key

      Code:

        ZipFile: |
          import json
          import os

          import boto3
          import pymysql


          s3 = boto3.client("s3")
          ssm = boto3.client("ssm")


          DB_NAME_PARAMETER = os.environ[
              "DB_NAME_PARAMETER"
          ]

          DB_ENDPOINT_PARAMETER = os.environ[
              "DB_ENDPOINT_PARAMETER"
          ]

          DB_PORT_PARAMETER = os.environ[
              "DB_PORT_PARAMETER"
          ]

          DB_USERNAME_PARAMETER = os.environ[
              "DB_USERNAME_PARAMETER"
          ]

          DB_PASSWORD_PARAMETER = os.environ[
              "DB_PASSWORD_PARAMETER"
          ]

          SCHEMA_BUCKET = os.environ[
              "SCHEMA_BUCKET"
          ]

          SCHEMA_KEY = os.environ[
              "SCHEMA_KEY"
          ]


          def log_event(
              level,
              message,
              **details
          ):

              record = {
                  "level": level,
                  "service":
                      "cloudmart-schema-initializer",
                  "message":
                      message,
                  **details
              }

              print(
                  json.dumps(record)
              )


          def get_parameter(name):

              result = ssm.get_parameter(
                  Name=name,
                  WithDecryption=True
              )

              return result[
                  "Parameter"
              ][
                  "Value"
              ]


          def get_db_connection():

              return pymysql.connect(
                  host=get_parameter(
                      DB_ENDPOINT_PARAMETER
                  ),
                  port=int(
                      get_parameter(
                          DB_PORT_PARAMETER
                      )
                  ),
                  user=get_parameter(
                      DB_USERNAME_PARAMETER
                  ),
                  password=get_parameter(
                      DB_PASSWORD_PARAMETER
                  ),
                  database=get_parameter(
                      DB_NAME_PARAMETER
                  ),
                  connect_timeout=10,
                  read_timeout=30,
                  write_timeout=30,
                  cursorclass=
                      pymysql.cursors.DictCursor
              )


          def load_schema():

              result = s3.get_object(
                  Bucket=SCHEMA_BUCKET,
                  Key=SCHEMA_KEY
              )

              return result[
                  "Body"
              ].read().decode(
                  "utf-8"
              )


          def execute_schema(
              connection,
              schema
          ):

              lines = []

              for line in schema.splitlines():

                  stripped = line.strip()

                  if stripped.startswith("--"):
                      continue

                  if not stripped:
                      continue

                  lines.append(line)

              cleaned_schema = "\n".join(
                  lines
              )

              statements = [

                  statement.strip()

                  for statement
                  in cleaned_schema.split(";")

                  if statement.strip()
              ]

              executed = 0

              with connection.cursor() as cursor:

                  for statement in statements:

                      cursor.execute(
                          statement
                      )

                      executed += 1

              connection.commit()

              return executed


          def lambda_handler(
              event,
              context
          ):

              request_id = (
                  context.aws_request_id
              )

              connection = None

              log_event(
                  "INFO",
                  "Schema initialization request received",
                  request_id=request_id
              )

              try:

                  schema = load_schema()

                  log_event(
                      "INFO",
                      "Schema file loaded from S3",
                      request_id=request_id,
                      bucket=SCHEMA_BUCKET,
                      key=SCHEMA_KEY
                  )

                  connection = (
                      get_db_connection()
                  )

                  log_event(
                      "INFO",
                      "RDS connection established",
                      request_id=request_id
                  )

                  statement_count = (
                      execute_schema(
                          connection,
                          schema
                      )
                  )

                  log_event(
                      "INFO",
                      "Database schema applied successfully",
                      request_id=request_id,
                      statements_executed=
                          statement_count
                  )

                  return {
                      "statusCode": 200,
                      "headers": {
                          "Content-Type":
                              "application/json"
                      },
                      "body": json.dumps({
                          "message":
                              "CloudMart database schema applied successfully",
                          "statements_executed":
                              statement_count,
                          "request_id":
                              request_id
                      })
                  }

              except Exception as exc:

                  if connection is not None:

                      try:
                          connection.rollback()
                      except Exception:
                          pass

                  log_event(
                      "ERROR",
                      "Database schema initialization failed",
                      request_id=request_id,
                      error_type=
                          type(exc).__name__,
                      error=str(exc)
                  )

                  return {
                      "statusCode": 500,
                      "headers": {
                          "Content-Type":
                              "application/json"
                      },
                      "body": json.dumps({
                          "message":
                              "Database schema initialization failed",
                          "error_type":
                              type(exc).__name__,
                          "request_id":
                              request_id
                      })
                  }

              finally:

                  if connection is not None:

                      try:
                          connection.close()
                      except Exception:
                          pass


      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-schema-initializer

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # ORDER CONFIRMATION SNS TOPIC
  # ==========================================================

  OrderConfirmationTopic:
    Type: AWS::SNS::Topic

    Properties:

      TopicName:
        !Sub cloudmart-${Environment}-order-confirmations

      DisplayName:
        !Sub CloudMart ${Environment} Order Confirmations

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-order-confirmations

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # ORDER CONFIRMATION EMAIL SUBSCRIPTION
  # ==========================================================

  OrderConfirmationEmailSubscription:
    Type: AWS::SNS::Subscription

    Properties:

      TopicArn:
        !Ref OrderConfirmationTopic

      Protocol:
        email

      Endpoint:
        !Ref AlertEmail


  # ==========================================================
  # ORDER CONFIRMATION SNS POLICY
  # ==========================================================

  OrderConfirmationTopicPolicy:
    Type: AWS::SNS::TopicPolicy

    Properties:

      Topics:
        - !Ref OrderConfirmationTopic

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Sid:
              AllowEventBridgeOrderConfirmation

            Effect:
              Allow

            Principal:
              Service:
                events.amazonaws.com

            Action:
              - sns:Publish

            Resource:
              !Ref OrderConfirmationTopic


  # ==========================================================
  # EVENTBRIDGE - ORDER CONFIRMED
  # ==========================================================

  OrderConfirmedEventRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-confirmed-rule

      Description:
        !Sub CloudMart ${Environment} order confirmation notification rule

      State:
        ENABLED

      EventBusName:
        !Ref CloudMartEventBus

      EventPattern:

        source:
          - cloudmart.order

        detail-type:
          - OrderConfirmed

      Targets:

        - Id:
            OrderConfirmationSnsTarget

          Arn:
            !Ref OrderConfirmationTopic

          InputTransformer:

            InputPathsMap:

              order_id:
                $.detail.order_id

              customer_id:
                $.detail.customer_id

              status:
                $.detail.status

            InputTemplate: |
              "CloudMart Order Confirmed\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nStatus: <status>\n\nYour order has been successfully confirmed."


  # ==========================================================
  # EVENTBRIDGE - ORDER PLACED
  # ==========================================================

  OrderPlacedEventRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-placed-rule

      Description:
        !Sub CloudMart ${Environment} order placed notification rule

      State:
        ENABLED

      EventBusName:
        !Ref CloudMartEventBus

      EventPattern:

        source:
          - cloudmart.order

        detail-type:
          - OrderPlaced

      Targets:

        - Id:
            OrderPlacedSnsTarget

          Arn:
            !Ref OrderConfirmationTopic

          InputTransformer:

            InputPathsMap:

              order_id:
                $.detail.order_id

              customer_id:
                $.detail.customer_id

              status:
                $.detail.status

            InputTemplate: |
              "CloudMart Order Created\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nStatus: <status>\n\nYour order has been created successfully."


  # ==========================================================
  # EVENTBRIDGE - ORDER FAILED
  # ==========================================================

  OrderFailedEventRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-failed-rule

      Description:
        !Sub CloudMart ${Environment} order failure notification rule

      State:
        ENABLED

      EventBusName:
        !Ref CloudMartEventBus

      EventPattern:

        source:
          - cloudmart.order

        detail-type:
          - OrderFailed

      Targets:

        - Id:
            OrderFailedSnsTarget

          Arn:
            !Ref OrderConfirmationTopic

          InputTransformer:

            InputPathsMap:

              order_id:
                $.detail.order_id

              customer_id:
                $.detail.customer_id

              error:
                $.detail.error

            InputTemplate: |
              "CloudMart Order Failed\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nError: <error>\n\nThe order could not be completed and inventory was not deducted."


  # ==========================================================
  # SNS LOW-STOCK ALERT TOPIC
  # ==========================================================

  LowStockTopic:
    Type: AWS::SNS::Topic

    Properties:

      TopicName:
        !Sub cloudmart-${Environment}-low-stock-alerts

      DisplayName:
        !Sub CloudMart ${Environment} Low Stock Alerts

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-low-stock-alerts

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # SNS EMAIL SUBSCRIPTION
  # ==========================================================

  LowStockEmailSubscription:
    Type: AWS::SNS::Subscription

    Properties:

      TopicArn:
        !Ref LowStockTopic

      Protocol:
        email

      Endpoint:
        !Ref AlertEmail


  # ==========================================================
  # SNS TOPIC POLICY
  # ==========================================================

  LowStockTopicPolicy:
    Type: AWS::SNS::TopicPolicy

    Properties:

      Topics:
        - !Ref LowStockTopic

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Sid:
              AllowEventBridgePublish

            Effect:
              Allow

            Principal:
              Service:
                events.amazonaws.com

            Action:
              - sns:Publish

            Resource:
              !Ref LowStockTopic


  # ==========================================================
  # EVENTBRIDGE LOW-STOCK RULE
  # ==========================================================

  LowStockEventRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-low-stock-rule

      Description:
        !Sub CloudMart ${Environment} low-stock inventory alert rule

      State:
        ENABLED

      EventBusName:
        !Ref CloudMartEventBus

      EventPattern:

        source:
          - cloudmart.product

        detail-type:
          - Inventory Changed

        detail:

          low_stock:
            - true

      Targets:

        - Id:
            LowStockSnsTarget

          Arn:
            !Ref LowStockTopic

          InputTransformer:

            InputPathsMap:

              product_id:
                $.detail.product_id

              product_name:
                $.detail.product_name

              old_stock:
                $.detail.old_stock

              new_stock:
                $.detail.new_stock

              low_stock_threshold:
                $.detail.low_stock_threshold

            InputTemplate: |
              "CloudMart Low Stock Alert\n\nProduct ID: <product_id>\nProduct: <product_name>\nPrevious Stock: <old_stock>\nCurrent Stock: <new_stock>\nLow Stock Threshold: <low_stock_threshold>\n\nThe product stock is at or below the low-stock threshold."


  # ==========================================================
  # EVENTBRIDGE - ORDER DELIVERED
  # ==========================================================

  OrderDeliveredEventRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-delivered-rule

      Description:
        !Sub CloudMart ${Environment} order delivered notification rule

      State:
        ENABLED

      EventBusName:
        !Ref CloudMartEventBus

      EventPattern:

        source:
          - cloudmart.order

        detail-type:
          - OrderDelivered

      Targets:

        - Id:
            OrderDeliveredSnsTarget

          Arn:
            !Ref OrderConfirmationTopic

          InputTransformer:

            InputPathsMap:

              order_id:
                $.detail.order_id

              customer_id:
                $.detail.customer_id

              status:
                $.detail.status

            InputTemplate: |
              "CloudMart Order Delivered\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nStatus: <status>\n\nYour order has been delivered successfully."


  # ==========================================================
  # EVENTBRIDGE - ORDER CANCELLED
  # ==========================================================

  OrderCancelledEventRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-cancelled-rule

      Description:
        !Sub CloudMart ${Environment} order cancelled notification rule

      State:
        ENABLED

      EventBusName:
        !Ref CloudMartEventBus

      EventPattern:

        source:
          - cloudmart.order

        detail-type:
          - OrderCancelled

      Targets:

        - Id:
            OrderCancelledSnsTarget

          Arn:
            !Ref OrderConfirmationTopic

          InputTransformer:

            InputPathsMap:

              order_id:
                $.detail.order_id

              customer_id:
                $.detail.customer_id

              status:
                $.detail.status

              note:
                $.detail.note

            InputTemplate: |
              "CloudMart Order Cancelled\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nStatus: <status>\nNote: <note>\n\nThe order was cancelled. Inventory was restored where applicable."


