AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Application-Events Stack.
  Creates Lambda Authorizer, PyMySQL layer, Product Lambda,
  Order Lambda, Order Processor Lambda,
  EventBridge order lifecycle events, EventBridge low-stock rule,
  and SNS alerts.

Parameters:

  # ==========================================================
  # ENVIRONMENT
  # ==========================================================

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment


  # ==========================================================
  # DATABASE SSM PARAMETERS
  # ==========================================================

  DBName:
    Type: String
    Default: /cloudmart/dev/db/name
    Description: SSM parameter containing database name

  DBEndpoint:
    Type: String
    Default: /cloudmart/dev/db/endpoint
    Description: SSM parameter containing RDS endpoint

  DBPort:
    Type: String
    Default: /cloudmart/dev/db/port
    Description: SSM parameter containing RDS port

  DBUsername:
    Type: String
    Default: /cloudmart/dev/db/username
    Description: SSM parameter containing database username

  DBPassword:
    Type: String
    Default: /cloudmart/dev/db/password
    Description: SSM parameter containing database password


  # ==========================================================
  # AUTHENTICATION
  # ==========================================================

  AuthTokenParameter:
    Type: String
    Default: /cloudmart/dev/auth/token
    Description: SSM SecureString containing authentication token
  CustomerTokensParameter:
    Type: String
    Default: /cloudmart/dev/auth/customer-tokens
    Description: SSM SecureString containing customer authentication tokens

  # ==========================================================
  # LAMBDA ARTIFACTS
  # ==========================================================

  LambdaArtifactBucket:
    Type: String
    Description: S3 bucket containing Lambda artifacts

  PyMySQLLayerS3Key:
    Type: String
    Description: S3 object key for the PyMySQL Lambda layer

  ProductLambdaS3Key:
    Type: String
    Description: S3 object key for the Product Lambda package

  OrderLambdaS3Key:
    Type: String
    Description: S3 object key for the Order Lambda package

  OrderProcessorLambdaS3Key:
    Type: String
    Description: S3 object key for the Order Processor Lambda package

  AlertEmail:
    Type: String
    Description: Email address for CloudMart alerts


# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ==========================================================
  # CUSTOM EVENTBRIDGE EVENT BUS
  # ==========================================================

  CloudMartEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub cloudmart-${Environment}-event-bus

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-event-bus
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================
  # LAMBDA AUTHORISER
  # ==========================================================

  # ==========================================================
# LAMBDA AUTHORIZER
# ==========================================================

LambdaAuthorizer:
  Type: AWS::Lambda::Function

  Properties:

    FunctionName: !Sub cloudmart-${Environment}-lambda-authorizer

    Runtime: python3.12

    Handler: index.lambda_handler

    Role:
      Fn::ImportValue:
        Fn::Sub: cloudmart-${Environment}-LambdaAuthorizerRoleArn

    Timeout: 10

    MemorySize: 128

    VpcConfig:

      SecurityGroupIds:
        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

      SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

    Environment:

      Variables:

        ADMIN_TOKEN_PARAMETER: !Ref AuthTokenParameter

        CUSTOMER_TOKENS_PARAMETER: !Ref CustomerTokensParameter

    Code:

      ZipFile: |

        import json
        import os
        import boto3


        ssm = boto3.client("ssm")


        def get_parameter(parameter_name):

            response = ssm.get_parameter(
                Name=parameter_name,
                WithDecryption=True
            )

            return response["Parameter"]["Value"]


        def generate_policy(
            principal_id,
            effect,
            resource,
            auth_context=None
        ):

            policy = {
                "principalId": principal_id,
                "policyDocument": {
                    "Version": "2012-10-17",
                    "Statement": [
                        {
                            "Action": "execute-api:Invoke",
                            "Effect": effect,
                            "Resource": resource
                        }
                    ]
                }
            }

            if auth_context:
                policy["context"] = auth_context

            return policy


        def get_request_details(method_arn):

            try:

                execute_api_part = method_arn.split(":")[5]

                parts = execute_api_part.split("/")

                http_method = (
                    parts[2]
                    if len(parts) > 2
                    else ""
                )

                resource_path = (
                    "/"
                    + "/".join(parts[3:])
                    if len(parts) > 3
                    else "/"
                )

                return http_method, resource_path

            except Exception:

                return "", ""


        def normalize_path(resource_path):

            parts = [
                part
                for part in resource_path.split("/")
                if part
            ]


            if len(parts) == 1:

                if parts[0] == "products":
                    return "/products"

                if parts[0] == "orders":
                    return "/orders"


            if (
                len(parts) == 2
                and parts[0] == "products"
            ):
                return "/products/{id}"


            if (
                len(parts) == 2
                and parts[0] == "orders"
            ):
                return "/orders/{id}"


            if (
                len(parts) == 3
                and parts[0] == "orders"
                and parts[2] == "status"
            ):
                return "/orders/{id}/status"


            return resource_path


        def customer_is_allowed(
            http_method,
            resource_path
        ):

            normalized_path = normalize_path(
                resource_path
            )

            allowed_routes = {

                ("GET", "/products"),

                ("GET", "/products/{id}"),

                ("POST", "/orders"),

                ("GET", "/orders"),

                ("GET", "/orders/{id}"),

                (
                    "PATCH",
                    "/orders/{id}/status"
                )
            }

            return (
                http_method,
                normalized_path
            ) in allowed_routes


        def lambda_handler(event, context):

            method_arn = event.get(
                "methodArn",
                "*"
            )


            try:

                authorization_header = event.get(
                    "authorizationToken",
                    ""
                )


                if not authorization_header:

                    return generate_policy(
                        "unauthorized",
                        "Deny",
                        method_arn
                    )


                provided_token = (
                    authorization_header.strip()
                )


                if provided_token.lower().startswith(
                    "bearer "
                ):

                    provided_token = (
                        provided_token[7:].strip()
                    )


                if not provided_token:

                    return generate_policy(
                        "unauthorized",
                        "Deny",
                        method_arn
                    )


                admin_parameter = os.environ[
                    "ADMIN_TOKEN_PARAMETER"
                ]

                customer_parameter = os.environ[
                    "CUSTOMER_TOKENS_PARAMETER"
                ]


                admin_token = get_parameter(
                    admin_parameter
                )

                customer_tokens_value = get_parameter(
                    customer_parameter
                )


                customer_tokens = json.loads(
                    customer_tokens_value
                )


                (
                    http_method,
                    resource_path
                ) = get_request_details(
                    method_arn
                )


                # ADMIN

                if provided_token == admin_token:

                    return generate_policy(
                        "admin",
                        "Allow",
                        method_arn,
                        {
                            "role": "ADMIN",
                            "customer_id": ""
                        }
                    )


                # CUSTOMER

                customer_id = customer_tokens.get(
                    provided_token
                )


                if customer_id is None:

                    return generate_policy(
                        "unauthorized",
                        "Deny",
                        method_arn
                    )


                customer_id = int(customer_id)


                if not customer_is_allowed(
                    http_method,
                    resource_path
                ):

                    return generate_policy(
                        f"customer-{customer_id}",
                        "Deny",
                        method_arn
                    )


                return generate_policy(
                    f"customer-{customer_id}",
                    "Allow",
                    method_arn,
                    {
                        "role": "CUSTOMER",
                        "customer_id": str(customer_id)
                    }
                )


            except Exception as exc:

                print(
                    json.dumps(
                        {
                            "error_type": type(exc).__name__,
                            "error": str(exc)
                        }
                    )
                )


                return generate_policy(
                    "unauthorized",
                    "Deny",
                    method_arn
                )


  # ==========================================================
  # AUTHORISER INVOCATION PERMISSION
  # ==========================================================

  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref LambdaAuthorizer

      Action:
        lambda:InvokeFunction

      Principal:
        apigateway.amazonaws.com


  # ==========================================================
  # PYMYSQL LAMBDA LAYER
  # ==========================================================

  PyMySQLLayer:
    Type: AWS::Lambda::LayerVersion

    Properties:

      LayerName:
        !Sub cloudmart-${Environment}-pymysql

      Description:
        PyMySQL and cryptography dependencies for CloudMart Lambdas

      CompatibleRuntimes:
        - python3.12

      CompatibleArchitectures:
        - x86_64

      Content:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref PyMySQLLayerS3Key


  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-product-lambda

      Runtime:
        python3.12

      Handler:
        lambda_function.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-ProductLambdaRoleArn

      Timeout: 30

      MemorySize: 256

      Layers:
        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName

          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint

          DB_PORT_PARAMETER:
            !Ref DBPort

          DB_USERNAME_PARAMETER:
            !Ref DBUsername

          DB_PASSWORD_PARAMETER:
            !Ref DBPassword

          EVENT_BUS_NAME:
            !Ref CloudMartEventBus

      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref ProductLambdaS3Key

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-product-lambda

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # ORDER LAMBDA
  # ==========================================================

  OrderLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-order-lambda

      Runtime:
        python3.12

      Handler:
        lambda_function.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-OrderLambdaRoleArn

      Timeout: 30

      MemorySize: 256

      Layers:
        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName

          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint

          DB_PORT_PARAMETER:
            !Ref DBPort

          DB_USERNAME_PARAMETER:
            !Ref DBUsername

          DB_PASSWORD_PARAMETER:
            !Ref DBPassword

          EVENT_BUS_NAME:
            !Ref CloudMartEventBus

          ORDER_PROCESSOR_FUNCTION_NAME:
            !Ref OrderProcessorLambda

      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref OrderLambdaS3Key

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-order-lambda

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # ORDER PROCESSOR LAMBDA
  # ==========================================================

  OrderProcessorLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-order-processor

      Runtime:
        python3.12

      Handler:
        lambda_function.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-OrderProcessorLambdaRoleArn

      Timeout: 60

      MemorySize: 256

      Layers:
        - !Ref PyMySQLLayer

      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-SecondaryPrivateSubnetId

      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName

          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint

          DB_PORT_PARAMETER:
            !Ref DBPort

          DB_USERNAME_PARAMETER:
            !Ref DBUsername

          DB_PASSWORD_PARAMETER:
            !Ref DBPassword

          EVENT_BUS_NAME:
            !Ref CloudMartEventBus

      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref OrderProcessorLambdaS3Key

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-order-processor

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # ORDER LAMBDA -> ORDER PROCESSOR PERMISSION
  # ==========================================================

  OrderProcessorInvokePermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref OrderProcessorLambda

      Action:
        lambda:InvokeFunction

      Principal:
        lambda.amazonaws.com

      SourceArn:
        !GetAtt OrderLambda.Arn


  # ==========================================================
  # ORDER CONFIRMATION SNS TOPIC
  # ==========================================================

  OrderConfirmationTopic:
    Type: AWS::SNS::Topic

    Properties:

      TopicName:
        !Sub cloudmart-${Environment}-order-confirmations

      DisplayName:
        !Sub CloudMart ${Environment} Order Confirmations

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-order-confirmations

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # ORDER CONFIRMATION EMAIL SUBSCRIPTION
  # ==========================================================

  OrderConfirmationEmailSubscription:
    Type: AWS::SNS::Subscription

    Properties:

      TopicArn:
        !Ref OrderConfirmationTopic

      Protocol:
        email

      Endpoint:
        !Ref AlertEmail


  # ==========================================================
  # ORDER CONFIRMATION SNS POLICY
  # ==========================================================

  OrderConfirmationTopicPolicy:
    Type: AWS::SNS::TopicPolicy

    Properties:

      Topics:
        - !Ref OrderConfirmationTopic

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Sid:
              AllowEventBridgeOrderConfirmation

            Effect:
              Allow

            Principal:
              Service:
                events.amazonaws.com

            Action:
              - sns:Publish

            Resource:
              !Ref OrderConfirmationTopic


  # ==========================================================
  # EVENTBRIDGE - ORDER CONFIRMED
  # ==========================================================

  OrderConfirmedEventRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-confirmed-rule

      Description:
        !Sub CloudMart ${Environment} order confirmation notification rule

      State:
        ENABLED

      EventBusName:
        !Ref CloudMartEventBus

      EventPattern:

        source:
          - cloudmart.orders

        detail-type:
          - OrderConfirmed

      Targets:

        - Id:
            OrderConfirmationSnsTarget

          Arn:
            !Ref OrderConfirmationTopic

          InputTransformer:

            InputPathsMap:

              order_id:
                $.detail.order_id

              customer_id:
                $.detail.customer_id

              status:
                $.detail.status

            InputTemplate: |
              "CloudMart Order Confirmed\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nStatus: <status>\n\nYour order has been successfully confirmed."


  # ==========================================================
  # EVENTBRIDGE - ORDER PLACED
  # ==========================================================

  OrderPlacedEventRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-placed-rule

      Description:
        !Sub CloudMart ${Environment} order placed notification rule

      State:
        ENABLED

      EventBusName:
        !Ref CloudMartEventBus

      EventPattern:

        source:
          - cloudmart.orders

        detail-type:
          - OrderPlaced

      Targets:

        - Id:
            OrderPlacedSnsTarget

          Arn:
            !Ref OrderConfirmationTopic

          InputTransformer:

            InputPathsMap:

              order_id:
                $.detail.order_id

              customer_id:
                $.detail.customer_id

              status:
                $.detail.status

            InputTemplate: |
              "CloudMart Order Placed\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nStatus: <status>\n\nYour order has been created successfully."


  # ==========================================================
  # EVENTBRIDGE - ORDER FAILED
  # ==========================================================

  OrderFailedEventRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-failed-rule

      Description:
        !Sub CloudMart ${Environment} order failure notification rule

      State:
        ENABLED

      EventBusName:
        !Ref CloudMartEventBus

      EventPattern:

        source:
          - cloudmart.orders

        detail-type:
          - OrderFailed

      Targets:

        - Id:
            OrderFailedSnsTarget

          Arn:
            !Ref OrderConfirmationTopic

          InputTransformer:

            InputPathsMap:

              order_id:
                $.detail.order_id

              customer_id:
                $.detail.customer_id

              error:
                $.detail.error

            InputTemplate: |
              "CloudMart Order Failed\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nError: <error>\n\nThe order could not be completed and inventory was not deducted."


  # ==========================================================
  # SNS LOW-STOCK ALERT TOPIC
  # ==========================================================

  LowStockTopic:
    Type: AWS::SNS::Topic

    Properties:

      TopicName:
        !Sub cloudmart-${Environment}-low-stock-alerts

      DisplayName:
        !Sub CloudMart ${Environment} Low Stock Alerts

      Tags:

        - Key: Name
          Value:
            !Sub cloudmart-${Environment}-low-stock-alerts

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # SNS EMAIL SUBSCRIPTION
  # ==========================================================

  LowStockEmailSubscription:
    Type: AWS::SNS::Subscription

    Properties:

      TopicArn:
        !Ref LowStockTopic

      Protocol:
        email

      Endpoint:
        !Ref AlertEmail


  # ==========================================================
  # SNS TOPIC POLICY
  # ==========================================================

  LowStockTopicPolicy:
    Type: AWS::SNS::TopicPolicy

    Properties:

      Topics:
        - !Ref LowStockTopic

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Sid:
              AllowEventBridgePublish

            Effect:
              Allow

            Principal:
              Service:
                events.amazonaws.com

            Action:
              - sns:Publish

            Resource:
              !Ref LowStockTopic


  # ==========================================================
  # EVENTBRIDGE LOW-STOCK RULE
  # ==========================================================

  LowStockEventRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-low-stock-rule

      Description:
        !Sub CloudMart ${Environment} low-stock inventory alert rule

      State:
        ENABLED

      EventBusName:
        !Ref CloudMartEventBus

      EventPattern:

        source:
          - cloudmart.product

        detail-type:
          - Inventory Changed

        detail:

          low_stock:
            - true

      Targets:

        - Id:
            LowStockSnsTarget

          Arn:
            !Ref LowStockTopic

          InputTransformer:

            InputPathsMap:

              product_id:
                $.detail.product_id

              product_name:
                $.detail.product_name

              old_stock:
                $.detail.old_stock

              new_stock:
                $.detail.new_stock

              low_stock_threshold:
                $.detail.low_stock_threshold

            InputTemplate: |
              "CloudMart Low Stock Alert\n\nProduct ID: <product_id>\nProduct: <product_name>\nPrevious Stock: <old_stock>\nCurrent Stock: <new_stock>\nLow Stock Threshold: <low_stock_threshold>\n\nThe product stock is at or below the low-stock threshold."


  # ==========================================================
  # EVENTBRIDGE - ORDER DELIVERED
  # ==========================================================

  OrderDeliveredEventRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-delivered-rule

      Description:
        !Sub CloudMart ${Environment} order delivered notification rule

      State:
        ENABLED

      EventBusName:
        !Ref CloudMartEventBus

      EventPattern:

        source:
          - cloudmart.orders

        detail-type:
          - OrderDelivered

      Targets:

        - Id:
            OrderDeliveredSnsTarget

          Arn:
            !Ref OrderConfirmationTopic

          InputTransformer:

            InputPathsMap:

              order_id:
                $.detail.order_id

              customer_id:
                $.detail.customer_id

              status:
                $.detail.status

            InputTemplate: |
              "CloudMart Order Delivered\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nStatus: <status>\n\nYour order has been delivered successfully."


  # ==========================================================
  # EVENTBRIDGE - ORDER CANCELLED
  # ==========================================================

  OrderCancelledEventRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-cancelled-rule

      Description:
        !Sub CloudMart ${Environment} order cancelled notification rule

      State:
        ENABLED

      EventBusName:
        !Ref CloudMartEventBus

      EventPattern:

        source:
          - cloudmart.orders

        detail-type:
          - OrderCancelled

      Targets:

        - Id:
            OrderCancelledSnsTarget

          Arn:
            !Ref OrderConfirmationTopic

          InputTransformer:

            InputPathsMap:

              order_id:
                $.detail.order_id

              customer_id:
                $.detail.customer_id

              status:
                $.detail.status

              note:
                $.detail.note

            InputTemplate: |
              "CloudMart Order Cancelled\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nStatus: <status>\nNote: <note>\n\nThe order was cancelled. Inventory was restored where applicable."


# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  # ==========================================================
  # AUTHORISER
  # ==========================================================

  LambdaAuthorizerArn:

    Description:
      Lambda Authorizer ARN

    Value:
      !GetAtt LambdaAuthorizer.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-LambdaAuthorizerArn


  LambdaAuthorizerName:

    Description:
      Lambda Authorizer function name

    Value:
      !Ref LambdaAuthorizer

    Export:
      Name:
        !Sub cloudmart-${Environment}-LambdaAuthorizerName


  # ==========================================================
  # PRODUCT
  # ==========================================================

  ProductLambdaArn:

    Description:
      Product Lambda ARN

    Value:
      !GetAtt ProductLambda.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-ProductLambdaArn


  ProductLambdaName:

    Description:
      Product Lambda function name

    Value:
      !Ref ProductLambda

    Export:
      Name:
        !Sub cloudmart-${Environment}-ProductLambdaName


  # ==========================================================
  # ORDER
  # ==========================================================

  OrderLambdaArn:

    Description:
      Order Lambda ARN

    Value:
      !GetAtt OrderLambda.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-OrderLambdaArn


  OrderLambdaName:

    Description:
      Order Lambda function name

    Value:
      !Ref OrderLambda

    Export:
      Name:
        !Sub cloudmart-${Environment}-OrderLambdaName


  OrderProcessorLambdaArn:

    Description:
      Order Processor Lambda ARN

    Value:
      !GetAtt OrderProcessorLambda.Arn

    Export:
      Name:
        !Sub cloudmart-${Environment}-OrderProcessorLambdaArn


  OrderProcessorLambdaName:

    Description:
      Order Processor Lambda function name

    Value:
      !Ref OrderProcessorLambda

    Export:
      Name:
        !Sub cloudmart-${Environment}-OrderProcessorLambdaName


  # ==========================================================
  # PYMYSQL LAYER
  # ==========================================================

  PyMySQLLayerArn:

    Description:
      PyMySQL Lambda Layer ARN

    Value:
      !Ref PyMySQLLayer

    Export:
      Name:
        !Sub cloudmart-${Environment}-PyMySQLLayerArn


  # ==========================================================
  # ORDER SNS
  # ==========================================================

  OrderConfirmationTopicArn:

    Description:
      SNS topic ARN for confirmed order notifications

    Value:
      !Ref OrderConfirmationTopic

    Export:
      Name:
        !Sub cloudmart-${Environment}-OrderConfirmationTopicArn


  OrderConfirmationTopicName:

    Description:
      SNS topic name for confirmed order notifications

    Value:
      !GetAtt OrderConfirmationTopic.TopicName

    Export:
      Name:
        !Sub cloudmart-${Environment}-OrderConfirmationTopicName


  # ==========================================================
  # LOW-STOCK SNS
  # ==========================================================

  LowStockTopicArn:

    Description:
      SNS topic ARN for low-stock alerts

    Value:
      !Ref LowStockTopic

    Export:
      Name:
        !Sub cloudmart-${Environment}-LowStockTopicArn


  LowStockTopicName:

