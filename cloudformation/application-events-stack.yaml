AWSTemplateFormatVersion: "2010-09-09"

Description: >
  CloudMart Application and Events Stack.
  Creates Lambda functions, EventBridge resources,
  SNS notifications, and Lambda integrations.

# ==========================================================
# PARAMETERS
# ==========================================================

Parameters:

  Environment:
    Type: String
    Default: dev

    AllowedValues:
      - dev
      - prod


  LambdaArtifactBucket:
    Type: String


  PyMySQLLayerS3Key:
    Type: String


  ProductLambdaS3Key:
    Type: String


  OrderLambdaS3Key:
    Type: String


  OrderProcessorLambdaS3Key:
    Type: String


  AuthorizerLambdaS3Key:
    Type: String


  # Kept for deployment workflow compatibility
  SchemaS3Key:
    Type: String


  DBName:
    Type: String


  DBEndpoint:
    Type: String


  DBPort:
    Type: String


  DBUsername:
    Type: String


  DBPassword:
    Type: String


  AuthTokenParameter:
    Type: String


  CustomerTokensParameter:
    Type: String


  AlertEmail:
    Type: String


# ==========================================================
# RESOURCES
# ==========================================================

Resources:


  # ==========================================================
  # PYMYSQL LAMBDA LAYER
  # ==========================================================

  PyMySQLLayer:

    Type: AWS::Lambda::LayerVersion

    Properties:

      LayerName:
        !Sub "cloudmart-${Environment}-pymysql"


      Description: >
        PyMySQL dependency layer for CloudMart Lambda functions


      Content:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref PyMySQLLayerS3Key


      CompatibleRuntimes:
        - python3.12


      CompatibleArchitectures:
        - x86_64


  # ==========================================================
  # EVENTBRIDGE EVENT BUS
  # ==========================================================

  CloudMartEventBus:

    Type: AWS::Events::EventBus

    Properties:

      Name:
        !Sub "cloudmart-${Environment}-event-bus"


  # ==========================================================
  # SNS ALERT TOPIC
  # ==========================================================

  AlertTopic:

    Type: AWS::SNS::Topic

    Properties:

      TopicName:
        !Sub "cloudmart-${Environment}-alerts"


  # ==========================================================
  # SNS EMAIL SUBSCRIPTION
  # ==========================================================

  AlertSubscription:

    Type: AWS::SNS::Subscription

    Properties:

      Protocol:
        email

      TopicArn:
        !Ref AlertTopic

      Endpoint:
        !Ref AlertEmail


  # ==========================================================
  # SNS TOPIC POLICY
  # ALLOWS EVENTBRIDGE TO PUBLISH ALERTS
  # ==========================================================

  AlertTopicPolicy:

    Type: AWS::SNS::TopicPolicy

    Properties:

      Topics:
        - !Ref AlertTopic

      PolicyDocument:

        Version: "2012-10-17"

        Statement:

          - Sid: AllowEventBridgePublish

            Effect: Allow

            Principal:

              Service: events.amazonaws.com

            Action:
              - sns:Publish

            Resource:
              !Ref AlertTopic


  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub "cloudmart-${Environment}-product-lambda"


      Runtime:
        python3.12


      Handler:
        lambda_function.lambda_handler


      Role:

        Fn::ImportValue:

          Fn::Sub: "cloudmart-${Environment}-ProductLambdaRoleArn"


      Timeout:
        30


      MemorySize:
        256


      # ======================================================
      # VPC CONFIGURATION
      # Required for private RDS access
      # ======================================================

      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:

              Fn::Sub: "cloudmart-${Environment}-LambdaSecurityGroupId"


        SubnetIds:

          - Fn::ImportValue:

              Fn::Sub: "cloudmart-${Environment}-PrivateSubnetId"

          - Fn::ImportValue:

              Fn::Sub: "cloudmart-${Environment}-SecondaryPrivateSubnetId"


      Layers:

        - !Ref PyMySQLLayer


      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref ProductLambdaS3Key


      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName


          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint


          DB_PORT_PARAMETER:
            !Ref DBPort


          DB_USERNAME_PARAMETER:
            !Ref DBUsername


          DB_PASSWORD_PARAMETER:
            !Ref DBPassword


          EVENT_BUS_NAME:
            !Ref CloudMartEventBus


  # ==========================================================
  # ORDER PROCESSOR LAMBDA
  # ==========================================================

  OrderProcessorLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub "cloudmart-${Environment}-order-processor"


      Runtime:
        python3.12


      Handler:
        lambda_function.lambda_handler


      Role:

        Fn::ImportValue:

          Fn::Sub: "cloudmart-${Environment}-OrderProcessorLambdaRoleArn"


      Timeout:
        30


      MemorySize:
        256


      # ======================================================
      # VPC CONFIGURATION
      # Required for private RDS access
      # ======================================================

      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:

              Fn::Sub: "cloudmart-${Environment}-LambdaSecurityGroupId"


        SubnetIds:

          - Fn::ImportValue:

              Fn::Sub: "cloudmart-${Environment}-PrivateSubnetId"

          - Fn::ImportValue:

              Fn::Sub: "cloudmart-${Environment}-SecondaryPrivateSubnetId"


      Layers:

        - !Ref PyMySQLLayer


      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref OrderProcessorLambdaS3Key


      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName


          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint


          DB_PORT_PARAMETER:
            !Ref DBPort


          DB_USERNAME_PARAMETER:
            !Ref DBUsername


          DB_PASSWORD_PARAMETER:
            !Ref DBPassword


          EVENT_BUS_NAME:
            !Ref CloudMartEventBus


  # ==========================================================
  # ORDER LAMBDA
  # ==========================================================

  OrderLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub "cloudmart-${Environment}-order-lambda"


      Runtime:
        python3.12


      Handler:
        lambda_function.lambda_handler


      Role:

        Fn::ImportValue:

          Fn::Sub: "cloudmart-${Environment}-OrderLambdaRoleArn"


      Timeout:
        30


      MemorySize:
        256


      # ======================================================
      # VPC CONFIGURATION
      # Required for private RDS access
      # ======================================================

      VpcConfig:

        SecurityGroupIds:

          - Fn::ImportValue:

              Fn::Sub: "cloudmart-${Environment}-LambdaSecurityGroupId"


        SubnetIds:

          - Fn::ImportValue:

              Fn::Sub: "cloudmart-${Environment}-PrivateSubnetId"

          - Fn::ImportValue:

              Fn::Sub: "cloudmart-${Environment}-SecondaryPrivateSubnetId"


      Layers:

        - !Ref PyMySQLLayer


      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref OrderLambdaS3Key


      Environment:

        Variables:

          DB_NAME_PARAMETER:
            !Ref DBName


          DB_ENDPOINT_PARAMETER:
            !Ref DBEndpoint


          DB_PORT_PARAMETER:
            !Ref DBPort


          DB_USERNAME_PARAMETER:
            !Ref DBUsername


          DB_PASSWORD_PARAMETER:
            !Ref DBPassword


          EVENT_BUS_NAME:
            !Ref CloudMartEventBus


          ORDER_PROCESSOR_FUNCTION_NAME:
            !Ref OrderProcessorLambda


  # ==========================================================
  # LAMBDA AUTHORIZER
  # ==========================================================

  LambdaAuthorizer:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub "cloudmart-${Environment}-lambda-authorizer"


      Runtime:
        python3.12


      Handler:
        lambda_function.lambda_handler


      Role:

        Fn::ImportValue:

          Fn::Sub: "cloudmart-${Environment}-LambdaAuthorizerRoleArn"


      Timeout:
        30


      MemorySize:
        128


      Code:

        S3Bucket:
          !Ref LambdaArtifactBucket

        S3Key:
          !Ref AuthorizerLambdaS3Key


      Environment:

        Variables:

          ADMIN_TOKEN_PARAMETER:
            !Ref AuthTokenParameter


          CUSTOMER_TOKENS_PARAMETER:
            !Ref CustomerTokensParameter


  # ==========================================================
  # ORDER UPDATED EVENT RULE
  # SENDS ORDER UPDATED EVENTS TO ORDER PROCESSOR
  # ==========================================================

  OrderUpdatedEventRule:

    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub "cloudmart-${Environment}-order-updated"


      Description: >
        Sends order update events to Order Processor Lambda


      EventBusName:
        !Ref CloudMartEventBus


      EventPattern:

        source:
          - cloudmart.orders


        detail-type:
          - OrderUpdated


      State:
        ENABLED


      Targets:

        - Arn:
            !GetAtt OrderProcessorLambda.Arn

          Id:
            OrderProcessorTarget


  # ==========================================================
  # EVENTBRIDGE INVOKE PERMISSION
  # ==========================================================

  OrderProcessorLambdaPermission:

    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref OrderProcessorLambda


      Action:
        lambda:InvokeFunction


      Principal:
        events.amazonaws.com


      SourceArn:
        !GetAtt OrderUpdatedEventRule.Arn


  # ==========================================================
  # ORDER EVENTS TO SNS
  # ==========================================================

  OrderEventsToSNSRule:

    Type: AWS::Events::Rule

    DependsOn:
      - AlertTopicPolicy

    Properties:

      Name:
        !Sub "cloudmart-${Environment}-order-events-to-sns"


      Description: >
        Sends CloudMart order and stock events to SNS alerts


      EventBusName:
        !Ref CloudMartEventBus


      EventPattern:

        source:
          - cloudmart.orders


        detail-type:
          - OrderPlaced
          - OrderPending
          - OrderConfirmed
          - OrderUpdated
          - LowStock


      State:
        ENABLED


      Targets:

        - Arn:
            !Ref AlertTopic

          Id:
            SNSAlertTarget


# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:


  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambdaArn:

    Description:
      Product Lambda ARN


    Value:
      !GetAtt ProductLambda.Arn


    Export:

      Name:
        !Sub "cloudmart-${Environment}-ProductLambdaArn"


  ProductLambdaName:

    Description:
      Product Lambda Name


    Value:
      !Ref ProductLambda


    Export:

      Name:
        !Sub "cloudmart-${Environment}-ProductLambdaName"


  # ==========================================================
  # ORDER LAMBDA
  # ==========================================================

  OrderLambdaArn:

    Description:
      Order Lambda ARN


    Value:
      !GetAtt OrderLambda.Arn


    Export:

      Name:
        !Sub "cloudmart-${Environment}-OrderLambdaArn"


  OrderLambdaName:

    Description:
      Order Lambda Name


    Value:
      !Ref OrderLambda


    Export:

      Name:
        !Sub "cloudmart-${Environment}-OrderLambdaName"


  # ==========================================================
  # ORDER PROCESSOR LAMBDA
  # ==========================================================

  OrderProcessorLambdaArn:

    Description:
      Order Processor Lambda ARN


    Value:
      !GetAtt OrderProcessorLambda.Arn


    Export:

      Name:
        !Sub "cloudmart-${Environment}-OrderProcessorLambdaArn"


  OrderProcessorLambdaName:

    Description:
      Order Processor Lambda Name


    Value:
      !Ref OrderProcessorLambda


    Export:

      Name:
        !Sub "cloudmart-${Environment}-OrderProcessorLambdaName"


  # ==========================================================
  # LAMBDA AUTHORIZER
  # ==========================================================

  LambdaAuthorizerArn:

    Description:
      Lambda Authorizer ARN


    Value:
      !GetAtt LambdaAuthorizer.Arn


    Export:

      Name:
        !Sub "cloudmart-${Environment}-LambdaAuthorizerArn"


  LambdaAuthorizerName:

    Description:
      Lambda Authorizer Function Name


    Value:
      !Ref LambdaAuthorizer


    Export:

      Name:
        !Sub "cloudmart-${Environment}-LambdaAuthorizerName"


  # ==========================================================
  # EVENTBRIDGE EVENT BUS
  # ==========================================================

  EventBusName:

    Description:
      CloudMart EventBridge Event Bus Name


    Value:
      !Ref CloudMartEventBus


    Export:

      Name:
        !Sub "cloudmart-${Environment}-EventBusName"


  EventBusArn:

    Description:
      CloudMart EventBridge Event Bus ARN


    Value:
      !GetAtt CloudMartEventBus.Arn


    Export:

      Name:
        !Sub "cloudmart-${Environment}-EventBusArn"


  # ==========================================================
  # SNS ALERT TOPIC
  # ==========================================================

  AlertTopicArn:

    Description:
      CloudMart SNS Alert Topic ARN


    Value:
      !Ref AlertTopic


    Export:

      Name:
        !Sub "cloudmart-${Environment}-AlertTopicArn"