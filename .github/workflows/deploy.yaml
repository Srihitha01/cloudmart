name: CloudMart Infrastructure Deployment

on:

  push:
    branches:
      - main

    paths:
      - 'cloudformation/**'
      - 'database/**'
      - 'lambda/**'
      - '.github/workflows/deploy.yaml'

  workflow_dispatch:


permissions:
  id-token: write
  contents: read


env:

  AWS_REGION: ap-south-1
  ENVIRONMENT: dev

  NETWORK_STACK_NAME: cloudmart-network-security-dev
  DATA_STACK_NAME: cloudmart-data-storage-dev
  IAM_STACK_NAME: cloudmart-iam-dev
  APPLICATION_EVENTS_STACK_NAME: cloudmart-application-events-dev
  API_MONITORING_EC2_STACK_NAME: cloudmart-api-monitoring-ec2-dev

  LAMBDA_ARTIFACT_BUCKET: cloudmart-dev-artifacts


jobs:

  # ============================================================
  # 1. NETWORK-SECURITY STACK
  # ============================================================

  deploy-network:

    name: Deploy Network-Security Stack
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      - name: Validate Network CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml \
            --region "$AWS_REGION"


      - name: Deploy Network-Security Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name "$NETWORK_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset


      - name: Show Network Stack Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Show Network Stack Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table


      - name: Show Network Stack Failure Details
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED'].[LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table


  # ============================================================
  # 2. DATA-STORAGE STACK
  # ============================================================

  deploy-data:

    name: Deploy Data-Storage Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-network

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      - name: Validate Data CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml \
            --region "$AWS_REGION"


      - name: Verify Network-Security Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Deploy Data-Storage Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name "$DATA_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DBName="cloudmart" \
              DBUsername="cloudmartadmin" \
              DBPassword="${{ secrets.CLOUDMART_DB_PASSWORD }}" \
              DBInstanceClass="db.t3.micro" \
              AllocatedStorage="20" \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset


      - name: Show Data Stack Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Show Data Stack Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table


      - name: Show Data Stack Failure Details
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED'].[LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table


  # ============================================================
  # 3. IAM-CONFIGURATION STACK
  # ============================================================

  deploy-iam:

    name: Deploy IAM-Configuration Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-data

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      - name: Validate IAM CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml \
            --region "$AWS_REGION"


      - name: Verify Data-Storage Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Deploy IAM-Configuration Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name "$IAM_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset


      - name: Show IAM Stack Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Show IAM Stack Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table


      - name: Show IAM Stack Failure Details
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED'].[LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table


  # ============================================================
  # 4. APPLICATION-EVENTS STACK
  # ============================================================

  deploy-application-events:

    name: Deploy Application-Events Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-iam

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      - name: Verify Network-Security Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Verify Data-Storage Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Verify IAM-Configuration Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      # ========================================================
      # VALIDATE APPLICATION-EVENTS TEMPLATE
      # ========================================================

      - name: Validate Application-Events CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/application-events-stack.yaml \
            --region "$AWS_REGION"


      # ========================================================
      # BUILD PYMYSQL LAYER
      # ========================================================

      - name: Build PyMySQL Layer
        shell: bash
        run: |
          set -e

          rm -rf layer-build
          rm -f pymysql-layer.zip

          mkdir -p layer-build/python

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            -r lambda/product/requirements.txt \
            -t layer-build/python

          test -d layer-build/python/pymysql
          test -d layer-build/python/cryptography

          echo "PyMySQL and cryptography dependencies installed."


      # ========================================================
      # PACKAGE PYMYSQL LAYER
      # ========================================================

      - name: Package PyMySQL Layer
        shell: bash
        run: |
          set -e

          cd layer-build

          zip -r ../pymysql-layer.zip python

          cd ..

          test -f pymysql-layer.zip

          ls -lh pymysql-layer.zip


      # ========================================================
      # UPLOAD PYMYSQL LAYER
      # ========================================================

      - name: Upload PyMySQL Layer
        shell: bash
        run: |
          set -e

          ARTIFACT_KEY="layers/pymysql/pymysql-layer-${GITHUB_SHA}.zip"

          aws s3 cp \
            pymysql-layer.zip \
            "s3://${LAMBDA_ARTIFACT_BUCKET}/${ARTIFACT_KEY}" \
            --region "$AWS_REGION"

          echo "PYMYSQL_LAYER_S3_BUCKET=${LAMBDA_ARTIFACT_BUCKET}" >> "$GITHUB_ENV"
          echo "PYMYSQL_LAYER_S3_KEY=${ARTIFACT_KEY}" >> "$GITHUB_ENV"

          echo "PyMySQL layer uploaded successfully."


      # ========================================================
      # PACKAGE PRODUCT LAMBDA
      # ========================================================

      - name: Package Product Lambda
        shell: bash
        run: |
          set -e

          rm -rf product-lambda-build
          rm -f product-lambda.zip

          mkdir -p product-lambda-build

          test -f lambda/product/lambda_function.py

          cp \
            lambda/product/lambda_function.py \
            product-lambda-build/index.py

          cd product-lambda-build

          zip \
            ../product-lambda.zip \
            index.py

          cd ..

          test -f product-lambda.zip

          ls -lh product-lambda.zip


      # ========================================================
      # UPLOAD PRODUCT LAMBDA
      # ========================================================

      - name: Upload Product Lambda
        shell: bash
        run: |
          set -e

          PRODUCT_LAMBDA_KEY="lambda/product/product-lambda-${GITHUB_SHA}.zip"

          aws s3 cp \
            product-lambda.zip \
            "s3://${LAMBDA_ARTIFACT_BUCKET}/${PRODUCT_LAMBDA_KEY}" \
            --region "$AWS_REGION"

          echo "PRODUCT_LAMBDA_S3_KEY=${PRODUCT_LAMBDA_KEY}" >> "$GITHUB_ENV"

          echo "Product Lambda uploaded successfully."


      # ========================================================
      # UPLOAD DATABASE SCHEMA
      # ========================================================

      - name: Upload Database Schema
        shell: bash
        run: |
          set -e

          test -f database/schema.sql

          SCHEMA_KEY="database/schema-${GITHUB_SHA}.sql"

          aws s3 cp \
            database/schema.sql \
            "s3://${LAMBDA_ARTIFACT_BUCKET}/${SCHEMA_KEY}" \
            --region "$AWS_REGION"

          echo "SCHEMA_S3_KEY=${SCHEMA_KEY}" >> "$GITHUB_ENV"

          echo "Database schema uploaded successfully."


      # ========================================================
      # VERIFY UPLOADED ARTIFACTS
      # ========================================================

      - name: Verify uploaded Lambda artifacts
        shell: bash
        run: |
          set -e

          aws s3api head-object \
            --bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --key "$PYMYSQL_LAYER_S3_KEY"

          aws s3api head-object \
            --bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --key "$PRODUCT_LAMBDA_S3_KEY"

          aws s3api head-object \
            --bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --key "$SCHEMA_S3_KEY"

          echo "All Lambda and schema artifacts verified."


      # ========================================================
      # DEPLOY APPLICATION-EVENTS STACK
      # ========================================================

      - name: Deploy Application-Events Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/application-events-stack.yaml \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DBName="/cloudmart/$ENVIRONMENT/db/name" \
              DBEndpoint="/cloudmart/$ENVIRONMENT/db/endpoint" \
              DBPort="/cloudmart/$ENVIRONMENT/db/port" \
              DBUsername="/cloudmart/$ENVIRONMENT/db/username" \
              DBPassword="/cloudmart/$ENVIRONMENT/db/password" \
              AuthTokenParameter="/cloudmart/$ENVIRONMENT/auth/token" \
              LambdaArtifactBucket="$LAMBDA_ARTIFACT_BUCKET" \
              PyMySQLLayerS3Key="$PYMYSQL_LAYER_S3_KEY" \
              ProductLambdaS3Key="$PRODUCT_LAMBDA_S3_KEY" \
              SchemaS3Key="$SCHEMA_S3_KEY" \
              AlertEmail="${{ secrets.CLOUDMART_ALERT_EMAIL }}" \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset


      - name: Show Application-Events Stack Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Show Application-Events Stack Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table


      # ========================================================
      # VERIFY LAMBDAS
      # ========================================================

      - name: Verify Lambda Authorizer
        run: |
          aws lambda get-function-configuration \
            --function-name "cloudmart-${ENVIRONMENT}-lambda-authorizer" \
            --region "$AWS_REGION" \
            --query '[FunctionName,Runtime,Handler,State,LastUpdateStatus]' \
            --output table


      - name: Verify Product Lambda
        run: |
          aws lambda get-function-configuration \
            --function-name "cloudmart-${ENVIRONMENT}-product-lambda" \
            --region "$AWS_REGION" \
            --query '[FunctionName,Runtime,Handler,State,LastUpdateStatus,CodeSize]' \
            --output table


      - name: Verify Product Lambda Layer
        run: |
          aws lambda get-function-configuration \
            --function-name "cloudmart-${ENVIRONMENT}-product-lambda" \
            --region "$AWS_REGION" \
            --query 'Layers[*].[Arn,CodeSize]' \
            --output table


      - name: Verify Schema Initializer Lambda
        run: |
          aws lambda get-function-configuration \
            --function-name "cloudmart-${ENVIRONMENT}-schema-initializer" \
            --region "$AWS_REGION" \
            --query '[FunctionName,Runtime,Handler,State,LastUpdateStatus]' \
            --output table


      # ========================================================
      # VERIFY SNS
      # ========================================================

      - name: Verify SNS Low-Stock Topic
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`LowStockTopicArn`].OutputValue' \
            --output text


      # ========================================================
      # VERIFY EVENTBRIDGE
      # ========================================================

      - name: Verify EventBridge Low-Stock Rule
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`LowStockEventRuleArn`].OutputValue' \
            --output text


      - name: Show Application-Events Failure Details
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED'].[LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table


  # ============================================================
  # 5. API-MONITORING-EC2 STACK
  # ============================================================

  deploy-api-monitoring-ec2:

    name: Deploy API-Monitoring-EC2 Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-application-events

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      - name: Verify Application-Events Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Validate API-Monitoring-EC2 CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/api-monitoring-ec2-stack.yaml \
            --region "$AWS_REGION"


      - name: Deploy API-Monitoring-EC2 Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/api-monitoring-ec2-stack.yaml \
            --stack-name "$API_MONITORING_EC2_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset


      - name: Show API-Monitoring-EC2 Stack Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$API_MONITORING_EC2_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Show API-Monitoring-EC2 Stack Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$API_MONITORING_EC2_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table


      - name: Show API-Monitoring-EC2 Failure Details
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name "$API_MONITORING_EC2_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED'].[LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table