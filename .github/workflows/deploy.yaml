name: CloudMart Infrastructure Deployment


# ============================================================
# WORKFLOW TRIGGERS
# ============================================================

on:
  push:
    branches:
      - main
  workflow_dispatch:

# ============================================================
# GITHUB ACTIONS PERMISSIONS
# ============================================================

permissions:

  id-token: write

  contents: read


# ============================================================
# JOB 0
# LOAD CENTRAL CLOUDMART CONFIGURATION
#
# config/config.json is the single source of truth.
# ============================================================

jobs:

  load-config:

    name: Load CloudMart Configuration

    runs-on: ubuntu-latest

    outputs:

      environment: ${{ steps.config.outputs.environment }}

      project: ${{ steps.config.outputs.project }}

      managed_by: ${{ steps.config.outputs.managed_by }}

      owner: ${{ steps.config.outputs.owner }}


    steps:


      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v5


      # ------------------------------------------------------
      # LOAD CONFIGURATION
      # ------------------------------------------------------

      - name: Load CloudMart Configuration

        id: config

        shell: bash

        run: |

          echo "========================================"

          echo "LOADING CLOUDMART CONFIGURATION"

          echo "========================================"


          CONFIG_FILE="config/config.json"


          if [ ! -f "$CONFIG_FILE" ]; then

            echo "ERROR: $CONFIG_FILE was not found."

            exit 1

          fi


          ENVIRONMENT=$(jq -r '.[] | select(.Key=="Environment") | .Value' "$CONFIG_FILE")
          PROJECT=$(jq -r '.[] | select(.Key=="Project") | .Value' "$CONFIG_FILE")
          MANAGED_BY=$(jq -r '.[] | select(.Key=="ManagedBy") | .Value' "$CONFIG_FILE")
          OWNER=$(jq -r '.[] | select(.Key=="Owner") | .Value' "$CONFIG_FILE")


          # --------------------------------------------------
          # VALIDATE ENVIRONMENT
          # --------------------------------------------------

          if [ -z "$ENVIRONMENT" ] || [ "$ENVIRONMENT" = "null" ]; then

            echo "ERROR: Deployment environment is missing."

            exit 1

          fi


          if [ "$ENVIRONMENT" != "dev" ] && [ "$ENVIRONMENT" != "prod" ]; then

            echo "ERROR: Invalid Environment: $ENVIRONMENT"

            echo "Allowed values: dev or prod"

            exit 1

          fi


          # --------------------------------------------------
          # VALIDATE PROJECT
          # --------------------------------------------------

          if [ -z "$PROJECT" ] || [ "$PROJECT" = "null" ]; then

            echo "ERROR: Project is missing from config/config.json."

            exit 1

          fi


          # --------------------------------------------------
          # VALIDATE MANAGED BY
          # --------------------------------------------------

          if [ -z "$MANAGED_BY" ] || [ "$MANAGED_BY" = "null" ]; then

            echo "ERROR: ManagedBy is missing from config/config.json."

            exit 1

          fi


          # --------------------------------------------------
          # VALIDATE OWNER
          # --------------------------------------------------

          if [ -z "$OWNER" ] || [ "$OWNER" = "null" ]; then

            echo "ERROR: Owner is missing from config/config.json."

            exit 1

          fi


          # --------------------------------------------------
          # GITHUB JOB OUTPUTS
          # --------------------------------------------------

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          echo "managed_by=$MANAGED_BY" >> "$GITHUB_OUTPUT"

          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"


          echo ""

          echo "========================================"

          echo "CLOUDMART CONFIGURATION"

          echo "========================================"

          echo "Project:    $PROJECT"

          echo "Environment: $ENVIRONMENT"

          echo "ManagedBy:  $MANAGED_BY"

          echo "Owner:      $OWNER"

          echo "========================================"


  # ==========================================================
  # 1. DEPLOY NETWORK SECURITY STACK
  # ==========================================================

  deploy-network:

    name: Deploy Network Security Stack

    runs-on: ubuntu-latest

    needs:
      - load-config


    env:
      AWS_REGION: ap-south-1

      ENVIRONMENT: ${{ needs.load-config.outputs.environment }}

      PROJECT: ${{ needs.load-config.outputs.project }}

      MANAGED_BY: ${{ needs.load-config.outputs.managed_by }}

      OWNER: ${{ needs.load-config.outputs.owner }}

      NETWORK_STACK_NAME: cloudmart-network-security-${{ needs.load-config.outputs.environment }}


    steps:


      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v5


      # ------------------------------------------------------
      # AWS AUTHENTICATION
      # ------------------------------------------------------

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v6

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      # ------------------------------------------------------
      # VERIFY AWS IDENTITY
      # ------------------------------------------------------

      - name: Verify AWS Identity

        run: |

          echo "========================================"

          echo "VERIFYING AWS IDENTITY"

          echo "========================================"

          aws sts get-caller-identity


      # ------------------------------------------------------
      # VALIDATE NETWORK TEMPLATE
      # ------------------------------------------------------

      - name: Validate Network Stack

        run: |

          echo "========================================"

          echo "VALIDATING NETWORK STACK"

          echo "========================================"


          python -m pip install --quiet cfn-lint
          cfn-lint -t cloudformation/network-stack.yaml --non-zero-exit-code error


      # ------------------------------------------------------
      # DEPLOY NETWORK STACK
      # ------------------------------------------------------

      - name: Deploy Network Security Stack

        run: |

          echo "========================================"

          echo "DEPLOYING NETWORK SECURITY STACK"

          echo "========================================"


          echo "Environment: $ENVIRONMENT"

          echo "Stack:       $NETWORK_STACK_NAME"

          echo "Region:      $AWS_REGION"


          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name "$NETWORK_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset


      # ------------------------------------------------------
      # VERIFY NETWORK STACK
      # ------------------------------------------------------

      - name: Verify Network Security Stack

        run: |

          echo "========================================"

          echo "VERIFYING NETWORK SECURITY STACK"

          echo "========================================"


          aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      # ------------------------------------------------------
      # SHOW NETWORK OUTPUTS
      # ------------------------------------------------------

      - name: Show Network Outputs

        run: |

          echo "========================================"

          echo "NETWORK STACK OUTPUTS"

          echo "========================================"


          aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table


  # ==========================================================
  # 2. DEPLOY DATA STORAGE STACK
  # ==========================================================

  deploy-data:

    name: Deploy Data Storage Stack

    runs-on: ubuntu-latest

    needs:

      - load-config

      - deploy-network


    env:
      AWS_REGION: ap-south-1

      ENVIRONMENT: ${{ needs.load-config.outputs.environment }}

      PROJECT: ${{ needs.load-config.outputs.project }}

      MANAGED_BY: ${{ needs.load-config.outputs.managed_by }}

      OWNER: ${{ needs.load-config.outputs.owner }}

      NETWORK_STACK_NAME: cloudmart-network-security-${{ needs.load-config.outputs.environment }}

      DATA_STACK_NAME: cloudmart-data-storage-${{ needs.load-config.outputs.environment }}


    steps:


      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v5


      # ------------------------------------------------------
      # AWS AUTHENTICATION
      # ------------------------------------------------------

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v6

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      # ------------------------------------------------------
      # VERIFY AWS IDENTITY
      # ------------------------------------------------------

      - name: Verify AWS Identity

        run: |

          echo "========================================"

          echo "VERIFYING AWS IDENTITY"

          echo "========================================"

          aws sts get-caller-identity


      # ------------------------------------------------------
      # MASK DATABASE PASSWORD
      # Prevent the manually entered password from appearing
      # in GitHub Actions logs.
      # ------------------------------------------------------

      - name: Mask DB Password
        env:
          DB_PASSWORD_INPUT: ${{ secrets.CLOUDMART_DB_PASSWORD }}
        run: |
          if [ -z "$DB_PASSWORD_INPUT" ]; then
            echo "ERROR: Database password was not entered."
            exit 1
          fi

          echo "::add-mask::$DB_PASSWORD_INPUT"

      # ------------------------------------------------------
      # VALIDATE DATABASE PASSWORD
      # ------------------------------------------------------

      - name: Validate DB Password

        env:

          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}

        run: |

          echo "========================================"

          echo "VALIDATING DATABASE PASSWORD"

          echo "========================================"


          if [ -z "$DB_PASSWORD" ]; then

            echo "ERROR: DB password was not entered in the workflow input."

            exit 1

          fi


          PASSWORD_LENGTH=${#DB_PASSWORD}


          echo "Database password secret is available."


          if [ "$PASSWORD_LENGTH" -lt 12 ]; then

            echo "ERROR: Database password must contain at least 12 characters."

            exit 1

          fi


          echo "Database password validation passed."


      # ------------------------------------------------------
      # VALIDATE DATA STACK
      # ------------------------------------------------------

      - name: Validate Data Stack

        run: |

          echo "========================================"

          echo "VALIDATING DATA STORAGE STACK"

          echo "========================================"


          python -m pip install --quiet cfn-lint
          cfn-lint -t cloudformation/data-stack.yaml --non-zero-exit-code error


      # ------------------------------------------------------
      # DEPLOY DATA STORAGE STACK
      # ------------------------------------------------------

      - name: Deploy Data Storage Stack

        env:

          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}

        run: |

          echo "========================================"

          echo "DEPLOYING DATA STORAGE STACK"

          echo "========================================"


          echo "Environment: $ENVIRONMENT"

          echo "Stack:       $DATA_STACK_NAME"


          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name "$DATA_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DBPassword="$DB_PASSWORD" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


      # ------------------------------------------------------
      # VERIFY DATABASE SSM PARAMETERS
      # ------------------------------------------------------

      - name: Verify Database SSM Parameters

        run: |

          echo "========================================"

          echo "VERIFYING DATABASE SSM PARAMETERS"

          echo "========================================"


          aws ssm get-parameters-by-path \
            --path "/cloudmart/${ENVIRONMENT}/db" \
            --recursive \
            --region "$AWS_REGION" \
            --query "Parameters[].{Name:Name,Type:Type}" \
            --output table


      # ------------------------------------------------------
      # VERIFY DATA STACK
      # ------------------------------------------------------

      - name: Verify Data Storage Stack

        run: |

          echo "========================================"

          echo "VERIFYING DATA STORAGE STACK"

          echo "========================================"


          aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      # ------------------------------------------------------
      # SHOW DATA OUTPUTS
      # ------------------------------------------------------

      - name: Show Data Storage Outputs

        run: |

          echo "========================================"

          echo "DATA STORAGE STACK OUTPUTS"

          echo "========================================"


          aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table


  # ==========================================================
  # 3. DEPLOY IAM STACK
  # ==========================================================

  deploy-iam:

    name: Deploy IAM Stack

    runs-on: ubuntu-latest

    needs:

      - load-config

      - deploy-network

      - deploy-data


    env:
      AWS_REGION: ap-south-1

      ENVIRONMENT: ${{ needs.load-config.outputs.environment }}

      PROJECT: ${{ needs.load-config.outputs.project }}

      MANAGED_BY: ${{ needs.load-config.outputs.managed_by }}

      OWNER: ${{ needs.load-config.outputs.owner }}

      IAM_STACK_NAME: cloudmart-iam-${{ needs.load-config.outputs.environment }}


    steps:


      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v5


      # ------------------------------------------------------
      # AWS AUTHENTICATION
      # ------------------------------------------------------

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v6

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      # ------------------------------------------------------
      # VERIFY AWS IDENTITY
      # ------------------------------------------------------

      - name: Verify AWS Identity

        run: |

          echo "========================================"

          echo "VERIFYING AWS IDENTITY"

          echo "========================================"

          aws sts get-caller-identity


      # ------------------------------------------------------
      # VALIDATE IAM TEMPLATE
      # ------------------------------------------------------

      - name: Validate IAM Stack

        run: |

          echo "========================================"

          echo "VALIDATING IAM STACK"

          echo "========================================"


          python -m pip install --quiet cfn-lint
          cfn-lint -t cloudformation/iam-stack.yaml --non-zero-exit-code error


      # ------------------------------------------------------
      # DEPLOY IAM STACK
      # ------------------------------------------------------

      - name: Deploy IAM Stack

        run: |

          echo "========================================"

          echo "DEPLOYING IAM STACK"

          echo "========================================"


          echo "Environment: $ENVIRONMENT"

          echo "Stack:       $IAM_STACK_NAME"


          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name "$IAM_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


      # ------------------------------------------------------
      # VERIFY IAM STACK
      # ------------------------------------------------------

      - name: Verify IAM Stack

        run: |

          echo "========================================"

          echo "VERIFYING IAM STACK"

          echo "========================================"


          aws cloudformation describe-stacks \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      # ------------------------------------------------------
      # VERIFY AUTHENTICATION SSM PARAMETERS
      # ------------------------------------------------------

      - name: Verify Authentication SSM Parameters

        run: |

          echo "========================================"

          echo "VERIFYING AUTHENTICATION SSM PARAMETERS"

          echo "========================================"


          aws ssm describe-parameters \
            --region "$AWS_REGION" \
            --query "Parameters[?Name=='/cloudmart/${ENVIRONMENT}/auth/token' || Name=='/cloudmart/${ENVIRONMENT}/auth/customer-tokens'].[Name,Type]" \
            --output table

      # ------------------------------------------------------
      # SHOW IAM OUTPUTS
      # ------------------------------------------------------

      - name: Show IAM Outputs

        run: |

          echo "========================================"

          echo "IAM STACK OUTPUTS"

          echo "========================================"


          aws cloudformation describe-stacks \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table


  # ==========================================================
  # 4. DEPLOY APPLICATION EVENTS STACK
  # ==========================================================

  deploy-application-events:

    name: Deploy Application Events Stack

    runs-on: ubuntu-latest

    needs:

      - load-config

      - deploy-data

      - deploy-iam


    env:
      AWS_REGION: ap-south-1

      ENVIRONMENT: ${{ needs.load-config.outputs.environment }}

      PROJECT: ${{ needs.load-config.outputs.project }}

      MANAGED_BY: ${{ needs.load-config.outputs.managed_by }}

      OWNER: ${{ needs.load-config.outputs.owner }}

      ALERT_EMAIL: ${{ secrets.CLOUDMART_ALERT_EMAIL }}

      DATA_STACK_NAME: cloudmart-data-storage-${{ needs.load-config.outputs.environment }}

      APPLICATION_EVENTS_STACK_NAME: cloudmart-application-events-${{ needs.load-config.outputs.environment }}


    steps:


      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v5


      # ------------------------------------------------------
      # AWS AUTHENTICATION
      # ------------------------------------------------------

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v6

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      # ------------------------------------------------------
      # VERIFY AWS IDENTITY
      # ------------------------------------------------------

      - name: Verify AWS Identity

        run: |

          echo "========================================"

          echo "VERIFYING AWS IDENTITY"

          echo "========================================"

          aws sts get-caller-identity


      # ------------------------------------------------------
      # VERIFY REQUIRED PROJECT FILES
      # ------------------------------------------------------

      - name: Verify Required Project Files

        run: |

          echo "========================================"

          echo "VERIFYING PROJECT FILES"

          echo "========================================"


          test -f lambda/authorizer/lambda_function.py

          test -f lambda/product/lambda_function.py

          test -f lambda/customer/lambda_function.py

          test -f lambda/order/lambda_function.py

          test -f lambda/order-processor/lambda_function.py

          test -f lambda/daily-report/lambda_function.py

          test -f database/schema.sql

          test -f dashboard/app.py


          echo "All required project files found."


      # ------------------------------------------------------
      # VALIDATE APPLICATION EVENTS TEMPLATE
      # ------------------------------------------------------

      - name: Validate Application Events Stack

        run: |

          echo "========================================"

          echo "VALIDATING APPLICATION EVENTS STACK"

          echo "========================================"


          python -m pip install --quiet cfn-lint
          cfn-lint -t cloudformation/application-events-stack.yaml --non-zero-exit-code error


      # ------------------------------------------------------
      # GET ARTIFACT BUCKET FROM DATA STACK
      # ------------------------------------------------------

      - name: Get Artifact Bucket Name

        run: |

          echo "========================================"

          echo "GETTING ARTIFACT BUCKET"

          echo "========================================"


          ARTIFACT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactBucketName'].OutputValue" \
            --output text)


          if [ -z "$ARTIFACT_BUCKET" ] || [ "$ARTIFACT_BUCKET" = "None" ]; then

            echo "ERROR: ArtifactBucketName output was not found."

            exit 1

          fi


          echo "LAMBDA_ARTIFACT_BUCKET=$ARTIFACT_BUCKET" >> "$GITHUB_ENV"


          echo "Artifact bucket: $ARTIFACT_BUCKET"


      # ------------------------------------------------------
      # CREATE BUILD DIRECTORIES
      # ------------------------------------------------------

      - name: Create Build Directories

        run: |

          echo "========================================"

          echo "PREPARING BUILD DIRECTORY"

          echo "========================================"


          rm -rf build

          mkdir -p build


      # ------------------------------------------------------
      # BUILD PYMYSQL LAYER
      # ------------------------------------------------------

      - name: Build PyMySQL Layer

        run: |

          echo "========================================"

          echo "BUILDING PYMYSQL LAYER"

          echo "========================================"


          mkdir -p build/pymysql-layer/python


          python -m pip install --upgrade pip


          python -m pip install \
            PyMySQL==1.1.1 \
            cryptography==45.0.6 \
            -t build/pymysql-layer/python


          cd build/pymysql-layer


          zip -r ../pymysql-layer.zip python


          cd ../..


      # ------------------------------------------------------
      # BUILD AUTHORIZER LAMBDA
      # ------------------------------------------------------

      - name: Build Authorizer Lambda

        run: |

          echo "========================================"

          echo "BUILDING AUTHORIZER LAMBDA"

          echo "========================================"


          mkdir -p build/authorizer


          cp lambda/authorizer/lambda_function.py \
            build/authorizer/


          if [ -f lambda/authorizer/requirements.txt ]; then

            python -m pip install \
              -r lambda/authorizer/requirements.txt \
              -t build/authorizer

          fi


          cd build/authorizer


          zip -r ../authorizer-lambda.zip .


          cd ../..


      # ------------------------------------------------------
      # BUILD PRODUCT LAMBDA
      # ------------------------------------------------------

      - name: Build Product Lambda

        run: |

          echo "========================================"

          echo "BUILDING PRODUCT LAMBDA"

          echo "========================================"


          mkdir -p build/product


          cp lambda/product/lambda_function.py \
            build/product/


          if [ -f lambda/product/requirements.txt ]; then

            python -m pip install \
              -r lambda/product/requirements.txt \
              -t build/product

          fi


          cd build/product


          zip -r ../product-lambda.zip .


          cd ../..


      # ------------------------------------------------------
      # BUILD CUSTOMER LAMBDA
      # ------------------------------------------------------

      - name: Build Customer Lambda

        run: |

          echo "========================================"

          echo "BUILDING CUSTOMER LAMBDA"

          echo "========================================"

          mkdir -p build/customer

          cp lambda/customer/lambda_function.py \
            build/customer/

          if [ -f lambda/customer/requirements.txt ]; then

            python -m pip install \
              -r lambda/customer/requirements.txt \
              -t build/customer

          fi

          cd build/customer

          zip -r ../customer-lambda.zip .

          cd ../..


      # ------------------------------------------------------
      # BUILD ORDER LAMBDA
      # ------------------------------------------------------

      - name: Build Order Lambda

        run: |

          echo "========================================"

          echo "BUILDING ORDER LAMBDA"

          echo "========================================"


          mkdir -p build/order


          cp lambda/order/lambda_function.py \
            build/order/


          if [ -f lambda/order/requirements.txt ]; then

            python -m pip install \
              -r lambda/order/requirements.txt \
              -t build/order

          fi


          cd build/order


          zip -r ../order-lambda.zip .


          cd ../..


      # ------------------------------------------------------
      # BUILD ORDER PROCESSOR LAMBDA
      # ------------------------------------------------------

      - name: Build Order Processor Lambda

        run: |

          echo "========================================"

          echo "BUILDING ORDER PROCESSOR LAMBDA"

          echo "========================================"


          mkdir -p build/order-processor


          cp lambda/order-processor/lambda_function.py \
            build/order-processor/


          if [ -f lambda/order-processor/requirements.txt ]; then

            python -m pip install \
              -r lambda/order-processor/requirements.txt \
              -t build/order-processor

          fi


          cd build/order-processor


          zip -r ../order-processor-lambda.zip .


          cd ../..


      # ------------------------------------------------------
      # BUILD DAILY REPORT LAMBDA
      # ------------------------------------------------------

      - name: Build Daily Report Lambda

        run: |

          echo "========================================"

          echo "BUILDING DAILY REPORT LAMBDA"

          echo "========================================"


          mkdir -p build/daily-report


          cp lambda/daily-report/lambda_function.py \
            build/daily-report/


          if [ -f lambda/daily-report/requirements.txt ]; then

            python -m pip install \
              -r lambda/daily-report/requirements.txt \
              -t build/daily-report

          fi


          cd build/daily-report


          zip -r ../daily-report-lambda.zip .


          cd ../..


      # ------------------------------------------------------
      # PACKAGE DATABASE SCHEMA
      # ------------------------------------------------------

      - name: Package Database Schema

        run: |

          echo "========================================"

          echo "PACKAGING DATABASE SCHEMA"

          echo "========================================"


          cp database/schema.sql \
            build/schema.sql


      # ------------------------------------------------------
      # UPLOAD PYMYSQL LAYER
      # ------------------------------------------------------

      - name: Upload PyMySQL Layer

        run: |

          aws s3 cp \
            build/pymysql-layer.zip \
            "s3://${LAMBDA_ARTIFACT_BUCKET}/layers/pymysql/pymysql-layer-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"


      # ------------------------------------------------------
      # UPLOAD AUTHORIZER
      # ------------------------------------------------------

      - name: Upload Authorizer Lambda

        run: |

          aws s3 cp \
            build/authorizer-lambda.zip \
            "s3://${LAMBDA_ARTIFACT_BUCKET}/lambda/authorizer/authorizer-lambda-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"


      # ------------------------------------------------------
      # UPLOAD PRODUCT LAMBDA
      # ------------------------------------------------------

      - name: Upload Product Lambda

        run: |

          aws s3 cp \
            build/product-lambda.zip \
            "s3://${LAMBDA_ARTIFACT_BUCKET}/lambda/product/product-lambda-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"


      # ------------------------------------------------------
      # UPLOAD CUSTOMER LAMBDA
      # ------------------------------------------------------

      - name: Upload Customer Lambda

        run: |

          aws s3 cp \
            build/customer-lambda.zip \
            "s3://${LAMBDA_ARTIFACT_BUCKET}/lambda/customer/customer-lambda-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"


      # ------------------------------------------------------
      # UPLOAD ORDER LAMBDA
      # ------------------------------------------------------

      - name: Upload Order Lambda

        run: |

          aws s3 cp \
            build/order-lambda.zip \
            "s3://${LAMBDA_ARTIFACT_BUCKET}/lambda/order/order-lambda-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"


      # ------------------------------------------------------
      # UPLOAD ORDER PROCESSOR
      # ------------------------------------------------------

      - name: Upload Order Processor Lambda

        run: |

          aws s3 cp \
            build/order-processor-lambda.zip \
            "s3://${LAMBDA_ARTIFACT_BUCKET}/lambda/order-processor/order-processor-lambda-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"


      # ------------------------------------------------------
      # UPLOAD DAILY REPORT LAMBDA
      # ------------------------------------------------------

      - name: Upload Daily Report Lambda

        run: |

          aws s3 cp \
            build/daily-report-lambda.zip \
            "s3://${LAMBDA_ARTIFACT_BUCKET}/lambda/daily-report/daily-report-lambda-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"


      # ------------------------------------------------------
      # UPLOAD DATABASE SCHEMA
      # ------------------------------------------------------

      - name: Upload Database Schema

        run: |

          aws s3 cp \
            build/schema.sql \
            "s3://${LAMBDA_ARTIFACT_BUCKET}/database/schema-${GITHUB_SHA}.sql" \
            --region "$AWS_REGION"


      # ------------------------------------------------------
      # VERIFY ARTIFACTS
      # ------------------------------------------------------

      - name: Verify Uploaded Artifacts

        run: |

          echo "========================================"

          echo "VERIFYING UPLOADED ARTIFACTS"

          echo "========================================"


          aws s3api head-object \
            --bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --key "layers/pymysql/pymysql-layer-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"


          aws s3api head-object \
            --bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --key "lambda/authorizer/authorizer-lambda-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"


          aws s3api head-object \
            --bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --key "lambda/product/product-lambda-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"


          aws s3api head-object \
            --bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --key "lambda/customer/customer-lambda-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

          aws s3api head-object \
            --bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --key "lambda/order/order-lambda-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"


          aws s3api head-object \
            --bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --key "lambda/order-processor/order-processor-lambda-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

          aws s3api head-object \
            --bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --key "lambda/daily-report/daily-report-lambda-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION" 


          aws s3api head-object \
            --bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --key "database/schema-${GITHUB_SHA}.sql" \
            --region "$AWS_REGION"


          echo "All Lambda artifacts verified successfully."


      # ------------------------------------------------------
      # DEPLOY APPLICATION EVENTS STACK
      # ------------------------------------------------------

      - name: Deploy Application Events Stack

        run: |

          echo "========================================"

          echo "DEPLOYING APPLICATION EVENTS STACK"

          echo "========================================"


          echo "Environment: $ENVIRONMENT"

          echo "Stack:       $APPLICATION_EVENTS_STACK_NAME"




          aws cloudformation deploy \
            --template-file cloudformation/application-events-stack.yaml \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              LambdaArtifactBucket="$LAMBDA_ARTIFACT_BUCKET" \
              PyMySQLLayerS3Key="layers/pymysql/pymysql-layer-${GITHUB_SHA}.zip" \
              AuthorizerLambdaS3Key="lambda/authorizer/authorizer-lambda-${GITHUB_SHA}.zip" \
              ProductLambdaS3Key="lambda/product/product-lambda-${GITHUB_SHA}.zip" \
              CustomerLambdaS3Key="lambda/customer/customer-lambda-${GITHUB_SHA}.zip" \
              OrderLambdaS3Key="lambda/order/order-lambda-${GITHUB_SHA}.zip" \
              OrderProcessorLambdaS3Key="lambda/order-processor/order-processor-lambda-${GITHUB_SHA}.zip" \
              DailyReportLambdaS3Key="lambda/daily-report/daily-report-lambda-${GITHUB_SHA}.zip" \
              SchemaS3Key="database/schema-${GITHUB_SHA}.sql" \
              DBName="/cloudmart/${ENVIRONMENT}/db/name" \
              DBEndpoint="/cloudmart/${ENVIRONMENT}/db/endpoint" \
              DBPort="/cloudmart/${ENVIRONMENT}/db/port" \
              DBUsername="/cloudmart/${ENVIRONMENT}/db/username" \
              DBPassword="/cloudmart/${ENVIRONMENT}/db/password" \
              AuthTokenParameter="/cloudmart/${ENVIRONMENT}/auth/token" \
              CustomerTokensParameter="/cloudmart/${ENVIRONMENT}/auth/customer-tokens" \
              AlertEmail="$ALERT_EMAIL" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset


      # ------------------------------------------------------
      # VERIFY APPLICATION STACK
      # ------------------------------------------------------

      - name: Verify Application Events Stack

        run: |

          echo "========================================"

          echo "VERIFYING APPLICATION EVENTS STACK"

          echo "========================================"


          aws cloudformation describe-stacks \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      # ------------------------------------------------------
      # SHOW APPLICATION OUTPUTS
      # ------------------------------------------------------

      - name: Show Application Outputs

        run: |

          echo "========================================"

          echo "APPLICATION EVENTS STACK OUTPUTS"

          echo "========================================"


          aws cloudformation describe-stacks \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table


      # ------------------------------------------------------
      # VERIFY LAMBDA FUNCTIONS
      # ------------------------------------------------------

      - name: Verify CloudMart Lambda Functions

        run: |

          echo "========================================"

          echo "VERIFYING LAMBDA FUNCTIONS"

          echo "========================================"


          for FUNCTION_NAME in \
            "cloudmart-${ENVIRONMENT}-product-lambda" \
            "cloudmart-${ENVIRONMENT}-customer-lambda" \
            "cloudmart-${ENVIRONMENT}-order-lambda" \
            "cloudmart-${ENVIRONMENT}-order-processor" \
            "cloudmart-${ENVIRONMENT}-daily-report" \
            "cloudmart-${ENVIRONMENT}-lambda-authorizer"

          do

            echo ""

            echo "Checking Lambda: $FUNCTION_NAME"


            aws lambda get-function-configuration \
              --function-name "$FUNCTION_NAME" \
              --region "$AWS_REGION" \
              --query '[FunctionName,Runtime,Handler,State,LastUpdateStatus]' \
              --output table

          done


  # ==========================================================
  # 5. DEPLOY API MONITORING + EC2 STACK
  # ==========================================================

  deploy-api-monitoring-ec2:

    name: Deploy API Monitoring EC2 Stack

    runs-on: ubuntu-latest

    needs:

      - load-config

      - deploy-application-events


    env:
      AWS_REGION: ap-south-1

      ENVIRONMENT: ${{ needs.load-config.outputs.environment }}

      PROJECT: ${{ needs.load-config.outputs.project }}

      MANAGED_BY: ${{ needs.load-config.outputs.managed_by }}

      OWNER: ${{ needs.load-config.outputs.owner }}

      API_MONITORING_EC2_STACK_NAME: cloudmart-api-monitoring-ec2-${{ needs.load-config.outputs.environment }}

      DATA_STACK_NAME: cloudmart-data-storage-${{ needs.load-config.outputs.environment }}


    steps:


      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v5


      # ------------------------------------------------------
      # AWS AUTHENTICATION
      # ------------------------------------------------------

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v6

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      # ------------------------------------------------------
      # VERIFY AWS IDENTITY
      # ------------------------------------------------------

      - name: Verify AWS Identity

        run: |

          echo "========================================"

          echo "VERIFYING AWS IDENTITY"

          echo "========================================"

          aws sts get-caller-identity


      # ------------------------------------------------------
      # PUBLISH EC2 DASHBOARD FILES
      # GitHub Actions syncs the existing dashboard source to
      # the artifact bucket. No manual packaging is required.
      # ------------------------------------------------------

      - name: Publish EC2 Dashboard Files

        run: |

          echo "========================================"

          echo "PUBLISHING EC2 DASHBOARD FILES"

          echo "========================================"


          test -f dashboard/app.py


          ARTIFACT_BUCKET=$(aws cloudformation describe-stacks             --stack-name "$DATA_STACK_NAME"             --region "$AWS_REGION"             --query "Stacks[0].Outputs[?OutputKey=='ArtifactBucketName'].OutputValue"             --output text)


          if [ -z "$ARTIFACT_BUCKET" ] || [ "$ARTIFACT_BUCKET" = "None" ]; then
            echo "ERROR: Artifact bucket not found."
            exit 1
          fi


          echo "Artifact bucket: $ARTIFACT_BUCKET"


          aws s3 sync dashboard/             "s3://${ARTIFACT_BUCKET}/dashboard/"             --region "$AWS_REGION"             --delete


          echo "Dashboard files published successfully."


      # ------------------------------------------------------
      # VALIDATE API TEMPLATE
      # ------------------------------------------------------

      - name: Validate API Monitoring EC2 Stack

        run: |

          echo "========================================"

          echo "VALIDATING API MONITORING EC2 STACK"

          echo "========================================"


          python -m pip install --quiet cfn-lint
          cfn-lint -t cloudformation/api-monitoring-ec2-stack.yaml --non-zero-exit-code error


      # ------------------------------------------------------
      # DEPLOY API MONITORING EC2 STACK
      # ------------------------------------------------------

      - name: Deploy API Monitoring EC2 Stack

        run: |

          echo "========================================"

          echo "DEPLOYING API MONITORING EC2 STACK"

          echo "========================================"


          echo "Environment: $ENVIRONMENT"

          echo "Stack:       $API_MONITORING_EC2_STACK_NAME"

          # CloudFormation requires S3 for templates larger than 51,200 bytes.
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          CFN_ARTIFACT_BUCKET="cloudmart-cfn-artifacts-${AWS_ACCOUNT_ID}-${AWS_REGION}"

          if ! aws s3api head-bucket --bucket "$CFN_ARTIFACT_BUCKET" 2>/dev/null; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$CFN_ARTIFACT_BUCKET" --region "$AWS_REGION"
            else
              aws s3api create-bucket \
                --bucket "$CFN_ARTIFACT_BUCKET" \
                --region "$AWS_REGION" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
          fi

          aws cloudformation deploy \
            --template-file cloudformation/api-monitoring-ec2-stack.yaml \
            --stack-name "$API_MONITORING_EC2_STACK_NAME" \
            --s3-bucket "$CFN_ARTIFACT_BUCKET" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset


      # ------------------------------------------------------
      # EC2 DASHBOARD DEPLOYMENT
      # The API stack UserData automatically installs Nginx,
      # Gunicorn and the dashboard from the artifact bucket.
      # No manual/SSM dashboard deployment is required.
      # ------------------------------------------------------



      # ------------------------------------------------------
      # VERIFY API STACK
      # ------------------------------------------------------

      - name: Verify API Monitoring EC2 Stack

        run: |

          echo "========================================"

          echo "VERIFYING API MONITORING EC2 STACK"

          echo "========================================"


          aws cloudformation describe-stacks \
            --stack-name "$API_MONITORING_EC2_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      # ------------------------------------------------------
      # SHOW API OUTPUTS
      # ------------------------------------------------------

      - name: Show API Monitoring EC2 Outputs

        run: |

          echo "========================================"

          echo "API MONITORING EC2 STACK OUTPUTS"

          echo "========================================"


          aws cloudformation describe-stacks \
            --stack-name "$API_MONITORING_EC2_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table


      # ------------------------------------------------------
      # FINAL STACK STATUS
      # ------------------------------------------------------

      - name: Display CloudMart Deployment Summary

        run: |

          echo ""

          echo "========================================"

          echo "CLOUDMART DEPLOYMENT SUMMARY"

          echo "========================================"


          echo ""

          echo "Project:     $PROJECT"

          echo "Environment: $ENVIRONMENT"

          echo "Managed By:  $MANAGED_BY"

          echo "Owner:       $OWNER"

          echo "Region:      $AWS_REGION"


          echo ""

          echo "========================================"

          echo "FINAL STACK STATUS"

          echo "========================================"


          for STACK_NAME in \
            "cloudmart-network-security-${ENVIRONMENT}" \
            "cloudmart-data-storage-${ENVIRONMENT}" \
            "cloudmart-iam-${ENVIRONMENT}" \
            "cloudmart-application-events-${ENVIRONMENT}" \
            "cloudmart-api-monitoring-ec2-${ENVIRONMENT}"

          do

            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query 'Stacks[0].[StackName,StackStatus]' \
              --output table

          done


          echo ""

          echo "========================================"

          echo "CLOUDMART DEPLOYMENT COMPLETED"

          echo "All deployment commands completed. Review stack statuses above."

          echo "========================================"
