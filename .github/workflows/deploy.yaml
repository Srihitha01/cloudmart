name: CloudMart Infrastructure Deployment

on:
  push:
    branches:
      - main
      - feature/order-flow

    paths:
      - 'cloudformation/**'
      - 'lambda/**'
      - 'database/**'
      - '.github/workflows/deploy.yaml'

  workflow_dispatch:


permissions:
  id-token: write
  contents: read


env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev

  NETWORK_STACK_NAME: cloudmart-network-security-dev
  DATA_STACK_NAME: cloudmart-data-storage-dev
  IAM_STACK_NAME: cloudmart-iam-dev
  APPLICATION_EVENTS_STACK_NAME: cloudmart-application-events-dev
  API_MONITORING_EC2_STACK_NAME: cloudmart-api-monitoring-ec2-dev

  LAMBDA_ARTIFACT_BUCKET: cloudmart-dev-artifacts

  PYMYSQL_LAYER_S3_KEY: layers/pymysql/pymysql-layer-1c359937e7f4e8453f83e9b3f5a021ebdbd515e5.zip

  SCHEMA_S3_KEY: database/schema.sql


jobs:

  # ============================================================
  # 1. NETWORK SECURITY
  # ============================================================

  deploy-network:

    name: Deploy Network Security Stack

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      - name: Validate Network template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml \
            --region "$AWS_REGION"


      - name: Deploy Network Security Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name "$NETWORK_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


      - name: Verify Network Security Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


  # ============================================================
  # 2. DATA STORAGE
  # ============================================================

  deploy-data:

    name: Deploy Data Storage Stack

    runs-on: ubuntu-latest

    needs:
      - deploy-network


    steps:

      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      - name: Validate Data Storage template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml \
            --region "$AWS_REGION"


      - name: Deploy Data Storage Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name "$DATA_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


      - name: Verify Data Storage Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Show Data Storage Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table


  # ============================================================
  # 3. IAM
  # ============================================================

  deploy-iam:

    name: Deploy IAM Stack

    runs-on: ubuntu-latest

    needs:
      - deploy-network
      - deploy-data


    steps:

      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      - name: Validate IAM template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml \
            --region "$AWS_REGION"


      - name: Deploy IAM Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name "$IAM_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


      - name: Verify IAM Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Show IAM Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table


  # ============================================================
  # 4. BUILD AND UPLOAD ARTIFACTS
  # ============================================================

  build-artifacts:

    name: Build Lambda Artifacts

    runs-on: ubuntu-latest

    needs:
      - deploy-iam


    steps:

      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ========================================================
      # SET ARTIFACT KEYS
      # ========================================================

      - name: Set Lambda artifact keys
        run: |
          echo "PRODUCT_LAMBDA_S3_KEY=lambda/product/product-lambda-${GITHUB_SHA}.zip" >> "$GITHUB_ENV"
          echo "ORDER_LAMBDA_S3_KEY=lambda/order/order-lambda-${GITHUB_SHA}.zip" >> "$GITHUB_ENV"
          echo "ORDER_PROCESSOR_LAMBDA_S3_KEY=lambda/order-processor/order-processor-lambda-${GITHUB_SHA}.zip" >> "$GITHUB_ENV"
          echo "AUTHORIZER_LAMBDA_S3_KEY=lambda/authorizer/authorizer-lambda-${GITHUB_SHA}.zip" >> "$GITHUB_ENV"


      # ========================================================
      # PACKAGE PRODUCT LAMBDA
      # ========================================================

      - name: Create Product Lambda package
        run: |
          cd lambda/product
          zip -r ../../product-lambda.zip .
          cd ../..


      # ========================================================
      # PACKAGE ORDER LAMBDA
      # ========================================================

      - name: Create Order Lambda package
        run: |
          cd lambda/order
          zip -r ../../order-lambda.zip .
          cd ../..


      # ========================================================
      # PACKAGE ORDER PROCESSOR LAMBDA
      # ========================================================

      - name: Create Order Processor Lambda package
        run: |
          cd lambda/order-processor
          zip -r ../../order-processor-lambda.zip .
          cd ../..


      # ========================================================
      # PACKAGE AUTHORIZER LAMBDA
      # ========================================================

      - name: Create Authorizer Lambda package
        run: |
          cd lambda/authorizer
          zip -r ../../authorizer-lambda.zip .
          cd ../..


      # ========================================================
      # UPLOAD PRODUCT LAMBDA
      # ========================================================

      - name: Upload Product Lambda
        run: |
          aws s3 cp \
            product-lambda.zip \
            "s3://${LAMBDA_ARTIFACT_BUCKET}/${PRODUCT_LAMBDA_S3_KEY}" \
            --region "$AWS_REGION"


      # ========================================================
      # UPLOAD ORDER LAMBDA
      # ========================================================

      - name: Upload Order Lambda
        run: |
          aws s3 cp \
            order-lambda.zip \
            "s3://${LAMBDA_ARTIFACT_BUCKET}/${ORDER_LAMBDA_S3_KEY}" \
            --region "$AWS_REGION"


      # ========================================================
      # UPLOAD ORDER PROCESSOR LAMBDA
      # ========================================================

      - name: Upload Order Processor Lambda
        run: |
          aws s3 cp \
            order-processor-lambda.zip \
            "s3://${LAMBDA_ARTIFACT_BUCKET}/${ORDER_PROCESSOR_LAMBDA_S3_KEY}" \
            --region "$AWS_REGION"


      # ========================================================
      # UPLOAD AUTHORIZER LAMBDA
      # ========================================================

      - name: Upload Authorizer Lambda
        run: |
          aws s3 cp \
            authorizer-lambda.zip \
            "s3://${LAMBDA_ARTIFACT_BUCKET}/${AUTHORIZER_LAMBDA_S3_KEY}" \
            --region "$AWS_REGION"


      # ========================================================
      # UPLOAD DATABASE SCHEMA
      # ========================================================

      - name: Upload Database Schema
        run: |
          aws s3 cp \
            database/schema.sql \
            "s3://${LAMBDA_ARTIFACT_BUCKET}/${SCHEMA_S3_KEY}" \
            --region "$AWS_REGION"


      # ========================================================
      # VERIFY DATABASE SCHEMA
      # ========================================================

      - name: Verify Database Schema Upload
        run: |
          aws s3api head-object \
            --bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --key "$SCHEMA_S3_KEY" \
            --region "$AWS_REGION"


  # ============================================================
  # 5. APPLICATION EVENTS
  # ============================================================

  deploy-application-events:

    name: Deploy Application Events Stack

    runs-on: ubuntu-latest

    needs:
      - deploy-network
      - deploy-data
      - deploy-iam
      - build-artifacts


    steps:

      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Set Lambda artifact keys
        run: |
          echo "PRODUCT_LAMBDA_S3_KEY=lambda/product/product-lambda-${GITHUB_SHA}.zip" >> "$GITHUB_ENV"
          echo "ORDER_LAMBDA_S3_KEY=lambda/order/order-lambda-${GITHUB_SHA}.zip" >> "$GITHUB_ENV"
          echo "ORDER_PROCESSOR_LAMBDA_S3_KEY=lambda/order-processor/order-processor-lambda-${GITHUB_SHA}.zip" >> "$GITHUB_ENV"
          echo "AUTHORIZER_LAMBDA_S3_KEY=lambda/authorizer/authorizer-lambda-${GITHUB_SHA}.zip" >> "$GITHUB_ENV"


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      - name: Validate Application Events template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/application-events-stack.yaml \
            --region "$AWS_REGION"


      # ========================================================
      # VERIFY ARTIFACTS
      # ========================================================

      - name: Verify PyMySQL Layer
        run: |
          aws s3api head-object \
            --bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --key "$PYMYSQL_LAYER_S3_KEY" \
            --region "$AWS_REGION"


      - name: Verify Product Lambda artifact
        run: |
          aws s3api head-object \
            --bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --key "$PRODUCT_LAMBDA_S3_KEY" \
            --region "$AWS_REGION"


      - name: Verify Order Lambda artifact
        run: |
          aws s3api head-object \
            --bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --key "$ORDER_LAMBDA_S3_KEY" \
            --region "$AWS_REGION"


      - name: Verify Order Processor Lambda artifact
        run: |
          aws s3api head-object \
            --bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --key "$ORDER_PROCESSOR_LAMBDA_S3_KEY" \
            --region "$AWS_REGION"


      - name: Verify Authorizer Lambda artifact
        run: |
          aws s3api head-object \
            --bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --key "$AUTHORIZER_LAMBDA_S3_KEY" \
            --region "$AWS_REGION"


      - name: Verify Database Schema
        run: |
          aws s3api head-object \
            --bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --key "$SCHEMA_S3_KEY" \
            --region "$AWS_REGION"


      # ========================================================
      # DEPLOY APPLICATION EVENTS
      # ========================================================

      - name: Deploy Application Events Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/application-events-stack.yaml \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              LambdaArtifactBucket="$LAMBDA_ARTIFACT_BUCKET" \
              PyMySQLLayerS3Key="$PYMYSQL_LAYER_S3_KEY" \
              ProductLambdaS3Key="$PRODUCT_LAMBDA_S3_KEY" \
              OrderLambdaS3Key="$ORDER_LAMBDA_S3_KEY" \
              OrderProcessorLambdaS3Key="$ORDER_PROCESSOR_LAMBDA_S3_KEY" \
              AuthorizerLambdaS3Key="$AUTHORIZER_LAMBDA_S3_KEY" \
              SchemaS3Key="$SCHEMA_S3_KEY" \
              DBName="/cloudmart/$ENVIRONMENT/db/name" \
              DBEndpoint="/cloudmart/$ENVIRONMENT/db/endpoint" \
              DBPort="/cloudmart/$ENVIRONMENT/db/port" \
              DBUsername="/cloudmart/$ENVIRONMENT/db/username" \
              DBPassword="/cloudmart/$ENVIRONMENT/db/password" \
              AuthTokenParameter="/cloudmart/$ENVIRONMENT/auth/token" \
              CustomerTokensParameter="/cloudmart/$ENVIRONMENT/auth/customer-tokens" \
              AlertEmail="${{ secrets.CLOUDMART_ALERT_EMAIL }}" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --disable-rollback


      # ========================================================
      # VERIFY APPLICATION EVENTS STACK
      # ========================================================

      - name: Verify Application Events Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Show Application Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table


      # ========================================================
      # VERIFY LAMBDAS
      # ========================================================

      - name: Verify Product Lambda
        run: |
          aws lambda get-function-configuration \
            --function-name "cloudmart-${ENVIRONMENT}-product-lambda" \
            --region "$AWS_REGION" \
            --query '[FunctionName,Runtime,Handler,State,LastUpdateStatus]' \
            --output table


      - name: Verify Order Lambda
        run: |
          aws lambda get-function-configuration \
            --function-name "cloudmart-${ENVIRONMENT}-order-lambda" \
            --region "$AWS_REGION" \
            --query '[FunctionName,Runtime,Handler,State,LastUpdateStatus]' \
            --output table


      - name: Verify Order Processor Lambda
        run: |
          aws lambda get-function-configuration \
            --function-name "cloudmart-${ENVIRONMENT}-order-processor" \
            --region "$AWS_REGION" \
            --query '[FunctionName,Runtime,Handler,State,LastUpdateStatus]' \
            --output table


      - name: Verify Lambda Authorizer
        run: |
          aws lambda get-function-configuration \
            --function-name "cloudmart-${ENVIRONMENT}-lambda-authorizer" \
            --region "$AWS_REGION" \
            --query '[FunctionName,Runtime,Handler,State,LastUpdateStatus]' \
            --output table


      # ========================================================
      # APPLICATION FAILURE DETAILS
      # ========================================================

      - name: Show Application Events Failure Details
        if: failure()
        run: |
          echo "==============================================="
          echo "APPLICATION EVENTS STACK FAILURE DETAILS"
          echo "==============================================="

          aws cloudformation describe-stack-events \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --region "$AWS_REGION" \
            --max-items 50 \
            --query "StackEvents[].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true


  # ============================================================
  # 6. API MONITORING EC2
  # ============================================================

  deploy-api-monitoring-ec2:

    name: Deploy API Monitoring EC2 Stack

    runs-on: ubuntu-latest

    needs:
      - deploy-application-events


    steps:

      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      - name: Validate API Monitoring EC2 template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/api-monitoring-ec2-stack.yaml \
            --region "$AWS_REGION"


      - name: Deploy API Monitoring EC2 Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/api-monitoring-ec2-stack.yaml \
            --stack-name "$API_MONITORING_EC2_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


      - name: Verify API Monitoring EC2 Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$API_MONITORING_EC2_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Show API Monitoring EC2 Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$API_MONITORING_EC2_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table


      - name: Show API Endpoint
        run: |
          echo "==============================================="
          echo "CLOUDMART API ENDPOINT"
          echo "==============================================="

          aws cloudformation describe-stacks \
            --stack-name "$API_MONITORING_EC2_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" \
            --output text