name: CloudMart Infrastructure Deployment


on:

  push:

    branches:
      - main
      - feature/order-flow

    paths:
      - 'cloudformation/**'
      - 'lambda/**'
      - 'database/**'
      - '.github/workflows/deploy.yaml'


  workflow_dispatch:


permissions:

  id-token: write

  contents: read


env:

  AWS_REGION: ap-south-1

  ENVIRONMENT: dev


  # ============================================================
  # STACK NAMES
  # ============================================================

  NETWORK_STACK_NAME: cloudmart-network-security-dev

  DATA_STACK_NAME: cloudmart-data-storage-dev

  IAM_STACK_NAME: cloudmart-iam-dev

  APPLICATION_EVENTS_STACK_NAME: cloudmart-application-events-dev

  API_MONITORING_EC2_STACK_NAME: cloudmart-api-monitoring-ec2-dev


  # ============================================================
  # S3 ARTIFACT BUCKET
  # ============================================================

  LAMBDA_ARTIFACT_BUCKET: cloudmart-dev-artifacts


  # ============================================================
  # PYMYSQL LAYER
  # ============================================================

  PYMYSQL_LAYER_S3_KEY: layers/pymysql/pymysql-layer-1c359937e7f4e8453f83e9b3f5a021ebdbd515e5.zip


  # ============================================================
  # DATABASE SCHEMA
  # ============================================================

  SCHEMA_S3_KEY: database/schema.sql


jobs:


  # ============================================================
  # 1. NETWORK
  # ============================================================

  deploy-network:

    name: Deploy Network-Security Stack

    runs-on: ubuntu-latest


    steps:


      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ========================================================
      # VALIDATE NETWORK TEMPLATE
      # ========================================================

      - name: Validate Network template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml \
            --region "$AWS_REGION"


      # ========================================================
      # DEPLOY NETWORK STACK
      # ========================================================

      - name: Deploy Network-Security Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name "$NETWORK_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset


      # ========================================================
      # VERIFY NETWORK STACK
      # ========================================================

      - name: Verify Network Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Show Network Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table


      - name: Show Network Failure Details
        if: failure()

        run: |
          echo "================================================"
          echo "NETWORK STACK FAILURE DETAILS"
          echo "================================================"

          aws cloudformation describe-stack-events \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --max-items 30 \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='UPDATE_ROLLBACK_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true


  # ============================================================
  # 2. DATA STORAGE
  # ============================================================

  deploy-data:

    name: Deploy Data-Storage Stack

    runs-on: ubuntu-latest


    needs:

      - deploy-network


    steps:


      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ========================================================
      # VALIDATE DATA TEMPLATE
      # ========================================================

      - name: Validate Data template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml \
            --region "$AWS_REGION"


      # ========================================================
      # DEPLOY DATA STACK
      # ========================================================

      - name: Deploy Data-Storage Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name "$DATA_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DBName="cloudmart" \
              DBUsername="cloudmartadmin" \
              DBPassword="${{ secrets.CLOUDMART_DB_PASSWORD }}" \
              DBInstanceClass="db.t3.micro" \
              AllocatedStorage="20" \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset


      # ========================================================
      # VERIFY DATA STACK
      # ========================================================

      - name: Verify Data-Storage Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Show Data Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table


      - name: Show Data Failure Details
        if: failure()

        run: |
          echo "================================================"
          echo "DATA STACK FAILURE DETAILS"
          echo "================================================"

          aws cloudformation describe-stack-events \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --max-items 30 \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='UPDATE_ROLLBACK_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true


  # ============================================================
  # 3. IAM
  # ============================================================

  deploy-iam:

    name: Deploy IAM Stack

    runs-on: ubuntu-latest


    needs:

      - deploy-network
      - deploy-data


    steps:


      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ========================================================
      # VALIDATE IAM TEMPLATE
      # ========================================================

      - name: Validate IAM template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml \
            --region "$AWS_REGION"


      # ========================================================
      # DEPLOY IAM STACK
      # ========================================================

      - name: Deploy IAM Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name "$IAM_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


      # ========================================================
      # VERIFY IAM STACK
      # ========================================================

      - name: Verify IAM Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Show IAM Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table


      - name: Show IAM Failure Details
        if: failure()

        run: |
          echo "================================================"
          echo "IAM STACK FAILURE DETAILS"
          echo "================================================"

          aws cloudformation describe-stack-events \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --max-items 30 \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='UPDATE_ROLLBACK_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true


  # ============================================================
  # 4. APPLICATION EVENTS
  # ============================================================

  deploy-application-events:

    name: Deploy Application-Events Stack

    runs-on: ubuntu-latest


    needs:

      - deploy-network
      - deploy-data
      - deploy-iam


    steps:


      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ========================================================
      # AWS AUTHENTICATION
      # ========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ========================================================
      # PACKAGE PRODUCT LAMBDA
      # ========================================================

      - name: Package Product Lambda
        run: |
          cd lambda/product
          zip -r ../../product-lambda.zip .
          cd ../..


      # ========================================================
      # PACKAGE ORDER LAMBDA
      # ========================================================

      - name: Package Order Lambda
        run: |
          cd lambda/order
          zip -r ../../order-lambda.zip .
          cd ../..


      # ========================================================
      # PACKAGE ORDER PROCESSOR LAMBDA
      # ========================================================

      - name: Package Order Processor Lambda
        run: |
          cd lambda/order-processor
          zip -r ../../order-processor-lambda.zip .
          cd ../..


      # ========================================================
      # UPLOAD PRODUCT LAMBDA
      # ========================================================

      - name: Upload Product Lambda artifact
        run: |
          aws s3 cp \
            product-lambda.zip \
            "s3://${LAMBDA_ARTIFACT_BUCKET}/lambda/product/product-lambda-${GITHUB_SHA}.zip"


      # ========================================================
      # UPLOAD ORDER LAMBDA
      # ========================================================

      - name: Upload Order Lambda artifact
        run: |
          aws s3 cp \
            order-lambda.zip \
            "s3://${LAMBDA_ARTIFACT_BUCKET}/lambda/order/order-lambda-${GITHUB_SHA}.zip"


      # ========================================================
      # UPLOAD ORDER PROCESSOR LAMBDA
      # ========================================================

      - name: Upload Order Processor Lambda artifact
        run: |
          aws s3 cp \
            order-processor-lambda.zip \
            "s3://${LAMBDA_ARTIFACT_BUCKET}/lambda/order-processor/order-processor-lambda-${GITHUB_SHA}.zip"


      # ========================================================
      # SET PRODUCT LAMBDA ARTIFACT KEY
      # ========================================================

      - name: Set Product Lambda artifact key
        run: |
          echo "PRODUCT_LAMBDA_S3_KEY=lambda/product/product-lambda-${GITHUB_SHA}.zip" >> "$GITHUB_ENV"


      # ========================================================
      # SET ORDER LAMBDA ARTIFACT KEY
      # ========================================================

      - name: Set Order Lambda artifact key
        run: |
          echo "ORDER_LAMBDA_S3_KEY=lambda/order/order-lambda-${GITHUB_SHA}.zip" >> "$GITHUB_ENV"


      # ========================================================
      # SET ORDER PROCESSOR ARTIFACT KEY
      # ========================================================

      - name: Set Order Processor artifact key
        run: |
          echo "ORDER_PROCESSOR_LAMBDA_S3_KEY=lambda/order-processor/order-processor-lambda-${GITHUB_SHA}.zip" >> "$GITHUB_ENV"


      # ========================================================
      # VERIFY IAM STACK
      # ========================================================

      - name: Verify IAM Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      # ========================================================
      # VERIFY PYMYSQL LAYER
      # ========================================================

      - name: Verify PyMySQL Layer artifact
        run: |
          aws s3api head-object \
            --bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --key "$PYMYSQL_LAYER_S3_KEY"


      # ========================================================
      # VERIFY PRODUCT LAMBDA
      # ========================================================

      - name: Verify Product Lambda artifact
        run: |
          aws s3api head-object \
            --bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --key "$PRODUCT_LAMBDA_S3_KEY"


      # ========================================================
      # VERIFY ORDER LAMBDA
      # ========================================================

      - name: Verify Order Lambda artifact
        run: |
          aws s3api head-object \
            --bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --key "$ORDER_LAMBDA_S3_KEY"


      # ========================================================
      # VERIFY ORDER PROCESSOR
      # ========================================================

      - name: Verify Order Processor artifact
        run: |
          aws s3api head-object \
            --bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --key "$ORDER_PROCESSOR_LAMBDA_S3_KEY"


      # ========================================================
      # VALIDATE APPLICATION EVENTS TEMPLATE
      # ========================================================

      - name: Validate Application-Events template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/application-events-stack.yaml \
            --region "$AWS_REGION"


      # ========================================================
      # DEPLOY APPLICATION EVENTS STACK
      # ========================================================

      - name: Deploy Application-Events Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/application-events-stack.yaml \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              LambdaArtifactBucket="$LAMBDA_ARTIFACT_BUCKET" \
              PyMySQLLayerS3Key="$PYMYSQL_LAYER_S3_KEY" \
              ProductLambdaS3Key="$PRODUCT_LAMBDA_S3_KEY" \
              OrderLambdaS3Key="$ORDER_LAMBDA_S3_KEY" \
              OrderProcessorLambdaS3Key="$ORDER_PROCESSOR_LAMBDA_S3_KEY" \
              SchemaS3Key="$SCHEMA_S3_KEY" \
              DBName="/cloudmart/$ENVIRONMENT/db/name" \
              DBEndpoint="/cloudmart/$ENVIRONMENT/db/endpoint" \
              DBPort="/cloudmart/$ENVIRONMENT/db/port" \
              DBUsername="/cloudmart/$ENVIRONMENT/db/username" \
              DBPassword="/cloudmart/$ENVIRONMENT/db/password" \
              AuthTokenParameter="/cloudmart/$ENVIRONMENT/auth/token" \
              CustomerTokensParameter="/cloudmart/$ENVIRONMENT/auth/customer-tokens" \
              AlertEmail="${{ secrets.CLOUDMART_ALERT_EMAIL }}" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


      # ========================================================
      # VERIFY APPLICATION EVENTS STACK
      # ========================================================

      - name: Verify Application-Events Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Show Application Events Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table


      - name: Show Application Events Failure Details
        if: failure()

        run: |
          echo "================================================"
          echo "APPLICATION EVENTS STACK FAILURE DETAILS"
          echo "================================================"

          aws cloudformation describe-stack-events \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --region "$AWS_REGION" \
            --max-items 30 \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='UPDATE_ROLLBACK_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true


  # ============================================================
  # 5. API MONITORING EC2
  # ============================================================

  deploy-api-monitoring-ec2:

    name: Deploy API Monitoring EC2 Stack

    runs-on: ubuntu-latest


    needs:

      - deploy-application-events


    steps:


      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ========================================================
      # VALIDATE API MONITORING EC2 TEMPLATE
      # ========================================================

      - name: Validate API Monitoring EC2 template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/api-monitoring-ec2-stack.yaml \
            --region "$AWS_REGION"


      # ========================================================
      # DEPLOY API MONITORING EC2 STACK
      # ========================================================

      - name: Deploy API Monitoring EC2 Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/api-monitoring-ec2-stack.yaml \
            --stack-name "$API_MONITORING_EC2_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


      # ========================================================
      # VERIFY API MONITORING EC2 STACK
      # ========================================================

      - name: Verify API Monitoring EC2 Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$API_MONITORING_EC2_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Show API Monitoring EC2 Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$API_MONITORING_EC2_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table


      - name: Show API Monitoring EC2 Failure Details
        if: failure()

        run: |
          echo "================================================"
          echo "API MONITORING EC2 STACK FAILURE DETAILS"
          echo "================================================"

          aws cloudformation describe-stack-events \
            --stack-name "$API_MONITORING_EC2_STACK_NAME" \
            --region "$AWS_REGION" \
            --max-items 30 \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='UPDATE_ROLLBACK_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true