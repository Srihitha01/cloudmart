name: CloudMart Infrastructure Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'cloudformation/**'
      - '.github/workflows/deploy.yaml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev
  NETWORK_STACK_NAME: cloudmart-network-security-dev

jobs:

  deploy-network:
    name: Deploy Network-Security
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # Checkout repository
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # Configure AWS using GitHub OIDC
      # ==================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ==================================================
      # Verify AWS identity
      # ==================================================

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ==================================================
      # Validate CloudFormation template
      # ==================================================

      - name: Validate Network-Security template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml


      # ==================================================
      # Deploy Network-Security stack
      # ==================================================

      - name: Deploy Network-Security stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name "$NETWORK_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              AvailabilityZone="ap-south-1a" \
              VpcCidr="10.0.0.0/16" \
              PublicSubnetCidr="10.0.1.0/24" \
              PrivateSubnetCidr="10.0.2.0/24" \
              AdminCidr="${{ secrets.ADMIN_CIDR }}" \
            --capabilities CAPABILITY_NAMED_IAM


      # ==================================================
      # Display CloudFormation failure events
      # ==================================================

      - name: Show CloudFormation failure events
        if: always()
        run: |
          echo "Checking CloudFormation stack events..."

          aws cloudformation describe-stack-events \
            --stack-name "$NETWORK_STACK_NAME" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED'].[LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table


      # ==================================================
      # Wait for stack deployment
      # ==================================================

      - name: Wait for Network-Security deployment
        if: success()
        run: |
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Stack status: $STACK_STATUS"

          if [ "$STACK_STATUS" = "CREATE_IN_PROGRESS" ]; then

            aws cloudformation wait stack-create-complete \
              --stack-name "$NETWORK_STACK_NAME"

          elif [ "$STACK_STATUS" = "UPDATE_IN_PROGRESS" ]; then

            aws cloudformation wait stack-update-complete \
              --stack-name "$NETWORK_STACK_NAME"

          elif [ "$STACK_STATUS" = "CREATE_COMPLETE" ]; then

            echo "Network-Security stack created successfully."

          elif [ "$STACK_STATUS" = "UPDATE_COMPLETE" ]; then

            echo "Network-Security stack updated successfully."

          else

            echo "Unexpected stack status: $STACK_STATUS"
            exit 1

          fi


      # ==================================================
      # Show stack status
      # ==================================================

      - name: Show Network-Security status
        if: success()
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      # ==================================================
      # Show stack outputs
      # ==================================================

      - name: Show Network-Security outputs
        if: success()
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --query 'Stacks[0].Outputs' \
            --output table