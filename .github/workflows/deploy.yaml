name: CloudMart Infrastructure Deployment

on:

  push:
    branches:
      - main

    paths:
      - 'cloudformation/**'
      - 'lambda/**'
      - 'database/**'
      - '.github/workflows/deploy.yaml'

  workflow_dispatch:


permissions:
  id-token: write
  contents: read


env:

  AWS_REGION: ap-south-1
  ENVIRONMENT: dev

  NETWORK_STACK_NAME: cloudmart-network-security-dev
  DATA_STACK_NAME: cloudmart-data-storage-dev
  IAM_STACK_NAME: cloudmart-iam-dev
  APPLICATION_EVENTS_STACK_NAME: cloudmart-application-events-dev
  API_MONITORING_EC2_STACK_NAME: cloudmart-api-monitoring-ec2-dev

  LAMBDA_ARTIFACT_BUCKET: cloudmart-dev-artifacts


jobs:

  # ============================================================
  # 1. NETWORK
  # ============================================================

  deploy-network:

    name: Deploy Network-Security Stack
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      - name: Validate Network template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml \
            --region "$AWS_REGION"


      - name: Deploy Network-Security Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name "$NETWORK_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset


  # ============================================================
  # 2. DATA STORAGE
  # ============================================================

  deploy-data:

    name: Deploy Data-Storage Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-network

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      - name: Validate Data template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml \
            --region "$AWS_REGION"


      - name: Deploy Data-Storage Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name "$DATA_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DBName="cloudmart" \
              DBUsername="cloudmartadmin" \
              DBPassword="${{ secrets.CLOUDMART_DB_PASSWORD }}" \
              DBInstanceClass="db.t3.micro" \
              AllocatedStorage="20" \
              LambdaArtifactBucket="$LAMBDA_ARTIFACT_BUCKET" \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset


      - name: Verify Data-Storage Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Show Data-Storage Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table


      - name: Verify RDS
        run: |
          aws rds describe-db-instances \
            --db-instance-identifier "cloudmart-${ENVIRONMENT}-mysql" \
            --region "$AWS_REGION" \
            --query '[DBInstances[0].DBInstanceIdentifier,DBInstances[0].DBInstanceStatus,DBInstances[0].Endpoint.Address,DBInstances[0].Endpoint.Port,DBInstances[0].PubliclyAccessible]' \
            --output table


      - name: Verify Report Bucket
        run: |
          aws cloudformation describe-stack-resources \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackResources[?LogicalResourceId=='CloudMartReportBucket'].[LogicalResourceId,ResourceType,ResourceStatus,PhysicalResourceId]" \
            --output table


      - name: Show Data-Storage Failure Details
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED'].[LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table


  # ============================================================
  # 3. IAM
  # ============================================================

  deploy-iam:

    name: Deploy IAM Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-data

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      - name: Verify Data Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Validate IAM template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml \
            --region "$AWS_REGION"


      - name: Deploy IAM Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name "$IAM_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset


      - name: Verify IAM Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Show IAM Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table


      - name: Show IAM Failure Details
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED'].[LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table


  # ============================================================
  # 4. APPLICATION EVENTS - SAM
  # ============================================================

  deploy-application-events:

    name: Deploy Application-Events Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-iam

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v3

        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      - name: Verify IAM stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Validate SAM template
        run: |
          sam validate \
            --template-file cloudformation/application-events-stack.yaml \
            --region "$AWS_REGION"


      # ========================================================
      # BUILD APPLICATION
      # ========================================================

      - name: SAM Build
        run: |
          sam build \
            --template-file cloudformation/application-events-stack.yaml \
            --use-container


      # ========================================================
      # DEPLOY APPLICATION
      # ========================================================

      - name: SAM Deploy
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --region "$AWS_REGION" \
            --s3-bucket "$LAMBDA_ARTIFACT_BUCKET" \
            --s3-prefix "sam/$ENVIRONMENT" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DBName="/cloudmart/$ENVIRONMENT/db/name" \
              DBEndpoint="/cloudmart/$ENVIRONMENT/db/endpoint" \
              DBPort="/cloudmart/$ENVIRONMENT/db/port" \
              DBUsername="/cloudmart/$ENVIRONMENT/db/username" \
              DBPassword="/cloudmart/$ENVIRONMENT/db/password" \
              AuthTokenParameter="/cloudmart/$ENVIRONMENT/auth/token" \
              AlertEmail="${{ secrets.CLOUDMART_ALERT_EMAIL }}"


      # ========================================================
      # VERIFY DEPLOYMENT
      # ========================================================

      - name: Show Application-Events Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Show Application-Events Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table


      - name: Verify Product Lambda
        run: |
          aws lambda get-function-configuration \
            --function-name "cloudmart-${ENVIRONMENT}-product-lambda" \
            --region "$AWS_REGION" \
            --query '[FunctionName,Runtime,Handler,State,LastUpdateStatus]' \
            --output table


      - name: Verify Authorizer
        run: |
          aws lambda get-function-configuration \
            --function-name "cloudmart-${ENVIRONMENT}-lambda-authorizer" \
            --region "$AWS_REGION" \
            --query '[FunctionName,Runtime,Handler,State,LastUpdateStatus]' \
            --output table


      - name: Verify EventBridge
        run: |
          aws events describe-rule \
            --name "cloudmart-${ENVIRONMENT}-low-stock-rule" \
            --region "$AWS_REGION" \
            --query '[Name,State]' \
            --output table


      - name: Show Application-Events Failure Details
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED'].[LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table


  # ============================================================
  # 5. API MONITORING / EC2
  # ============================================================

  deploy-api-monitoring-ec2:

    name: Deploy API-Monitoring-EC2 Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-application-events

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      - name: Verify Application-Events Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Validate API-Monitoring-EC2 template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/api-monitoring-ec2-stack.yaml \
            --region "$AWS_REGION"


      - name: Deploy API-Monitoring-EC2 Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/api-monitoring-ec2-stack.yaml \
            --stack-name "$API_MONITORING_EC2_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset


      - name: Show API-Monitoring-EC2 Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$API_MONITORING_EC2_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      - name: Show API-Monitoring-EC2 Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$API_MONITORING_EC2_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table