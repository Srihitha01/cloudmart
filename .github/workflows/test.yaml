name: CloudMart Application Test

on:

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'cloudformation/application-events-stack.yaml'
      - 'cloudformation/iam-stack.yaml'
      - '.github/workflows/test.yaml'


permissions:
  id-token: write
  contents: read


env:

  AWS_REGION: ap-south-1
  ENVIRONMENT: dev

  NETWORK_STACK_NAME: cloudmart-network-security-dev
  DATA_STACK_NAME: cloudmart-data-storage-dev
  IAM_STACK_NAME: cloudmart-iam-dev
  APPLICATION_EVENTS_STACK_NAME: cloudmart-application-events-dev


jobs:

  test-application-events:

    name: Validate Application-Events

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # AWS CREDENTIALS
      # ======================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ======================================================
      # VERIFY AWS IDENTITY
      # ======================================================

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ======================================================
      # VERIFY NETWORK
      # ======================================================

      - name: Verify Network Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      # ======================================================
      # VERIFY DATA
      # ======================================================

      - name: Verify Data Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      # ======================================================
      # VERIFY IAM
      # ======================================================

      - name: Verify IAM Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      # ======================================================
      # VERIFY AUTH TOKEN PARAMETER
      # ======================================================

      - name: Verify Auth Token Parameter
        run: |
          aws ssm get-parameter \
            --name "/cloudmart/$ENVIRONMENT/auth/token" \
            --region "$AWS_REGION" \
            --query 'Parameter.[Name,Type,Version]' \
            --output table


      # ======================================================
      # VALIDATE TEMPLATE
      # ======================================================

      - name: Validate Application-Events Template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/application-events-stack.yaml \
            --region "$AWS_REGION"


      # ======================================================
      # DEPLOY APPLICATION-EVENTS
      # ======================================================

      - name: Deploy Application-Events Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/application-events-stack.yaml \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DBName="/cloudmart/$ENVIRONMENT/db/name" \
              DBEndpoint="/cloudmart/$ENVIRONMENT/db/endpoint" \
              DBPort="/cloudmart/$ENVIRONMENT/db/port" \
              DBUsername="/cloudmart/$ENVIRONMENT/db/username" \
              DBPassword="/cloudmart/$ENVIRONMENT/db/password" \
              AuthTokenParameter="/cloudmart/$ENVIRONMENT/auth/token" \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset


      # ======================================================
      # VERIFY APPLICATION-EVENTS
      # ======================================================

      - name: Verify Application-Events Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table


      # ======================================================
      # VERIFY AUTHORISER
      # ======================================================

      - name: Verify Lambda Authorizer
        run: |
          aws lambda get-function-configuration \
            --function-name "cloudmart-${ENVIRONMENT}-lambda-authorizer" \
            --region "$AWS_REGION" \
            --query '[FunctionName,Runtime,Handler,State,LastUpdateStatus]' \
            --output table


      # ======================================================
      # VERIFY PRODUCT LAMBDA
      # ======================================================

      - name: Verify Product Lambda
        run: |
          aws lambda get-function-configuration \
            --function-name "cloudmart-${ENVIRONMENT}-product-lambda" \
            --region "$AWS_REGION" \
            --query '[FunctionName,Runtime,Handler,State,LastUpdateStatus]' \
            --output table


      # ======================================================
      # VERIFY PRODUCT LAMBDA VPC
      # ======================================================

      - name: Verify Product Lambda VPC
        run: |
          aws lambda get-function-configuration \
            --function-name "cloudmart-${ENVIRONMENT}-product-lambda" \
            --region "$AWS_REGION" \
            --query '[VpcConfig.SubnetIds,VpcConfig.SecurityGroupIds]' \
            --output json