name: CloudMart Application-Events Test

on:
  push:
    branches:
      - main
    paths:
      - 'cloudformation/application-events-stack.yaml'
      - '.github/workflows/test.yaml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev

  NETWORK_STACK_NAME: cloudmart-network-security-dev
  DATA_STACK_NAME: cloudmart-data-storage-dev
  IAM_STACK_NAME: cloudmart-iam-dev
  APPLICATION_EVENTS_STACK_NAME: cloudmart-application-events-dev

jobs:

  test-application-events:

    name: Test Application-Events Stack

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify Network-Security Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table

      - name: Verify Data-Storage Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table

      - name: Verify IAM-Configuration Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table

      - name: Verify authentication parameter
        run: |
          aws ssm get-parameter \
            --name "/cloudmart/$ENVIRONMENT/auth/token" \
            --region "$AWS_REGION" \
            --query 'Parameter.[Name,Type]' \
            --output table

      - name: Validate Application-Events template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/application-events-stack.yaml \
            --region "$AWS_REGION"

      - name: Deploy Application-Events Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/application-events-stack.yaml \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              AuthTokenParameter="/cloudmart/$ENVIRONMENT/auth/token" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset

      - name: Verify Application-Events Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table

      - name: Show Application-Events Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table

      - name: Verify Lambda Authorizer
        run: |
          aws lambda get-function \
            --function-name "cloudmart-${ENVIRONMENT}-lambda-authorizer" \
            --region "$AWS_REGION" \
            --query 'Configuration.[FunctionName,Runtime,Handler,State,LastUpdateStatus]' \
            --output table

      - name: Show CloudFormation failure details
        if: failure()
        run: |
          echo "Checking Application-Events CloudFormation events..."

          if aws cloudformation describe-stacks \
            --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
            --region "$AWS_REGION" > /dev/null 2>&1; then

            aws cloudformation describe-stack-events \
              --stack-name "$APPLICATION_EVENTS_STACK_NAME" \
              --region "$AWS_REGION" \
              --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED'].[LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
              --output table

          else
            echo "Application-Events stack does not exist."
          fi